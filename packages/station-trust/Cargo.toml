[package]
name = "station-trust"
version = "0.1.0"
edition = "2021"

[build-dependencies]
prost-build = "=0.14.3"

[dependencies]
libp2p-identity = { version = "=0.3.0", features = ["ed25519", "peerid", "rand"] }
multiaddr = "0.19"
prost = "=0.14.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
url = "2"
x509-parser = "=0.18.1"
