[package]
name = "secure-content-core"
version = "0.1.0"
edition = "2021"
description = "Portable Secure Content crypto, canonical codec, and object transfer kernel"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
hpke-rs = { version = "0.6.1", features = ["rustcrypto", "std"] }
rand = "0.8"
sha2 = "0.10"
thiserror = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
