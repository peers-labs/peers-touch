[package]
name = "x-config-core"
version = "0.1.0"
edition = "2021"

[build-dependencies]
prost-build = "=0.14.3"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hmac = "0.12"
prost = "=0.14.3"
prost-types = "=0.14.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
station-trust = { path = "../station-trust" }
url = "2"

[dev-dependencies]
libp2p-identity = { version = "=0.3.0", features = ["ed25519", "peerid", "rand"] }
