[package]
name = "messaging-native-filesystem"
version = "0.1.0"
edition = "2021"
description = "Native filesystem adapter for the portable Messaging Core"

[dependencies]
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
messaging-core = { path = "../messaging-core" }
rustix = { version = "1.1", features = ["fs"] }
secure-content-core = { path = "../secure-content-core" }
sha2 = "0.10"
ulid = "1"

[dev-dependencies]
