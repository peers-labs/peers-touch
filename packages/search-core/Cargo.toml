[package]
name = "search-core"
version = "0.1.0"
edition = "2021"
description = "Portable Peers Search query kernel — CJK-aware tokenizer, query AST, FTS5 match expression, RRF fusion, cursor, cancellation, and source ports"

[dependencies]
base64 = "0.22"
hmac = "0.12"
log = "0.4"
prost = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
hex = "0.4"
