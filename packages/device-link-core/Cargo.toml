[package]
name = "device-link-core"
version = "0.1.0"
edition = "2021"
description = "Native Device Link transcript and authenticated material verification"

[dependencies]
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
hpke-rs = { version = "=0.6.1", features = ["std", "rustcrypto"] }
libp2p-identity = { version = "=0.3.0", features = ["ed25519", "peerid"] }
prost = "=0.14.3"
rand = "0.8"
reqwest = { version = "=0.13.2", features = ["blocking"] }
schema-core = { path = "../schema-core" }
sha2 = "0.10"
station-trust = { path = "../station-trust" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
