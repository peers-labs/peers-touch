[package]
name = "messaging-core"
version = "0.1.0"
edition = "2021"
description = "Portable Rust Messaging Core — protocol, crypto, and transaction logic shared by Desktop and Mobile"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
curve25519-dalek = "4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
openmls = { version = "0.8.1", features = ["test-utils"] }
openmls_basic_credential = "0.5.0"
openmls_memory_storage = { version = "0.5.0", features = ["persistence"] }
openmls_rust_crypto = "0.5.1"
openmls_traits = "0.5.0"
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
rustix = { version = "1.1", features = ["fs"] }
secure-content-core = { path = "../secure-content-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tls_codec = "0.4.2"
ulid = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
