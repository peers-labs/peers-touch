[package]
name = "peers-touch-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "provider_models_lib"
path = "src/provider_models_lib.rs"

[build-dependencies]
prost-build = "0.14.3"
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
tauri = { version = "2.0.1", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2.0.1"
tauri-plugin-global-shortcut = "2.0.1"
tauri-plugin-playwright = { version = "0.4.1", optional = true }
tiny_http = "0.12"
threadpool = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
urlencoding = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = "4"
aes-gcm = "0.10"
argon2 = "0.5"
arboard = "3"
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
prost = { version = "0.14.3", features = ["derive"] }
prost-types = "0.14.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
rfd = "0.15"
tokio = { version = "1", features = ["rt"] }
futures-lite = "2"
ulid = "1.1"
openmls = { version = "0.8.1", features = ["test-utils"] }
openmls_rust_crypto = "0.5.1"
openmls_memory_storage = { version = "0.5.0", features = ["persistence"] }
openmls_traits = "0.5.0"
openmls_basic_credential = "0.5.0"
tls_codec = "0.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e-testing = ["dep:tauri-plugin-playwright"]
