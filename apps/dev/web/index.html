<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peers Dev</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">Peers Touch</p>
      <h1>Peers Dev</h1>
      <p class="product-surface">Development Control Plane</p>
    </div>
    <div class="topbar-actions">
      <div class="server-meta">
        <span id="server-source" class="server-source">Resolving source</span>
        <span id="observed-at" class="observed-at">Loading</span>
      </div>
      <span id="transport" class="transport" data-state="connecting">Connecting</span>
      <button id="refresh" class="icon-button" type="button" title="Refresh" aria-label="Refresh">
        ↻
      </button>
    </div>
  </header>

  <section class="summary" aria-label="Development summary">
    <div class="metric"><span class="metric-label">Worktrees</span><strong id="worktree-count">0</strong></div>
    <div class="metric"><span class="metric-label">Active plans</span><strong id="plan-count">0</strong></div>
    <div class="metric"><span class="metric-label">Working agents</span><strong id="agent-count">0</strong></div>
    <div class="metric"><span class="metric-label">Blocked / drift</span><strong id="blocked-count">0</strong></div>
    <div class="metric"><span class="metric-label">Profiles</span><strong id="profile-count">0</strong></div>
  </section>

  <p id="status-message" class="status-message" role="status"></p>

  <section class="section" aria-labelledby="worktree-heading">
    <div class="section-heading">
      <h2 id="worktree-heading">Worktree Progress</h2>
      <span id="authority" class="authority">Authority unknown</span>
    </div>
    <div id="worktree-list" class="worktree-list"></div>
  </section>

  <section class="section" aria-labelledby="profile-heading">
    <div class="section-heading">
      <h2 id="profile-heading">Runtime Capacity</h2>
      <span id="profile-capacity-count" class="count">0</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Profile</th>
            <th>State</th>
            <th>Control</th>
            <th>Station</th>
            <th>Relay</th>
            <th>Source</th>
            <th>Worktrees</th>
            <th>Slots</th>
            <th>Work</th>
          </tr>
        </thead>
        <tbody id="occupancy-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
