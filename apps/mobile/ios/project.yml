name: PeersTouch
options:
  bundleIdPrefix: com.peerstouch
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.3"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"

targets:
  PeersTouch:
    type: application
    platform: iOS
    sources:
      - path: PeersTouch
        excludes:
          - "**/*.xcassets/**"
    resources:
      - path: PeersTouch/Assets.xcassets
      - path: PeersTouch/Info.plist
        buildPhase: none
    settings:
      base:
        INFOPLIST_FILE: PeersTouch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.peerstouch.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: UserNotifications.framework
