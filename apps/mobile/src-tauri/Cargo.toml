[package]
name = "peers-touch-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "peers_touch_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "=0.14.3"
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
curve25519-dalek = "4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
libp2p-identity = { version = "=0.3.0", features = ["ed25519", "peerid"] }
messaging-core = { path = "../../../packages/messaging-core" }
prost = "=0.14.3"
prost-types = "=0.14.3"
rand = "0.8"
reqwest = "=0.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.0.1", features = [] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-opener = "=2.5.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[features]
default = ["custom-protocol"]
acceptance-harness = []
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-peers-secure-storage = { path = "plugins/secure-storage" }
