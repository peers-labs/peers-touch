peers:
  node:
    server:
      subserver:
        turn:
          enabled: false
          port: 3478
          realm: peers-touch
          public-ip: 0.0.0.0
          auth-secret: your_auth_secret
          # Optional. STUN URLs advertised to clients via
          # /api/v1/turn/ice-servers. Omit to fall back to the public default
          # (stun:stun.l.google.com:19302); set your own for a private deployment.
          # stun-urls:
          #   - stun:stun.example.com:19302
          # Optional. Lifetime of ephemeral TURN credentials handed to clients
          # (Go duration, e.g. 24h, 1h30m). Omit to use the default (24h).
          # credential-ttl: 24h
          # Optional. Label embedded in the short-term credential username
          # ("<expiry>:<label>"). Omit to use the default (webrtc-user).
          # credential-username: webrtc-user