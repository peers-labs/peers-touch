providers:
  - id: ark
    name: ByteDance Ark
    description: ByteDance Ark AI platform
    enabled: true
    builtin: true
    show_checker: false
    show_api_key: true
    protocol: openai-compatible
    discovery: openai-models
    home_url: https://www.volcengine.com/product/ark
    api_key_url: https://console.volcengine.com/ark
    default_base_url: https://ark.cn-beijing.volces.com/api/v3
    models:
      - id: doubao-pro-256k
        display_name: Doubao Pro
        type: chat
        enabled: true
        context_window: 256000
      - id: doubao-embedding
        display_name: Doubao Embedding
        type: embedding
        enabled: true
        context_window: 8192
  - id: openai
    name: OpenAI
    description: GPT models from OpenAI
    enabled: true
    builtin: true
    show_checker: true
    protocol: openai-compatible
    discovery: openai-models
    home_url: https://openai.com
    api_key_url: https://platform.openai.com/api-keys
    default_base_url: https://api.openai.com/v1
    models:
      - id: gpt-4o
        display_name: GPT-4o
        type: chat
        enabled: true
        context_window: 128000
      - id: gpt-4o-mini
        display_name: GPT-4o Mini
        type: chat
        enabled: true
        context_window: 128000
  - id: anthropic
    name: Anthropic
    description: Claude models from Anthropic
    enabled: true
    builtin: true
    show_checker: true
    protocol: anthropic
    discovery: anthropic-models
    home_url: https://www.anthropic.com
    api_key_url: https://console.anthropic.com/settings/keys
    default_base_url: https://api.anthropic.com
    models:
      - id: claude-sonnet-4-20250514
        display_name: Claude Sonnet 4
        type: chat
        enabled: true
        context_window: 200000
  - id: google
    name: Google
    description: Gemini models from Google
    enabled: true
    builtin: true
    show_checker: true
    protocol: gemini
    discovery: gemini-models
    home_url: https://ai.google.dev
    api_key_url: https://aistudio.google.com/apikey
    default_base_url: https://generativelanguage.googleapis.com/v1beta
    models:
      - id: gemini-2.0-flash
        display_name: Gemini 2.0 Flash
        type: chat
        enabled: true
        context_window: 1048576
  - id: deepseek
    name: DeepSeek
    description: DeepSeek models
    enabled: true
    builtin: true
    show_checker: true
    protocol: openai-compatible
    discovery: openai-models
    home_url: https://deepseek.com
    api_key_url: https://platform.deepseek.com/api_keys
    default_base_url: https://api.deepseek.com/v1
    models:
      - id: deepseek-chat
        display_name: DeepSeek Chat
        type: chat
        enabled: true
        context_window: 128000
  - id: ollama
    name: Ollama
    description: Run open-source models locally
    enabled: true
    builtin: true
    show_checker: true
    protocol: ollama
    discovery: ollama-tags
    home_url: https://ollama.com
    api_key_url: ""
    default_base_url: http://localhost:11434
    models: []
  - id: openrouter
    name: OpenRouter
    description: Unified routing for multiple LLM providers
    enabled: false
    builtin: true
    show_checker: true
    protocol: openai-compatible
    discovery: openai-models
    home_url: https://openrouter.ai
    api_key_url: https://openrouter.ai/keys
    default_base_url: https://openrouter.ai/api/v1
    models:
      - id: openai/gpt-4o-mini
        display_name: GPT-4o Mini (OpenRouter)
        type: chat
        enabled: true
        context_window: 128000
  - id: mistral
    name: Mistral
    description: Mistral AI models
    enabled: false
    builtin: true
    show_checker: true
    protocol: openai-compatible
    discovery: openai-models
    home_url: https://mistral.ai
    api_key_url: https://console.mistral.ai/api-keys
    default_base_url: https://api.mistral.ai/v1
    models:
      - id: mistral-large-latest
        display_name: Mistral Large
        type: chat
        enabled: true
        context_window: 131072
  - id: groq
    name: Groq
    description: Groq low-latency inference platform
    enabled: false
    builtin: true
    show_checker: true
    protocol: openai-compatible
    discovery: openai-models
    home_url: https://groq.com
    api_key_url: https://console.groq.com/keys
    default_base_url: https://api.groq.com/openai/v1
    models:
      - id: llama-3.3-70b-versatile
        display_name: Llama 3.3 70B
        type: chat
        enabled: true
        context_window: 131072
  - id: together
    name: Together
    description: Together AI model hosting
    enabled: false
    builtin: true
    show_checker: true
    protocol: openai-compatible
    discovery: openai-models
    home_url: https://www.together.ai
    api_key_url: https://api.together.xyz/settings/api-keys
    default_base_url: https://api.together.xyz/v1
    models:
      - id: meta-llama/Llama-3.1-70B-Instruct-Turbo
        display_name: Llama 3.1 70B Turbo
        type: chat
        enabled: true
        context_window: 131072
  - id: cohere
    name: Cohere
    description: Cohere language models
    enabled: false
    builtin: true
    show_checker: true
    protocol: openai-compatible
    discovery: openai-models
    home_url: https://cohere.com
    api_key_url: https://dashboard.cohere.com/api-keys
    default_base_url: https://api.cohere.com/compatibility/v1
    models:
      - id: command-r-plus
        display_name: Command R+
        type: chat
        enabled: true
        context_window: 128000
  - id: codex-cli
    name: Codex CLI
    description: Local Codex CLI adapter running in the Agent workspace
    enabled: false
    builtin: true
    show_checker: false
    show_api_key: false
    protocol: cli
    discovery: static
    home_url: https://developers.openai.com/codex
    api_key_url: ""
    default_base_url: ""
    runtime_kind: cli
    cli_command: codex exec --skip-git-repo-check -
    models:
      - id: gpt-5-codex
        display_name: GPT-5 Codex
        type: chat
        enabled: true
        context_window: 128000
  - id: cursor-cli
    name: Cursor CLI
    description: Local Cursor Agent CLI adapter running in the Agent workspace
    enabled: false
    builtin: true
    show_checker: false
    show_api_key: false
    protocol: cli
    discovery: static
    home_url: https://cursor.com
    api_key_url: ""
    default_base_url: ""
    runtime_kind: cli
    cli_command: cursor-agent --print --output-format text --trust
    models_command: cursor-agent --list-models
    models:
      - id: auto
        display_name: Auto
        type: chat
        enabled: true
        context_window: 200000
  - id: claude-cli
    name: Claude CLI
    description: Local Claude CLI adapter running in the Agent workspace
    enabled: false
    builtin: true
    show_checker: false
    show_api_key: false
    protocol: cli
    discovery: static
    home_url: https://www.anthropic.com/claude-code
    api_key_url: ""
    default_base_url: ""
    runtime_kind: cli
    cli_command: claude -p
    models:
      - id: sonnet
        display_name: Claude Sonnet
        type: chat
        enabled: true
        context_window: 200000
      - id: opus
        display_name: Claude Opus
        type: chat
        enabled: false
        context_window: 200000
      - id: haiku
        display_name: Claude Haiku
        type: chat
        enabled: false
        context_window: 200000
  - id: trae-cli
    name: TRAE CLI
    description: Local TRAE CLI adapter running in the Agent workspace
    enabled: false
    builtin: true
    show_checker: false
    show_api_key: false
    protocol: cli
    discovery: static
    home_url: https://www.trae.ai
    api_key_url: ""
    default_base_url: ""
    runtime_kind: cli
    cli_command: traecli exec --skip-git-repo-check -
    models_command: traecli debug models
    models:
      - id: GPT-5.5
        display_name: GPT-5.5
        type: chat
        enabled: true
        context_window: 128000
