peers:
  node:
    server:
      subserver:
        oss:
          enabled: true
          path: /sub-oss
          rds-name: oss
          store-path: ${PEERS_NODE_SERVER_SUBSERVER_OSS_STORE_PATH}
          sign-secret: ""

          # Active storage driver. `local` (default) keeps bytes on the
          # filesystem under `store-path`. `s3` switches to any
          # S3-protocol object store — AWS S3, MinIO, Cloudflare R2,
          # Backblaze B2, GCS S3-compat, Alibaba/Tencent OSS, etc.
          # backend: s3

          # Content-addressable keys (sha256-derived). Recommended for
          # chat attachments — identical bytes uploaded by different
          # users dedup to one object.
          # key-strategy: cas

          # Presigned upload — only takes effect when `backend: s3` (or
          # any backend that implements the PresignedBackend capability).
          # `presigned-upload-threshold` is the size in bytes at or above
          # which the desktop client switches from multipart to direct
          # PUT. Defaults to 8 MiB; set to 0 to keep all uploads on the
          # multipart path.
          # presigned-upload-threshold: 8388608
          # presigned-upload-ttl: 300       # seconds, default 300
          # presigned-download-ttl: 300     # seconds, default 300

          # S3 driver configuration. Required when `backend: s3`. The
          # `endpoint` is the host (and optional port) of the S3 service;
          # the scheme is derived from `use-ssl` unless an explicit
          # `https://` / `http://` prefix is supplied.
          #
          # `force-path-style: true` is the safe default for non-AWS
          # services (MinIO, R2, B2, …). AWS itself prefers virtual-hosted
          # style — leave the flag at false there.
          #
          # `key-prefix` is prepended to every object key. Useful when
          # the same bucket is shared across multiple Stations — e.g.
          # `households/alice/` and `households/bob/`.
          # s3:
          #   endpoint: minio.local:9000
          #   region: us-east-1
          #   bucket: peers-touch-oss
          #   access-key-id: ${PEERS_OSS_S3_ACCESS_KEY_ID}
          #   secret-access-key: ${PEERS_OSS_S3_SECRET_ACCESS_KEY}
          #   use-ssl: false
          #   force-path-style: true
          #   key-prefix: ""
