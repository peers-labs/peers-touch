peers:
  node:
    server:
      subserver:
        relay:
          enabled: true
          max-stations: 100
          heartbeat-timeout: 60
          forward-timeout: 30
          max-body-size: 10485760
          max-concurrent-per-station: 64
          stream-ping-interval: 30
          stream-ping-timeout: 5
          stream-listen-addr: ""
          public-listen-addr: ""
          public-upstream-url: ""
          graceful-drain-timeout: 10
          tls-cert-file: ""
          tls-key-file: ""
          allow-insecure-loopback: false
          signing-key-file: ""
          operator-key-file: ""
          operator-issuer: ""
          operator-audience: ""
          operator-scope: ""
