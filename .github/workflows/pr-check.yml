# PR quality checks for Peers-Touch
name: PR Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Auto-label based on changed files
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml

  # Validate PR title follows Conventional Commits
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
            style
            build
            revert
          scopes: |
            station
            desktop
            mobile
            android
            ios
            proto
            model
            applet-sdk
            applets
            locales
            tooling
            ci
            deps
            oauth2
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            PR title subject must:
            - Start with lowercase letter
            - Not end with a period
            - Follow format: <type>(<scope>): <subject>

  # Validate commit messages in the PR
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --save-dev @commitlint/cli @commitlint/config-conventional
      - name: Validate pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A squash merge preserves the reviewed tree but not the branch ancestry.
          base_tree="$(git rev-parse "$BASE_SHA^{tree}")"
          range_base="$(
            git log --topo-order --format='%H %T' "$BASE_SHA..$HEAD_SHA" |
              awk -v tree="$base_tree" \
                '$2 == tree && !found { print $1; found=1 }'
          )"
          if [ -z "$range_base" ]; then
            range_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi

          echo "Linting commits after $range_base"
          while read -r commit_sha; do
            git show -s --format=%B "$commit_sha" | npx commitlint --verbose
          done < <(
            git rev-list --reverse --ancestry-path "$range_base..$HEAD_SHA"
          )

  # Check PR description is not empty
  pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const sections = ['Summary', 'Changes', 'Type', 'Test Plan'];
            const missing = sections.filter(s => {
              const regex = new RegExp(`## ${s}`, 'i');
              return !regex.test(body);
            });

            if (missing.length > 0) {
              core.setFailed(
                `PR description is missing required sections: ${missing.join(', ')}. ` +
                `Please use the PR template.`
              );
            }

            // Check that at least one Type checkbox is checked
            const typeChecked = /- \[x\] `\w+`/.test(body);
            if (!typeChecked) {
              core.setFailed('Please check at least one Type in the PR description.');
            }

  # Desktop performance red-line gate — blocks merge when P95 regresses
  perf-gate:
    if: contains(github.event.pull_request.labels.*.name, 'perf') || contains(github.event.pull_request.changed_files_paths || '', 'apps/desktop/src/')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Run performance stress tests (N=30, P95 gate)
        working-directory: apps/desktop
        env:
          PT_PERFORMANCE_RUNTIME: tauri-webview-dev
          PT_PERF_GATE_SAMPLES: 30
          PT_PERF_GATE_P95_NAV_MS: 100
          PT_PERF_GATE_P95_INPUT_MS: 50
        run: |
          pnpm exec playwright test e2e/tests/performance-stress.spec.ts --reporter=json --output=perf-gate-results.json || true
      - name: Evaluate P95 thresholds
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsPath = path.join(process.env.GITHUB_WORKSPACE, 'apps/desktop/perf-gate-results.json');
            if (!fs.existsSync(resultsPath)) {
              core.setFailed('Performance gate: no results file produced. Tests may have crashed.');
              return;
            }
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const suites = results.suites ?? [];
            const failures = suites.flatMap(s => (s.specs ?? []).filter(sp => sp.ok === false));
            if (failures.length > 0) {
              const names = failures.map(f => f.title).join(', ');
              core.setFailed(`Performance gate FAILED: ${names}`);
            } else {
              core.info('Performance gate PASSED: all P95 thresholds met.');
            }
