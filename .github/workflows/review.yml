name: Review Framework

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-framework:
    runs-on: ubuntu-latest
    env:
      REVIEW_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'

      - name: Configure Acceptance artifact root
        run: |
          echo "PT_ACCEPTANCE_ARTIFACT_ROOT=$RUNNER_TEMP/peers-touch-acceptance" >> "$GITHUB_ENV"

      - name: Resolve explicit execution plans
        run: |
          python3 tooling/scripts/review/pr-plan-input.py \
            --event "$GITHUB_EVENT_PATH" \
            > "$RUNNER_TEMP/execution-plans.txt"

      - name: Install review framework dependencies
        run: python3 -m pip install -r tooling/acceptance/requirements.txt

      - name: Install plan validation fixture
        run: |
          # planctl.mjs -> module-governance.mjs imports the yaml package.
          # Keep this version in sync with the yaml devDependency in
          # package.json and pnpm-lock.yaml. --no-save/--no-package-lock
          # provisions node_modules only; the manifest and lockfile stay
          # unchanged because yaml is already a repo devDependency.
          npm install --no-save --no-package-lock yaml@2.9.1

      - name: Validate explicit execution plans
        run: |
          while IFS= read -r plan; do
            node tooling/scripts/plan/planctl.mjs validate \
              --repo-root "$GITHUB_WORKSPACE" \
              --plan "$plan"
          done < "$RUNNER_TEMP/execution-plans.txt"

      - name: Validate Acceptance workflow contracts
        run: |
          python3 tooling/scripts/review/pr-plan-input-test.py
          python3 -m unittest tooling.acceptance.tests.test_execution_plan
          python3 tooling/scripts/acceptance-plan-test.py
          python3 tooling/scripts/acceptance-run-test.py

      - name: Install shell-quote audit fixture
        run: |
          # Keep this version in sync with the shell-quote entry in pnpm-lock.yaml.
          # --no-save/--no-package-lock provision node_modules only; the manifest
          # and lockfile stay unchanged because shell-quote is a transitive dep.
          npm install --no-save --no-package-lock shell-quote@1.10.0

      - name: Install dead-code advisory fixture
        run: |
          # Keep this version in sync with the knip devDependency in package.json
          # and pnpm-lock.yaml. --no-save/--no-package-lock provisions node_modules
          # only; the advisory is non-blocking and SKIPs when knip cannot resolve.
          npm install --no-save --no-package-lock knip@5.43.6

      - name: Run review framework gates
        run: |
          tooling/scripts/review/run.sh --range "$REVIEW_RANGE" --strict-knowledge

      - name: Generate quality evidence
        if: always()
        run: |
          python3 tooling/scripts/quality-evidence.py --range "$REVIEW_RANGE"

      - name: Write review summary
        if: always()
        run: |
          {
            echo "## Review Framework"
            tooling/scripts/review/route-change.sh --range "$REVIEW_RANGE" --format github || true
            echo
            tooling/scripts/review/knowledge-match.sh --range "$REVIEW_RANGE" || true
            echo
            if python3 tooling/scripts/acceptance-artifact.py cat \
              --gate quality-evidence --role quality-markdown; then
              true
            else
              echo "Quality evidence report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/peers-touch-acceptance
          if-no-files-found: warn
          retention-days: 14
