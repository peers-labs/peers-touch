name: Review Framework

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-framework:
    runs-on: ubuntu-latest
    env:
      REVIEW_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Acceptance artifact root
        run: |
          echo "PT_ACCEPTANCE_ARTIFACT_ROOT=$RUNNER_TEMP/peers-touch-acceptance" >> "$GITHUB_ENV"

      - name: Resolve explicit execution plans
        run: |
          python3 tooling/scripts/review/pr-plan-input.py \
            --event "$GITHUB_EVENT_PATH" \
            > "$RUNNER_TEMP/execution-plans.txt"

      - name: Require completed execution plans
        run: |
          while IFS= read -r plan; do
            python3 tooling/scripts/execution-plan.py \
              --ci \
              --require-complete \
              --plan "$plan"
          done < "$RUNNER_TEMP/execution-plans.txt"

      - name: Validate Acceptance workflow contracts
        run: |
          python3 -m pip install -r tooling/acceptance/requirements.txt
          python3 tooling/scripts/review/pr-plan-input-test.py
          python3 -m unittest tooling.acceptance.tests.test_execution_plan
          python3 tooling/scripts/acceptance-plan-test.py
          python3 tooling/scripts/acceptance-run-test.py

      - name: Run review framework gates
        run: |
          tooling/scripts/review/run.sh --range "$REVIEW_RANGE" --strict-knowledge

      - name: Generate quality evidence
        if: always()
        run: |
          python3 tooling/scripts/quality-evidence.py --range "$REVIEW_RANGE"

      - name: Write review summary
        if: always()
        run: |
          {
            echo "## Review Framework"
            tooling/scripts/review/route-change.sh --range "$REVIEW_RANGE" --format github || true
            echo
            tooling/scripts/review/knowledge-match.sh --range "$REVIEW_RANGE" || true
            echo
            if python3 tooling/scripts/acceptance-artifact.py cat \
              --gate quality-evidence --role quality-markdown; then
              true
            else
              echo "Quality evidence report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/peers-touch-acceptance
          if-no-files-found: warn
          retention-days: 14
