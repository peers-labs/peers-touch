  --brand-primary: #667eea;
  --brand-secondary: #764ba2;
  --brand-surface: #ffffff;
  --brand-muted: #f5f6fb;
  --brand-border: rgba(31, 41, 55, 0.08);
  --tabbar-height: 56px;
  --header-height: 58px;
  --safe-area-bottom: env(safe-area-inset-bottom, 0px);
  --safe-area-top: env(safe-area-inset-top, 0px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body,
#root {
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  background: var(--brand-muted);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  user-select: none;
}

button,
input {
  font: inherit;
  touch-action: manipulation;
}

input,
textarea,
select,
.ant-input,
.ant-input-affix-wrapper,
.ant-select-selector {
  font-size: 16px !important;
}

.full-width {
  width: 100%;
}

.root-error-screen {
  position: relative;
  display: flex;
  min-height: 100dvh;
  width: 100%;
  align-items: flex-end;
  padding: calc(var(--safe-area-top) + 24px) 20px calc(var(--safe-area-bottom) + 24px);
  background:
    radial-gradient(circle at 20% 14%, rgba(102, 126, 234, 0.28), transparent 30%),
    radial-gradient(circle at 88% 0%, rgba(248, 113, 113, 0.22), transparent 32%),
    linear-gradient(180deg, #ffffff 0%, #f4f6ff 100%);
  overflow: hidden;
}

.root-error-orb {
  position: absolute;
  top: 84px;
  right: -52px;
  width: 180px;
  height: 180px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(102, 126, 234, 0.24), rgba(118, 75, 162, 0.12));
  filter: blur(2px);
}

.root-error-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  padding: 24px;
  border: 1px solid rgba(31, 41, 55, 0.08);
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: 0 28px 90px rgba(27, 31, 59, 0.16);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

.root-error-eyebrow {
  color: var(--brand-primary);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.root-error-card h1 {
  margin: 0;
  color: rgba(15, 23, 42, 0.94);
  font-size: 32px;
  line-height: 1.05;
  letter-spacing: -0.04em;
}

.root-error-card p {
  margin: 0;
  color: rgba(15, 23, 42, 0.62);
  font-size: 15px;
  line-height: 1.5;
}

.root-error-message {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 118px;
  overflow: auto;
  padding: 12px 14px;
  border: 1px solid rgba(102, 126, 234, 0.16);
  border-radius: 16px;
  background: rgba(102, 126, 234, 0.08);
  color: rgba(15, 23, 42, 0.72);
  font-size: 13px;
  line-height: 1.45;
  word-break: break-word;
  -webkit-overflow-scrolling: touch;
}

.root-error-message strong {
  color: rgba(15, 23, 42, 0.88);
  font-size: 14px;
}

.root-error-message span {
  color: rgba(15, 23, 42, 0.62);
}

.root-error-details {
  margin-top: 2px;
}

.root-error-details summary {
  cursor: pointer;
  color: rgba(102, 126, 234, 0.92);
  font-weight: 800;
}

.root-error-details pre {
  margin: 8px 0 0;
  white-space: pre-wrap;
  color: rgba(15, 23, 42, 0.62);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 11px;
  line-height: 1.45;
}

.root-error-actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.root-error-primary,
.root-error-secondary {
  height: 46px;
  border: 0;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 800;
}

.root-error-primary {
  background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
  color: #fff;
  box-shadow: 0 14px 34px rgba(102, 126, 234, 0.28);
}

.root-error-secondary {
  background: rgba(15, 23, 42, 0.06);
  color: rgba(15, 23, 42, 0.72);
}

.root-error-copy {
  border: 1px solid rgba(102, 126, 234, 0.18);
  background: rgba(102, 126, 234, 0.08);
  color: rgba(79, 70, 229, 0.88);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
}

.launch-screen {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100%;
  background: #ffffff;
  overflow: hidden;
}

.launch-topbar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: calc(var(--safe-area-top) + 12px) 16px 0;
  min-height: calc(var(--safe-area-top) + 44px);
}

.launch-hero {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
}

.launch-hero-logo {
  display: block;
  width: 140px;
  height: auto;
  object-fit: contain;
  opacity: 0.92;
}

.launch-body {
  flex: 0 0 auto;
  padding: 0 20px calc(var(--safe-area-bottom) + 32px);
}

.mobile-language-switcher {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 34px;
  min-width: 70px;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid rgba(31, 41, 55, 0.08);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
  color: rgba(0, 0, 0, 0.62);
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  cursor: pointer;
  white-space: nowrap;
}

.launch-brand-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 44px;
}

.launch-logo {
  display: block;
  width: min(112px, 32vw);
  height: 38px;
  border: 0;
  border-radius: 0;
  outline: 0;
  background: transparent;
  box-shadow: none;
  object-fit: contain;
  object-position: left center;
}

.launch-kicker {
  color: var(--brand-primary) !important;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.pt-network-intro {
  position: relative;
  width: 100%;
  height: clamp(260px, 42vh, 390px);
  overflow: hidden;
  border: 1px solid rgba(100, 133, 200, 0.16);
  border-radius: 30px;
  background:
    radial-gradient(circle at 74% 28%, rgba(32, 214, 232, 0.16), transparent 28%),
    radial-gradient(circle at 22% 72%, rgba(83, 125, 255, 0.14), transparent 30%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(245, 248, 255, 0.62));
  box-shadow: inset 0 0 70px rgba(83, 125, 255, 0.08), 0 18px 54px rgba(39, 61, 105, 0.12);
}

.pt-network-intro::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.75), transparent),
    linear-gradient(90deg, rgba(83, 125, 255, 0.045) 1px, transparent 1px),
    linear-gradient(rgba(83, 125, 255, 0.038) 1px, transparent 1px);
  background-size: 220px 100%, 36px 36px, 36px 36px;
  opacity: 0.72;
  animation: pt-network-quiet-sweep 9s ease-in-out infinite;
}

.pt-network-intro__header {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 3;
  display: flex;
  align-items: center;
  min-height: 30px;
  padding: 0 12px;
  border: 1px solid rgba(83, 125, 255, 0.16);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.64);
  color: rgba(9, 19, 38, 0.58);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.pt-network-intro__mesh {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.pt-network-intro__edge {
  fill: none;
  stroke: rgba(72, 104, 160, 0.22);
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-dasharray: 6 10;
  animation: pt-network-edge-flow 12s linear infinite;
}

.pt-network-intro__edge--hot {
  stroke: rgba(62, 199, 225, 0.62);
  stroke-width: 1.8;
  filter: drop-shadow(0 0 5px rgba(32, 214, 232, 0.36));
}

.pt-network-intro__data {
  opacity: 0.96;
  filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 8px 14px rgba(58, 87, 145, 0.12));
}

.pt-network-intro__data--blue {
  color: #537dff;
}

.pt-network-intro__data--cyan {
  color: #20d6e8;
}

.pt-network-intro__data--green {
  color: #35d48a;
}

.pt-network-intro__data--amber {
  color: #f5b73f;
}

.pt-network-intro__data--rose {
  color: #eb6f9c;
}

.pt-network-intro__token-shell {
  fill: rgba(255, 255, 255, 0.9);
  stroke: currentColor;
  stroke-width: 1.25;
  vector-effect: non-scaling-stroke;
}

.pt-network-intro__token-glyph {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.pt-network-intro__node-hit {
  fill: rgba(255, 255, 255, 0.78);
  stroke: rgba(83, 125, 255, 0.24);
  stroke-width: 1.2;
  filter: drop-shadow(0 12px 22px rgba(58, 87, 145, 0.14));
}

.pt-network-intro__node-halo {
  fill: none;
  stroke: rgba(83, 125, 255, 0.16);
  stroke-width: 1.2;
  transform-origin: center;
  animation: pt-network-halo 4.2s ease-out infinite;
}

.pt-network-intro__node-label {
  fill: rgba(9, 19, 38, 0.78);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.055em;
  text-anchor: middle;
  text-transform: uppercase;
}

.pt-network-intro__node-sub {
  fill: rgba(9, 19, 38, 0.42);
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-anchor: middle;
  text-transform: uppercase;
}

.pt-network-intro__node--selected .pt-network-intro__node-hit {
  fill: rgba(255, 255, 255, 0.96);
  stroke: rgba(83, 125, 255, 0.72);
  stroke-width: 1.8;
  filter: drop-shadow(0 0 18px rgba(83, 125, 255, 0.38)) drop-shadow(0 16px 26px rgba(58, 87, 145, 0.18));
  animation: pt-network-selected-pop 6.2s ease-in-out infinite;
}

.pt-network-intro__node--selected .pt-network-intro__node-halo {
  stroke: rgba(83, 125, 255, 0.45);
  animation: pt-network-selected-halo 2.7s ease-out infinite;
}

.pt-network-intro__placeholder-name {
  animation: pt-network-fade-old 6.2s ease-in-out infinite;
}

.pt-network-intro__chosen-name {
  opacity: 0;
  animation: pt-network-fade-chosen 6.2s ease-in-out infinite;
}

.pt-network-intro__swap-flash {
  opacity: 0;
  fill: none;
  stroke: rgba(32, 214, 232, 0.62);
  stroke-width: 1.2;
  transform-origin: center;
  animation: pt-network-swap-flash 6.2s ease-out infinite;
}

@keyframes pt-network-quiet-sweep {
  0%, 100% { background-position: -260px 0, 0 0, 0 0; }
  50% { background-position: 260px 0, 18px 18px, 18px 18px; }
}

@keyframes pt-network-edge-flow {
  to { stroke-dashoffset: -160; }
}

@keyframes pt-network-halo {
  0%, 100% { opacity: 0.18; transform: scale(1); }
  50% { opacity: 0.36; transform: scale(1.08); }
}

@keyframes pt-network-selected-halo {
  0% { opacity: 0.6; transform: scale(0.92); }
  100% { opacity: 0; transform: scale(1.48); }
}

@keyframes pt-network-selected-pop {
  0%, 34% { transform: scale(1); }
  43% { transform: scale(1.08); }
  55%, 100% { transform: scale(1); }
}

@keyframes pt-network-fade-old {
  0%, 32% { opacity: 1; }
  43%, 100% { opacity: 0; }
}

@keyframes pt-network-fade-chosen {
  0%, 35% { opacity: 0; }
  48%, 100% { opacity: 1; }
}

@keyframes pt-network-swap-flash {
  35% { opacity: 0; transform: scale(0.85); }
  47% { opacity: 0.84; transform: scale(1.18); }
  66%, 100% { opacity: 0; transform: scale(1.62); }
}

@media (prefers-reduced-motion: reduce) {
  .pt-network-intro *,
  .pt-network-intro::before {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

.auth-gate-screen {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  width: 100%;
  padding: calc(var(--safe-area-top) + 20px) 20px calc(var(--safe-area-bottom) + 16px);
  background:
    radial-gradient(circle at 20% 12%, rgba(102, 126, 234, 0.24), transparent 32%),
    radial-gradient(circle at 88% 8%, rgba(118, 75, 162, 0.2), transparent 28%),
    linear-gradient(180deg, #ffffff 0%, #f4f6ff 100%);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.auth-gate-brand {
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
  gap: 18px;
  padding-top: 6px;
}

.auth-gate-title {
  margin: 8px 0 0 !important;
  font-size: 32px !important;
  line-height: 1.08 !important;
  letter-spacing: -0.04em !important;
}

.auth-gate-card {
  display: flex;
  flex: 0 0 auto;
  margin-top: auto;
  border-radius: 28px !important;
  box-shadow: 0 24px 80px rgba(27, 31, 59, 0.12);
}

.auth-gate-card > .ant-card-body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

.auth-station-summary {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  min-height: 58px;
  padding: 10px 12px;
  border: 1px solid rgba(102, 126, 234, 0.18);
  border-radius: 16px;
  background: rgba(102, 126, 234, 0.08);
}

.auth-station-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 14px;
  background: #fff;
  color: var(--brand-primary);
}

.auth-station-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.auth-gate-copy {
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(0, 0, 0, 0.5);
}

.auth-fields {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.auth-account-history {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.auth-account-history > .ant-typography {
  font-size: 12px;
}

.auth-account-list {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
}

.auth-account-chip {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  gap: 1px;
  max-width: 176px;
  padding: 8px 10px;
  border: 1px solid rgba(15, 23, 42, 0.1);
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.86);
  color: rgba(15, 23, 42, 0.86);
  text-align: left;
  appearance: none;
  -webkit-appearance: none;
}

.auth-account-chip.active {
  border-color: rgba(102, 126, 234, 0.38);
  background: rgba(102, 126, 234, 0.1);
}

.auth-account-chip span,
.auth-account-chip small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.auth-account-chip span {
  font-size: 13px;
  font-weight: 700;
}

.auth-account-chip small {
  color: rgba(15, 23, 42, 0.46);
  font-size: 11px;
}

.auth-fields .ant-input,
.auth-fields .ant-input-affix-wrapper {
  min-height: 44px;
  border-radius: 12px;
}

.auth-error {
  display: block;
  padding: 8px 10px;
  border-radius: 12px;
  background: rgba(255, 77, 79, 0.08);
}

.auth-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
}

.auth-actions .ant-btn {
  height: 44px;
  border-radius: 12px;
}

.launch-card {
  flex: 0 0 auto;
  border-radius: 16px !important;
  border: 1px solid rgba(31, 41, 55, 0.08) !important;
  box-shadow: 0 4px 20px rgba(27, 31, 59, 0.05);
}

.launch-card > .ant-card-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 16px !important;
}

.station-selector {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  gap: 12px;
}

.launch-actions {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  gap: 10px;
}

.mobile-truncate {
  display: block;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.station-selector-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.station-selector-header > div {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.station-helper-line {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  max-width: 100%;
  color: rgba(0, 0, 0, 0.45);
  font-size: 13px;
  line-height: 18px;
  white-space: nowrap;
}

.station-helper-line.warning {
  color: #ad6800;
}

.station-helper-line span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.station-input-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 36px;
  align-items: center;
  gap: 6px;
}

.station-input-row.with-cancel {
  grid-template-columns: minmax(0, 1fr) 36px 36px;
}

.station-input-row > .ant-btn {
  height: 36px;
  width: 36px;
  padding: 0;
  border-radius: 10px;
}

.station-input-cancel {
  color: rgba(0, 0, 0, 0.45) !important;
}

.station-url-control {
  display: flex;
  align-items: center;
  min-width: 0;
  height: 44px;
  gap: 6px;
  padding: 4px;
  border: 1px solid #d9d9d9;
  border-radius: 12px;
  background: #fff;
  overflow: hidden;
}

.station-url-control:focus-within {
  border-color: var(--brand-primary);
  box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.12);
}

.station-url-control.error {
  border-color: #ff4d4f;
}

.station-protocol-select {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  min-width: 72px;
  height: 34px;
  padding: 0 13px;
  border: 1px solid rgba(15, 23, 42, 0.1);
  border-radius: 9px;
  background: #fff;
  box-shadow: none;
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1;
  color: rgba(0, 0, 0, 0.72);
  text-align: center;
  appearance: none;
  -webkit-appearance: none;
}

.station-address-input {
  flex: 1 1 auto;
  min-width: 0;
  padding-left: 6px !important;
}

.station-address-input .ant-input {
  min-width: 0;
  padding-left: 2px !important;
}

.station-error {
  display: block;
  padding: 8px 10px;
  border-radius: 12px;
  background: rgba(255, 77, 79, 0.08);
}

.station-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 210px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.station-empty,
.station-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--brand-muted);
}

.station-entry {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto 16px 30px;
  cursor: pointer;
  border: 1px solid transparent;
}

.station-entry.active {
  border-color: rgba(102, 126, 234, 0.28);
  background: rgba(102, 126, 234, 0.1);
  color: var(--brand-primary);
}

.station-entry-copy {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  text-align: left;
}

.station-entry-status {
  flex: 0 0 auto;
  color: rgba(0, 0, 0, 0.38);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.station-entry-status.online {
  color: #389e0d;
}

.station-entry-status.validating {
  color: rgba(0, 0, 0, 0.45);
}

.station-entry-status.offline {
  color: #cf1322;
}

.station-remove {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  color: rgba(0, 0, 0, 0.38);
}

.station-remove:active {
  background: rgba(0, 0, 0, 0.06);
  color: rgba(0, 0, 0, 0.7);
}

.station-add-secondary {
  align-self: flex-start;
  height: 30px;
  padding-inline: 2px !important;
  color: rgba(0, 0, 0, 0.56) !important;
  font-weight: 600;
}

.mobile-shell {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100%;
  background: var(--brand-muted);
  overflow: hidden;
}

.mobile-content {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  position: relative;
}

.page-container {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  padding-top: var(--safe-area-top);
  background: var(--brand-muted);
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.mobile-tabbar {
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: calc(var(--tabbar-height) + var(--safe-area-bottom));
  padding-bottom: var(--safe-area-bottom);
  border-top: 0.5px solid var(--brand-border);
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  flex: 0 0 auto;
  z-index: 100;
}

.tabbar-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 1;
  height: var(--tabbar-height);
  border: none;
  background: none;
  color: rgba(0, 0, 0, 0.4);
  cursor: pointer;
  transition: color 0.15s, transform 0.1s;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

.tabbar-item.active {
  color: var(--brand-primary);
}

.tabbar-item:active {
  transform: scale(0.92);
}

.tabbar-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.01em;
}

.tabbar-item.active .tabbar-label {
  font-weight: 600;
}

.tabbar-item .ant-badge {
  line-height: 0;
}

.moments-page {
  gap: 0;
  padding-bottom: calc(var(--tabbar-height) + var(--safe-area-bottom));
}

.moments-composer-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 0 18px 18px;
  padding: 16px;
  border: 1px solid rgba(15, 23, 42, 0.06);
  border-radius: 24px;
  background: var(--brand-surface);
  box-shadow: 0 18px 50px rgba(27, 31, 59, 0.08);
}

.moments-composer-eyebrow {
  color: rgba(102, 126, 234, 0.92) !important;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.moments-image-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.moments-image-tile {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 16px;
  background: rgba(15, 23, 42, 0.08);
}

.moments-image-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.moments-image-tile.uploading img,
.moments-image-tile.error img {
  filter: brightness(0.72);
}

.moments-image-status {
  position: absolute;
  left: 6px;
  bottom: 6px;
  max-width: calc(100% - 12px);
  padding: 3px 6px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.72);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}

.moments-image-actions {
  position: absolute;
  top: 6px;
  right: 6px;
  display: flex;
  gap: 4px;
}

.moments-image-actions button {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: none;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  color: rgba(15, 23, 42, 0.76);
}

.moments-composer-actions {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.moments-composer-actions .ant-btn {
  flex: 1;
  min-width: 0;
}

.page-header {
  display: flex;
  align-items: center;
  height: var(--header-height);
  min-height: var(--header-height);
  padding: 0 18px;
  gap: 12px;
  background: rgba(245, 246, 251, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-logo {
  display: block;
  width: 54px;
  height: 24px;
  border: 0;
  border-radius: 0;
  outline: 0;
  background: transparent;
  box-shadow: none;
  object-fit: contain;
}

.header-title {
  flex: 1;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.04em;
}

.header-title.compact {
  font-size: 18px;
  line-height: 1.1;
}

.header-title-stack {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.header-action {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: 1px solid rgba(15, 23, 42, 0.08);
  background: var(--brand-surface);
  border-radius: 12px;
  color: rgba(0, 0, 0, 0.62);
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
}

.mobile-shell .ant-avatar,
.chat-header-avatar {
  border-radius: 12px !important;
}

.contacts-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 40px 40px;
  align-items: center;
  gap: 8px;
  padding: 0 18px 12px;
}

.contacts-search-input .ant-input-affix-wrapper,
.contacts-search-input.ant-input-affix-wrapper {
  height: 38px;
  border-radius: 10px;
}

.contacts-add-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 38px;
  border: 1px solid rgba(15, 23, 42, 0.08);
  border-radius: 10px;
  color: rgba(0, 0, 0, 0.68);
  background: var(--brand-surface);
  box-shadow: 0 8px 24px rgba(31, 41, 55, 0.06);
  cursor: pointer;
}

.chat-search-bar {
  padding: 0 18px 12px;
}

.chat-search-bar .ant-input-affix-wrapper {
  height: 38px;
  border-radius: 10px;
}

.chat-search-bar.thread {
  padding-top: 8px;
  background: #f2f4fb;
}

.message-search-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0 18px 8px;
  padding: 10px;
  border-radius: 16px;
  background: var(--brand-surface);
  box-shadow: 0 8px 26px rgba(27, 31, 59, 0.06);
}

.message-search-result {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 10px;
  background: rgba(248, 250, 252, 0.8);
  text-align: left;
}

.empty-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 18px 18px;
  min-height: 420px;
  padding: 28px 18px;
  border-radius: 28px;
  background: var(--brand-surface);
  box-shadow: 0 18px 60px rgba(27, 31, 59, 0.08);
}

.empty-copy {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 280px;
  margin: 0 auto;
  text-align: center;
}

.mobile-notice {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  margin: 0 18px 10px;
  padding: 10px 10px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.35;
  word-break: break-word;
}

.mobile-notice.error {
  background: rgba(255, 77, 79, 0.1);
  color: #d9363e;
}

.mobile-notice.info {
  background: rgba(76, 110, 245, 0.1);
  color: #3d5afe;
}

.mobile-notice.success {
  background: rgba(82, 196, 26, 0.1);
  color: #237804;
}

.mobile-notice-icon {
  flex: 0 0 auto;
}

.mobile-notice-copy {
  min-width: 0;
}

.mobile-notice-close {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border: 0;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.54);
  color: inherit;
}

.page-error {
  margin: 0 18px 10px;
  padding: 8px 10px;
  border-radius: 12px;
  background: rgba(255, 77, 79, 0.08);
  word-break: break-word;
}

.social-list-panel {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0 0 18px;
  padding: 0 12px;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.social-list-panel .ant-list {
  overflow: hidden;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: 0 10px 32px rgba(27, 31, 59, 0.06);
}

.social-list-panel .ant-list-item {
  border-block-end: 0.5px solid rgba(15, 23, 42, 0.06) !important;
}

.conversation-item,
.contact-item {
  min-height: 68px;
  padding: 10px 12px !important;
  cursor: pointer;
}

.conversation-item .ant-list-item-meta,
.contact-item .ant-list-item-meta {
  align-items: center !important;
}

.conversation-item .ant-avatar,
.contact-item .ant-avatar {
  width: 48px;
  height: 48px;
  border-radius: 14px !important;
  font-size: 17px;
}

.conversation-avatar-frame {
  position: relative;
  display: inline-flex;
  width: 48px;
  height: 48px;
}

.conversation-online-dot {
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 12px;
  height: 12px;
  border: 2px solid #fff;
  border-radius: 999px;
  background: #52c41a;
  box-shadow: 0 2px 5px rgba(15, 23, 42, 0.16);
}

.conversation-item .ant-list-item-meta-title,
.contact-item .ant-list-item-meta-title {
  margin-bottom: 2px !important;
}

.conversation-item .ant-list-item-meta-description,
.contact-item .ant-list-item-meta-description {
  max-width: 210px;
  overflow: hidden;
  color: rgba(0, 0, 0, 0.45) !important;
  font-size: 14px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.conversation-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  align-self: stretch;
  justify-content: center;
  gap: 7px;
  min-width: 50px;
  padding-left: 8px;
}

.conversation-meta .ant-typography {
  font-size: 12px;
}

.conversation-title-row {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.conversation-title-row svg {
  flex: 0 0 auto;
  color: rgba(0, 0, 0, 0.42);
}

.social-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 6px 7px;
  color: rgba(0, 0, 0, 0.48);
  font-size: 12px;
  text-transform: uppercase;
}

.friend-request-form,
.find-people-modal {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.find-people-modal .page-error {
  margin: 0;
}

.group-management-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.group-create-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.group-setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(248, 250, 252, 0.9);
}

.group-management-panel .ant-list-item {
  padding-inline: 0 !important;
}

.group-management-panel .ant-tag {
  margin-inline-end: 0;
}

.people-result-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 360px;
  overflow-y: auto;
}

.people-result-card {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 1px solid rgba(15, 23, 42, 0.06);
  border-radius: 14px;
  background: rgba(248, 250, 252, 0.8);
}

.people-result-copy {
  min-width: 0;
}

.people-result-title {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.people-result-title .ant-tag {
  margin: 0;
  font-size: 10px;
  line-height: 16px;
}

.contact-profile-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 8px 0 4px;
}

.contact-profile-copy {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  text-align: center;
}

.contact-profile-name {
  font-size: 18px !important;
}

.contact-profile-note {
  max-width: 100%;
  color: rgba(0, 0, 0, 0.72);
}

.contact-profile-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  width: 100%;
}

.contact-profile-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px;
  border-radius: 12px;
  background: rgba(248, 250, 252, 0.9);
}

.contact-profile-tags {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}

.notification-drawer .ant-drawer-content {
  border-radius: 24px 24px 0 0;
  overflow: hidden;
}

.notification-drawer .ant-drawer-header {
  padding: 14px 18px;
}

.notification-drawer .ant-drawer-body {
  padding: 0 14px calc(var(--safe-area-bottom) + 14px);
}

.notification-list .ant-list-item {
  border-block-end: none !important;
}

.notification-item {
  display: grid !important;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  align-items: center !important;
  gap: 10px;
  margin: 8px 0;
  padding: 10px !important;
  border: 1px solid rgba(15, 23, 42, 0.06);
  border-radius: 16px;
  background: rgba(248, 250, 252, 0.8);
  cursor: pointer;
}

.notification-item.unread {
  border-color: rgba(102, 126, 234, 0.24);
  background: rgba(102, 126, 234, 0.08);
}

.notification-icon {
  background: rgba(102, 126, 234, 0.12) !important;
  color: var(--brand-primary) !important;
}

.notification-copy {

/* ============================================================
   Moments feed — prototype-matching card layout
   ============================================================ */

.moments-feed {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 12px 20px;
}

.moments-card {
  border-radius: 14px !important;
  border: 1px solid rgba(15, 23, 42, 0.06) !important;
  box-shadow: 0 1px 3px rgba(31, 35, 48, 0.03);
}

.moments-card > .ant-card-body {
  padding: 14px !important;
}

.moments-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.moments-card-author {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.moments-card-name {
  font-size: 14px !important;
  font-weight: 600 !important;
  color: rgba(31, 35, 48, 0.88);
}

.moments-card-time {
  font-size: 11px !important;
}

.moments-card-text {
  margin: 0 0 10px;
  font-size: 14px;
  line-height: 1.5;
  color: rgba(51, 56, 69, 0.88);
}

/* Moments image grid */

.moments-image-single {
  border-radius: 10px;
  overflow: hidden;
  width: 240px;
  max-width: 100%;
  aspect-ratio: 4 / 3;
  background-size: cover;
  background-position: center;
}

.moments-image-single img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.moments-image-grid-2,
.moments-image-grid-3 {
  display: grid;
  gap: 4px;
}

.moments-image-grid-2 {
  grid-template-columns: repeat(2, 1fr);
  max-width: 280px;
}

.moments-image-grid-3 {
  grid-template-columns: repeat(3, 1fr);
  max-width: 320px;
}

.moments-image-grid-2 .moments-grid-image,
.moments-image-grid-3 .moments-grid-image {
  aspect-ratio: 1;
  border-radius: 10px;
  overflow: hidden;
}

.moments-grid-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Moments reaction summary */

.moments-reaction-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}

.moments-reaction-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.06);
  font-size: 11px;
  font-weight: 600;
  color: rgba(75, 79, 94, 0.88);
}

.moments-reaction-tag.mine {
  background: rgba(102, 126, 234, 0.1);
  color: var(--brand-primary);
}

/* Moments action row */

.moments-card-actions {
  position: relative;
  display: flex;
  align-items: center;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 0.5px solid rgba(15, 23, 42, 0.06);
}

.moments-action-group {
  display: flex;
  align-items: center;
  gap: 18px;
}

.moments-action {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: none;
  background: none;
  color: rgba(107, 112, 128, 0.8);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  padding: 4px 0;
  transition: color 0.12s;
  -webkit-tap-highlight-color: transparent;
}

.moments-action.reacted {
  color: #ef4444;
}

.moments-action:active {
  opacity: 0.6;
}

.moments-action--share {
  margin-left: auto;
}

.moments-action:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Moments reaction picker */

.moments-reaction-picker {
  position: absolute;
  top: -44px;
  left: 0;
  display: flex;
  gap: 4px;
  padding: 6px 8px;
  background: #fff;
  border-radius: 999px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
  z-index: 10;
  animation: moments-pop-in 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes moments-pop-in {
  from {
    opacity: 0;
    transform: scale(0.85) translateY(6px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.moments-reaction-picker-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: none;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
  border-radius: 10px;
  padding: 0;
  transition: transform 0.12s, background 0.12s;
  -webkit-tap-highlight-color: transparent;
}

.moments-reaction-picker-btn:active {
  transform: scale(0.85);
  background: rgba(15, 23, 42, 0.06);
}

.moments-reaction-picker-btn.active {
  transform: scale(1.15);
}

/* Moments comment section */

.moments-comments {
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(15, 23, 42, 0.03);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.moments-comment {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

.moments-comment-body {
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex: 1;
  min-width: 0;
}

.moments-comment-name {
  font-size: 12px !important;
  color: var(--brand-primary) !important;
}

.moments-comment-text {
  font-size: 13px;
  color: rgba(51, 56, 69, 0.88);
  line-height: 1.4;
}

.moments-comment-time {
  font-size: 10px !important;
}

.moments-comment-more {
  align-self: flex-start;
  border: none;
  background: none;
  padding: 2px 0;
  color: rgba(156, 160, 171, 0.8);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}

.moments-comment-more:active {
  color: rgba(74, 79, 94, 0.8);
}

/* Moments inline comment input */

.moments-comment-input-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 0.5px solid rgba(15, 23, 42, 0.06);
}

.moments-comment-input {
  flex: 1;
  border: 1px solid rgba(15, 23, 42, 0.12);
  border-radius: 18px;
  padding: 6px 12px;
  font-size: 13px;
  outline: none;
  font-family: inherit;
}

.moments-comment-input:focus {
  border-color: var(--brand-primary);
}

.moments-comment-send {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: rgba(15, 23, 42, 0.06);
  color: rgba(156, 160, 171, 0.8);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.moments-comment-send.active {
  background: var(--brand-primary);
  color: #ffffff;
}

/* Moments new post card */

.moments-new-post-card {
  margin: 0 12px 8px;
  background: #ffffff;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}

.moments-new-post-textarea {
  width: 100%;
  border: 1px solid rgba(15, 23, 42, 0.12);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  resize: none;
  font-family: inherit;
  outline: none;
}

.moments-new-post-textarea:focus {
  border-color: var(--brand-primary);
}

.moments-new-post-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}

.moments-new-post-cancel {
  border: none;
  background: rgba(15, 23, 42, 0.06);
  color: rgba(107, 112, 128, 0.8);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

.moments-new-post-submit {
  border: none;
  background: var(--brand-primary);
  color: #ffffff;
  padding: 6px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.moments-new-post-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Moments feed load more */

.moments-feed-load-more,
.moments-feed-loading-more,
.moments-feed-end {
  display: flex;
  justify-content: center;
  padding: 8px 0;
}

/* ============================================================
   Settings / Profile — prototype-matching layout
   ============================================================ */

.settings-page {
  gap: 0;
  padding-bottom: calc(var(--tabbar-height) + var(--safe-area-bottom) + 32px);
}

.settings-body {
  padding: 12px 14px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Profile header card */

.settings-profile-header-card {
  border-radius: 14px !important;
  border: 1px solid rgba(15, 23, 42, 0.06) !important;
  box-shadow: 0 1px 3px rgba(31, 35, 48, 0.03);
}

.settings-profile-header-card > .ant-card-body {
  padding: 16px !important;
}

.settings-profile-header {
  display: flex;
  align-items: center;
  gap: 14px;
}

.settings-profile-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  min-width: 0;
}

.settings-profile-name {
  font-size: 18px !important;
  font-weight: 700 !important;
  color: rgba(31, 35, 48, 0.92);
}

.settings-profile-ptid {
  font-size: 12px !important;
  font-family: 'SF Mono', 'Menlo', monospace;
  letter-spacing: 0.02em;
}

/* Profile stats row */

.settings-profile-stats {
  display: flex;
  align-items: center;
  justify-content: space-around;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 0.5px solid rgba(15, 23, 42, 0.06);
}

.settings-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  flex: 1;
}

.settings-stat-value {
  font-size: 18px !important;
  font-weight: 700 !important;
  color: rgba(31, 35, 48, 0.92);
}

.settings-stat-label {
  font-size: 11px !important;
}

.settings-stat-divider {
  width: 0.5px;
  height: 28px;
  background: rgba(15, 23, 42, 0.12);
}

/* Settings group block */

.settings-group-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.settings-group-block-title {
  padding: 0 4px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: rgba(156, 160, 171, 0.8);
}

.settings-group-card {
  border-radius: 14px !important;
  border: 1px solid rgba(15, 23, 42, 0.06) !important;
  box-shadow: 0 1px 3px rgba(31, 35, 48, 0.03);
}

.settings-group-card > .ant-card-body {
  padding: 0 !important;
}

/* Settings row */

.setting-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  transition: background 0.12s;
  cursor: pointer;
}

.setting-row:active {
  background: rgba(15, 23, 42, 0.03);
}

.setting-row--border {
  border-top: 0.5px solid rgba(15, 23, 42, 0.06);
}

.setting-row-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  flex: 0 0 auto;
}

.setting-row-label {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  color: rgba(51, 56, 69, 0.88);
}

.setting-row-value {
  font-size: 13px !important;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.setting-row-control {
  flex: 0 0 auto;
}

/* Sign out button */

.settings-sign-out {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 14px;
  border: 1px solid rgba(15, 23, 42, 0.06);
  border-radius: 14px;
  background: #fff;
  color: #ef4444;
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s;
  box-shadow: 0 1px 3px rgba(31, 35, 48, 0.03);
  -webkit-tap-highlight-color: transparent;
}

.settings-sign-out:active {
  background: rgba(15, 23, 42, 0.03);
}

/* Settings dirty bar (keep in prototype style) */

.settings-dirty-bar {
  margin: 0 14px 8px;
  padding: 10px 14px;
  border-radius: 14px;
  background: rgba(102, 126, 234, 0.06);
  border: 1px solid rgba(102, 126, 234, 0.12);
}

.settings-dirty-conflict {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.settings-dirty-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.settings-dirty-buttons {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ── Conversation list — prototype-aligned icons & preview ── */

.conversation-state-icon {
  flex: 0 0 auto;
  color: rgba(0, 0, 0, 0.36);
}

.conversation-preview {
  display: block;
  max-width: 100%;
  overflow: hidden;
  color: rgba(0, 0, 0, 0.45);
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.conversation-time {
  font-size: 11px !important;
}

.conversation-badge .ant-badge-count {
  font-size: 10px;
  font-weight: 600;
  min-width: 18px;
  height: 18px;
  line-height: 18px;
  padding: 0 5px;
  border-radius: 999px;
}

/* ── Contacts page — prototype-aligned sections ── */

.contacts-body {
  padding: 8px 0 20px;
}

.contact-section {
  margin-bottom: 8px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px 6px;
  background: rgba(0, 0, 0, 0.03);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(0, 0, 0, 0.42);
}

.group-list,
.contact-list {
  background: #fff;
}

.group-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  border-bottom: 0.5px solid rgba(15, 23, 42, 0.06);
  cursor: pointer;
  transition: background 0.12s;
}

.group-item:last-child {
  border-bottom: none;
}

.group-item:active {
  background: rgba(0, 0, 0, 0.03);
}

.group-item .ant-avatar {
  width: 44px;
  height: 44px;
  border-radius: 14px !important;
}

.group-info {
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex: 1;
  min-width: 0;
}

.contact-letter {
  padding: 4px 16px;
  background: rgba(0, 0, 0, 0.03);
  font-size: 12px;
  font-weight: 600;
  color: rgba(0, 0, 0, 0.42);
}

.contact-item-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 0.5px solid rgba(15, 23, 42, 0.06);
  cursor: pointer;
  transition: background 0.12s;
}

.contact-item-row:last-child {
  border-bottom: none;
}

.contact-item-row:active {
  background: rgba(0, 0, 0, 0.03);
}

.contact-item-row .ant-avatar {
  width: 44px;
  height: 44px;
  border-radius: 14px !important;
}

.contact-item-row .conversation-avatar-frame {
  width: 44px;
  height: 44px;
}

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex: 1;
  min-width: 0;
}
