schemaVersion: 1
journeys:
  - schemaVersion: 1
    id: sc-dj-runtime-lease-control
    domain: local-dev-control-plane
    title: Registered workspace and atomic Station capability lease control
    productAcceptanceRefs: []
    workClasses: [infrastructure]
    runtimeClass: service
    actorRoles: [current_workspace, competing_workspace]
    clientRoles: [local_dev_cli]
    requiredServiceRoles: [machine_dev_control_plane]
    steps:
      - id: register-current-workspace
        action: explicitly register the verified federation workspace to tracked profile four and machine slot 5 without creating or changing an environment definition
        expected: [registry authority becomes machine-control-plane, binding contains the verified workspace ID canonical root branch profile and slot]
        negative: [unregistered workspaces fail WORKSPACE_UNREGISTERED, dirty or untracked profile definitions cannot authorize deploy]
      - id: local-slot-acquire-hold-release
        action: in an isolated machine root run two child processes against the same local.slot 5 critical section
        expected: [the first process holds the slot, the competitor fails LOCAL_SLOT_CONFLICT, the lease releases on success failure signal or timeout]
        negative: [a declaration alone never establishes possession, stale PID or JSON cannot establish a lease]
      - id: station-deploy-acquire-hold-release
        action: in an isolated machine root run two child processes against one fake station.deploy critical section that exercises the same make station lease wrapper without contacting a Station
        expected: [the first process atomically holds station.deploy through fake deploy restart and health readback, the competitor fails STATION_CAPABILITY_CONFLICT, the lease releases on success failure signal or timeout]
        negative: [no real Station mutation, no declaration-only possession, no stale-owner lock]
      - id: station-reset-acquire-hold-release
        action: in an isolated machine root run two child processes against one fake station.reset pre-audit deletion post-audit critical section without contacting a Station
        expected: [the first process holds one lease across the complete fake reset transaction, the competitor fails STATION_CAPABILITY_CONFLICT, the lease releases on success failure signal or timeout]
        negative: [no real reset, no lease gap between audit and deletion, no stale-owner lock]
      - id: profile-bound-resolution
        action: in an isolated machine root switch fixture-backed tracked four and fiveArm definitions then run config and dry-run preflight, while the real workspace registration remains bound only to four
        expected: [each fixture command resolves the isolated workspace binding, non-loopback URL and exact deploy environment before mutation while slot 5 remains workspace-owned]
        negative: [no basename sibling-worktree active-pointer or legacy profile slot fallback]
    budgets: { focusedCheckSeconds: 1200, functionalRunSeconds: 1200, cleanupSeconds: 300 }
    promotionGateIds: []

