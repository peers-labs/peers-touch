  - schemaVersion: 1
    id: sc-dj-content-prekey-client-boundary
    domain: key-exchange
    title: Canonical client Content PreKey publication and inventory
    productAcceptanceRefs: []
    workClasses: [infrastructure]
    runtimeClass: service
    actorRoles: [publisher, revoked_publisher]
    clientRoles: [http_client]
    requiredServiceRoles: [station_http, key_exchange, actor_identity, postgresql]
    steps:
      - id: canonical-publish-inventory
        action: publish endpoint and recovery pools through the canonical protobuf routes and read current inventory
        expected: [JWT actor header device and fresh device-possession proof are exact, returned inventory matches committed pool state, Direct and MLS state is unchanged]
        negative: [JSON query alternate duplicate unknown non-minimal and out-of-order protobuf encodings are rejected before mutation]
      - id: publication-receipt
        action: lose the first publish response then concurrently replay the exact command across a publisher profile rotation
        expected: [one command reservation and one atomic mutation exist, exact replay proves the commit, fresh inventory determines current readiness, completed receipt count never exceeds newly inserted immutable key count]
        negative: [changed or arbitrary command IDs conflict, first-time all-existing batches leave no receipt, concurrent retries leave no dangling PENDING, absent receipt never hides committed key rows]
      - id: publisher-races
        action: race publication and first claim against signing-key rotation and endpoint revocation
        expected: [Actor Identity row fencing yields one valid before-state or one typed rejection, unclaimed revoked or stale material is never exposed]
        negative: [no partial pool mutation, no claim after revocation fence, no Direct or MLS state change]
      - id: postgresql-contention
        action: execute receipt reservation, pool and Actor Identity lock ordering, concurrent replay, rotation and revocation races on PostgreSQL
        expected: [all required PostgreSQL tests execute without skip and produce one serializable receipt and pool outcome]
        negative: [missing DSN or skipped PostgreSQL evidence blocks EC5A, SQLite cannot substitute]
      - id: auth-error-lifecycle
        action: exercise missing invalid revoked wrong-actor wrong-device invalid-material oversized quota and dependency failures
        expected: [every route-matched response is the declared protobuf error with a stable code, only retryable quota or dependency failures carry Retry-After in 1..300, terminal failures omit it]
        negative: [wrong Station, wrong session, capability substitution, missing or invalid possession signature, short nonce, expired or future proof, and invalid per-PreKey issuer signature all fail before read or mutation with their distinct typed codes, no JSON error body, anonymous retry, secret log, handler-local queue, public claim route, or Direct/MLS alias]
    budgets: { focusedCheckSeconds: 1200, functionalRunSeconds: 1200, cleanupSeconds: 300 }
    promotionGateIds: [station-api-ownership, secure-content-prekey-client-boundary]

