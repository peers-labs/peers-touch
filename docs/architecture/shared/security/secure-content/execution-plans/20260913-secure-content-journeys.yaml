  - schemaVersion: 1
    id: sc-dj-social-expansion
    domain: social
    title: Desktop complete Social audience subtype and lifecycle matrix
    productAcceptanceRefs: [SOC-SEC-AS05, SOC-SEC-AS06, SOC-SEC-AS07, SOC-SEC-AS09, SOC-SEC-AS10, SOC-SEC-AS11, SOC-SEC-AS12, SOC-SEC-AS15, SOC-SEC-AS16]
    workClasses: [product-behavior]
    runtimeClass: native-desktop
    actorRoles: [alice, bob, eve, group_member, remote_recipient]
    clientRoles: [desktop_alice, desktop_bob, desktop_eve, desktop_remote_recipient]
    requiredServiceRoles: [station_primary, station_secondary, social, conversation_membership, key_exchange, object_backend]
    steps:
      - id: audience
        action: exercise FOLLOWERS FRIENDS CIRCLE GROUP SELF CUSTOM and remote-recipient rejection
        expected: [typed Circle and canonical Conversation Group targets select the intended local authority, CUSTOM_DENY accepts only FOLLOWERS, authorized readers succeed, stale snapshots and the fiveArm-backed remote recipient reject before publish]
        negative: [no CUSTOM_DENY(PUBLIC), numeric Group alias, synthetic remote PTID, remote-member truncation, partial Post, key claim, envelope, delivery or object grant]
      - id: comment
        action: edit encrypt submit retry rate-limit and invalidate parent
        expected: [COMMENT_EDITING and COMMENT_ENCRYPTING retain draft, COMMENT_SUBMITTING is local, COMMENT_POSTED is exact at receiver, COMMENT_FAILED is retryable, COMMENT_RATE_LIMITED exposes retry-after, COMMENT_PARENT_UNAVAILABLE disables submit]
        receiverRole: bob
      - id: subtype
        action: publish TEXT IMAGE VIDEO Poll Repost Mention Reaction Link and Location cases
        expected: [exact typed projection and audience rules, image and video receiver bytes match]
        receiverRole: bob
      - id: object
        action: traverse image and video placeholder grant download decrypt ready deny integrity offline attach replay conflict expire physical-delete failure worker restart and cleanup retry
        expected: [all eight media states preserve their actions, exact receiver bytes reach MEDIA_READY, exact attach replay returns the original result, conflicting attach is typed, unattached cleanup resumes through durable GC states, and attached objects are never collected]
        negative: [no public or plaintext fallback, partial grant, cross-resource attachment, cross-uploader attachment, silent metadata deletion, or deletion of attached media]
        receiverRole: bob
      - id: delete-block
        action: cancel before/after admission, time out, switch account, delete and block
        expected: [receipt resolves outcome, prior projection clears, future access denies]
