  - schemaVersion: 1
    id: sc-dj-canonical-schema-activation
    domain: local-dev-control-plane
    title: Canonical private schema activation before private Social Journeys
    productAcceptanceRefs: []
    workClasses: [infrastructure]
    runtimeClass: service
    actorRoles: [workspace_owner, competing_invocation]
    clientRoles: [schema_activation_controller]
    requiredServiceRoles: [machine_dev_control_plane, station_four, station_fiveArm]
    steps:
      - id: dwf-control-plane-prerequisite
        action: verify the separately delivered unversioned DWF-D23 control plane, its host-neutral rollout audit, the workspace-owned active-work record, and the current Plan declaration and Development Session checkpoint
        expected: [the Plan and Task Slices use the one current unversioned shape, Git declaration Session and active-work owners agree on source identity, and 13 of 22 closures remain done]
        negative: [no DWF-D18 or versioned workflow compatibility path, shared project-memory runtime truth, raw file rollout, partial semantic merge, or stale source declaration]
      - id: source-freeze
        action: under the W12A SOURCE_MUTATION declaration complete every remaining W7-W11 source scenario driver runtime-admission and hard-cut deliverable, run focused checks, record one clean canonical Development Session checkpoint, and write development/secure-content/W12A/source/<generation>/result.json
        expected: [the declaration Session and workspace-owned active-work record bind the exact commit consumed by both activations and no W7-W11 functional task retains source-write authority]
        negative: [no activation on dirty or partial source, no later functional-task patch under an older attestation, no mutable overwrite of an earlier generation result]
      - id: source-and-control-plane-preflight
        action: from the exact source-freeze checkpoint validate W12A-FOUR and W12A-FIVEARM as different work-item declarations, each containing exactly one profile deployment environment destructive scope and reset lease, plus the maintenance CLI identity reviewed SSH transport and closed SC-D23 database/object allowlists
        expected: [each profile declaration freezes its own immutable SCHEMA_ACTIVATION manifest and no product client starts]
        negative: [one declaration never contains both reset scopes; unknown schema edge attachment shape owner reference source service identity environment scope intent or manifest digest fails before mutation; no direct SQL DDL storage delete HTTP route reusable bearer or compatibility writer exists]
      - id: lease-process-lock-and-replay
        action: exercise the generic station.reset lease wrapper, direct-child SSH process, remote deployment-environment plus scope advisory lock, exact invocation replay, conflicting digest, competing invocation, expiry, and closed-channel cases
        expected: [one invocation owns the complete critical section, exact replay returns the current journal state, and every competitor or invalid invocation fails closed]
        negative: [no declaration-only possession, detached SSH mutation, parallel reset, changed-manifest resume, or journal advance after timeout disconnect lease loss or conflicting replay]
      - id: cancellation-boundaries
        action: cancel before database commit and separately interrupt by timeout or SSH disconnect after each durable journal transition
        expected: [pre-commit cancellation rolls back to PREPARED, post-transition interruption leaves Station quiesced at the last durable state, and resume uses the same manifest with a fresh invocation ID]
        negative: [no partial state reported as success, no Station restart before COMPLETE, no new reset ID or manifest during resume]
      - id: activate-four-then-five-arm
        action: complete W12A-FOUR then W12A-FIVEARM under separate reset IDs declarations exact scopes leases manifests journals and invocation sets
        expected: [both journals reach COMPLETE serially, each profile directory has one immutable manifest journal invocation set attestation and result, canonical private schema and indexes match current models, retired columns and private rows and objects are absent, and public plus non-Social state remains byte-equal]
        negative: [no cross-profile target, parallel activation, consumed Content PreKey reactivation, public mutation, or activation relabelled as FINAL_CUT]
      - id: aggregate-activation
        action: create one immutable W12A aggregate from exactly the four and fiveArm COMPLETE child-result digests plus the shared source-freeze digest
        expected: [the aggregate proves both current attestations belong to the same exact source generation and contains no product-pass claim]
        negative: [missing duplicate stale wrong-source or wrong-profile child fails aggregation, no child artifact is rewritten]
      - id: schema-attestation-admission
        action: emit one CanonicalPrivateSchemaAttestationV1 per completed profile and ask the runtime owner to admit a private Social manifest, then repeat with missing stale wrong-source wrong-profile wrong-service incomplete-journal and schema-drift attestations
        expected: [the exact current attestations bind both Station services before client launch and every invalid variant returns CANONICAL_PRIVATE_SCHEMA_UNAVAILABLE before the first private product action]
        negative: [no scenario-generated attestation, schema-inspection substitute, stale attestation acceptance, W7 pass, W12 pass, or formal Acceptance claim]
      - id: source-drift-reopen
        action: from a simulated W7-W11 source defect report only the failed task and first-failure ref; let the current Development Workflow owner mechanically select W12A and W7, quiesce the Session/runtime, release exact leases and declaration, record immutable evidence invalidation, return W12A to current, return W7 and every affected successor to pending, apply the root fix only under a new W12A SOURCE_MUTATION declaration, then publish a clean Session checkpoint and require both activations
        expected: [the Plan validates before and after reopen, earlier evidence remains immutable but cannot satisfy the new generation, and product retry is impossible until both fresh attestations exist]
        negative: [no source edit while a functional task owns the declaration, no done functional task remains credited against changed source, no recapture of the Plan initial HEAD]
      - id: release-and-restore
        action: release both reset leases, remove station.reset from the workspace registration, and restore the canonical workspace binding to profile four and slot 5
        expected: [station connect and deploy capability remain, later reset acquisition fails without fresh task authorization, and W7 becomes the next dependency-ready task]
    budgets: { focusedCheckSeconds: 1800, deploySeconds: 1200, functionalRunSeconds: 7200, cleanupSeconds: 1200 }
    promotionGateIds: []

