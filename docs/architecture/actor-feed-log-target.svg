<text class="viewpoint" x="1706" y="46" text-anchor="end">RUNTIME-TOPOLOGY</text>
<line class="headerRule" x1="44" y1="72" x2="1706" y2="72"/>
<rect class="zone zone-secondary" x="40" y="110" width="360" height="620" rx="7"/>
<text class="zoneTitle" x="54" y="137">CLIENT DEVICES</text>
<rect class="zone zone-external" x="1243" y="272" width="124" height="128" rx="7"/>
<text class="zoneTitle" x="1257" y="299">FALLBACK</text>
<rect class="zone zone-primary" x="800" y="110" width="440" height="700" rx="7"/>
<text class="zoneTitle" x="814" y="137">HOME STATION · 日志权威宿主</text>
