<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1750 900" width="1750" height="900"
  role="img" aria-labelledby="title-project.actor-feed-log-target">
<style>
  .canvas { fill: #111418; }
  .headerRule { stroke: #30363d; stroke-width: 1; }
