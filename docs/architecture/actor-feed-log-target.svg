<path class="edge edge-return" d="M 370 360 L 610 360 L 610 585 L 840 585" marker-end="url(#arrow-return)"/>
<rect class="edgeLabelBox" x="420.03" y="345" width="139.94" height="24" rx="4"/>
<text class="edgeLabel" x="490" y="362" text-anchor="middle">② 分页读时间线投影</text>
<path class="edge edge-event" d="M 1020 160 L 1020 140 L 1550 140 L 1550 160" marker-end="url(#arrow-event)"/>
<rect class="edgeLabelBox" x="1202.29" y="125" width="165.42" height="24" rx="4"/>
<text class="edgeLabel" x="1285" y="142" text-anchor="middle">③ 日志复制（默认直连）</text>
<path class="edge edge-secondary" d="M 1200 210 L 1210 210 L 1210 346 L 1252 346" marker-end="url(#arrow-secondary)"/>
<path class="edge edge-secondary" d="M 1358 346 L 1384 346 L 1384 210 L 1410 210" marker-end="url(#arrow-secondary)"/>
<rect class="node node-secondary" x="70" y="160" width="300" height="100" rx="6"/>
