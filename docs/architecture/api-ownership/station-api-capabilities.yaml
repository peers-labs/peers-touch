target_absent_routes:
  - { method: POST, path: /messaging/conversation/direct }
  - { method: GET, path: /messaging/conversation/list }
  - { method: POST, path: /messaging/command/prepare }
  - { method: POST, path: /messaging/command/submit }
  - { method: POST, path: /messaging/group/genesis/prepare }
  - { method: POST, path: /messaging/membership/transition/prepare }
  - { method: POST, path: /messaging/receipt/submit }
  - { method: POST, path: /conversation/receipt }
  - { method: POST, path: /device/register }
  - { method: POST, path: /keypackage/upload }
  - { method: POST, path: /keypackage/fetch }
