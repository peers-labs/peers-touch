    request_proto: peers_touch.model.chat.v1.SubmitConversationCommandRequest
    response_proto: peers_touch.model.chat.v1.SubmitConversationCommandResponse
    truth_stores: [conversations, conversation_events, conversation_command_receipts]
    allowed_dependencies: [conversation.delivery.enqueue, federation.delivery.enqueue]
    forbidden_aliases:
      - { method: POST, path: /messaging/command/submit }
    superseded_symbols:
      - peers_touch.model.chat.v1.SubmitMessagingCommandRequest
      - peers_touch.model.chat.v1.SubmitMessagingCommandResponse

