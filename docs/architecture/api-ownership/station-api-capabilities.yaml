schema_version: 1
status: accepted_target
scope: chat-social-federation-ownership-remediation
activation:
  state: implemented_expected_debt
  gate_enabled: true
  requirements:
    - complete_inventory_for_every_governed_prefix
    - implementation_gate_and_schema_validation_land_together
governed_prefixes:
  - /conversation/
  - /messaging/
  - /device/
  - /recovery/
  - /key-exchange/
  - /api/v1/social/friend-request
  - /api/v1/social/friend-requests
  - /federation/
owner_roots:
  station.conversation:
    - apps/station/app/subserver/conversation/
  station.conversation.delivery:
    - apps/station/app/subserver/conversation/
  station.actor_identity:
    - apps/station/app/subserver/actor_identity/subserver.go
  station.recovery:
    - apps/station/app/subserver/recovery/subserver.go
  station.key_exchange:
    - apps/station/app/subserver/key_exchange/
  station.social:
    - apps/station/app/subserver/social/handler.go
  station.federation:
    - apps/station/frame/core/federation/

ddd_layers:
  - name: conversation.domain
    root: apps/station/app/subserver/conversation/domain/
    forbidden_imports:
      - database/sql
      - github.com/peers-labs/peers-touch/station/app/subserver/conversation/application
      - github.com/peers-labs/peers-touch/station/app/subserver/conversation/infrastructure
      - github.com/peers-labs/peers-touch/station/app/subserver/conversation/interface
      - github.com/peers-labs/peers-touch/station/frame
      - gorm.io
      - net/http
  - name: conversation.application
    root: apps/station/app/subserver/conversation/application/
    forbidden_imports:
      - database/sql
      - github.com/peers-labs/peers-touch/station/app/subserver/conversation/infrastructure
      - github.com/peers-labs/peers-touch/station/app/subserver/conversation/interface
      - github.com/peers-labs/peers-touch/station/frame/core/server
      - github.com/peers-labs/peers-touch/station/frame/touch/model
      - gorm.io
      - net/http
  - name: conversation.infrastructure
    root: apps/station/app/subserver/conversation/infrastructure/
    forbidden_imports:
      - github.com/peers-labs/peers-touch/station/app/subserver/conversation/interface
  - name: conversation.interface.http
    root: apps/station/app/subserver/conversation/interface/http/
    forbidden_imports:
      - github.com/peers-labs/peers-touch/station/app/subserver/conversation/infrastructure

