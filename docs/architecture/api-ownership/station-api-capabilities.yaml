schema_version: 1
status: accepted_target
scope: chat-social-federation-ownership-remediation
activation:
  state: implemented_expected_debt
  gate_enabled: true
  requirements:
    - complete_inventory_for_every_governed_prefix
    - implementation_gate_and_schema_validation_land_together
governed_prefixes:
  - /conversation/
  - /messaging/
  - /device/
  - /recovery/
  - /key-exchange/
  - /api/v1/social/friend-request
  - /api/v1/social/friend-requests
  - /federation/
owner_roots:
  station.conversation:
    - apps/station/app/subserver/conversation/
  station.conversation.delivery:
    - apps/station/app/subserver/conversation/
  station.actor_identity:
    - apps/station/app/subserver/actor_identity/subserver.go
  station.recovery:
    - apps/station/app/subserver/recovery/subserver.go
  station.social:
    - apps/station/app/subserver/social/handler.go
  station.federation:
    - apps/station/frame/core/federation/

capabilities:
  - id: chat.conversation.create_direct
    domain_owner: station.conversation
    truth_owner: conversation.authority
    exposure: client
    canonical_route: { method: POST, path: /conversation/direct }
    request_proto: peers_touch.model.chat.v1.CreateDirectConversationRequest
    response_proto: peers_touch.model.chat.v1.CreateDirectConversationResponse
    truth_stores: [conversations, conversation_members, conversation_member_devices]
    allowed_dependencies: [actor.device_directory.read, conversation.delivery.enqueue]
    forbidden_aliases:
      - { method: POST, path: /messaging/conversation/direct }
    superseded_symbols:
      - peers_touch.model.chat.v1.CreateMessagingDirectConversationRequest
      - peers_touch.model.chat.v1.CreateMessagingDirectConversationResponse

  - id: chat.conversation.create_group
    domain_owner: station.conversation
    truth_owner: conversation.authority
    exposure: client
    canonical_route: { method: POST, path: /conversation/group }
    request_proto: peers_touch.model.chat.v1.CreateGroupConversationRequest
    response_proto: peers_touch.model.chat.v1.CreateGroupConversationResponse
    truth_stores: [conversations, conversation_members, conversation_member_devices]
    allowed_dependencies: [actor.device_directory.read, conversation.delivery.enqueue]
    forbidden_aliases: []
    superseded_symbols: []

  - id: chat.conversation.list
    domain_owner: station.conversation
    truth_owner: conversation.authority
    exposure: client
    canonical_route: { method: GET, path: /conversation/list }
    request_proto: peers_touch.model.chat.v1.ListConversationsRequest
    response_proto: peers_touch.model.chat.v1.ListConversationsResponse
    truth_stores: [conversations, conversation_members]
    allowed_dependencies: []
    forbidden_aliases:
      - { method: GET, path: /messaging/conversation/list }
    superseded_symbols:
      - peers_touch.model.chat.v1.ListMessagingConversationsRequest
      - peers_touch.model.chat.v1.ListMessagingConversationsResponse

  - id: chat.command.prepare
    domain_owner: station.conversation
    truth_owner: conversation.authority
    exposure: client
    canonical_route: { method: POST, path: /conversation/command/prepare }
    request_proto: peers_touch.model.chat.v1.PrepareConversationCommandRequest
    response_proto: peers_touch.model.chat.v1.PrepareConversationCommandResponse
    truth_stores: [conversations, conversation_members, conversation_member_devices]
    allowed_dependencies: [actor.device_directory.read, federation.endpoint_manifest.read]
    forbidden_aliases:
