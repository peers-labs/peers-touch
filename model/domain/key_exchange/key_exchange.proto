syntax = "proto3";

package peers_touch.model.key_exchange.v1;

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/key_exchange/model;model";

// X3DH key bundle upload — base64-encoded public keys.
message UploadKeyBundleRequest {
  string ik_pub   = 1;
  int32  spk_id   = 2;
  string spk_pub  = 3;
  string spk_sig  = 4;
  repeated int32  opk_ids  = 5;
  repeated string opk_pubs = 6;
  // Opaque per-install identifier. Empty => server stores as "legacy".
  string device_id = 7;
}

message UploadKeyBundleResponse {}

// One logical device publish for a DID (may share the DID across installs).
message KeyBundle {
  string did = 1;
  // Stable per-install id from the publisher; empty string means legacy row
  // (server key "legacy" is mapped to "").
  string device_id = 2;
  string ik_pub = 3; // Ed25519 public, base64
  string spk_pub = 4;
  string spk_sig = 5;
  // One-time prekey pubs consumed for this fetch (base64), newest policy via server.
  repeated string opks = 6;
  int64 published_at_unix_ms = 7; // server stamp (identity upsert time)
}

// Fetch another actor's key bundles by DID.
message FetchKeyBundleRequest {
  string did = 1;
  // When empty, return all bundles for the DID. When set, only that device_id
  // (after server-side normalization matching upload).
  string device_id = 2;
}

message FetchKeyBundleResponse {
  repeated KeyBundle bundles = 1;
}

// Replenish one-time prekeys.
message ReplenishOpksRequest {
  repeated int32  opk_ids  = 1;
  repeated string opk_pubs = 2;
  // Targets the same device row as uploads; empty => legacy.
  string device_id = 3;
}

message ReplenishOpksResponse {}

// Count remaining one-time prekeys.
message OpkCountRequest {
  string device_id = 1; // empty => legacy bucket for this DID.
}

message OpkCountResponse {
  int64 count = 1;
}
