syntax = "proto3";

package peers_touch.model.chat.v1;

import "domain/chat/endpoint.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

message MlsLeafIdentity {
  uint32 format_version = 1;
  string conversation_id = 2;
  CryptoEndpoint endpoint = 3;
  bytes credential_fingerprint = 4;
}

enum MlsQueuePayloadKind {
  MLS_QUEUE_PAYLOAD_KIND_UNSPECIFIED = 0;
  MLS_QUEUE_PAYLOAD_KIND_COMMIT = 1;
  MLS_QUEUE_PAYLOAD_KIND_WELCOME = 2;
  MLS_QUEUE_PAYLOAD_KIND_APPLICATION_MESSAGE = 3;
}

message MlsQueuePayload {
  MlsQueuePayloadKind kind = 1;
  string conversation_id = 2;
  string transition_id = 3;
  string event_id = 4;
  int64 authority_sequence = 5;
  int64 from_membership_epoch = 6;
  int64 to_membership_epoch = 7;
  int64 from_mls_epoch = 8;
  int64 to_mls_epoch = 9;
  CryptoEndpoint recipient = 10;
  bytes opaque_mls_bytes = 11;
  bytes payload_sha256 = 12;
}

message MlsEpochHead {
  string conversation_id = 1;
  int64 membership_epoch = 2;
  int64 mls_epoch = 3;
  string transition_id = 4;
  bytes commit_sha256 = 5;
  int64 authority_sequence = 6;
}
