syntax = "proto3";

package peers_touch.model.chat.v1;

import "domain/chat/attachment.proto";
import "domain/chat/conversation.proto";
import "domain/chat/endpoint.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

enum MessagingContentKind {
  MESSAGING_CONTENT_KIND_UNSPECIFIED = 0;
  MESSAGING_CONTENT_KIND_TEXT = 1;
  MESSAGING_CONTENT_KIND_IMAGE = 2;
  MESSAGING_CONTENT_KIND_FILE = 3;
  MESSAGING_CONTENT_KIND_AUDIO = 4;
  MESSAGING_CONTENT_KIND_VIDEO = 5;
  MESSAGING_CONTENT_KIND_SYSTEM = 6;
}

enum PreparedEndpointPayloadKind {
  PREPARED_ENDPOINT_PAYLOAD_KIND_UNSPECIFIED = 0;
  PREPARED_ENDPOINT_PAYLOAD_KIND_DIRECT_CIPHERTEXT = 1;
  PREPARED_ENDPOINT_PAYLOAD_KIND_MLS_APPLICATION = 2;
  PREPARED_ENDPOINT_PAYLOAD_KIND_MLS_COMMIT = 3;
  PREPARED_ENDPOINT_PAYLOAD_KIND_MLS_WELCOME = 4;
  PREPARED_ENDPOINT_PAYLOAD_KIND_PUBLIC_EVENT = 5;
  PREPARED_ENDPOINT_PAYLOAD_KIND_CONVERSATION_STATE = 6;
  PREPARED_ENDPOINT_PAYLOAD_KIND_MLS_RETIREMENT = 7;
  // Non-E2EE, Station-resident service plaintext. Only a system sender may
  // produce it (aggregate-enforced); human device commands using this kind
  // are rejected. Serialized body is DirectServicePlaintextPayload.
  PREPARED_ENDPOINT_PAYLOAD_KIND_DIRECT_SERVICE_PLAINTEXT = 8;
}

// Delivery security marker recorded alongside a committed message so history
// stays classifiable even if a member projection/actor_kind is later missing.
enum MessageDeliverySecurity {
  MESSAGE_DELIVERY_SECURITY_UNSPECIFIED = 0;
  MESSAGE_DELIVERY_SECURITY_E2EE = 1;
  MESSAGE_DELIVERY_SECURITY_SERVICE_PLAINTEXT = 2;
}

// Structured body for peers-touch.bot-event.v1, self-contained in the chat
// domain (the conversation wire must not depend on the edge bot domain).
enum ServiceBotEventKind {
  SERVICE_BOT_EVENT_KIND_UNSPECIFIED = 0;
  SERVICE_BOT_EVENT_KIND_TASK_COMPLETED = 1;
  SERVICE_BOT_EVENT_KIND_WAITING_INPUT = 2;
  SERVICE_BOT_EVENT_KIND_TASK_FAILED = 3;
  SERVICE_BOT_EVENT_KIND_IDLE = 4;
  SERVICE_BOT_EVENT_KIND_CUSTOM = 5;
}

enum ServiceBotEventSeverity {
  SERVICE_BOT_EVENT_SEVERITY_UNSPECIFIED = 0;
  SERVICE_BOT_EVENT_SEVERITY_INFO = 1;
  SERVICE_BOT_EVENT_SEVERITY_ATTENTION = 2;
  SERVICE_BOT_EVENT_SEVERITY_ERROR = 3;
}

message ServiceBotEventSource {
  string agent = 1;
  string workspace = 2;
  string session_id = 3;
  map<string, string> labels = 4;
}

message ServiceBotEventContent {
  // Always "peers-touch.bot-event.v1".
  string schema = 1;
  ServiceBotEventKind event_type = 2;
  ServiceBotEventSeverity severity = 3;
  string bot_ptid = 4;
  string group_key = 5;
  string dedupe_key = 6;
  string action_url = 7;
  ServiceBotEventSource source = 8;
}

// Body for PREPARED_ENDPOINT_PAYLOAD_KIND_DIRECT_SERVICE_PLAINTEXT. Unlike
// ciphertext kinds this is readable by the Station and carries a rendered
// fallback plus an optional structured event. Clients rendering it MUST show
// a non-E2EE marker (and MUST NOT show a lock).
message DirectServicePlaintextPayload {
  string fallback_text = 1;
  oneof content {
    ServiceBotEventContent bot_event = 2;
  }
}

// A command payload prepared for exactly one endpoint. The authority validates
// the complete required endpoint set before committing the command.
message PreparedEndpointPayload {
  CryptoEndpoint recipient = 1;
  PreparedEndpointPayloadKind kind = 2;
  bytes opaque_payload = 3;
  bytes payload_sha256 = 4;
}

message SendMessageIntent {
  string message_id = 1;
  MessagingContentKind content_kind = 2;
  string reply_to_message_id = 3;
  string thread_root_message_id = 4;
  repeated EncryptedObjectDescriptor attachments = 5;
  repeated PreparedEndpointPayload direct_payloads = 6;
  bytes mls_application_payload = 7;
  bytes mls_application_payload_sha256 = 8;
}

message EditMessageIntent {
  string message_id = 1;
  repeated PreparedEndpointPayload direct_payloads = 2;
  bytes mls_application_payload = 3;
  bytes mls_application_payload_sha256 = 4;
}

message RetractMessageIntent {
  string message_id = 1;
}

message HideMessageForActorIntent {
  string message_id = 1;
}

message ModerateMessageIntent {
  string message_id = 1;
  string reason_code = 2;
}

message ForwardMessageIntent {
  string destination_message_id = 1;
  MessagingContentKind content_kind = 2;
  repeated EncryptedObjectDescriptor destination_attachments = 3;
  repeated PreparedEndpointPayload destination_payloads = 4;
  bytes mls_application_payload = 5;
  bytes mls_application_payload_sha256 = 6;
}

message ReactionIntent {
  string message_id = 1;
  string reaction = 2;
  bool remove = 3;
}

message PinMessageIntent {
  string message_id = 1;
  bool remove = 2;
}

message UpdateConversationIntent {
  optional string name = 1;
  optional string description = 2;
  optional string avatar_object_id = 3;
  reserved 4;
  optional GroupVisibilityV1 visibility = 5;
}

enum MessagingMembershipAction {
  MESSAGING_MEMBERSHIP_ACTION_UNSPECIFIED = 0;
  MESSAGING_MEMBERSHIP_ACTION_ADD_ACTOR = 1;
  MESSAGING_MEMBERSHIP_ACTION_REMOVE_ACTOR = 2;
  MESSAGING_MEMBERSHIP_ACTION_LEAVE = 3;
  MESSAGING_MEMBERSHIP_ACTION_CHANGE_ROLE = 4;
  MESSAGING_MEMBERSHIP_ACTION_ADD_DEVICE = 5;
  MESSAGING_MEMBERSHIP_ACTION_REMOVE_DEVICE = 6;
}

message MessagingMembershipChangeIntent {
  MessagingMembershipAction action = 1;
  string ptid = 2;
  string device_id = 3;
  reserved 4;
  reserved "home_station_id";
  string role = 5;
}

message MembershipTransitionIntent {
  string transition_id = 1;
  int64 from_membership_epoch = 2;
  int64 from_mls_epoch = 3;
  int64 to_mls_epoch = 4;
  repeated MessagingMembershipChangeIntent changes = 5;
  bytes mls_commit = 6;
  bytes mls_commit_sha256 = 7;
  repeated PreparedEndpointPayload welcome_payloads = 8;
  string leave_intent_id = 9;
  string authority_plan_id = 10;
  bytes authority_plan_sha256 = 11;
}

message DissolveConversationIntent {}

enum ConversationMemberAuthorityAction {
  CONVERSATION_MEMBER_AUTHORITY_ACTION_UNSPECIFIED = 0;
  CONVERSATION_MEMBER_AUTHORITY_ACTION_UPDATE_MEMBER = 1;
  CONVERSATION_MEMBER_AUTHORITY_ACTION_TRANSFER_OWNERSHIP = 2;
}

// Exact authority command for target-member administration. This command is
// intentionally separate from actor-local MemberSettings.
message ConversationMemberAuthorityCommand {
  uint32 version = 1;
  string command_id = 2;
  string conversation_id = 3;
  CryptoEndpoint operator = 4;
  string target_ptid = 5;
  ConversationMemberAuthorityAction action = 6;
  optional MemberRole role = 7;
  optional bool muted = 8;
  google.protobuf.Timestamp muted_until = 9;
  string federation_id = 10;
  string authority_station_peer_id = 11;
  int64 authority_epoch = 12;
  int64 authority_sequence = 13;
  bytes authority_hash = 14;
  int64 observed_membership_epoch = 15;
  int64 observed_mls_epoch = 16;
  google.protobuf.Timestamp client_timestamp = 17;
  google.protobuf.Timestamp deadline = 18;
}

// Durable client intent. The exact deterministic bytes are replayed until the
// authority returns a terminal result.
message ChatCommand {
  string command_id = 1;
  string conversation_id = 2;
  CryptoEndpoint sender = 3;
  int64 observed_membership_epoch = 4;
  int64 observed_mls_epoch = 5;
  google.protobuf.Timestamp client_timestamp = 6;
  bytes delivery_plan_sha256 = 7;
  string authority_station_peer_id = 8;

  oneof payload {
    SendMessageIntent send_message = 20;
    EditMessageIntent edit_message = 21;
    RetractMessageIntent retract_message = 22;
    ReactionIntent reaction = 23;
    PinMessageIntent pin_message = 24;
    UpdateConversationIntent update_conversation = 25;
    MembershipTransitionIntent membership_transition = 26;
    DissolveConversationIntent dissolve_conversation = 27;
    HideMessageForActorIntent hide_message_for_actor = 28;
    ModerateMessageIntent moderate_message = 29;
    ForwardMessageIntent forward_message = 30;
  }
}

// The only remote durable command wrapper. command_id is both the proposal
// identity and the authority idempotency identity.
message ConversationCommandProposal {
  uint32 version = 1;
  string federation_id = 2;
  string authority_station_peer_id = 3;
  int64 authority_epoch = 4;
  string home_station_peer_id = 5;
  string actor_ptid = 6;
  string actor_device_id = 7;
  string actor_signing_key_id = 8;
  ChatCommand command = 9;
  bytes command_sha256 = 10;
  bytes actor_signature = 11;
  int64 created_at_unix_ms = 12;
  int64 expires_at_unix_ms = 13;
  ConversationMemberAuthorityCommand member_authority_command = 14;
}

// Exact deterministic protobuf input signed by the actor device.
message ConversationCommandProposalSigningInput {
  uint32 version = 1;
  string federation_id = 2;
  string authority_station_peer_id = 3;
  int64 authority_epoch = 4;
  string home_station_peer_id = 5;
  string conversation_id = 6;
  string command_id = 7;
  ConversationCommandKind command_kind = 8;
  string actor_ptid = 9;
  string actor_device_id = 10;
  string actor_signing_key_id = 11;
  bytes command_sha256 = 12;
  int64 created_at_unix_ms = 13;
  int64 expires_at_unix_ms = 14;
}
