syntax = "proto3";

package peers_touch.model.chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

enum RecoveryArchiveSectionKind {
  RECOVERY_ARCHIVE_SECTION_KIND_UNSPECIFIED = 0;
  RECOVERY_ARCHIVE_SECTION_KIND_ACTOR_IDENTITY = 1;
  RECOVERY_ARCHIVE_SECTION_KIND_MESSAGE_HISTORY = 2;
  RECOVERY_ARCHIVE_SECTION_KIND_ATTACHMENT_METADATA = 3;
  RECOVERY_ARCHIVE_SECTION_KIND_TRUST = 4;
}

message RecoveryArchiveSection {
  RecoveryArchiveSectionKind kind = 1;
  bytes ciphertext = 2;
  bytes ciphertext_sha256 = 3;
  uint64 record_count = 4;
}

// The encrypted archive intentionally excludes device identity keys, prekeys,
// Direct ratchets, skipped message keys, and live MLS state.
message RecoveryArchiveManifest {
  uint32 format_version = 1;
  string ptid = 2;
  string revision_id = 3;
  repeated RecoveryArchiveSection sections = 4;
  bytes archive_sha256 = 5;
  google.protobuf.Timestamp created_at = 6;
  string created_by_device_id = 7;
}

message PutRecoveryRevisionRequest {
  string revision_id = 1;
  uint32 format_version = 2;
  bytes encrypted_archive = 3;
  bytes encrypted_archive_sha256 = 4;
}

message PutRecoveryRevisionResponse {
  string revision_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message GetLatestRecoveryRevisionRequest {}

message GetLatestRecoveryRevisionResponse {
  string revision_id = 1;
  uint32 format_version = 2;
  bytes encrypted_archive = 3;
  bytes encrypted_archive_sha256 = 4;
  google.protobuf.Timestamp created_at = 5;
}
