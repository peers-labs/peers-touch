syntax = "proto3";

package peers_touch.model.chat.v1;

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

import "domain/actor/actor.proto";
import "domain/chat/command.proto";
import "domain/chat/conversation.proto";
import "domain/chat/event.proto";
import "domain/key_exchange/key_exchange.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// Conversation Subserver API Messages
//
// Service-layer request/response types for the unified conversation HTTP API.
// All domain types (Conversation, ConversationMember, ChatCommand,
// ConversationEvent, etc.) are defined in the domain Chat proto set.
// ============================================================================

// --- Conversation Management ---

message CreateDirectConversationRequest {
  string peer_ptid = 1;
  reserved 2;
  reserved "peer_station_peer_id";
  string federation_id = 3;
  peers_touch.model.actor.v1.ActorDeviceRef creator = 4;
  string command_id = 5;
}

message CreateDirectConversationResponse {
  Conversation conversation = 1;
  ConversationEvent event = 2;
}

message CreateGroupConversationRequest {
  reserved 1, 2, 3, 4, 5;
  reserved "name", "members", "genesis_transition", "federation_id", "conversation_id";
  ChatCommand command = 6;
}

message CreateGroupConversationResponse {
  Conversation conversation = 1;
  ConversationEvent event = 2;
  reserved "transition_event";
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message GetConversationPublicHeadRequest {
  string conversation_id = 1;
}

message GetConversationPublicHeadResponse {
  ConversationPublicHead head = 1;
}

message ListConversationsRequest {}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message GetConversationMembersRequest {
  string conversation_id = 1;
}

message GetConversationMembersResponse {
  repeated ConversationMember members = 1;
}

message UpdateConversationMemberRequest {
  oneof submission {
    ConversationMemberAuthorityCommand command = 1;
    ConversationCommandProposal proposal = 2;
  }
}

message UpdateConversationMemberResponse {
  ConversationMember member = 1;
  ConversationEvent event = 2;
  bool accepted_for_forwarding = 3;
}

message TransferConversationOwnershipRequest {
  oneof submission {
    ConversationMemberAuthorityCommand command = 1;
    ConversationCommandProposal proposal = 2;
  }
}

message TransferConversationOwnershipResponse {
  Conversation conversation = 1;
  ConversationMember previous_owner = 2;
  ConversationMember new_owner = 3;
  ConversationEvent event = 4;
  bool accepted_for_forwarding = 5;
}

// --- Commands & Events ---

message SubmitConversationAuthorityCommandRequest {
  oneof submission {
    ChatCommand command = 1;
    ConversationCommandProposal proposal = 2;
  }
}

message SubmitConversationAuthorityCommandResponse {
  ConversationEvent event = 1;
  ConversationCommandRejectCode reject_code = 2;
  PrepareConversationCommandResponse current_plan = 3;
  bool accepted_for_forwarding = 4;
}

enum ConversationCommandResolutionState {
  CONVERSATION_COMMAND_RESOLUTION_STATE_UNSPECIFIED = 0;
  CONVERSATION_COMMAND_RESOLUTION_STATE_HOME_PENDING = 1;
  CONVERSATION_COMMAND_RESOLUTION_STATE_ACCEPTED = 2;
  CONVERSATION_COMMAND_RESOLUTION_STATE_TERMINAL_REJECTED = 3;
  CONVERSATION_COMMAND_RESOLUTION_STATE_NOT_FOUND = 4;
}

message ConversationCommandResultRef {
  string conversation_id = 1;
  string command_id = 2;
  bytes command_sha256 = 3;
}

message ResolveConversationCommandResultsRequest {
  repeated ConversationCommandResultRef commands = 1;
}

message ResolvedConversationCommandResult {
  string conversation_id = 1;
  string command_id = 2;
  bytes command_sha256 = 3;
  ConversationCommandResolutionState state = 4;
  ConversationCommandProposalResult result = 5;
  ConversationCommandRejectCode terminal_error_code = 6;
}

message ResolveConversationCommandResultsResponse {
  repeated ResolvedConversationCommandResult results = 1;
}

enum ConversationMembershipAction {
  CONVERSATION_MEMBERSHIP_ACTION_UNSPECIFIED = 0;
  CONVERSATION_MEMBERSHIP_ACTION_ADD_ACTOR = 1;
  CONVERSATION_MEMBERSHIP_ACTION_REMOVE_ACTOR = 2;
  CONVERSATION_MEMBERSHIP_ACTION_LEAVE = 3;
  CONVERSATION_MEMBERSHIP_ACTION_CHANGE_ROLE = 4;
  CONVERSATION_MEMBERSHIP_ACTION_ADD_DEVICE = 5;
  CONVERSATION_MEMBERSHIP_ACTION_REMOVE_DEVICE = 6;
}

message PrepareConversationCommandRequest {
  string conversation_id = 1;
  peers_touch.model.actor.v1.ActorDeviceRef sender = 2;
  string authority_station_peer_id = 3;
  ConversationCommandKind command_kind = 4;
}

message PrepareConversationCommandResponse {
  string conversation_id = 1;
  ConversationKind conversation_kind = 2;
  int64 authority_sequence = 3;
  bytes authority_hash = 4;
  int64 membership_epoch = 5;
  int64 mls_epoch = 6;
  repeated peers_touch.model.actor.v1.ActorDeviceRef required_endpoints = 7;
  bytes delivery_plan_sha256 = 8;
  repeated peers_touch.model.actor.v1.ActorEndpointManifest endpoint_manifests = 9;
  string authority_station_peer_id = 10;
}

message PrepareConversationGroupRequest {
  string conversation_id = 1;
  string name = 2;
  repeated peers_touch.model.actor.v1.ActorRef members = 3;
  peers_touch.model.actor.v1.ActorDeviceRef creator = 4;
  string federation_id = 5;
}

message PrepareConversationGroupResponse {
  string authority_plan_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  string authority_station_peer_id = 3;
  repeated peers_touch.model.actor.v1.ActorDeviceRef prospective_endpoints = 4;
  repeated peers_touch.model.key_exchange.v1.MlsKeyPackageReservation reserved_key_packages = 5;
  repeated peers_touch.model.actor.v1.ActorEndpointManifest endpoint_manifests = 6;
  bytes authority_plan_sha256 = 7;
}

message PrepareConversationMembershipRequest {
  string conversation_id = 1;
  peers_touch.model.actor.v1.ActorDeviceRef sender = 2;
  ConversationMembershipAction action = 3;
  peers_touch.model.actor.v1.ActorRef target_actor = 4;
  string target_device_id = 5;
  MemberRole role = 6;
}

message PrepareConversationMembershipResponse {
  string authority_plan_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  string authority_station_peer_id = 3;
  int64 authority_sequence = 4;
  bytes authority_hash = 5;
  int64 from_membership_epoch = 6;
  int64 from_mls_epoch = 7;
  repeated peers_touch.model.actor.v1.ActorDeviceRef pre_endpoints = 8;
  repeated peers_touch.model.actor.v1.ActorDeviceRef post_endpoints = 9;
  repeated peers_touch.model.actor.v1.ActorDeviceRef added_endpoints = 10;
  repeated peers_touch.model.actor.v1.ActorDeviceRef removed_endpoints = 11;
  repeated peers_touch.model.key_exchange.v1.MlsKeyPackageReservation reserved_key_packages = 12;
  repeated peers_touch.model.actor.v1.ActorEndpointManifest endpoint_manifests = 13;
  bytes authority_plan_sha256 = 14;
}

message PrepareFederatedConversationCommandRequest {
  PrepareConversationCommandRequest request = 1;
  string source_home_station_peer_id = 2;
}

message PrepareFederatedConversationCommandResponse {
  PrepareConversationCommandResponse plan = 1;
}

message SubmitConversationTypingRequest {
  string conversation_id = 1;
  peers_touch.model.actor.v1.ActorDeviceRef sender = 2;
  uint64 pulse_generation = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool is_typing = 5;
}

message SubmitConversationTypingResponse {
  bool accepted = 1;
  google.protobuf.Timestamp expires_at = 2;
}

enum FederatedConversationTypingPhase {
  FEDERATED_CONVERSATION_TYPING_PHASE_UNSPECIFIED = 0;
  FEDERATED_CONVERSATION_TYPING_PHASE_AUTHORITY_ADMISSION = 1;
  FEDERATED_CONVERSATION_TYPING_PHASE_HOME_FANOUT = 2;
}

message FederatedConversationTypingSignal {
  uint32 format_version = 1;
  FederatedConversationTypingPhase phase = 2;
  string federation_id = 3;
  string conversation_id = 4;
  string authority_station_peer_id = 5;
  uint64 authority_epoch = 6;
  peers_touch.model.actor.v1.ActorDeviceRef sender = 7;
  string sender_home_station_peer_id = 8;
  uint64 pulse_generation = 9;
  google.protobuf.Timestamp expires_at = 10;
  bool is_typing = 11;
  repeated string recipient_actor_ptids = 12;
}

message SubmitMlsLeaveIntentRequest {
  MlsLeaveIntent intent = 1;
}

message SubmitMlsLeaveIntentResponse {
  MlsLeaveIntent intent = 1;
}

message ListPendingMlsLeaveIntentsRequest {
  string conversation_id = 1;
}

message ListPendingMlsLeaveIntentsResponse {
  repeated MlsLeaveIntent intents = 1;
}

message SubmitFederatedMlsLeaveIntentRequest {
  MlsLeaveIntent intent = 1;
  string source_home_station_peer_id = 2;
}

message SubmitFederatedMlsLeaveIntentResponse {
  MlsLeaveIntent intent = 1;
}

message ListFederatedMlsLeaveIntentsRequest {
  string conversation_id = 1;
  string source_home_station_peer_id = 2;
}

message ListFederatedMlsLeaveIntentsResponse {
  repeated MlsLeaveIntent intents = 1;
}

message ListConversationEventsRequest {
  string conversation_id = 1;
  int64 after_seq = 2;
  int32 limit = 3;
}

message ListConversationEventsResponse {
  repeated ConversationEvent events = 1;
}

message SyncAuthorityConversationEventsRequest {
  string federation_id = 1;
  string conversation_id = 2;
  int64 authority_epoch = 3;
  int64 after_group_seq = 4;
  int32 limit = 5;
}

message SyncAuthorityConversationEventsResponse {
  repeated ConversationEvent events = 1;
}

// --- Unified Message Queries ---

message ListConversationMessagesRequest {
  string conversation_id = 1;
  int64 after_seq = 2;
  int32 limit = 3;
}

message ListConversationMessagesResponse {
  repeated ConversationEvent events = 1;
  bool has_more = 2;
}

message ListThreadMessagesRequest {
  string conversation_id = 1;
  string root_id = 2;
  int64 after_seq = 3;
  int32 limit = 4;
}

message ListThreadMessagesResponse {
  repeated ConversationEvent events = 1;
  bool has_more = 2;
}

message GetThreadCountsRequest {
  string conversation_id = 1;
  repeated string root_ids = 2;
}

message ThreadCountEntry {
  string root_message_id = 1;
  int64 reply_count = 2;
  string latest_reply_id = 3;
  int64 latest_reply_at_ms = 4;
  int64 unread_count = 5;
}

message GetThreadCountsResponse {
  repeated ThreadCountEntry counts = 1;
}

// --- Member Settings ---

message MemberSettings {
  string nickname = 1;
  bool muted = 2;
  bool alert_enabled = 3;
  bool pinned = 4;
  string background = 5;
  reserved 6;
  string background_image = 7;
}

message GetMemberSettingsRequest {
  string conversation_id = 1;
}

message GetMemberSettingsResponse {
  MemberSettings settings = 1;
}

message UpdateMemberSettingsRequest {
  string conversation_id = 1;
  MemberSettings settings = 2;
}

message UpdateMemberSettingsResponse {
  bool success = 1;
}
