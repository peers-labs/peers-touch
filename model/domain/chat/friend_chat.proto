syntax = "proto3";

package peers_touch.model.chat.v1;

import "google/protobuf/timestamp.proto";
import "domain/chat/chat.proto";
import "domain/common/common.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

message FriendChatSession {
  string ulid = 1;
  string participant_a_ptid = 2;
  string participant_b_ptid = 3;
  string last_message_ulid = 4;
  google.protobuf.Timestamp last_message_at = 5;
  int32 unread_count_a = 6;
  int32 unread_count_b = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Enriched participant profiles (populated at query time)
  string participant_a_display_name = 10;
  string participant_a_avatar = 11;
  string participant_b_display_name = 12;
  string participant_b_avatar = 13;
}

message FriendChatMessage {
  string ulid = 1;
  string session_ulid = 2;
  string sender_ptid = 3;
  string receiver_ptid = 4;
  
  FriendMessageType type = 5;
  string content = 6;
  repeated FriendMessageAttachment attachments = 7;
  
  string reply_to_ulid = 8;
  // Root message of the thread this message belongs to. Empty means
  // the message is not part of a thread. Unlike reply_to_ulid, this
  // remains stable when replying to a reply inside the same thread.
  string thread_root_ulid = 18;
  
  FriendMessageStatus status = 9;
  google.protobuf.Timestamp sent_at = 10;
  google.protobuf.Timestamp delivered_at = 11;
  google.protobuf.Timestamp read_at = 12;
  
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;

  // E2E ciphertext; when set, content may be empty or a non-secret placeholder.
  bytes encrypted_payload = 15;

  // Mutation flags. A mutated message keeps its row (so threading,
  // replies, and search snippets stay coherent) but its content is
  // either cleared (`recalled = true`) or replaced (`edited_at`
  // non-null). `recalled` and `edited_at` are mutually exclusive: a
  // recalled message cannot subsequently be edited; an edited message
  // can still be recalled. The wire-level deletion path removes the
  // row entirely and does not surface here.
  bool recalled = 16;
  google.protobuf.Timestamp edited_at = 17;
}

enum FriendMessageType {
  FRIEND_MESSAGE_TYPE_UNSPECIFIED = 0;
  FRIEND_MESSAGE_TYPE_TEXT = 1;
  FRIEND_MESSAGE_TYPE_IMAGE = 2;
  FRIEND_MESSAGE_TYPE_FILE = 3;
  FRIEND_MESSAGE_TYPE_AUDIO = 4;
  FRIEND_MESSAGE_TYPE_VIDEO = 5;

  // Control type. The friend session is being used as a transport
  // for a SenderKeyDistributionMessage (see group_chat.proto). The
  // recipient MUST route the body to the group sender-key store and
  // MUST NOT render the message in the visible chat history. The
  // body lives in `encrypted_payload` (still under the friend chat
  // E2EE envelope) and decodes as `peers_touch.model.chat.v1.SenderKeyDistributionMessage`.
  // Numbered well above the user-visible types to leave room for
  // future user-facing types without colliding with control types.
  FRIEND_MESSAGE_TYPE_SENDER_KEY_DISTRIBUTION = 50;
}

enum FriendMessageStatus {
  FRIEND_MESSAGE_STATUS_UNSPECIFIED = 0;
  FRIEND_MESSAGE_STATUS_SENDING = 1;
  FRIEND_MESSAGE_STATUS_SENT = 2;
  FRIEND_MESSAGE_STATUS_DELIVERED = 3;
  FRIEND_MESSAGE_STATUS_READ = 4;
  FRIEND_MESSAGE_STATUS_FAILED = 5;
}

message FriendMessageAttachment {
  string cid = 1;
  string filename = 2;
  string mime_type = 3;
  int64 size = 4;
  string thumbnail_cid = 5;
  // visibility echoes the OSS subserver's `oss_files.visibility`
  // for this attachment ("public" / "chat" / "private"). The
  // sender is authoritative — the receiver UI surfaces it as a
  // badge so the user can tell at a glance whether the file
  // they are looking at is reach-restricted to this chat session
  // or has been published to a wider audience. Empty string is
  // treated as "unknown" by older clients and rendered without
  // a badge; new servers SHOULD always populate it.
  string visibility = 6;
  peers_touch.model.common.v1.EncryptedMediaDescriptor media_encryption = 7;
}

message MessageEnvelope {
  string message_ulid = 1;
  string sender_ptid = 2;
  string receiver_ptid = 3;
  string session_ulid = 4;
  bytes encrypted_payload = 5;
  int64 timestamp = 6;
  string signature = 7;
}

message OfflineMessage {
  string ulid = 1;
  string receiver_ptid = 2;
  string sender_ptid = 3;
  string session_ulid = 4;
  bytes encrypted_payload = 5;
  OfflineMessageStatus status = 6;
  google.protobuf.Timestamp expire_at = 7;
  google.protobuf.Timestamp delivered_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

enum OfflineMessageStatus {
  OFFLINE_MESSAGE_STATUS_UNSPECIFIED = 0;
  OFFLINE_MESSAGE_STATUS_PENDING = 1;
  OFFLINE_MESSAGE_STATUS_DELIVERED = 2;
  OFFLINE_MESSAGE_STATUS_EXPIRED = 3;
}

message SendMessageRequest {
  string session_ulid = 1;
  string receiver_ptid = 2;
  FriendMessageType type = 3;
  string content = 4;
  repeated FriendMessageAttachment attachments = 5;
  string reply_to_ulid = 6;
  bytes encrypted_payload = 7;
  // Client-generated ULID for idempotency across direct + relay paths.
  // When set, Station should persist this ULID instead of generating a new one.
  string client_ulid = 8;
  // Optional explicit thread root. If omitted and reply_to_ulid is
  // present, Station resolves it from the replied message.
  string thread_root_ulid = 9;
}

message SendMessageResponse {
  FriendChatMessage message = 1;
  string relay_status = 2;
}

message GetMessagesRequest {
  string session_ulid = 1;
  string before_ulid = 2;
  int32 limit = 3;
}

message GetMessagesResponse {
  repeated FriendChatMessage messages = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

message SearchFriendMessagesRequest {
  string query = 1;
  string session_ulid = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message SearchFriendMessagesResponse {
  repeated FriendChatMessage messages = 1;
  int32 total = 2;
}

message CreateSessionRequest {
  string participant_ptid = 1;
}

message CreateSessionResponse {
  FriendChatSession session = 1;
  bool created = 2;
}

message GetSessionsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetSessionsResponse {
  repeated FriendChatSession sessions = 1;
  int32 total = 2;
}

message FriendConversationSettings {
  string session_ulid = 1;
  bool is_muted = 2;
  bool is_pinned = 3;
  bool alert_enabled = 4;
  string background = 5;
  int64 cleared_at_unix_ms = 6;
}

message GetFriendConversationSettingsRequest {
  string session_ulid = 1;
}

message GetFriendConversationSettingsResponse {
  FriendConversationSettings settings = 1;
}

message UpdateFriendConversationSettingsRequest {
  string session_ulid = 1;
  optional bool is_muted = 2;
  optional bool is_pinned = 3;
  optional bool alert_enabled = 4;
  optional string background = 5;
  optional int64 cleared_at_unix_ms = 6;
}

message UpdateFriendConversationSettingsResponse {
  FriendConversationSettings settings = 1;
}

message MarkReadRequest {
  string session_ulid = 1;
  string last_read_ulid = 2;
}

message MarkReadResponse {
  int32 unread_count = 1;
}

message RelayMessageRequest {
  MessageEnvelope envelope = 1;
}

message RelayMessageResponse {
  string status = 1;
  google.protobuf.Timestamp delivered_at = 2;
  string forwarded_to = 3;
}

// SyncMessages: batch sync pending messages to server (POST /friend-chat/message/sync).
message SyncMessageItem {
  string ulid = 1;
  string session_ulid = 2;
  string receiver_ptid = 3;
  FriendMessageType type = 4;
  string content = 5;
  google.protobuf.Timestamp sent_at = 6;
  // Optional E2E ciphertext. When set, content may be a non-secret placeholder.
  bytes encrypted_payload = 7;
  repeated FriendMessageAttachment attachments = 8;
  string reply_to_ulid = 9;
  string thread_root_ulid = 10;
}

message SyncMessagesRequest {
  repeated SyncMessageItem messages = 1;
}

message SyncMessagesResponse {
  int32 synced = 1;
  repeated string failed = 2;
}

// MessageAck: acknowledge message delivery/read status
message MessageAckRequest {
  repeated string ulids = 1;
  int32 status = 2;
}

message MessageAckResponse {
  // Empty success response
}

// Pending offline messages
message GetPendingRequest {
  int32 limit = 1;
}

message PendingMessageInfo {
  string ulid = 1;
  string sender_ptid = 2;
  string session_ulid = 3;
  bytes encrypted_payload = 4;
  int64 created_at = 5;
}

message GetPendingResponse {
  repeated PendingMessageInfo messages = 1;
}

// Stats
message GetStatsRequest {
  // Empty request
}

message GetStatsResponse {
  int64 pending_messages = 1;
  string status = 2;
}

// ============================================================================
// Friend Request API (uses FriendRequest and FriendRequestStatus from chat.proto)
// ============================================================================

message SendFriendRequestRequest {
  string receiver_ptid = 1;
  string message = 2;
}

message SendFriendRequestResponse {
  FriendRequest request = 1;
}

message AcceptFriendRequestRequest {
  string request_id = 1;
}

message AcceptFriendRequestResponse {
  FriendRequest request = 1;
  FriendChatSession session = 2;
}

message RejectFriendRequestRequest {
  string request_id = 1;
}

message RejectFriendRequestResponse {
  FriendRequest request = 1;
}

message ListFriendRequestsRequest {
  FriendRequestStatus status = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListFriendRequestsResponse {
  repeated FriendRequest requests = 1;
  int32 total = 2;
}

// ============================================================================
// Friendship Controls
// ============================================================================

message BlockUserRequest {
  string target_ptid = 1;
}

message BlockUserResponse {
  Friend friend = 1;
}

message UnblockUserRequest {
  string target_ptid = 1;
}

message UnblockUserResponse {
  bool success = 1;
}

message ListBlockedUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListBlockedUsersResponse {
  repeated Friend blocked_users = 1;
  int32 total = 2;
}

message GetFriendshipStatusRequest {
  string target_ptid = 1;
}

message GetFriendshipStatusResponse {
  Friend friend = 1;
}

// ============================================================================
// Friend Message Mutations: recall / edit / delete
// ============================================================================
//
// These three operations all share the same authorization rule: only
// the message's original sender may invoke them, and only within
// FRIEND_CHAT_MUTATION_WINDOW (operator-tunable; see the friend_chat
// subserver's options). Each mutation publishes a realtime
// MessageMutation StreamEvent onto the recipient's (and the sender's
// other devices') unified event stream so peers learn about the
// change without polling. See docs/architecture/realtime/event-stream.md
// §2.7 (MessageMutation).

message RecallFriendMessageRequest {
  string session_ulid = 1;
  string message_ulid = 2;
}

message RecallFriendMessageResponse {
  // Empty success response. The mutation lands on the realtime
  // stream with kind=RECALL; clients reconcile the local store from
  // there. The HTTP success only confirms the row was found,
  // owned, and within the recall window.
}

message EditFriendMessageRequest {
  string session_ulid = 1;
  string message_ulid = 2;
  // Plaintext replacement body. For E2EE chats, callers MUST also
  // provide `new_encrypted_payload`; Station never inspects either
  // field beyond a length sanity-check, but it persists both so
  // catch-up clients (cold sync) see the post-edit state. When E2EE
  // is in use, `new_content` SHOULD be either empty or a non-secret
  // placeholder, mirroring the SendMessage convention.
  string new_content = 3;
  bytes new_encrypted_payload = 4;
}

message EditFriendMessageResponse {
}

message DeleteFriendMessageRequest {
  string session_ulid = 1;
  string message_ulid = 2;
}

message DeleteFriendMessageResponse {
}

// Friend-chat E2EE ciphertext frame (serialized inside `encrypted_payload`).
// This compatibility-only frame is scheduled for deletion by the canonical
// Conversation device-payload cutover in docs/architecture/encryption/.
message EncryptedMessage {
  bytes ciphertext = 1;
  uint32 counter = 2;
  bytes ephemeral_key = 3;
  bytes ratchet_pub = 4;
  uint32 prev_counter = 5;
  // 0 = legacy chain-only ratchet, 1 = Double Ratchet (see design doc §5).
  uint32 version = 6;
  // AES-256-GCM nonce for Double Ratchet frames. Empty for legacy frames.
  bytes nonce = 7;
}
