syntax = "proto3";

package peers_touch.model.chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

// Argon2id parameters required to derive the client-side backup key.
message BackupKdfParameters {
  bytes salt = 1;
  uint32 memory_cost_kib = 2;
  uint32 time_cost = 3;
  uint32 parallelism = 4;
  uint32 output_length = 5;
}

// One immutable opaque backup revision. Station cannot decrypt encrypted_blob.
message CryptoBackupRevision {
  string backup_id = 1;
  string ptid = 2;
  uint64 revision = 3;
  bytes encrypted_blob = 4;
  bytes nonce = 5;
  bytes integrity_tag = 6;
  BackupKdfParameters kdf = 7;
  google.protobuf.Timestamp created_at = 8;
}

message PutCryptoBackupRequest {
  bytes encrypted_blob = 1;
  bytes nonce = 2;
  bytes integrity_tag = 3;
  BackupKdfParameters kdf = 4;
}

message PutCryptoBackupResponse {
  CryptoBackupRevision backup = 1;
}

message GetLatestCryptoBackupRequest {}

message GetLatestCryptoBackupResponse {
  CryptoBackupRevision backup = 1;
}

message ListCryptoBackupRevisionsRequest {
  uint32 limit = 1;
}

message ListCryptoBackupRevisionsResponse {
  repeated CryptoBackupRevision backups = 1;
}
