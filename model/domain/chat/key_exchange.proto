syntax = "proto3";

package peers_touch.model.chat.v1;

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

// X3DH public key bundle surface plus Double Ratchet wire-version negotiation.
message KeyBundle {
  repeated int32 supported_versions = 99;
}

// Canonical crypto endpoint. Both fields are required at every crypto boundary.
message CryptoEndpoint {
  string ptid = 1;
  string device_id = 2;
}

// Device-targeted initiator material required for the recipient to complete
// X3DH and initialize the negotiated direct-message ratchet.
message DirectSessionInit {
  string session_id = 1;
  string conversation_id = 2;
  CryptoEndpoint sender = 3;
  CryptoEndpoint recipient = 4;
  bytes sender_identity_key = 5;
  bytes sender_ephemeral_key = 6;
  uint32 recipient_signed_prekey_id = 7;
  optional uint32 recipient_one_time_prekey_id = 8;
  uint32 protocol_version = 9;
  uint64 session_generation = 10;
}
