syntax = "proto3";

package peers_touch.model.chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

// ============================================================================
// v1 Unified Conversation Contract
//
// Single source of truth for the IM data model per D-08...D-12.
// Both direct (1:1) and group conversations share this skeleton;
// business projections (group membership, direct session) are separate.
//
// See docs/architecture/federated-im/data-model.md for the governing design.
// See docs/architecture/federated-im/decisions.md D-10 (one envelope channel),
// D-11 (hard cutover), D-12 (text on envelope, P2P for media only).
// ============================================================================

// --- Conversation ---

// A conversation is the durable identity of a chat — direct or group.
// It does NOT hold messages; it holds metadata and lifecycle.
message Conversation {
  string conversation_id = 1;
  ConversationKind kind = 2;
  string authority_station_peer_id = 3;
  int64 membership_epoch = 4;
  ConversationStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;

  // Group-only fields (empty for direct).
  string name = 10;
  string description = 11;
  string avatar_cid = 12;
  string owner_ptid = 13;
  int32 max_members = 14;
  GroupVisibilityV1 visibility = 15;
  uint32 disappear_timer_seconds = 16;
  int64 mls_epoch = 17;
  string federation_id = 18;
  int64 authority_epoch = 19;
}

message ConversationPublicHead {
  string conversation_id = 1;
  ConversationPublicHeadSource source = 2;
  string federation_id = 3;
  string authority_station_peer_id = 4;
  int64 authority_epoch = 5;
  int64 group_seq = 6;
  bytes event_hash = 7;
  int64 membership_epoch = 8;
  int64 mls_epoch = 9;
  string transition_id = 10;
  bytes commit_sha256 = 11;
  string status = 12;
}

enum ConversationPublicHeadSource {
  CONVERSATION_PUBLIC_HEAD_SOURCE_UNSPECIFIED = 0;
  CONVERSATION_PUBLIC_HEAD_SOURCE_AUTHORITY = 1;
  CONVERSATION_PUBLIC_HEAD_SOURCE_FOLLOWER = 2;
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_GROUP = 2;
}

enum ConversationStatus {
  CONVERSATION_STATUS_UNSPECIFIED = 0;
  CONVERSATION_STATUS_ACTIVE = 1;
  CONVERSATION_STATUS_DISSOLVED = 2;
  CONVERSATION_STATUS_DEGRADED_READ_ONLY = 3;
  CONVERSATION_STATUS_ORPHANED_READ_ONLY = 4;
}

enum GroupVisibilityV1 {
  GROUP_VISIBILITY_V1_UNSPECIFIED = 0;
  GROUP_VISIBILITY_V1_PUBLIC = 1;
  GROUP_VISIBILITY_V1_PRIVATE = 2;
}

// --- Conversation Member ---

message ConversationMember {
  string conversation_id = 1;
  string ptid = 2;
  MemberRole role = 3;
  MemberStatus member_status = 4;
  string actor_home_station_peer_id = 5;
  string actor_home_station_domain = 6;
  google.protobuf.Timestamp joined_at = 7;
  string invited_by_ptid = 8;

  // Per-member settings
  string nickname = 10;
  bool muted = 11;
  google.protobuf.Timestamp muted_until = 12;
}

enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_MEMBER = 1;
  MEMBER_ROLE_ADMIN = 2;
  MEMBER_ROLE_OWNER = 3;
}

enum MemberStatus {
  MEMBER_STATUS_UNSPECIFIED = 0;
  MEMBER_STATUS_ACTIVE = 1;
  MEMBER_STATUS_LEFT = 2;
  MEMBER_STATUS_REMOVED = 3;
  MEMBER_STATUS_INVITED = 4;
}

// --- Message State Machine ---

// Canonical message delivery states (D-10).
// local_queued -> submitted -> committed -> home_delivered -> device_delivered -> read
enum MessageDeliveryState {
  MESSAGE_DELIVERY_STATE_UNSPECIFIED = 0;
  MESSAGE_DELIVERY_STATE_LOCAL_QUEUED = 1;
  MESSAGE_DELIVERY_STATE_SUBMITTED = 2;
  MESSAGE_DELIVERY_STATE_COMMITTED = 3;
  MESSAGE_DELIVERY_STATE_HOME_DELIVERED = 4;
  MESSAGE_DELIVERY_STATE_DEVICE_DELIVERED = 5;
  MESSAGE_DELIVERY_STATE_READ = 6;
  MESSAGE_DELIVERY_STATE_FAILED = 7;
}

// --- Conversation Command (client -> Station) ---

// Commands are what clients submit to their Home Station. The Station
// validates and either commits locally (if authority) or proposes to
// the authority Station (D-03).
message ConversationCommand {
  string command_id = 1;
  string conversation_id = 2;
  string sender_ptid = 3;
  string sender_device_id = 4;
  int64 observed_membership_epoch = 5;
  google.protobuf.Timestamp client_ts = 6;

  oneof payload {
    SendMessageCommand send_message = 10;
    EditMessageCommand edit_message = 11;
    RetractMessageCommand retract_message = 12;
    DissolveCommand dissolve = 16;
    UpdateSettingsCommand update_settings = 17;
    TypingCommand typing = 18;
    ReactCommand react = 19;
    PinMessageCommand pin_message = 21;
    MembershipTransitionCommand membership_transition = 22;
  }

  reserved 13, 14, 15, 20;
  reserved "add_members", "remove_members", "leave", "update_member";
}

message SendMessageCommand {
  repeated DeviceEncryptedPayload device_payloads = 1;
  MessageContentType content_type = 2;
  string reply_to_message_id = 3;
  string thread_root_message_id = 4;
  repeated EncryptedAttachment attachments = 5;
  bytes group_encrypted_payload = 6;
}

message EditMessageCommand {
  string target_message_id = 1;
  repeated DeviceEncryptedPayload device_payloads = 2;
  bytes group_encrypted_payload = 3;
}

// One independently encrypted copy of a direct message for one active device.
message DeviceEncryptedPayload {
  string recipient_ptid = 1;
  string recipient_device_id = 2;
  string session_id = 3;
  bytes encrypted_envelope = 4;
}

message RetractMessageCommand {
  string target_message_id = 1;
}

message MembershipTransitionCommand {
  string transition_id = 1;
  int64 from_membership_epoch = 2;
  int64 from_mls_epoch = 3;
  int64 to_mls_epoch = 4;
  repeated MembershipTransitionChange changes = 5;
  bytes opaque_mls_commit_bytes = 6;
  bytes commit_sha256 = 7;
  repeated MlsWelcomeDelivery welcome_deliveries = 8;
  string idempotency_key = 9;
  // D-16 proof consumed atomically for a delegated LEAVE transition.
  string leave_intent_id = 10;
}

// D-15 device-scoped MLS leaf identity. Its deterministic protobuf bytes are
// the complete OpenMLS BasicCredential.identity. PTID-only credentials are not
// valid after the hard cutover.
message MlsDeviceCredential {
  uint32 version = 1;
  string ptid = 2;
  string device_id = 3;
}

// D-16 actor authorization for a different active MLS leaf to commit LEAVE.
message MlsLeaveIntent {
  uint32 version = 1;
  string intent_id = 2;
  string federation_id = 3;
  string authority_station_peer_id = 4;
  int64 authority_epoch = 5;
  string home_station_peer_id = 6;
  string conversation_id = 7;
  string actor_ptid = 8;
  string actor_device_id = 9;
  string actor_signing_key_id = 10;
  int64 observed_membership_epoch = 11;
  int64 observed_mls_epoch = 12;
  int64 created_at_unix_ms = 13;
  int64 expires_at_unix_ms = 14;
  bytes actor_signature = 15;
}

// Exact deterministic protobuf input signed by the departing actor device.
message MlsLeaveIntentSigningInput {
  uint32 version = 1;
  string intent_id = 2;
  string federation_id = 3;
  string authority_station_peer_id = 4;
  int64 authority_epoch = 5;
  string home_station_peer_id = 6;
  string conversation_id = 7;
  string actor_ptid = 8;
  string actor_device_id = 9;
  string actor_signing_key_id = 10;
  int64 observed_membership_epoch = 11;
  int64 observed_mls_epoch = 12;
  int64 created_at_unix_ms = 13;
  int64 expires_at_unix_ms = 14;
}

message MembershipTransitionChange {
  string ptid = 1;
  string actor_home_station_peer_id = 2;
  MembershipTransitionAction action = 3;
  MemberRole role = 4;
  string device_id = 5;
}

enum MembershipTransitionAction {
  MEMBERSHIP_TRANSITION_ACTION_UNSPECIFIED = 0;
  MEMBERSHIP_TRANSITION_ACTION_ADD = 1;
  MEMBERSHIP_TRANSITION_ACTION_REMOVE = 2;
  MEMBERSHIP_TRANSITION_ACTION_LEAVE = 3;
  MEMBERSHIP_TRANSITION_ACTION_ROLE_CHANGE = 4;
  MEMBERSHIP_TRANSITION_ACTION_ADD_DEVICE = 5;
  MEMBERSHIP_TRANSITION_ACTION_REMOVE_DEVICE = 6;
}

message MlsWelcomeDelivery {
  string recipient_ptid = 1;
  string recipient_device_id = 2;
  string recipient_home_station_peer_id = 3;
  bytes opaque_welcome_bytes = 4;
  bytes welcome_sha256 = 5;
}

// D-17 is the only remote durable command wrapper. command_id is both the
// proposal identity and the authority idempotency identity.
message ConversationCommandProposal {
  uint32 version = 1;
  string federation_id = 2;
  string authority_station_peer_id = 3;
  int64 authority_epoch = 4;
  string home_station_peer_id = 5;
  string actor_ptid = 6;
  string actor_device_id = 7;
  string actor_signing_key_id = 8;
  ConversationCommand command = 9;
  bytes command_sha256 = 10;
  bytes actor_signature = 11;
  int64 created_at_unix_ms = 12;
  int64 expires_at_unix_ms = 13;
}

// Exact deterministic protobuf input signed by the actor device.
message ConversationCommandProposalSigningInput {
  uint32 version = 1;
  string federation_id = 2;
  string authority_station_peer_id = 3;
  int64 authority_epoch = 4;
  string home_station_peer_id = 5;
  string conversation_id = 6;
  string command_id = 7;
  ConversationCommandKind command_kind = 8;
  string actor_ptid = 9;
  string actor_device_id = 10;
  string actor_signing_key_id = 11;
  bytes command_sha256 = 12;
  int64 created_at_unix_ms = 13;
  int64 expires_at_unix_ms = 14;
}

enum ConversationCommandKind {
  CONVERSATION_COMMAND_KIND_UNSPECIFIED = 0;
  CONVERSATION_COMMAND_KIND_SEND_MESSAGE = 1;
  CONVERSATION_COMMAND_KIND_EDIT_MESSAGE = 2;
  CONVERSATION_COMMAND_KIND_RETRACT_MESSAGE = 3;
  CONVERSATION_COMMAND_KIND_DISSOLVE = 4;
  CONVERSATION_COMMAND_KIND_UPDATE_SETTINGS = 5;
  CONVERSATION_COMMAND_KIND_REACT = 6;
  CONVERSATION_COMMAND_KIND_PIN_MESSAGE = 7;
  CONVERSATION_COMMAND_KIND_MEMBERSHIP_TRANSITION = 8;
}

message ConversationCommandProposalResult {
  string command_id = 1;
  bool accepted = 2;
  CommittedConversationEvent committed_event = 3;
  ConversationCommandRejectCode reject_code = 4;
  bool retryable = 5;
  int64 retry_after_unix_ms = 6;
  int64 required_membership_epoch = 7;
  int64 required_mls_epoch = 8;
  int64 authority_group_seq = 9;
  bytes authority_event_hash = 10;
}

enum ConversationCommandRejectCode {
  CONVERSATION_COMMAND_REJECT_CODE_UNSPECIFIED = 0;
  CONVERSATION_COMMAND_REJECT_CODE_INVALID_PROPOSAL = 1;
  CONVERSATION_COMMAND_REJECT_CODE_INVALID_STATION_TOKEN = 2;
  CONVERSATION_COMMAND_REJECT_CODE_INACTIVE_FEDERATION_STATION = 3;
  CONVERSATION_COMMAND_REJECT_CODE_ACTOR_KEY_UNAVAILABLE = 4;
  CONVERSATION_COMMAND_REJECT_CODE_ACTOR_KEY_REVOKED = 5;
  CONVERSATION_COMMAND_REJECT_CODE_INVALID_ACTOR_SIGNATURE = 6;
  CONVERSATION_COMMAND_REJECT_CODE_COMMAND_HASH_MISMATCH = 7;
  CONVERSATION_COMMAND_REJECT_CODE_FIELD_BINDING_MISMATCH = 8;
  CONVERSATION_COMMAND_REJECT_CODE_NOT_AUTHORITY = 9;
  CONVERSATION_COMMAND_REJECT_CODE_PERMISSION_DENIED = 10;
  CONVERSATION_COMMAND_REJECT_CODE_MEMBERSHIP_EPOCH_STALE = 11;
  CONVERSATION_COMMAND_REJECT_CODE_MLS_EPOCH_MISMATCH = 12;
  CONVERSATION_COMMAND_REJECT_CODE_COMMAND_CONFLICT = 13;
  CONVERSATION_COMMAND_REJECT_CODE_COMMAND_EXPIRED = 14;
  CONVERSATION_COMMAND_REJECT_CODE_GROUP_READ_ONLY = 15;
  CONVERSATION_COMMAND_REJECT_CODE_PAYLOAD_TOO_LARGE = 16;
  CONVERSATION_COMMAND_REJECT_CODE_TOO_MANY_RECIPIENTS = 17;
  CONVERSATION_COMMAND_REJECT_CODE_RATE_LIMITED = 18;
  CONVERSATION_COMMAND_REJECT_CODE_UNSUPPORTED_COMMAND = 19;
  CONVERSATION_COMMAND_REJECT_CODE_STALE_DELIVERY_PLAN = 20;
  CONVERSATION_COMMAND_REJECT_CODE_CONVERSATION_STATE = 21;
  CONVERSATION_COMMAND_REJECT_CODE_SENDER_UNAUTHORIZED = 22;
  CONVERSATION_COMMAND_REJECT_CODE_DELIVERY_SET = 23;
  CONVERSATION_COMMAND_REJECT_CODE_AUTHORITY_PLAN_STALE = 24;
  CONVERSATION_COMMAND_REJECT_CODE_AUTHORITY_PLAN_EXPIRED = 25;
}

enum ConversationCommandSubmissionState {
  CONVERSATION_COMMAND_SUBMISSION_STATE_UNSPECIFIED = 0;
  CONVERSATION_COMMAND_SUBMISSION_STATE_HOME_ACCEPTED = 1;
  CONVERSATION_COMMAND_SUBMISSION_STATE_SUBMITTED = 2;
  CONVERSATION_COMMAND_SUBMISSION_STATE_RETRY_WAIT = 3;
  CONVERSATION_COMMAND_SUBMISSION_STATE_ACCEPTED = 4;
  CONVERSATION_COMMAND_SUBMISSION_STATE_TERMINAL_REJECTED = 5;
}

message ConversationCommandResultDelivery {
  string conversation_id = 1;
  string command_id = 2;
  ConversationCommandSubmissionState state = 3;
  ConversationCommandProposalResult result = 4;
}

message DissolveCommand {}

message UpdateSettingsCommand {
  // Only set fields are applied.
  optional string name = 1;
  optional string description = 2;
  optional string avatar_cid = 3;
  optional bool muted = 4;
  optional uint32 disappear_timer_seconds = 5;
}

message TypingCommand {
  bool is_typing = 1;
}

message ReactCommand {
  string message_id = 1;
  string emoji = 2;
  bool remove = 3;
}

message PinMessageCommand {
  string message_id = 1;
  bool unpin = 2;
}

// --- Committed Conversation Event (authority -> followers) ---

// Events are what the authority Station produces after validating a command.
// They are the single source of truth for group state progression.
message CommittedConversationEvent {
  string event_id = 1;
  string conversation_id = 2;
  int64 group_seq = 3;
  int64 membership_epoch = 4;
  string committed_by_station_peer_id = 5;
  google.protobuf.Timestamp committed_at = 6;
  bytes event_hash = 7;
  bytes prev_event_hash = 8;

  oneof payload {
    MessageCommittedEvent message_committed = 10;
    MessageEditedEvent message_edited = 11;
    MessageRetractedEvent message_retracted = 12;
    ConversationCreatedEvent conversation_created = 14;
    ConversationDissolvedEvent conversation_dissolved = 15;
    SettingsChangedEvent settings_changed = 16;
    ReactionEvent reaction = 17;
    PinEvent pin = 18;
    MembershipTransitionCommittedEvent membership_transition_committed = 19;
  }

  reserved 13;
  reserved "membership_changed";
}

message MessageCommittedEvent {
  string message_id = 1;
  string sender_ptid = 2;
  string sender_device_id = 3;
  repeated DeviceEncryptedPayload device_payloads = 4;
  MessageContentType content_type = 5;
  string reply_to_message_id = 6;
  string thread_root_message_id = 7;
  repeated EncryptedAttachment attachments = 8;
  google.protobuf.Timestamp client_ts = 9;
  bytes group_encrypted_payload = 10;
}

message MessageEditedEvent {
  string message_id = 1;
  string editor_ptid = 2;
  repeated DeviceEncryptedPayload device_payloads = 3;
  google.protobuf.Timestamp edited_at = 4;
  bytes group_encrypted_payload = 5;
}

message MessageRetractedEvent {
  string message_id = 1;
  string retractor_ptid = 2;
  google.protobuf.Timestamp retracted_at = 3;
}

message MembershipTransitionCommittedEvent {
  string transition_id = 1;
  int64 from_membership_epoch = 2;
  int64 to_membership_epoch = 3;
  int64 from_mls_epoch = 4;
  int64 to_mls_epoch = 5;
  repeated MembershipTransitionChange changes = 6;
  bytes opaque_mls_commit_bytes = 7;
  bytes commit_sha256 = 8;
  repeated MlsWelcomeDescriptor welcome_descriptors = 9;
  string leave_intent_id = 10;
}

message MlsWelcomeDescriptor {
  string recipient_ptid = 1;
  string recipient_device_id = 2;
  string recipient_home_station_peer_id = 3;
  bytes welcome_sha256 = 4;
}

message ConversationCreatedEvent {
  Conversation conversation = 1;
  repeated ConversationMember initial_members = 2;
}

message ConversationDissolvedEvent {
  string dissolved_by_ptid = 1;
}

message SettingsChangedEvent {
  string changed_by_ptid = 1;
  optional string name = 2;
  optional string description = 3;
  optional string avatar_cid = 4;
  optional bool muted = 5;
}

message ReactionEvent {
  string message_id = 1;
  string actor_ptid = 2;
  string emoji = 3;
  bool removed = 4;
  google.protobuf.Timestamp ts = 5;
}

message PinEvent {
  string message_id = 1;
  string actor_ptid = 2;
  bool unpinned = 3;
  google.protobuf.Timestamp ts = 4;
}

// --- Message Content Types ---

enum MessageContentType {
  MESSAGE_CONTENT_TYPE_UNSPECIFIED = 0;
  MESSAGE_CONTENT_TYPE_TEXT = 1;
  MESSAGE_CONTENT_TYPE_IMAGE = 2;
  MESSAGE_CONTENT_TYPE_FILE = 3;
  MESSAGE_CONTENT_TYPE_AUDIO = 4;
  MESSAGE_CONTENT_TYPE_VIDEO = 5;
  MESSAGE_CONTENT_TYPE_LOCATION = 6;
  MESSAGE_CONTENT_TYPE_STICKER = 7;
  MESSAGE_CONTENT_TYPE_SYSTEM = 8;
}

// --- Encrypted Attachment ---

message EncryptedAttachment {
  string attachment_id = 1;
  string filename = 2;
  int64 size_bytes = 3;
  string mime_type = 4;
  bytes encrypted_key = 5;
  string storage_ref = 6;
  bytes thumbnail_encrypted = 7;
}

// --- Message Receipt ---

message MessageReceipt {
  string conversation_id = 1;
  string message_id = 2;
  string ptid = 3;
  string device_id = 4;
  ReceiptType receipt_type = 5;
  google.protobuf.Timestamp ts = 6;
}

enum ReceiptType {
  RECEIPT_TYPE_UNSPECIFIED = 0;
  RECEIPT_TYPE_DELIVERED = 1;
  RECEIPT_TYPE_READ = 2;
}

// --- Delivery Cursor ---

message DeliveryCursor {
  string conversation_id = 1;
  string station_peer_id = 2;
  int64 last_delivered_group_seq = 3;
  int64 last_ack_group_seq = 4;
  int32 retry_count = 5;
  google.protobuf.Timestamp updated_at = 6;
}
