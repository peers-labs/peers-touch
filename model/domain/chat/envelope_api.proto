syntax = "proto3";

package peers_touch.model.chat.v1;

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

import "domain/chat/envelope.proto";
import "domain/chat/queue.proto";

// ============================================================================
// Envelope Subserver API Messages
//
// Service-layer request/response types for the envelope HTTP API.
// Domain types (StationEnvelope, DurableDeviceInboxItem) are defined in envelope.proto.
// ============================================================================

message SubmitEnvelopeRequest {
  StationEnvelope envelope = 1;
}

message SubmitEnvelopeResponse {
  string envelope_id = 1;
}

message AckEnvelopeRequest {
  string device_id = 1;
  string inbox_item_id = 2;
}

message AckEnvelopeResponse {}

message ResumeEnvelopesRequest {
  string device_id = 1;
  string after_cursor = 2;
}

message ResumeEnvelopesResponse {
  repeated DurableDeviceInboxItem items = 1;
}

message FederationDeliverEnvelopeRequest {
  StationEnvelope envelope = 1;
}

message FederationDeliverEnvelopeResponse {}
