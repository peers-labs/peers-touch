syntax = "proto3";

package peers_touch.model.chat.v1;

import "domain/chat/endpoint.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/chat;chat";

message DeviceConsumptionReceipt {
  string receipt_id = 1;
  string conversation_id = 2;
  string event_id = 3;
  CryptoEndpoint consumer = 4;
  int64 event_sequence = 5;
  int64 lane_sequence = 6;
  bytes payload_sha256 = 7;
  google.protobuf.Timestamp consumed_at = 8;
}

// Device-local disposition of an inbox item that failed deterministic
// validation and was quarantined so the contiguous device lane can ack past
// it. This receipt is never submitted to the authority Station; it anchors
// the local dead-letter record for later inspection or reprocessing.
enum DeviceInboxItemRejectReason {
  DEVICE_INBOX_ITEM_REJECT_REASON_UNSPECIFIED = 0;
  DEVICE_INBOX_ITEM_REJECT_REASON_PAYLOAD_INVALID = 1;
  DEVICE_INBOX_ITEM_REJECT_REASON_INTEGRITY_FAILED = 2;
  DEVICE_INBOX_ITEM_REJECT_REASON_RECIPIENT_MISMATCH = 3;
}

message DeviceRejectedItemReceipt {
  string receipt_id = 1;
  string item_id = 2;
  string conversation_id = 3;
  string event_id = 4;
  CryptoEndpoint consumer = 5;
  int64 lane_sequence = 6;
  bytes payload_sha256 = 7;
  DeviceInboxItemRejectReason reason = 8;
  string detail = 9;
  google.protobuf.Timestamp rejected_at = 10;
}

message ActorReadCursor {
  string conversation_id = 1;
  string reader_ptid = 2;
  int64 last_read_sequence = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message FederatedConversationReadCursor {
  uint32 format_version = 1;
  string federation_id = 2;
  string conversation_id = 3;
  string authority_station_peer_id = 4;
  uint64 authority_epoch = 5;
  CryptoEndpoint reader = 6;
  string reader_home_station_peer_id = 7;
  int64 last_read_sequence = 8;
}

message MessageDeliveryAggregate {
  string conversation_id = 1;
  string event_id = 2;
  int64 event_sequence = 3;
  uint32 required_device_count = 4;
  uint32 consumed_device_count = 5;
  uint32 revoked_device_count = 6;
  bool delivered = 7;
  bool fully_delivered = 8;
  bool read = 9;
}

message SubmitConversationReadCursorRequest {
  ActorReadCursor cursor = 1;
}

message SubmitConversationReadCursorResponse {
  ActorReadCursor cursor = 1;
}

message SubmitConversationDeliveryReceiptRequest {
  DeviceConsumptionReceipt receipt = 1;
}

message SubmitConversationDeliveryReceiptResponse {
  MessageDeliveryAggregate delivery = 1;
}
