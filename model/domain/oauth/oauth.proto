syntax = "proto3";

package peers_touch.model.oauth.v1;

import "google/protobuf/timestamp.proto";
import "domain/actor/actor.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model;model";

message OAuthClient {
  string id = 1;
  string name = 2;
  string client_id = 3;
  string client_secret_hash = 4;
  string redirect_uri = 5;
  string scopes = 6; // space-delimited
  google.protobuf.Timestamp created_at = 7;
}

message OAuthAuthCode {
  string code_hash = 1;
  string client_id = 2;
  string actor_ptid = 3;
  string scopes = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool used = 6;
}

message OAuthToken {
  string access_token_hash = 1;
  string refresh_token_hash = 2;
  string token_type = 3; // Bearer
  string scope = 4;
  string actor_ptid = 5;
  string client_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

// OAuthBridgeRequest is the payload from the external OAuth gateway
// to Station for silent registration / login.
message OAuthBridgeRequest {
  string provider         = 1;
  string provider_user_id = 2;
  string email            = 3;
  string username         = 4;
  string display_name     = 5;
  string avatar_url       = 6;
  string ts               = 7;  // RFC3339 timestamp for HMAC
  string sig              = 8;  // HMAC-SHA256 hex signature
}

message OAuthBridgeResponse {
  string session_id   = 1;
  string access_token = 2;
  string refresh_token = 3;
  string token_type   = 4;
  string expires_at   = 5;
  reserved 6, 7, 8, 9, 10;
  reserved "actor_id", "actor_id_num", "username", "display_name", "email";
  peers_touch.model.actor.v1.ActorRef actor_ref = 11 [json_name = "actor_ref"];
}
