syntax = "proto3";

package peers_touch.model.social.v1;

import "google/protobuf/timestamp.proto";
import "domain/activity/activity.proto";
import "domain/common/common.proto";
import "domain/social/media.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model;model";

// ============================================================================
// 帖子核心模型
// ============================================================================

message Post {
  reserved "author_id";

  string id = 1;
  string author_ptid = 2;
  PostType type = 3;
  // Deprecated: kept for backward compatibility with existing service /
  // DB code. New publishing flow should populate `audience` (field 50)
  // and let P1+ application layer translate into `visibility` for
  // legacy storage. Do not remove until P1 migration completes.
  PostVisibility visibility = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  bool is_deleted = 7;

  PostStats stats = 10;
  PostAuthor author = 20;
  PostInteraction interaction = 21;

  oneof content {
    TextPost text_post = 30;
    ImagePost image_post = 31;
    VideoPost video_post = 32;
    LinkPost link_post = 33;
    PollPost poll_post = 34;
    RepostPost repost_post = 35;
    LocationPost location_post = 36;
  }

  string reply_to_post_id = 40;

  // ==== Moments extensions (P0) ====
  // Coexist with legacy `visibility` until P1 service migration. When
  // both are present, `audience` is the source of truth.
  Audience audience = 50;
  // Aggregated typed reactions for this post; supersedes
  // `interaction.is_liked` semantics. The viewer's own reactions are
  // signalled via `ReactionSummary.reacted_by_viewer`.
  repeated ReactionSummary reactions = 51;
  // Position-aware @-mentions inside the post body. The legacy
  // `mentions: repeated string` inside variant types (TextPost, ...)
  // remains for simple username extraction, but UI rendering should
  // prefer `typed_mentions` which carries offset/length so highlighting
  // works without re-parsing the text.
  repeated Mention typed_mentions = 52;
}

enum PostType {
  TEXT = 0;
  IMAGE = 1;
  VIDEO = 2;
  LINK = 3;
  POLL = 4;
  REPOST = 5;
  LOCATION = 6;
}

enum PostVisibility {
  PUBLIC = 0;
  FOLLOWERS_ONLY = 1;
  PRIVATE = 2;
}

message PostStats {
  int64 likes_count = 1;
  int64 comments_count = 2;
  int64 reposts_count = 3;
  int64 views_count = 4;
}

message PostAuthor {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  bool is_following = 5;

  // Federation identity (Tier B social-graph extension).
  //
  // `federated_handle` is the canonical "@user@host" form a UI can
  // render verbatim. Empty when the actor row pre-dates the federation
  // backfill — clients fall back to "@username".
  //
  // `home_station_domain` is the DNS-style HTTP origin (no scheme)
  // of the actor's authoritative station. Used by Desktop's
  // <FederatedHandle/> when it composes the secondary line; also lets
  // the chat layer detect "same-station" peers without re-parsing the
  // handle.
  //
  // Both fields are population-only — a client that does not understand
  // them simply ignores them, matching how `is_following` was added.
  string federated_handle = 6 [json_name = "federated_handle"];
  string home_station_domain = 7 [json_name = "home_station_domain"];
}

message PostInteraction {
  bool is_liked = 1;
  bool is_reposted = 2;
  bool is_bookmarked = 3;
}

// ============================================================================
// 各种类型的帖子内容
// ============================================================================

message TextPost {
  string text = 1;
  repeated string hashtags = 2;
  repeated string mentions = 3;
}

message ImagePost {
  string text = 1;
  repeated ImageAttachment images = 2;
  repeated string hashtags = 3;
  repeated string mentions = 4;
}

message VideoPost {
  string text = 1;
  VideoAttachment video = 2;
  repeated string hashtags = 3;
  repeated string mentions = 4;
}

message LinkPost {
  string text = 1;
  LinkPreview link = 2;
  repeated string hashtags = 3;
  repeated string mentions = 4;
}

message PollPost {
  string text = 1;
  peers_touch.model.activity.v1.Poll poll = 2;
  repeated string hashtags = 3;
  repeated string mentions = 4;
}

message RepostPost {
  string comment = 1;
  string original_post_id = 2;
  Post original_post = 3;
}

message LocationPost {
  string text = 1;
  Location location = 2;
  repeated ImageAttachment images = 3;
  repeated string hashtags = 4;
  repeated string mentions = 5;
}

// ============================================================================
// 媒体附件
// ============================================================================

message ImageAttachment {
  string id = 1;
  string url = 2;
  string thumbnail_url = 3;
  int64 size_bytes = 4;
  int32 width = 5;
  int32 height = 6;
  string blurhash = 7;
  string alt_text = 8;
  peers_touch.model.common.v1.EncryptedMediaDescriptor media_encryption = 9;
}

message VideoAttachment {
  string id = 1;
  string url = 2;
  string thumbnail_url = 3;
  int64 size_bytes = 4;
  int32 width = 5;
  int32 height = 6;
  int32 duration_seconds = 7;
  string blurhash = 8;
  VideoQuality quality = 9;
  repeated VideoVariant variants = 10;
  peers_touch.model.common.v1.EncryptedMediaDescriptor media_encryption = 11;
}

message VideoVariant {
  string url = 1;
  int32 bitrate = 2;
  string codec = 3;
  int32 width = 4;
  int32 height = 5;
}

enum VideoQuality {
  AUTO = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  HD = 4;
}

message LinkPreview {
  string url = 1;
  string title = 2;
  string description = 3;
  string image_url = 4;
  string site_name = 5;
  string favicon_url = 6;
}

message Location {
  string name = 1;
  double latitude = 2;
  double longitude = 3;
  string address = 4;
  string place_id = 5;
}

// ============================================================================
// API 请求/响应
// ============================================================================

message CreatePostRequest {
  PostType type = 1;
  // Deprecated: replaced by `audience` (field 4). Server uses `audience`
  // when present and falls back to `visibility` only for legacy clients.
  // Will be removed in P4 once the desktop scaffold is fully on Audience.
  PostVisibility visibility = 2;
  string reply_to_post_id = 3;
  // Audience selector (Moments). REQUIRED for posts created via the new
  // `/api/v1/social/moments` route. Mutually exclusive with `visibility`
  // — when both are set the server uses `audience` and ignores
  // `visibility` per the deprecation note above.
  Audience audience = 4;

  oneof content {
    CreateTextPostRequest text = 10;
    CreateImagePostRequest image = 11;
    CreateVideoPostRequest video = 12;
    CreateLinkPostRequest link = 13;
    CreatePollPostRequest poll = 14;
    CreateRepostRequest repost = 15;
    CreateLocationPostRequest location = 16;
  }
}

message CreateTextPostRequest {
  string text = 1;
}

message CreateImagePostRequest {
  string text = 1;
  repeated string image_ids = 2;
  // Typed image attachments for E2EE media publishing. `image_ids` stays
  // for legacy clients, but new clients SHOULD populate `images` so the
  // media encryption descriptor survives the create -> hydrate loop.
  repeated ImageAttachment images = 3;
}

message CreateVideoPostRequest {
  string text = 1;
  string video_id = 2;
}

message CreateLinkPostRequest {
  string text = 1;
  string url = 2;
}

message CreatePollPostRequest {
  string text = 1;
  string question = 2;
  repeated string options = 3;
  int32 duration_hours = 4;
  bool multiple_choice = 5;
}

message CreateRepostRequest {
  string original_post_id = 1;
  string comment = 2;
}

message CreateLocationPostRequest {
  string text = 1;
  repeated string image_ids = 2;
  Location location = 3;
}

message CreatePostResponse {
  Post post = 1;
}

message UpdatePostRequest {
  string post_id = 1;
  optional string content = 2;
  optional PostVisibility visibility = 3;
}

message UpdatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string post_id = 1;
}

message DeletePostResponse {
  bool success = 1;
}

message GetPostRequest {
  string post_id = 1;
}

message GetPostResponse {
  Post post = 1;
  FeedObjectExplanation explanation = 2;
  PostDetailOutcome outcome = 3;
}

enum PostDetailOutcome {
  POST_DETAIL_OUTCOME_UNSPECIFIED = 0;
  POST_DETAIL_OUTCOME_AVAILABLE = 1;
  POST_DETAIL_OUTCOME_HIDDEN = 2;
  POST_DETAIL_OUTCOME_DELETED = 3;
  POST_DETAIL_OUTCOME_UNAVAILABLE = 4;
}

message ListPostsRequest {
  string cursor = 1;
  int32 limit = 2;
  PostFilter filter = 3;
}

message ListPostsResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
  repeated FeedObjectExplanation explanations = 4;
}

message PostFilter {
  reserved "author_id";

  string author_ptid = 1;
  repeated PostVisibility visibility = 2;
  bool exclude_replies = 3;
  bool exclude_reposts = 4;
}

// ============================================================================
// 时间线
// ============================================================================

message GetTimelineRequest {
  TimelineType type = 1;
  string cursor = 2;
  int32 limit = 3;
  string actor_ptid = 4;
  // Optional sort strategy. Currently only meaningful for
  // TIMELINE_PUBLIC; all other timelines fix RECENT order.
  TimelineSort sort = 5;
}

message GetTimelineResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
  repeated FeedObjectExplanation explanations = 4;
  TimelinePageOutcome outcome = 5;
  TimelinePolicySummary policy_summary = 6;
}

enum TimelinePageOutcome {
  TIMELINE_PAGE_OUTCOME_UNSPECIFIED = 0;
  TIMELINE_PAGE_OUTCOME_ITEMS = 1;
  TIMELINE_PAGE_OUTCOME_EMPTY = 2;
  TIMELINE_PAGE_OUTCOME_FILTERED_EMPTY = 3;
}

message TimelinePolicySummary {
  uint32 scanned_count = 1;
  uint32 filtered_count = 2;
}

// FeedObjectExplanation is a viewer-scoped projection, not intrinsic
// post content. It answers the Human federated-social questions the UI
// must make visible: where this object came from, why the viewer sees
// it, what audience boundary applies, and whether block policy affected
// projection.
message FeedObjectExplanation {
  string object_id = 1;
  ActivitySource source = 2;
  RelationshipReason relationship_reason = 3;
  AudienceExplanation audience_explanation = 4;
  BlockExplanation block_explanation = 5;
}

message ActivitySource {
  enum Kind {
    ACTIVITY_SOURCE_UNSPECIFIED = 0;
    ACTIVITY_SOURCE_LOCAL = 1;
    ACTIVITY_SOURCE_REMOTE = 2;
    ACTIVITY_SOURCE_UNRESOLVED = 3;
  }

  Kind kind = 1;
  string station_domain = 2;
  string station_peer_id = 3;
}

message RelationshipReason {
  enum Kind {
    RELATIONSHIP_REASON_UNSPECIFIED = 0;
    RELATIONSHIP_REASON_SELF = 1;
    RELATIONSHIP_REASON_FOLLOWING = 2;
    RELATIONSHIP_REASON_FOLLOWER = 3;
    RELATIONSHIP_REASON_MUTUAL = 4;
    RELATIONSHIP_REASON_CIRCLE = 5;
    RELATIONSHIP_REASON_MENTIONED = 6;
    RELATIONSHIP_REASON_PUBLIC_FEDERATED = 7;
    RELATIONSHIP_REASON_PROFILE_VIEW = 8;
    RELATIONSHIP_REASON_UNKNOWN = 9;
  }

  Kind kind = 1;
  string actor_ptid = 2;
  string circle_id = 3;
  string station_domain = 4;
}

message AudienceExplanation {
  Audience.Kind kind = 1;
  string target_id = 2;
  bool viewer_is_author = 3;
  bool viewer_is_member = 4;
  bool policy_filtered = 5;
}

message BlockExplanation {
  enum Kind {
    BLOCK_STATE_UNSPECIFIED = 0;
    BLOCK_STATE_NOT_BLOCKED = 1;
    BLOCK_STATE_VIEWER_BLOCKED_AUTHOR = 2;
    BLOCK_STATE_AUTHOR_BLOCKED_VIEWER = 3;
    BLOCK_STATE_STATION_BLOCKED = 4;
  }

  Kind kind = 1;
  string actor_ptid = 2;
  string station_domain = 3;
}

message StationModerationPolicy {
  enum Kind {
    STATION_MODERATION_POLICY_UNSPECIFIED = 0;
    STATION_MODERATION_POLICY_BLOCK = 1;
  }

  string station_domain = 1;
  string station_peer_id = 2;
  Kind kind = 3;
  string reason = 4;
  string created_by_actor_ptid = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message UpsertStationModerationPolicyRequest {
  StationModerationPolicy policy = 1;
}

message UpsertStationModerationPolicyResponse {
  StationModerationPolicy policy = 1;
}

message DeleteStationModerationPolicyRequest {
  string station_domain = 1;
  string station_peer_id = 2;
  StationModerationPolicy.Kind kind = 3;
}

message DeleteStationModerationPolicyResponse {
  bool success = 1;
}

message ListStationModerationPoliciesRequest {
  StationModerationPolicy.Kind kind = 1;
  string cursor = 2;
  int32 limit = 3;
}

message ListStationModerationPoliciesResponse {
  repeated StationModerationPolicy policies = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// MomentDelivery is the durable viewer-scoped inbox entry for HOME
// timeline projection. PUBLIC Moments are intentionally excluded from
// delivery rows and remain served by the public feed path.
message MomentDelivery {
  reserved "author_id";

  string id = 1;
  string viewer_id = 2;
  string post_id = 3;
  string author_ptid = 4;
  Audience.Kind audience_kind = 5;
  google.protobuf.Timestamp delivered_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
}

// SyncMomentsProjectionRequest is the runtime reconcile entrypoint.
// Cursors are optional; an empty cursor asks Station for a fresh
// authoritative snapshot of the viewer-owned projections.
message SyncMomentsProjectionRequest {
  string home_cursor = 1;
  string public_cursor = 2;
  int32 limit = 3;
  TimelineSort public_sort = 4;
  string reason = 5;
}

message SyncMomentsProjectionResponse {
  GetTimelineResponse home_timeline = 1;
  GetTimelineResponse public_timeline = 2;
  string sync_token = 3;
  google.protobuf.Timestamp synced_at = 4;
}

enum TimelineType {
  TIMELINE_HOME = 0;
  TIMELINE_USER = 1;
  TIMELINE_PUBLIC = 2;
}

// TimelineSort selects the ranking strategy used when serving a
// timeline. RECENT (default) returns posts in created_at DESC order
// — the cheap, predictable shape suitable for HOME and USER. HOT
// returns posts ranked by an engagement-decayed score; only the
// PUBLIC timeline implements it today.
enum TimelineSort {
  TIMELINE_SORT_RECENT = 0;
  TIMELINE_SORT_HOT = 1;
}

// ============================================================================
// 个人统计（Moments dashboard）
// ============================================================================

// GetMyMomentsStats returns aggregate counters for the calling user's
// Moments surface — the data that powers the user-side dashboard
// panel. All values are computed live (no caching layer in P2).
message GetMyMomentsStatsRequest {}

message GetMyMomentsStatsResponse {
  // Total non-deleted posts authored by the caller, summed across
  // social_public_posts and social_private_posts.
  int64 posts_count = 1;
  // Total non-deleted comments authored by the caller across every
  // post they're replying to.
  int64 comments_count = 2;
  // Total reactions authored by the caller (every reaction this user
  // has placed across the system).
  int64 reactions_given_count = 3;
  // Sum of comments_count across the caller's own non-deleted posts —
  // i.e. how much engagement their content has attracted.
  int64 comments_received_count = 4;
  // Total reactions placed BY OTHERS on the caller's non-deleted
  // posts.
  int64 reactions_received_count = 5;
  // Number of accounts the caller follows.
  int64 following_count = 6;
  // Number of accounts following the caller.
  int64 followers_count = 7;
  // Number of circles the caller has created (publisher-private
  // audience labels).
  int64 circles_count = 8;
}

// ============================================================================
// 互动
// ============================================================================

message RepostRequest {
  string post_id = 1;
  optional string comment = 2;
}

message RepostResponse {
  Post repost = 1;
}

// ============================================================================
// Audience (Moments visibility model, P0)
// ============================================================================
// `Audience` describes who can read a post. It is the publish-time decision
// frozen onto the post; `Audience.Kind` MUST be immutable after creation
// (changing audience after the fact would require re-fanout and is not
// supported in v1).
//
// Field semantics by Kind:
//   PUBLIC         — visible to anyone (federated when ActivityPub lands).
//                    target_id / actor_ptids / base_kind: unused.
//   FOLLOWERS      — visible to author's followers + author. unused: as PUBLIC.
//   FRIENDS        — visible to accepted Social relationship peers + author.
//                    target_id / actor_ptids / base_kind: unused.
//   CIRCLE         — visible to members of `target_id` circle (publisher-owned).
//                    target_id required.
//   GROUP          — visible to members of `target_id` chat.Group.
//                    target_id required.
//   SELF           — author-only (private note). all others unused.
//   CUSTOM_ALLOW   — visible only to `actor_ptids`. allow_list, length>=1.
//                    base_kind: unused (the list IS the rule).
//   CUSTOM_DENY    — visible per `base_kind` MINUS `actor_ptids`. base_kind
//                    MUST be PUBLIC or FOLLOWERS, actor_ptids MUST be non-empty.
message Audience {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    PUBLIC = 1;
    FOLLOWERS = 2;
    CIRCLE = 3;
    GROUP = 4;
    SELF = 5;
    CUSTOM_ALLOW = 6;
    CUSTOM_DENY = 7;
    FRIENDS = 8;
  }
  Kind kind = 1;
  // Required iff kind == CIRCLE or GROUP.
  uint64 target_id = 2;
  // Required iff kind == CUSTOM_ALLOW or CUSTOM_DENY.
  repeated string actor_ptids = 3;
  // ONLY meaningful when kind == CUSTOM_DENY: the base set the deny list
  // is subtracted from. MUST be PUBLIC or FOLLOWERS. For all other Kinds
  // this field is silently ignored.
  Kind base_kind = 4;
  // Key envelopes are audience-specific and intentionally separate from
  // media ciphertext. Chat reuses Sender Keys; Moments stores per-audience
  // sealed keys so Station can authorize fanout without reading media keys.
  repeated peers_touch.model.social.v1.AudienceKeyEnvelope key_envelopes = 5;
}

// ============================================================================
// Reactions (typed, replaces simple Like)
// ============================================================================
enum ReactionKind {
  REACTION_UNSPECIFIED = 0;
  REACTION_LIKE = 1;
  REACTION_LOVE = 2;
  REACTION_LAUGH = 3;
  REACTION_WOW = 4;
  REACTION_CELEBRATE = 5;
}

// Aggregated reaction count for a single ReactionKind on a Post.
message ReactionSummary {
  ReactionKind kind = 1;
  int64 count = 2;
  // True iff the requesting viewer has reacted with `kind` themselves.
  bool reacted_by_viewer = 3;
}

// Position-aware @-mention. `offset` and `length` are UTF-16 code unit
// indices into the post body so JS / Java / Swift can splice without
// re-parsing. `display` is the rendered handle (no leading `@`).
message Mention {
  string actor_ptid = 1;
  int32 offset = 2;
  int32 length = 3;
  string display = 4;
}

message ReactToPostRequest {
  string post_id = 1;
  ReactionKind kind = 2;
}

message ReactToPostResponse {
  bool success = 1;
  // Updated summary reflecting the viewer's new reaction. May contain
  // counts for all kinds, not just the one just added.
  repeated ReactionSummary reactions = 2;
}

message UnreactToPostRequest {
  string post_id = 1;
  ReactionKind kind = 2;
}

message UnreactToPostResponse {
  bool success = 1;
  repeated ReactionSummary reactions = 2;
}

message ListReactionsRequest {
  string post_id = 1;
  // Optional filter: when non-zero, only reactors of this kind are returned.
  ReactionKind kind = 2;
  string cursor = 3;
  int32 limit = 4;
}

message ListReactionsResponse {
  message Entry {
    PostAuthor reactor = 1;
    ReactionKind kind = 2;
    google.protobuf.Timestamp reacted_at = 3;
  }
  repeated Entry entries = 1;
  string next_cursor = 2;
  bool has_more = 3;
}
