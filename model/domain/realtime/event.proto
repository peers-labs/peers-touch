syntax = "proto3";

package peers_touch.model.realtime.v1;

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/realtime;realtime";

// Wire schema for the Canonical Event Stream.
//
// See docs/architecture/realtime/event-stream.md for the full contract.
// Brief: each authenticated device-window holds exactly one SSE
// connection to its home Station. That stream multiplexes every kind
// of real-time event encoded as a StreamEvent oneof. Schema evolves
// only by adding new oneof arms; existing arms are immutable.

// StreamEvent is the single envelope every realtime frame uses.
//
// Protobuf wire bytes are base64-encoded into the SSE `data:` field;
// `event_id` is set as the SSE `id:` field so the SSE Last-Event-ID
// resume mechanic works without parsing the body.
message StreamEvent {
  // Server-assigned, monotonic per-actor. Opaque to clients; clients
  // MUST NOT parse it. Used as the SSE id and as the Last-Event-ID
  // cursor on reconnect.
  string event_id = 1;

  // Server's wall-clock at emit time, milliseconds since Unix epoch.
  // Clients MUST NOT use this for ordering — trust event_id ordering.
  // Provided only for UI-side display and diagnostic logging.
  int64 ts_unix_ms = 2;

  oneof kind {
    Heartbeat       hb        = 10;
    MessageEnvelope message   = 11;
    MessageReceipt  receipt   = 12;
    TypingState     typing    = 13;
    PresenceFlip    presence  = 14;
    CallSignal      signaling = 15;
    Resync          resync    = 16;
    MessageMutation mutation  = 17;
  }
}

// Heartbeat is emitted by the server every 15 seconds (default,
// operator-tunable) so the client can detect a silent connection even
// when no business event has occurred recently. Clients reset their
// reconnect deadline on every received frame including heartbeats.
message Heartbeat {
  // The newest event_id the server has emitted on this stream.
  // Clients SHOULD store this as their next Last-Event-ID checkpoint
  // when there has been no business event since the last heartbeat;
  // doing so reduces redundant replay on reconnect.
  string floor_event_id = 1;
}

// MessageEnvelope carries an E2EE-encrypted chat message.
//
// Station sees ciphertext plus routing metadata; it cannot decrypt
// content. Attachments live as oss:// references inside the
// ciphertext, never in this envelope.
message MessageEnvelope {
  string sender_actor_id    = 1;
  string recipient_actor_id = 2;
  string session_ulid       = 3;

  // Message ULID, generated by the sender. Used by the receiver for
  // de-duplication when an event also arrives via the cold-recovery
  // pending-pull path described in §2.5 case-2 of the contract.
  string ulid = 4;

  // Opaque ciphertext. Includes the message body, attachment
  // references, and any per-message protocol metadata.
  bytes ciphertext = 5;

  // Sender's local clock at send time. Untrusted; for display only.
  int64 sent_ts_unix_ms = 6;
}

// MessageReceipt acknowledges that a message reached the receiver
// (DELIVERED) or has been seen (READ). Receipts are themselves
// E2EE-out-of-scope: they reveal only that a ulid was processed.
message MessageReceipt {
  string session_ulid  = 1;
  string ulid          = 2;
  Kind   kind          = 3;
  string from_actor_id = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    DELIVERED        = 1;
    READ             = 2;
  }
}

// TypingState carries an ephemeral "X is typing" indicator. Not
// persisted; if a client misses it nothing breaks.
message TypingState {
  string session_ulid  = 1;
  string from_actor_id = 2;
  bool   typing        = 3;
}

// PresenceFlip notifies the recipient that some actor's online state
// has changed. Sent to the recipient's stream, not broadcast.
message PresenceFlip {
  string actor_id = 1;
  bool   online   = 2;
}

// CallSignal carries WebRTC offer / answer / ICE candidate / hangup
// payloads for voice and video calls. The body is opaque to Station;
// SDP and candidate JSON live entirely inside `payload`.
//
// Reserved for the media plane only. Text messages MUST NOT be
// transported as CallSignal events.
message CallSignal {
  string session_ulid  = 1;
  string from_actor_id = 2;
  Kind   kind          = 3;
  bytes  payload       = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    OFFER            = 1;
    ANSWER           = 2;
    CANDIDATE        = 3;
    HANGUP           = 4;
    // Application-layer ringing protocol. CALL_REQUEST initiates a
    // voice or video call (the WebRTC OFFER / ANSWER / CANDIDATE
    // exchange that follows is the same as for the data-plane
    // handshake — these kinds only exist so the UI can show a
    // ringing modal before media renegotiation starts). The
    // payload's plaintext form is JSON: `{"kind":"audio"|"video",
    // "callId":"<ulid>"}`.
    CALL_REQUEST     = 5;
    CALL_ACCEPT      = 6;
    CALL_REJECT      = 7;
    CALL_END         = 8;
  }
}

// MessageMutation notifies a peer that a previously-delivered message
// was retroactively modified by its author: recalled (content cleared
// and a tombstone shown), edited (content replaced, edited_at stamped),
// or deleted (row removed; UI removes the bubble entirely).
//
// Wire-level constraints:
//   * RECALL: `new_content` MUST be empty. `new_ciphertext` MUST be
//     empty. The receiver clears the bubble's text and renders a
//     "this message was recalled" placeholder.
//   * EDIT: For E2EE chats, `new_ciphertext` carries the freshly
//     ratchet-encrypted body and `new_content` is empty. For chats
//     where E2EE is not yet established (legacy / not-yet-keyed
//     sessions), `new_content` carries plaintext. Receivers MUST
//     prefer `new_ciphertext` when both are non-empty.
//   * DELETE: both fields MUST be empty. Receivers remove the
//     message from their store entirely.
//
// Mutations are authored by the message's original sender only.
// Station rejects mutations from any other actor at the ingress
// handler. The receiver's UI is forward-only: a stale RECALL
// arriving after a DELETE for the same ulid is a no-op (the row no
// longer exists).
message MessageMutation {
  string session_ulid  = 1;
  string ulid          = 2;
  string from_actor_id = 3;
  Kind   kind          = 4;
  bytes  new_ciphertext = 5;
  string new_content    = 6;
  // Server stamp of the mutation's wall-clock time, milliseconds
  // since Unix epoch. Display-only; clients must not use it for
  // ordering — trust the parent StreamEvent's `event_id`.
  int64 mutated_ts_unix_ms = 7;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    RECALL           = 1;
    EDIT             = 2;
    DELETE           = 3;
  }
}

// Resync is the server's only signal that the client's Last-Event-ID
// cursor falls outside the in-memory ring buffer. On receiving this,
// clients MUST perform a cold catch-up before trusting any event
// delivered after Resync. See §2.5 of the architecture contract.
message Resync {
  // The newest event_id the server holds. Clients use this as their
  // next Last-Event-ID after the cold catch-up completes.
  string newest_event_id = 1;

  // Human-readable reason, for client logs only. Not parsed.
  string reason = 2;
}
