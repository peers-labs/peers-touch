syntax = "proto3";

package peers_touch.model.realtime.v1;

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/realtime;realtime";

// Wire schema for the Canonical Event Stream.
//
// See docs/architecture/realtime/event-stream.md for the full contract.
// Brief: each authenticated device-window holds exactly one SSE
// connection to its home Station. That stream multiplexes every kind
// of real-time event encoded as a StreamEvent oneof. Schema evolves
// only by adding new oneof arms; existing arms are immutable.

// StreamEvent is the single envelope every realtime frame uses.
//
// Protobuf wire bytes are base64-encoded into the SSE `data:` field;
// `event_id` is set as the SSE `id:` field so the SSE Last-Event-ID
// resume mechanic works without parsing the body.
message StreamEvent {
  // Server-assigned, monotonic per-actor. Opaque to clients; clients
  // MUST NOT parse it. Used as the SSE id and as the Last-Event-ID
  // cursor on reconnect.
  string event_id = 1;

  // Server's wall-clock at emit time, milliseconds since Unix epoch.
  // Clients MUST NOT use this for ordering — trust event_id ordering.
  // Provided only for UI-side display and diagnostic logging.
  int64 ts_unix_ms = 2;

  oneof kind {
    Heartbeat             hb                       = 10;
    MessageEnvelope       message                  = 11;
    MessageReceipt        receipt                  = 12;
    TypingState           typing                   = 13;
    PresenceFlip          presence                 = 14;
    CallSignal            signaling                = 15;
    Resync                resync                   = 16;
    MessageMutation       mutation                 = 17;
    GroupMembershipChange group_membership_change   = 18;
    ConversationSettingsChanged conversation_settings_changed = 19;
    MomentEvent           moment                   = 20;
    GroupFederationEvent  group_federation_event   = 21;
      GroupSkdmEnvelopeDelivered group_skdm_envelope_delivered = 22;
    EnvelopeDelivered         envelope_delivered               = 23;
    LedgerEventDelivered      ledger_event_delivered           = 24;
    SocialGraphEvent          social_graph_event               = 25;
  }
}

// Heartbeat is emitted by the server every 15 seconds (default,
// operator-tunable) so the client can detect a silent connection even
// when no business event has occurred recently. Clients reset their
// reconnect deadline on every received frame including heartbeats.
message Heartbeat {
  // The newest event_id the server has emitted on this stream.
  // Clients SHOULD store this as their next Last-Event-ID checkpoint
  // when there has been no business event since the last heartbeat;
  // doing so reduces redundant replay on reconnect.
  string floor_event_id = 1;
}

// MessageEnvelope carries an E2EE-encrypted chat message.
//
// Station sees ciphertext plus routing metadata; it cannot decrypt
// content. Attachments live as oss:// references inside the
// ciphertext, never in this envelope.
message MessageEnvelope {
  string sender_actor_ptid    = 1;
  string recipient_actor_ptid = 2;
  string session_ulid       = 3;

  // Message ULID, generated by the sender. Used by the receiver for
  // de-duplication when an event also arrives via the cold-recovery
  // pending-pull path described in §2.5 case-2 of the contract.
  string ulid = 4;

  // Opaque ciphertext. Includes the message body, attachment
  // references, and any per-message protocol metadata.
  bytes ciphertext = 5;

  // Sender's local clock at send time. Untrusted; for display only.
  int64 sent_ts_unix_ms = 6;
}

// MessageReceipt acknowledges that a message reached the receiver
// (DELIVERED) or has been seen (READ). Receipts are themselves
// E2EE-out-of-scope: they reveal only that a ulid was processed.
message MessageReceipt {
  string session_ulid  = 1;
  string ulid          = 2;
  Kind   kind          = 3;
  string from_actor_ptid = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    DELIVERED        = 1;
    READ             = 2;
  }
}

// TypingState carries an ephemeral "X is typing" indicator. Not
// persisted; if a client misses it nothing breaks.
message TypingState {
  string session_ulid  = 1;
  string from_actor_ptid = 2;
  bool   typing        = 3;
}

// PresenceFlip notifies the recipient that some actor's online state
// has changed. Sent to the recipient's stream, not broadcast.
message PresenceFlip {
  string actor_ptid = 1;
  bool   online   = 2;
}

// CallSignal carries WebRTC offer / answer / ICE candidate / hangup
// payloads for voice and video calls. The body is opaque to Station;
// SDP and candidate JSON live entirely inside `payload`.
//
// Reserved for the media plane only. Text messages MUST NOT be
// transported as CallSignal events.
message CallSignal {
  string session_ulid  = 1;
  string from_actor_ptid = 2;
  Kind   kind          = 3;
  bytes  payload       = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    OFFER            = 1;
    ANSWER           = 2;
    CANDIDATE        = 3;
    HANGUP           = 4;
    // Application-layer ringing protocol. CALL_REQUEST initiates a
    // voice or video call (the WebRTC OFFER / ANSWER / CANDIDATE
    // exchange that follows is the same as for the data-plane
    // handshake — these kinds only exist so the UI can show a
    // ringing modal before media renegotiation starts). The
    // payload's plaintext form is JSON: `{"kind":"audio"|"video",
    // "callId":"<ulid>"}`.
    CALL_REQUEST     = 5;
    CALL_ACCEPT      = 6;
    CALL_REJECT      = 7;
    CALL_END         = 8;
  }
}

// MessageMutation notifies a peer that a previously-delivered message
// was retroactively modified by its author: recalled (content cleared
// and a tombstone shown), edited (content replaced, edited_at stamped),
// or deleted (row removed; UI removes the bubble entirely).
//
// Wire-level constraints:
//   * RECALL: `new_content` MUST be empty. `new_ciphertext` MUST be
//     empty. The receiver clears the bubble's text and renders a
//     "this message was recalled" placeholder.
//   * EDIT: For E2EE chats, `new_ciphertext` carries the freshly
//     ratchet-encrypted body and `new_content` is empty. For chats
//     where E2EE is not yet established (legacy / not-yet-keyed
//     sessions), `new_content` carries plaintext. Receivers MUST
//     prefer `new_ciphertext` when both are non-empty.
//   * DELETE: both fields MUST be empty. Receivers remove the
//     message from their store entirely.
//
// Mutations are authored by the message's original sender only.
// Station rejects mutations from any other actor at the ingress
// handler. The receiver's UI is forward-only: a stale RECALL
// arriving after a DELETE for the same ulid is a no-op (the row no
// longer exists).
message MessageMutation {
  string session_ulid  = 1;
  string ulid          = 2;
  string from_actor_ptid = 3;
  Kind   kind          = 4;
  bytes  new_ciphertext = 5;
  string new_content    = 6;
  // Server stamp of the mutation's wall-clock time, milliseconds
  // since Unix epoch. Display-only; clients must not use it for
  // ordering — trust the parent StreamEvent's `event_id`.
  int64 mutated_ts_unix_ms = 7;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    RECALL           = 1;
    EDIT             = 2;
    DELETE           = 3;
  }
}

// GroupMembershipChange notifies subscribers that a group's roster
// or lifecycle changed in real time. Every
// affected actor receives a frame on their SSE stream so clients
// can refresh cached membership and rotate Sender Keys promptly.
message GroupMembershipChange {
  string event_id = 1; // server ULID, opaque cursor
  string group_ulid = 2;
  string actor_ptid = 3; // the member whose membership flipped
  Kind kind = 4;
  int64 changed_ts_unix_ms = 5;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_REMOVED = 2; // an admin kicked them
    KIND_LEFT = 3;    // they left voluntarily
    KIND_UPDATED = 4; // role or moderation state changed
    KIND_TRANSFERRED = 5; // group ownership moved to actor_ptid
    KIND_DISSOLVED = 6;   // group is dissolved by owner
  }
}

// ConversationSettingsChanged invalidates the local per-conversation
// preference projection for one actor. Station emits it to the actor's
// own stream after mutating settings so the same account's open
// Desktop/Mobile sessions converge without waiting for restart.
message ConversationSettingsChanged {
  string container_ulid = 1; // friend session_ulid or group_ulid
  Kind kind = 2;
  string actor_ptid = 3;
  int64 changed_ts_unix_ms = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    FRIEND = 1;
    GROUP = 2;
  }
}

// MomentEvent notifies a viewer that a Moment they can see changed.
// It intentionally carries identifiers and small metadata only; clients
// refresh the authoritative Moment/detail projection through the social
// API so visibility filtering remains Station-owned.
message MomentEvent {
  Kind kind = 1;
  string post_id = 2;
  string author_actor_ptid = 3;
  string actor_ptid = 4;
  string comment_id = 5;
  string reaction_kind = 6;
  bool removed = 7;
  string audience = 8;
  int64 occurred_ts_unix_ms = 9;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    CREATED = 1;
    DELETED = 2;
    COMMENTED = 3;
    REACTED = 4;
  }
}

// GroupFederationEvent notifies a member's Home Station client that a
// committed authority-owned group event has been applied to the local
// follower projection. It carries identifiers only; clients refresh the
// group/message projection through group_chat APIs so Station remains
// unable to read E2EE plaintext.
message GroupFederationEvent {
  string group_ulid = 1;
  string event_ulid = 2;
  int64 seq = 3;
  string event_type = 4;
  string authority_station_peer_id = 5;
  int64 authority_epoch = 6;
  string event_hash = 7;
  string message_ulid = 8;
  int64 membership_epoch = 9;
  int64 committed_ts_unix_ms = 10;
  string actor_ptid = 11;
}

// GroupSkdmEnvelopeDelivered notifies one actor stream that their Home
// Station accepted an opaque, already sealed Sender Key Distribution
// Message envelope for one recipient device.
//
// Station must not inspect or transform encrypted_payload. The target
// client filters by recipient_device_id, opens encrypted_payload with
// its local identity key, and installs the inner SenderKeyDistributionMessage
// locally. Non-target devices for the same actor may see this envelope
// on the actor-level stream, but cannot open it.
message GroupSkdmEnvelopeDelivered {
  string group_ulid = 1;
  int64 membership_epoch = 2;
  string sender_ptid = 3;
  uint32 sender_key_id = 4;
  string recipient_ptid = 5;
  string recipient_device_id = 6;
  string idempotency_key = 7;
  bytes encrypted_payload = 8;
  int64 delivered_ts_unix_ms = 9;
  string sender_home_station_peer_id = 10;
}

// Resync is the server's only signal that the client's Last-Event-ID
// cursor falls outside the in-memory ring buffer. On receiving this,
// clients MUST perform a cold catch-up before trusting any event
// delivered after Resync. See §2.5 of the architecture contract.
message Resync {
  // The newest event_id the server holds. Clients use this as their
  // next Last-Event-ID after the cold catch-up completes.
  string newest_event_id = 1;

  // Human-readable reason, for client logs only. Not parsed.
  string reason = 2;
}

// EnvelopeDelivered notifies a device that a new StationEnvelope has
// been written to its durable inbox and is available for immediate
// processing. Fat-push: the full payload is embedded so clients can
// process without a round-trip fetch. Clients MUST still ACK via
// POST /envelope/ack after successful processing.
//
// Deduplication: inbox_item_id is the canonical dedup key. A device
// receiving the same inbox_item_id from both SSE push and resume poll
// MUST process at-most-once and ACK idempotently.
message EnvelopeDelivered {
  string inbox_item_id = 1;
  string envelope_id = 2;
  string conversation_id = 3;
  int32 payload_type = 4;
  bytes payload_bytes = 5;
  string sender_ptid = 6;
  string sender_device_id = 7;
  string recipient_device_id = 8;
  int64 membership_epoch = 9;
  int64 queued_ts_unix_ms = 10;
}

// LedgerEventDelivered pushes a new Federation governance event to connected
// member Stations via SSE. The receiving Station verifies hash chain and
// signatures before applying to local ledger. See wire-protocol.md §7.2.
message LedgerEventDelivered {
  string federation_id = 1;
  uint64 seq = 2;
  bytes  event_hash = 3;
  bytes  prev_hash = 4;
  string event_type = 5;
  bytes  payload_bytes = 6;
  bytes  payload_hash = 7;
  bytes  actor_signature = 8;
  bytes  station_signature = 9;
  bytes  sequencer_signature = 10;
  string actor_ptid = 11;
  string actor_federated_handle = 12;
  string station_peer_id = 13;
  string sequencer_station_peer_id = 14;
  int64  created_at_unix_ms = 15;
}

// SocialGraphEvent signals a change in the social relationship graph:
// friend requests sent/accepted/rejected, new conversations created by
// the social layer, or unfriend actions. Clients use this to refresh
// the friend request list and conversation list immediately, replacing
// indirect notification-based polling.
message SocialGraphEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    FRIEND_REQUEST_RECEIVED = 1;
    FRIEND_REQUEST_ACCEPTED = 2;
    FRIEND_REQUEST_REJECTED = 3;
    CONVERSATION_CREATED = 4;
    UNFRIENDED = 5;
  }

  Kind   kind = 1;
  string actor_ptid = 2;
  string target_ptid = 3;
  string request_id = 4;
  string conversation_id = 5;
  string actor_display_name = 6;
}
