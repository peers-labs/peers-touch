syntax = "proto3";

package peers_touch.model.auth.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "domain/actor/actor.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model;model";

message LoginRequest {
  string email = 1;
  string password = 2;
  string device_type = 3;
}

message AuthTokens {
  string token = 1;
  string access_token = 2;
  string refresh_token = 3;
  string token_type = 4;
  string expires_at = 5;
}

// Actor identity returned in login/oauth-bridge responses.
message AuthActorInfo {
  string id = 1;
  int64  actor_id = 2;
  string username = 3;
  string display_name = 4;
  string email = 5;
}

message LoginResponse {
  AuthTokens tokens = 1;
  string session_id = 2;
  AuthActorInfo actor = 3;
  peers_touch.model.actor.v1.ActorRef actor_ref = 4 [json_name = "actor_ref"];
}
