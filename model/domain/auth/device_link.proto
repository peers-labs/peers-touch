syntax = "proto3";

package peers_touch.model.auth.device_link.v1;

import "domain/auth/auth.proto";
import "domain/actor/actor.proto";
import "domain/access_gate/access_gate.proto";
import "domain/peer/access_endpoint.proto";
import "domain/peer/station_identity.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/devicelink;devicelink";

// Each offer authorizes one selected installation. Actor device concurrency is
// governed by Session/Actor Identity, never by offer or client-class quotas.
enum DeviceLinkState {
  DEVICE_LINK_STATE_UNSPECIFIED = 0;
  DEVICE_LINK_STATE_OPEN = 1;
  DEVICE_LINK_STATE_CLAIMS_PENDING = 2;
  DEVICE_LINK_STATE_APPROVED = 3;
  DEVICE_LINK_STATE_IDENTITY_DELIVERY = 4;
  DEVICE_LINK_STATE_DEVICE_PROVED = 5;
  DEVICE_LINK_STATE_ACCESS_PENDING = 6;
  DEVICE_LINK_STATE_CREDENTIAL_DELIVERY = 7;
  DEVICE_LINK_STATE_COMMITTED = 8;
  DEVICE_LINK_STATE_DENIED = 9;
  DEVICE_LINK_STATE_CANCELLED = 10;
  DEVICE_LINK_STATE_EXPIRED = 11;
  DEVICE_LINK_STATE_REVOKED = 12;
}

enum DeviceLinkErrorCode {
  DEVICE_LINK_ERROR_CODE_UNSPECIFIED = 0;
  DEVICE_LINK_ERROR_CODE_INVALID_ARGUMENT = 1;
  DEVICE_LINK_ERROR_CODE_OFFER_EXPIRED = 2;
  DEVICE_LINK_ERROR_CODE_OFFER_CANCELLED = 3;
  DEVICE_LINK_ERROR_CODE_CLAIM_LIMIT = 4;
  DEVICE_LINK_ERROR_CODE_CLAIM_NOT_SELECTED = 5;
  DEVICE_LINK_ERROR_CODE_STATION_UNREACHABLE = 6;
  DEVICE_LINK_ERROR_CODE_STATION_ROOT_MISMATCH = 7;
  DEVICE_LINK_ERROR_CODE_BOOTSTRAP_UNSUPPORTED = 8;
  DEVICE_LINK_ERROR_CODE_PROFILE_STALE = 9;
  DEVICE_LINK_ERROR_CODE_IDENTITY_CONFLICT = 10;
  DEVICE_LINK_ERROR_CODE_APPROVER_REVOKED = 11;
  DEVICE_LINK_ERROR_CODE_ACCESS_BLOCKED = 12;
  DEVICE_LINK_ERROR_CODE_DEVICE_SESSION_CONFLICT = 13;
  DEVICE_LINK_ERROR_CODE_DEVICE_LIMIT = 14;
  DEVICE_LINK_ERROR_CODE_SECURE_STORAGE_FAILED = 15;
  DEVICE_LINK_ERROR_CODE_DELIVERY_PENDING = 16;
  DEVICE_LINK_ERROR_CODE_REVISION_CONFLICT = 17;
  DEVICE_LINK_ERROR_CODE_UNAUTHORIZED = 18;
  DEVICE_LINK_ERROR_CODE_CAPACITY_EXCEEDED = 19;
}

message DeviceLinkConnectionCandidate {
  oneof material {
    peers_touch.model.peer.v1.PublicEndpointConnectionMaterial direct = 1;
    peers_touch.model.peer.v1.StationConnectionEnvelope circuit = 2;
  }
}

// Sign exact statement_bytes with "peers-touch/device-link/offer/v1\0".
// scan_capability is a random 32-byte possession secret, persisted only hashed.
message DeviceLinkOfferStatement {
  uint32 protocol_version = 1;
  string offer_id = 2;
  bytes offer_nonce = 3;
  string station_peer_id = 4;
  bytes station_root_public_key = 5;
  peers_touch.model.actor.v1.ActorRef actor = 6;
  string desktop_device_id = 7;
  bytes actor_identity_public_key = 8;
  bytes actor_identity_key_fingerprint = 9;
  bytes desktop_hpke_public_key = 10;
  int64 issued_at_unix_ms = 11;
  int64 expires_at_unix_ms = 12;
  repeated DeviceLinkConnectionCandidate connections = 13;
  bytes scan_capability = 14;
  uint64 crypto_revision = 15;
  peers_touch.model.actor.v1.ActorDeviceCertificate desktop_certificate = 16;
  bytes desktop_actor_cross_signature = 17;
}

message SignedDeviceLinkOffer {
  bytes statement_bytes = 1;
  bytes node_signature = 2;
  peers_touch.model.peer.v1.StationNodeAuthorization node_authorization = 3;
}

// A reference has one fixed retrieval endpoint and no recursive references.
// unsealing_key must stay in the QR fragment and is never sent to the endpoint.
message DeviceLinkLocator {
  uint32 protocol_version = 1;
  string station_peer_id = 2;
  bytes station_root_public_key = 3;
  bytes locator = 4;
  bytes unsealing_key = 5;
  bytes offer_digest = 6;
  peers_touch.model.peer.v1.PublicEndpointConnectionMaterial retrieval_endpoint = 7;
  bytes desktop_hpke_public_key = 8;
  int64 expires_at_unix_ms = 9;
}

// Fixed RFC 9180 suite: X25519/HKDF-SHA256/ChaCha20Poly1305.
// transcript_bytes binds the purpose and immutable authorization context.
message DeviceLinkHpkeEnvelope {
  uint32 protocol_version = 1;
  bytes encapsulated_key = 2;
  bytes ciphertext = 3;
  bytes transcript_bytes = 4;
}

message DeviceLinkClaimStatement {
  uint32 protocol_version = 1;
  string offer_id = 2;
  string request_id = 3;
  string station_peer_id = 4;
  string mobile_device_id = 5;
  string platform = 6;
  string app_version = 7;
  string device_label = 8;
  bytes mobile_hpke_public_key = 9;
  bytes mobile_device_signing_public_key = 10;
  bytes claim_nonce = 11;
  uint64 lifecycle_generation = 12;
  // The transport source is independently generated by the Mobile Host.
  bytes transport_source_public_key = 13;
}

message DeviceLinkClaim {
  string claim_id = 1;
  bytes statement_bytes = 2;
  bytes mobile_device_signature = 3;
  string access_attempt_id = 4;
  uint64 access_decision_revision = 5;
  uint64 profile_revision = 6;
  DeviceLinkState state = 7;
}

message DeviceLinkApprovalTranscript {
  uint32 protocol_version = 1;
  string offer_id = 2;
  bytes offer_digest = 3;
  string claim_id = 4;
  bytes claim_digest = 5;
  string station_peer_id = 6;
  peers_touch.model.actor.v1.ActorRef actor = 7;
  string desktop_device_id = 8;
  string mobile_device_id = 9;
  bytes desktop_hpke_public_key = 10;
  bytes mobile_hpke_public_key = 11;
  bytes mobile_device_signing_public_key = 12;
  string access_attempt_id = 13;
  uint64 approval_revision = 14;
  uint64 profile_revision = 15;
  int64 expires_at_unix_ms = 16;
}

message DeviceLinkIdentityMaterial {
  bytes actor_identity_seed = 1;
  bytes actor_identity_key_fingerprint = 2;
  bytes approval_transcript_digest = 3;
}

message DeviceLinkCredentialTranscript {
  uint32 protocol_version = 1;
  bytes approval_transcript_digest = 2;
  string delivery_id = 3;
  string session_id = 4;
  string mobile_device_id = 5;
  string access_attempt_id = 6;
  uint64 access_decision_revision = 7;
  int64 expires_at_unix_ms = 8;
}

message DeviceLinkCredentialMaterial {
  peers_touch.model.auth.v1.LoginResponse login = 1;
  DeviceLinkCredentialTranscript transcript = 2;
  repeated DeviceLinkConnectionCandidate connections = 3;
}

message CreateDeviceLinkRequest {
  string request_id = 1;
  bytes desktop_hpke_public_key = 2;
  peers_touch.model.actor.v1.ActorDeviceCertificate desktop_certificate = 3;
  bytes desktop_actor_cross_signature = 4;
  bytes device_signature = 5;
}

message CreateDeviceLinkResponse {
  SignedDeviceLinkOffer offer = 1;
  DeviceLinkLocator locator = 2;
  uint64 revision = 3;
}

message ClaimDeviceLinkRequest {
  string offer_id = 1;
  bytes scan_capability = 2;
  bytes statement_bytes = 3;
  bytes device_signature = 4;
}

message ClaimDeviceLinkResponse {
  DeviceLinkClaim claim = 1;
  // Returned once and retained by the Mobile secure runtime. Stored hashed.
  bytes claim_capability = 2;
  uint64 revision = 3;
}

// Every claim write carries an operation-specific device PoP. The signature
// covers canonical request bytes with this field empty and a domain separator.
message DeviceLinkClaimAuthorization {
  string offer_id = 1;
  string claim_id = 2;
  bytes claim_capability = 3;
  bytes device_signature = 4;
}

message ApproveDeviceLinkRequest {
  string offer_id = 1;
  string claim_id = 2;
  uint64 observed_revision = 3;
  DeviceLinkHpkeEnvelope identity_material = 4;
  bytes desktop_transcript_signature = 5;
}

message DenyDeviceLinkRequest {
  string offer_id = 1;
  string claim_id = 2;
  uint64 observed_revision = 3;
  bytes device_signature = 4;
}

message CancelDeviceLinkRequest {
  string offer_id = 1;
  DeviceLinkClaimAuthorization claim_authorization = 2;
  uint64 observed_revision = 3;
  bytes desktop_device_signature = 4;
}

message GetDeviceLinkStatusRequest {
  string offer_id = 1;
  DeviceLinkClaimAuthorization claim_authorization = 2;
}

message DeviceLinkStatus {
  string offer_id = 1;
  DeviceLinkState state = 2;
  uint64 revision = 3;
  int64 expires_at_unix_ms = 4;
  // Desktop sees pending claims; Mobile sees only its own claim.
  repeated DeviceLinkClaim claims = 5;
  string selected_claim_id = 6;
  DeviceLinkErrorCode reason = 7;
  peers_touch.model.access_gate.v1.AccessDecision access_decision = 8;
  string delivery_id = 9;
  bytes credential_digest = 10;
  // Current Actor Identity fence for re-signing enrollment. It does not mutate
  // the immutable approval transcript's profile_revision.
  uint64 current_profile_revision = 11;
}

message ApproveDeviceLinkResponse { DeviceLinkStatus status = 1; }
message DenyDeviceLinkResponse { DeviceLinkStatus status = 1; }
message CancelDeviceLinkResponse { DeviceLinkStatus status = 1; }
message GetDeviceLinkStatusResponse { DeviceLinkStatus status = 1; }
message ProveDeviceLinkDeviceResponse { DeviceLinkStatus status = 1; }
message SubmitDeviceLinkAccessActionResponse { DeviceLinkStatus status = 1; }
message AcknowledgeDeviceLinkResponse { DeviceLinkStatus status = 1; }

message GetDeviceLinkMaterialRequest {
  DeviceLinkClaimAuthorization authorization = 1;
}

message GetDeviceLinkMaterialResponse {
  DeviceLinkStatus status = 1;
  DeviceLinkHpkeEnvelope identity_material = 2;
  bytes desktop_transcript_signature = 3;
  DeviceLinkHpkeEnvelope credential_material = 4;
  bytes node_credential_signature = 5;
  peers_touch.model.peer.v1.StationNodeAuthorization node_authorization = 6;
}

message ProveDeviceLinkDeviceRequest {
  DeviceLinkClaimAuthorization authorization = 1;
  peers_touch.model.actor.v1.EnrollActorDeviceRequest enrollment = 2;
  uint64 observed_revision = 3;
}

message SubmitDeviceLinkAccessActionRequest {
  DeviceLinkClaimAuthorization authorization = 1;
  uint64 observed_revision = 2;
  peers_touch.model.access_gate.v1.SubmitAccessGateRequest submission = 3;
}

message AcknowledgeDeviceLinkRequest {
  DeviceLinkClaimAuthorization authorization = 1;
  string delivery_id = 2;
  bytes credential_digest = 3;
}

message DeviceLinkError {
  DeviceLinkErrorCode code = 1;
  // This projection never contains capabilities, identity seeds or tokens.
  DeviceLinkStatus status = 2;
}
