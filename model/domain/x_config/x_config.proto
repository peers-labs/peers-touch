syntax = "proto3";

package peers_touch.model.x_config.v1;

import "domain/peer/access_endpoint.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/xconfig;xconfig";

enum EndpointSeedKind {
  ENDPOINT_SEED_KIND_UNSPECIFIED = 0;
  ENDPOINT_SEED_KIND_RELAY = 1;
  ENDPOINT_SEED_KIND_DIRECT_STATION = 2;
}

enum ClientPlatform {
  CLIENT_PLATFORM_UNSPECIFIED = 0;
  CLIENT_PLATFORM_MACOS = 1;
  CLIENT_PLATFORM_WINDOWS = 2;
  CLIENT_PLATFORM_LINUX = 3;
  CLIENT_PLATFORM_IOS = 4;
  CLIENT_PLATFORM_ANDROID = 5;
}

enum ClientArchitecture {
  CLIENT_ARCHITECTURE_UNSPECIFIED = 0;
  CLIENT_ARCHITECTURE_ARM64 = 1;
  CLIENT_ARCHITECTURE_X86_64 = 2;
  CLIENT_ARCHITECTURE_UNIVERSAL = 3;
}

message EndpointSeed {
  string seed_id = 1;
  EndpointSeedKind kind = 2;
  string display_name = 3;
  peers_touch.model.peer.v1.PublicEndpointConnectionMaterial connection_material = 4;
  repeated string regions = 5;
  peers_touch.model.peer.v1.SignedPublicStationAdvertisement station_advertisement = 6;
  google.protobuf.Timestamp available_from = 7;
  google.protobuf.Timestamp available_until = 8;
}

message ReleaseDescriptor {
  string release_id = 1;
  ClientPlatform platform = 2;
  ClientArchitecture architecture = 3;
  string version = 4;
  string minimum_supported_version = 5;
  string manifest_url = 6;
  bytes manifest_sha256 = 7;
  string release_signing_key_id = 8;
  string release_notes_url = 9;
  google.protobuf.Timestamp published_at = 10;
}

message DirectiveValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    string endpoint_seed_id = 4;
  }
}

message VersionConstraint {
  // Allowed comparators: ">=", "<", "^" (caret, cargo-style floor/ceiling).
  // Multiple constraints on one rule combine with AND.
  string comparator = 1;
  string version = 2;
}

message LabelMatcher {
  string key = 1;
  string value = 2;
}

message TargetClause {
  // Empty repeated fields are wildcards; within a field values combine OR,
  // across fields the clause combines AND.
  repeated string products = 1;                // desktop | mobile | station
  repeated ClientPlatform platforms = 2;
  repeated ClientArchitecture architectures = 3;
  repeated string flavors = 4;
  repeated string channels = 5;
  repeated string environments = 6;            // dev | staging | prod
  repeated string regions = 7;                 // "unknown" matches no region
  repeated VersionConstraint versions = 8;
  repeated LabelMatcher labels = 9;
}

message DirectiveRule {
  string id = 1;
  TargetClause match = 2;
  DirectiveValue value = 3;
  // 0 and 1000 both mean full rollout; 1..999 enables device-id bucketing.
  uint32 rollout_permille = 4;
}

message Directive {
  string key = 1;
  repeated DirectiveRule rules = 2;            // ordered, first match wins
  DirectiveValue fallback = 3;                 // required
}

message XConfigSnapshotStatement {
  uint32 schema_version = 1;
  string channel = 2;
  uint64 sequence = 3;
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated EndpointSeed endpoint_seeds = 6;
  repeated ReleaseDescriptor releases = 7;
  repeated Directive directives = 8;
}

message SignedXConfigSnapshot {
  string signing_key_id = 1;
  bytes statement_bytes = 2;
  bytes ed25519_signature = 3;
}
