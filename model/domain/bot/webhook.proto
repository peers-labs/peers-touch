syntax = "proto3";

package peers_touch.model.bot.v1;

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/bot/model;model";

// Public webhook edge ingestion contract. The on-the-wire body is this
// message encoded as proto-JSON; inter-process/cross-device transport stays
// protobuf. Authenticated by a per-Bot Bearer secret, not a user JWT.

enum BotEventType {
  BOT_EVENT_TYPE_UNSPECIFIED = 0;
  BOT_EVENT_TYPE_TASK_COMPLETED = 1;
  BOT_EVENT_TYPE_WAITING_INPUT = 2;
  BOT_EVENT_TYPE_TASK_FAILED = 3;
  BOT_EVENT_TYPE_IDLE = 4;
  BOT_EVENT_TYPE_CUSTOM = 5;
}

enum BotEventSeverity {
  BOT_EVENT_SEVERITY_UNSPECIFIED = 0;
  BOT_EVENT_SEVERITY_INFO = 1;
  BOT_EVENT_SEVERITY_ATTENTION = 2;
  BOT_EVENT_SEVERITY_ERROR = 3;
}

message WebhookSource {
  string agent = 1;
  string workspace = 2;
  string session_id = 3;
  string action_url = 4;
  map<string, string> labels = 5;
}

message IngestWebhookEventRequest {
  // Schema version, currently "1".
  string schema_version = 1;
  // Required client-generated idempotency key; replays within the 24h window
  // return OUTCOME_DEDUPLICATED and produce exactly one message/notification.
  string request_id = 2;
  BotEventType event_type = 3;
  BotEventSeverity severity = 4;
  string title = 5;
  string body = 6;
  // Fold key: consecutive unread events sharing it collapse into one card.
  string group_key = 7;
  string dedupe_key = 8;
  WebhookSource source = 9;
}

enum IngestOutcome {
  INGEST_OUTCOME_UNSPECIFIED = 0;
  INGEST_OUTCOME_ACCEPTED = 1;
  INGEST_OUTCOME_DEDUPLICATED = 2;
}

message IngestWebhookEventResponse {
  IngestOutcome outcome = 1;
  string event_id = 2;
}

// Source authenticity is reserved, not verified in v1: a future edge may
// require X-PT-Signature: sha256=<hmac> and X-PT-Timestamp headers. Actor and
// recipient in the body are never trusted; attribution derives only from the
// authenticated webhook registry record.
