syntax = "proto3";

package peers_touch.model.federation.v1;

option go_package = "github.com/peers-labs/peers-touch/station/frame/core/plugin/native/federation/locator/pb;pb";

// ActorLocatorRecord is the on-the-wire shape of a signed locator pointer
// stored in the libp2p DHT under "/pst-actor/<federated_handle>".
//
// Receivers do NOT trust the record fields directly. They:
//   1. Verify `signature` against `signing_key_pem` using the canonical
//      serialisation (deterministic field ordering — see
//      apps/station/frame/core/plugin/native/federation/locator/record.go).
//   2. TOFU pin (federated_handle, signing_key_pem) on first sight.
//      A subsequent record claiming the same handle with a different key
//      MUST be rejected unless the new record carries a valid signature
//      from the *previously pinned* key (key-rotation / handover envelope —
//      not in scope for the initial drop).
//   3. Use `seq` to dedupe: lower-or-equal `seq` is dropped.
//
// The record body intentionally carries NO profile data. It is a *pointer*:
// "to talk to @alice@station-1.example, dial the home station whose libp2p
// PeerID is X and whose HTTP origin is Y, then GET /api/v1/federation/
// resolve?handle=...". Profile retrieval lives in the resolver layer.
message ActorLocatorRecord {
  // Canonical federated handle, e.g. "@alice@station-1.example". Always
  // lower-cased on the publish path so DHT keys are byte-stable.
  string federated_handle = 1 [json_name = "federated_handle"];

  // Authoritative home station — the only station that may legitimately
  // sign this handle. Cross-checked against signing_key_pem during TOFU.
  string home_station_peer_id = 2 [json_name = "home_station_peer_id"];

  // Stable HTTP origin of the home station, no scheme. Receivers MUST NOT
  // dial this directly across the federation; instead it is fed through
  // `/relay/forward/{home_station_peer_id}/...` so NAT-bound stations
  // remain reachable.
  string home_station_domain = 3 [json_name = "home_station_domain"];

  // Optional list of relay-mount labels through which this actor's home
  // station is reachable today. Pure hint — the resolver still authoritatively
  // looks up the live mount table from the relay before forwarding.
  repeated string inbox_relay_mounts = 4 [json_name = "inbox_relay_mounts"];

  // Tombstone flag. When true, the record is a withdrawal: receivers MUST
  // overwrite any cached entry for this handle and refuse to surface the
  // actor across the federation. Tombstones are signed exactly like live
  // records and persist in the DHT until expiry.
  bool tombstone = 5;

  // Monotonic per-handle counter. Higher seq beats lower seq; equal-seq
  // races are broken by `updated_at_unix_ms` and finally by lexicographic
  // signature compare. Seq is reset only via the (out-of-scope) handover
  // envelope — never decreased by routine updates.
  uint64 seq = 6;

  // Wall-clock the publisher minted the record. Receivers may reject
  // records older than a configurable freshness window; a record older
  // than ~24h is treated as stale and re-fetched.
  int64 updated_at_unix_ms = 7 [json_name = "updated_at_unix_ms"];

  // Detached Ed25519 signature over the canonical serialisation of every
  // OTHER field in this message (i.e. all fields except `signature`).
  bytes signature = 8;

  // PEM-encoded Ed25519 public key matching `home_station_peer_id`'s
  // station-signing key (NOT the libp2p host key — the federation key
  // managed by frame/core/auth/federation). Embedded so first-time
  // receivers can verify on TOFU without a side-channel JWKS fetch.
  string signing_key_pem = 9 [json_name = "signing_key_pem"];

  // SHA-256 / base32-nopad fingerprint of `signing_key_pem`. Receivers
  // recompute this and compare; mismatch is a tampered record.
  string signing_key_kid = 10 [json_name = "signing_key_kid"];
}
