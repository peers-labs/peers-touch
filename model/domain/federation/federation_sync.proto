syntax = "proto3";

package peers_touch.model.federation.v1;

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/federation/pb;federationpb";

// ═══════════════════════════════════════════════════════════════════════════════
// Federation Sync — Types for ledger replication between Stations.
// Source of truth: docs/architecture/federation/wire-protocol.md §7
// ═══════════════════════════════════════════════════════════════════════════════

import "domain/federation/federation_ledger.proto";

// LedgerEventDelivered is pushed via SSE (StreamEvent oneof arm 24).
// Member Stations receive this from the sequencer's events endpoint.
message LedgerEventDelivered {
  string    federation_id = 1;
  uint64    seq = 2;
  bytes     event_hash = 3;
  EventType event_type = 4;
  bytes     payload_bytes = 5;
  bytes     actor_signature = 6;
  bytes     station_signature = 7;
  bytes     sequencer_signature = 8;
  string    actor_federated_handle = 9;
  string    station_peer_id = 10;
  int64     created_at_unix_ms = 11;
}

// SyncCursor tracks a member Station's replication progress with a remote.
message SyncCursor {
  string federation_id = 1;
  string remote_station_peer_id = 2;
  bytes  last_seen_head_hash = 3;
  uint64 last_seen_head_seq = 4;
  uint64 last_applied_seq = 5;
  int64  last_sync_at_unix_ms = 6;
  SyncStatus status = 7;
  int32  error_code = 8;
  string error_message = 9;
}

enum SyncStatus {
  SYNC_STATUS_UNSPECIFIED = 0;
  SYNC_HEALTHY = 1;
  SYNC_LAGGING = 2;
  SYNC_FORK_DETECTED = 3;
  SYNC_REMOTE_UNREACHABLE = 4;
  SYNC_POLICY_REJECTED = 5;
}
