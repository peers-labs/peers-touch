syntax = "proto3";

package peers_touch.model.peer.v1;

option go_package = "github.com/peers-labs/peers-touch/station/frame/touch/model/peer;peer";

// StationIdentityRequest is sent before authentication. Challenge must contain
// exactly 32 cryptographically random bytes.
message StationIdentityRequest {
  bytes challenge = 1;
}

// StationCapabilitySet is sorted by UTF-8 bytes before deterministic
// serialization and hashing.
message StationCapabilitySet {
  repeated string capabilities = 1;
}

// StationNodeAuthorizationStatement delegates one logical Station root to one
// independently keyed physical node.
message StationNodeAuthorizationStatement {
  string station_peer_id = 1;
  string node_peer_id = 2;
  bytes node_public_key = 3;
  uint64 authorization_epoch = 4;
  bytes capabilities_digest = 5;
  int64 issued_at_unix_ms = 6;
  int64 expires_at_unix_ms = 7;
}

message StationNodeAuthorization {
  bytes statement_bytes = 1;
  bytes station_root_public_key = 2;
  bytes root_signature = 3;
}

// StationIdentityStatement is the deterministic challenge-bound payload signed
// by the authorized node key. Capabilities are sorted by UTF-8 bytes.
message StationIdentityStatement {
  bytes challenge = 1;
  string station_peer_id = 2;
  string canonical_origin = 3;
  repeated string capabilities = 4;
  int64 issued_at_unix_ms = 5;
  int64 expires_at_unix_ms = 6;
  bytes node_authorization_digest = 7;
}

message StationIdentityResponse {
  bytes statement_bytes = 1;
  bytes node_signature = 2;
  StationNodeAuthorization node_authorization = 3;
}
