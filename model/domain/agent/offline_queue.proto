syntax = "proto3";

package peers_touch.model.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/agent/model;model";

enum OfflineOpStatus {
  OFFLINE_OP_STATUS_UNSPECIFIED = 0;
  OFFLINE_OP_STATUS_PENDING = 1;
  OFFLINE_OP_STATUS_PROCESSING = 2;
  OFFLINE_OP_STATUS_COMPLETED = 3;
  OFFLINE_OP_STATUS_FAILED = 4;
  OFFLINE_OP_STATUS_CONFLICT = 5;
}

enum OfflineOpType {
  OFFLINE_OP_TYPE_UNSPECIFIED = 0;
  OFFLINE_OP_TYPE_WORKSPACE_FILE_CREATE = 1;
  OFFLINE_OP_TYPE_WORKSPACE_FILE_UPDATE = 2;
  OFFLINE_OP_TYPE_WORKSPACE_FILE_DELETE = 3;
  OFFLINE_OP_TYPE_MEMORY_CREATE = 4;
  OFFLINE_OP_TYPE_MEMORY_UPDATE = 5;
  OFFLINE_OP_TYPE_MEMORY_DELETE = 6;
  OFFLINE_OP_TYPE_AGENT_CONFIG_UPDATE = 7;
}

message OfflineOperation {
  string id = 1;
  string agent_id = 2;
  string device_id = 3;
  OfflineOpType op_type = 4;
  OfflineOpStatus status = 5;
  string payload = 6;
  string client_request_id = 7;
  int32 retry_count = 8;
  string error_message = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp processed_at = 12;
}

message EnqueueOfflineOpsRequest {
  string agent_id = 1;
  string device_id = 2;
  repeated OfflineOperation ops = 3;
}

message EnqueueOfflineOpsResponse {
  int32 enqueued_count = 1;
  repeated string op_ids = 2;
}

message ListPendingOfflineOpsRequest {
  string agent_id = 1;
  string device_id = 2;
  int32 limit = 3;
}

message ListPendingOfflineOpsResponse {
  repeated OfflineOperation ops = 1;
  int32 total = 2;
}

message GetOfflineOpRequest {
  string id = 1;
}

message GetOfflineOpResponse {
  OfflineOperation op = 1;
}

message AckOfflineOpRequest {
  string id = 1;
  bool success = 2;
  string error_message = 3;
}

message AckOfflineOpResponse {
  bool success = 1;
}

message SyncOfflineOpsRequest {
  string agent_id = 1;
  string device_id = 2;
  string last_sync_at = 3;
}

message SyncOfflineOpsResponse {
  repeated OfflineOperation pending_ops = 1;
  repeated OfflineOperation completed_ops = 2;
  string sync_cursor = 3;
}

message ResolveConflictRequest {
  string op_id = 1;
  string resolution = 2;
  string resolved_payload = 3;
}

message ResolveConflictResponse {
  bool success = 1;
  OfflineOperation op = 2;
}
