syntax = "proto3";

package peers_touch.model.agent.v1;

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/agent/model;model";

import "domain/agent/agent.proto";
import "domain/actor/actor.proto";
import "google/protobuf/timestamp.proto";

enum TurnStreamEventType {
  TURN_STREAM_EVENT_TYPE_UNSPECIFIED = 0;
  TURN_STREAM_EVENT_TYPE_TEXT = 1;
  TURN_STREAM_EVENT_TYPE_THINKING = 2;
  TURN_STREAM_EVENT_TYPE_TOOL_CALL = 3;
  TURN_STREAM_EVENT_TYPE_TOOL_RESULT = 4;
  TURN_STREAM_EVENT_TYPE_LOCAL_TOOL_REQUEST = 5;
  TURN_STREAM_EVENT_TYPE_TOOL_APPROVAL_REQUIRED = 6;
  TURN_STREAM_EVENT_TYPE_TOOL_APPROVAL_DECISION = 7;
  TURN_STREAM_EVENT_TYPE_PROGRESS = 8;
  TURN_STREAM_EVENT_TYPE_IMAGE = 9;
  TURN_STREAM_EVENT_TYPE_CONVERSATION_CREATED = 10;
  TURN_STREAM_EVENT_TYPE_ERROR = 11;
  TURN_STREAM_EVENT_TYPE_DONE = 12;
}

message TurnStreamEvent {
  TurnStreamEventType type = 1;
  string turn_id = 2;
  string conversation_id = 3;
  string agent_id = 4;
  uint64 sequence = 5;
  string event_id = 6;
  google.protobuf.Timestamp occurred_at = 7;

  oneof payload {
    TextPayload text = 10;
    ThinkingPayload thinking = 11;
    ToolCallPayload tool_call = 12;
    ToolResultPayload tool_result = 13;
    ToolApprovalRequiredPayload tool_approval_required = 14;
    ProgressPayload progress = 15;
    ImagePayload image = 16;
    ConversationCreatedPayload conversation_created = 17;
    ErrorPayload error = 18;
    DonePayload done = 19;
    ToolApprovalDecisionPayload tool_approval_decision = 20;
  }
}

message TextPayload {
  string text = 1;
}

message ThinkingPayload {
  string text = 1;
  bool done = 2;
}

message ToolCallPayload {
  string tool_call_id = 1;
  string name = 2;
  string arguments = 3;
}

message ToolResultPayload {
  string tool_call_id = 1;
  string result = 2;
}

message ToolApprovalRequiredPayload {
  string approval_id = 1;
  string tool_name = 2;
  string server_name = 3;
  string arguments = 4;
  string source = 5;
  string tool_call_id = 6;
  string decision_id = 7;
  uint64 decision_revision = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message ToolApprovalDecisionPayload {
  string approval_id = 1;
  string tool_call_id = 2;
  string decision_id = 3;
  uint64 decision_revision = 4;
  bool approved = 5;
  peers_touch.model.actor.v1.ActorRef actor_ref = 6;
  google.protobuf.Timestamp decided_at = 7;
  string idempotency_key = 8;
}

message ProgressPayload {
  string stage = 1;
}

message ImagePayload {
  string url = 1;
}

message ConversationCreatedPayload {
  string conversation_id = 1;
}

message ErrorPayload {
  string error = 1;
  string error_type = 2;
}

message DonePayload {
  string task_id = 1;
  TurnSummary turn_summary = 2;
  repeated string follow_up_suggestions = 3;
}

message TurnSummary {
  string turn_id = 1;
  string conversation_id = 2;
  string agent_id = 3;
  string user_input = 4;
  string final_response = 5;
  TurnStatus status = 6;
}
