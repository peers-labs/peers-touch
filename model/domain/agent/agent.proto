syntax = "proto3";

package peers_touch.model.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/agent/model;model";

enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_RUNNING = 1;
  TURN_STATUS_COMPLETED = 2;
  TURN_STATUS_FAILED = 3;
  TURN_STATUS_INTERRUPTED = 4;
  TURN_STATUS_CANCELLED = 5;
}

message Turn {
  string turn_id = 1;
  string conversation_id = 2;
  string agent_id = 3;
  string user_input = 4;
  string final_response = 5;
  int32 tool_iterations = 6;
  TurnStatus status = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
}

message ToolCallRecord {
  string tool_name = 1;
  string arguments = 2;
  string result = 3;
  int64 duration_ms = 4;
}

message ProviderCallRecord {
  string provider = 1;
  string model = 2;
  int32 input_tokens = 3;
  int32 output_tokens = 4;
  int64 latency_ms = 5;
  bool cache_hit = 6;
  string credential_id = 7;
}

message TurnTrace {
  string trace_id = 1;
  string turn_id = 2;
  string system_prompt_hash = 3;
  string memory_snapshot_hash = 4;
  string skill_index_hash = 5;
  repeated string skills_loaded = 6;
  repeated ToolCallRecord tool_calls = 7;
  repeated ProviderCallRecord provider_calls = 8;
  bool review_triggered = 9;
  repeated ClassifiedErrorEvent errors_classified = 10;
  CompressionEvent compression_event = 11;
  repeated DelegationResult delegation_results = 12;
  repeated KnowledgeChunkReference knowledge_chunks = 13;
}

enum FailoverReason {
  FAILOVER_REASON_UNSPECIFIED = 0;
  FAILOVER_REASON_AUTH = 1;
  FAILOVER_REASON_AUTH_PERMANENT = 2;
  FAILOVER_REASON_BILLING = 3;
  FAILOVER_REASON_RATE_LIMIT = 4;
  FAILOVER_REASON_OVERLOADED = 5;
  FAILOVER_REASON_SERVER_ERROR = 6;
  FAILOVER_REASON_TIMEOUT = 7;
  FAILOVER_REASON_CONTEXT_OVERFLOW = 8;
  FAILOVER_REASON_PAYLOAD_TOO_LARGE = 9;
  FAILOVER_REASON_MODEL_NOT_FOUND = 10;
  FAILOVER_REASON_FORMAT_ERROR = 11;
  FAILOVER_REASON_THINKING_SIGNATURE = 12;
  FAILOVER_REASON_LONG_CONTEXT_TIER = 13;
  FAILOVER_REASON_UNKNOWN = 14;
}

message ClassifiedErrorEvent {
  FailoverReason reason = 1;
  bool retryable = 2;
  bool should_compress = 3;
  bool should_rotate_credential = 4;
  bool should_fallback = 5;
  string provider = 6;
  string model = 7;
  int32 http_status = 8;
  string error_code = 9;
  string error_message = 10;
  google.protobuf.Timestamp classified_at = 11;
}

message CompressionEvent {
  bool triggered = 1;
  int32 tokens_before = 2;
  int32 tokens_after = 3;
  string new_conversation_id = 4;
}

enum DelegationStatus {
  DELEGATION_STATUS_UNSPECIFIED = 0;
  DELEGATION_STATUS_COMPLETED = 1;
  DELEGATION_STATUS_FAILED = 2;
  DELEGATION_STATUS_TIMEOUT = 3;
}

message DelegationResult {
  string task_id = 1;
  string parent_turn_id = 2;
  string task_description = 3;
  repeated string child_toolset = 4;
  DelegationStatus status = 5;
  string result_summary = 6;
  int32 tool_iterations = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
}

message Conversation {
  string conversation_id = 1;
  string agent_id = 2;
  reserved 3;
  reserved "user_id";
  string title = 4;
  string description = 5;
  string provider_id = 6;
  string model_name = 7;
  string status = 8;
  string parent_id = 9;
  string config_json = 10;
  map<string, string> meta = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string ptid = 14;
  string active_branch_message_id = 15;
  ConversationRuntimeBinding runtime_binding = 16;
  uint32 queued_turn_count = 17;
  uint64 version = 18;
}

// AgentThread is a durable sub-conversation forked from a source message
// inside a conversation. Messages with a matching thread_id belong to it.
message AgentThread {
  string thread_id = 1;
  string conversation_id = 2;
  // The message this thread was forked from.
  string source_message_id = 3;
  string title = 4;
  // Monotonic sequence of the source message's position, for ordering.
  int64 source_seq = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateThreadRequest {
  string conversation_id = 1;
  string source_message_id = 2;
  string title = 3;
}

message CreateThreadResponse {
  AgentThread thread = 1;
}

message ListThreadsRequest {
  string conversation_id = 1;
}

message ListThreadsResponse {
  repeated AgentThread threads = 1;
}

message ListThreadMessagesRequest {
  string thread_id = 1;
  int64 after_seq = 2;
}

message ListThreadMessagesResponse {
  repeated AgentMessage messages = 1;
}

enum AgentVisibility {
  AGENT_VISIBILITY_UNSPECIFIED = 0;
  AGENT_VISIBILITY_PRIVATE = 1;
  AGENT_VISIBILITY_WORKSPACE = 2;
}

message Agent {
  string agent_id = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string provider_id = 5;
  string model_name = 6;
  string effort = 7;
  AgentVisibility visibility = 8;
  string owner_actor_id = 9;
  string config_json = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  int64 version = 13;
}

message ListAgentsRequest {
  AgentVisibility visibility = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  int32 total = 2;
}

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  Agent agent = 1;
}

message CreateAgentRequest {
  string name = 1;
  string title = 2;
  string description = 3;
  string provider_id = 4;
  string model_name = 5;
  string effort = 6;
  AgentVisibility visibility = 7;
  string config_json = 8;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message UpdateAgentRequest {
  string agent_id = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string provider_id = 5;
  string model_name = 6;
  string effort = 7;
  AgentVisibility visibility = 8;
  string config_json = 9;
  int64 version = 10;
}

message UpdateAgentResponse {
  Agent agent = 1;
}

message DeleteAgentRequest {
  string agent_id = 1;
}

message DeleteAgentResponse {
  bool success = 1;
}

enum KnowledgeResourceType {
  KNOWLEDGE_RESOURCE_TYPE_UNSPECIFIED = 0;
  KNOWLEDGE_RESOURCE_TYPE_DOCUMENT = 1;
  KNOWLEDGE_RESOURCE_TYPE_FOLDER = 2;
  KNOWLEDGE_RESOURCE_TYPE_PROJECT = 3;
  KNOWLEDGE_RESOURCE_TYPE_URL = 4;
  KNOWLEDGE_RESOURCE_TYPE_NOTEBOOK = 5;
  KNOWLEDGE_RESOURCE_TYPE_WORKSPACE = 6;
}

enum KnowledgeResourcePolicy {
  KNOWLEDGE_RESOURCE_POLICY_UNSPECIFIED = 0;
  KNOWLEDGE_RESOURCE_POLICY_MANUAL = 1;
  KNOWLEDGE_RESOURCE_POLICY_AUTO = 2;
  KNOWLEDGE_RESOURCE_POLICY_ALWAYS = 3;
  KNOWLEDGE_RESOURCE_POLICY_DISABLED = 4;
}

enum KnowledgeResourceStatus {
  KNOWLEDGE_RESOURCE_STATUS_UNSPECIFIED = 0;
  KNOWLEDGE_RESOURCE_STATUS_BOUND = 1;
  KNOWLEDGE_RESOURCE_STATUS_PENDING_INDEX = 2;
  KNOWLEDGE_RESOURCE_STATUS_INDEXED = 3;
  KNOWLEDGE_RESOURCE_STATUS_ERROR = 4;
}

message KnowledgeResource {
  string resource_id = 1;
  string agent_id = 2;
  KnowledgeResourceType type = 3;
  string title = 4;
  string source = 5;
  KnowledgeResourcePolicy policy = 6;
  KnowledgeResourceStatus status = 7;
  string last_indexed_at = 8;
  string error = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message KnowledgeChunkReference {
  string chunk_id = 1;
  string resource_id = 2;
  string resource_title = 3;
  string source = 4;
  int32 chunk_index = 5;
  double score = 6;
  string content_preview = 7;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_SYSTEM = 1;
  MESSAGE_ROLE_USER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
  MESSAGE_ROLE_TOOL = 4;
}

message AgentMessage {
  string message_id = 1;
  string conversation_id = 2;
  string turn_id = 3;
  string model_name = 4;
  MessageRole role = 5;
  string content = 6;
  string reasoning_json = 7;
  string tool_calls_json = 8;
  string metadata_json = 9;
  string error_json = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Lineage: branch_id groups messages in a regenerate/edit branch.
  // replaces_message_id points to the message this one replaces (sibling branch).
  optional string branch_id = 13;
  optional string replaces_message_id = 14;
  // Monotonic sequence within a conversation for cursor replay.
  int64 seq = 15;
  // thread_id assigns this message to a durable sub-conversation (Thread)
  // forked from a source message. Empty = main conversation timeline.
  optional string thread_id = 16;
  AgentMessageStatus message_status = 17;
  string parent_message_id = 18;
  repeated AgentAttachmentRef attachments = 19;
  optional google.protobuf.Timestamp tombstoned_at = 20;
  optional string tombstoned_by_ptid = 21;
  optional string tombstone_reason = 22;
}

message ExecuteTurnRequest {
  // Fields 9, 10, 15, 16, 17 reserved (removed in C10 portability cleanup).
  reserved 9, 10, 15, 16, 17;

  string conversation_id = 1;
  string agent_id = 2;
  string user_input = 3;
  bool stream = 4;
  // JSON field names `model` / `provider` match desktop and HTTP clients (not model_override).
  optional string model = 5;
  optional string provider = 6;
  optional string identity = 7;
  optional string agent_config_prompt = 8;
  optional int32 context_window_size = 11;
  optional int32 max_retries = 12;
  repeated KnowledgeResource knowledge_resources = 13;
  // Reasoning effort level: "low" | "medium" | "high".
  // Passed through to LLM providers as reasoning_effort where supported.
  optional string effort = 14;
  optional bool memory_disabled = 18;
  // thread_id routes this turn into a durable Thread (sub-conversation).
  // Empty = main conversation timeline.
  optional string thread_id = 19;
  // Station validates and pins this lease before admitting device-local work.
  optional string client_capability_session_id = 20;
  string client_idempotency_key = 21;
}

message ExecuteTurnResponse {
  Turn turn = 1;
  TurnTrace trace = 2;
  AgentMessage response_message = 3;
  // task_id is the Station-owned Chat root task that hosts this turn so the
  // client can subscribe to the durable event outbox by cursor.
  string task_id = 4;
  TurnAdmission admission = 5;
}

message TurnTraceEntry {
  Turn turn = 1;
  TurnTrace trace = 2;
}

message ListTurnTracesRequest {
  string agent_id = 1;
  string conversation_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListTurnTracesResponse {
  repeated TurnTraceEntry entries = 1;
  int32 total = 2;
}

message GetTurnTraceRequest {
  string trace_id = 1;
  string turn_id = 2;
}

message GetTurnTraceResponse {
  TurnTraceEntry entry = 1;
}

// ============================================================================
// Client Capability Session (D13 — platform-neutral opaque resource refs)
// ============================================================================

message ClientCapabilitySession {
  // Fields 2 and 3 reserved (removed legacy untyped platform/capabilities).
  reserved 2, 3;

  string session_id = 1;
  string client_version = 4;
  string ptid = 5;
  string device_id = 6;
  ClientPlatform platform_kind = 7;
  repeated ClientCapability typed_capabilities = 8;
  google.protobuf.Timestamp expires_at = 9;
  string connection_id = 10;
}

message ListClientCapabilitySessionsRequest {}

message ListClientCapabilitySessionsResponse {
  repeated ClientCapabilitySession sessions = 1;
}

// ============================================================================
// Conversation CRUD API
// ============================================================================

enum ConversationStatus {
  CONVERSATION_STATUS_UNSPECIFIED = 0;
  CONVERSATION_STATUS_ACTIVE = 1;
  CONVERSATION_STATUS_ARCHIVED = 2;
  CONVERSATION_STATUS_COMPRESSED = 3;
  CONVERSATION_STATUS_DELETED = 4;
}

message ListConversationsRequest {
  string agent_id = 1;
  ConversationStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  int32 total = 2;
  bool has_more = 3;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message CreateConversationRequest {
  string agent_id = 1;
  string title = 2;
  optional string description = 3;
  optional string model_name = 4;
  optional string provider_id = 5;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message UpdateConversationRequest {
  string conversation_id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string model_name = 4;
  map<string, string> meta = 5;
  uint64 expected_version = 6;
  optional string active_branch_message_id = 7;
}

message UpdateConversationResponse {
  Conversation conversation = 1;
}

message ArchiveConversationRequest {
  string conversation_id = 1;
  bool permanent = 2;
  uint64 expected_version = 3;
}

message ArchiveConversationResponse {
  bool success = 1;
}

// ============================================================================
// Message listing + event streaming (cursor replay)
// ============================================================================

message ListMessagesRequest {
  string conversation_id = 1;
  optional int64 after_seq = 2;
  optional int64 before_seq = 3;
  int32 limit = 4;
  bool include_turn_events = 5;
}

message ListMessagesResponse {
  repeated AgentMessage messages = 1;
  reserved 2;
  reserved "turn_events";
  int64 next_cursor = 3;
  bool has_more = 4;
}

// ============================================================================
// Modern Chat Agent V2 canonical kernel contracts (MCA-C01 through MCA-C10)
// ============================================================================

enum RuntimeKind {
  RUNTIME_KIND_UNSPECIFIED = 0;
  RUNTIME_KIND_DIRECT_MODEL = 1;
  RUNTIME_KIND_EXTERNAL_AGENT = 2;
}

enum AgentTurnStatus {
  AGENT_TURN_STATUS_UNSPECIFIED = 0;
  AGENT_TURN_STATUS_SUBMITTED = 1;
  AGENT_TURN_STATUS_QUEUED = 2;
  AGENT_TURN_STATUS_ADMITTED = 3;
  AGENT_TURN_STATUS_CONTEXT_BUILDING = 4;
  AGENT_TURN_STATUS_RUNNING = 5;
  AGENT_TURN_STATUS_WAITING_APPROVAL = 6;
  AGENT_TURN_STATUS_WAITING_LOCAL_TOOL = 7;
  AGENT_TURN_STATUS_COMPRESSING = 8;
  AGENT_TURN_STATUS_RETRYING = 9;
  AGENT_TURN_STATUS_FALLING_BACK = 10;
  AGENT_TURN_STATUS_COMPLETED = 11;
  AGENT_TURN_STATUS_FAILED = 12;
  AGENT_TURN_STATUS_CANCELLED = 13;
  AGENT_TURN_STATUS_INTERRUPTED = 14;
  AGENT_TURN_STATUS_REJECTED = 15;
}

enum TurnAdmissionStatus {
  TURN_ADMISSION_STATUS_UNSPECIFIED = 0;
  TURN_ADMISSION_STATUS_STARTED = 1;
  TURN_ADMISSION_STATUS_QUEUED = 2;
  TURN_ADMISSION_STATUS_REPLAYED = 3;
}

enum TurnQueueStatus {
  TURN_QUEUE_STATUS_UNSPECIFIED = 0;
  TURN_QUEUE_STATUS_PENDING = 1;
  TURN_QUEUE_STATUS_ADMITTED = 2;
  TURN_QUEUE_STATUS_CANCELLED = 3;
}

enum AgentMessageStatus {
  AGENT_MESSAGE_STATUS_UNSPECIFIED = 0;
  AGENT_MESSAGE_STATUS_PENDING = 1;
  AGENT_MESSAGE_STATUS_STREAMING = 2;
  AGENT_MESSAGE_STATUS_COMPLETED = 3;
  AGENT_MESSAGE_STATUS_PARTIAL = 4;
  AGENT_MESSAGE_STATUS_FAILED = 5;
  AGENT_MESSAGE_STATUS_CANCELLED = 6;
}

enum RuntimeCapabilityResolution {
  RUNTIME_CAPABILITY_RESOLUTION_UNSPECIFIED = 0;
  RUNTIME_CAPABILITY_RESOLUTION_NATIVE = 1;
  RUNTIME_CAPABILITY_RESOLUTION_BRIDGED = 2;
  RUNTIME_CAPABILITY_RESOLUTION_DEGRADED = 3;
  RUNTIME_CAPABILITY_RESOLUTION_REJECTED = 4;
}

enum ContextSegmentType {
  CONTEXT_SEGMENT_TYPE_UNSPECIFIED = 0;
  CONTEXT_SEGMENT_TYPE_IDENTITY = 1;
  CONTEXT_SEGMENT_TYPE_POLICY = 2;
  CONTEXT_SEGMENT_TYPE_MODEL_FACTS = 3;
  CONTEXT_SEGMENT_TYPE_MEMORY = 4;
  CONTEXT_SEGMENT_TYPE_SKILL_INDEX = 5;
  CONTEXT_SEGMENT_TYPE_SKILL_BODY = 6;
  CONTEXT_SEGMENT_TYPE_HISTORY = 7;
  CONTEXT_SEGMENT_TYPE_SUMMARY = 8;
  CONTEXT_SEGMENT_TYPE_KNOWLEDGE = 9;
  CONTEXT_SEGMENT_TYPE_WORKSPACE_REFERENCE = 10;
  CONTEXT_SEGMENT_TYPE_ATTACHMENT = 11;
  CONTEXT_SEGMENT_TYPE_TOOL_SCHEMA = 12;
  CONTEXT_SEGMENT_TYPE_CURRENT_INPUT = 13;
}

enum ContextSegmentDecision {
  CONTEXT_SEGMENT_DECISION_UNSPECIFIED = 0;
  CONTEXT_SEGMENT_DECISION_INCLUDED = 1;
  CONTEXT_SEGMENT_DECISION_TRUNCATED = 2;
  CONTEXT_SEGMENT_DECISION_SUMMARIZED = 3;
  CONTEXT_SEGMENT_DECISION_REJECTED = 4;
}

enum ToolExecutionOwner {
  TOOL_EXECUTION_OWNER_UNSPECIFIED = 0;
  TOOL_EXECUTION_OWNER_STATION = 1;
  TOOL_EXECUTION_OWNER_CLIENT_CAPABILITY = 2;
}

enum ToolCallStatus {
  TOOL_CALL_STATUS_UNSPECIFIED = 0;
  TOOL_CALL_STATUS_PROPOSED = 1;
  TOOL_CALL_STATUS_WAITING_APPROVAL = 2;
  TOOL_CALL_STATUS_APPROVED = 3;
  TOOL_CALL_STATUS_DENIED = 4;
  TOOL_CALL_STATUS_CLAIMED = 5;
  TOOL_CALL_STATUS_RUNNING = 6;
  TOOL_CALL_STATUS_SUCCEEDED = 7;
  TOOL_CALL_STATUS_FAILED = 8;
  TOOL_CALL_STATUS_CANCELLED = 9;
  TOOL_CALL_STATUS_EXPIRED = 10;
  TOOL_CALL_STATUS_UNKNOWN_SIDE_EFFECT = 11;
}

enum ClientPlatform {
  CLIENT_PLATFORM_UNSPECIFIED = 0;
  CLIENT_PLATFORM_DESKTOP = 1;
  CLIENT_PLATFORM_BROWSER = 2;
  CLIENT_PLATFORM_MOBILE = 3;
}

enum CapabilityPermissionState {
  CAPABILITY_PERMISSION_STATE_UNSPECIFIED = 0;
  CAPABILITY_PERMISSION_STATE_GRANTED = 1;
  CAPABILITY_PERMISSION_STATE_DENIED = 2;
  CAPABILITY_PERMISSION_STATE_PROMPT = 3;
  CAPABILITY_PERMISSION_STATE_UNAVAILABLE = 4;
}

message AgentDefinition {
  string agent_id = 1;
  string ptid = 2;
  string name = 3;
  string description = 4;
  string avatar_ref = 5;
  string identity_prompt = 6;
  string agent_config_prompt = 7;
  string default_runtime_ref = 8;
  string memory_policy = 9;
  RuntimeBudget runtime_budget_policy = 10;
  uint64 version = 11;
}

message ConversationRuntimeBinding {
  RuntimeKind runtime_kind = 1;
  string provider_id = 2;
  string model_id = 3;
  string runtime_profile_id = 4;
  string external_session_id = 5;
  uint64 external_session_epoch = 6;
  string runtime_home_ref = 7;
  string capability_snapshot_hash = 8;
  string config_snapshot_hash = 9;
  google.protobuf.Timestamp bound_at = 10;
}

message RuntimeCapability {
  string capability_id = 1;
  RuntimeCapabilityResolution resolution = 2;
  string reason_code = 3;
}

message RuntimeInputCapabilities {
  bool text = 1;
  bool image = 2;
  bool file = 3;
  bool audio = 4;
}

message RuntimeOutputCapabilities {
  bool text = 1;
  bool image = 2;
  bool structured = 3;
}

message RuntimeExecutionCapabilities {
  bool streaming = 1;
  bool reasoning = 2;
  bool prompt_cache = 3;
  bool external_resume = 4;
}

message RuntimeAgenticCapabilities {
  bool native_tools = 1;
  bool parallel_tools = 2;
  bool local_bridge = 3;
}

message RuntimeCapabilityLimits {
  uint64 context_tokens = 1;
  uint64 output_tokens = 2;
  uint32 attachment_count = 3;
  uint64 attachment_bytes = 4;
}

message RuntimeCapabilityProvenance {
  string discovery_source = 1;
  string source_version = 2;
  google.protobuf.Timestamp observed_at = 3;
}

message RuntimeCapabilitySnapshot {
  string snapshot_id = 1;
  RuntimeInputCapabilities input = 2;
  RuntimeOutputCapabilities output = 3;
  RuntimeExecutionCapabilities runtime = 4;
  RuntimeAgenticCapabilities agentic = 5;
  RuntimeCapabilityLimits limits = 6;
  repeated RuntimeCapability resolution = 7;
  RuntimeCapabilityProvenance provenance = 8;
}

message RuntimeSnapshot {
  RuntimeKind runtime_kind = 1;
  string provider_id = 2;
  string model_id = 3;
  string runtime_profile_id = 4;
  RuntimeCapabilitySnapshot capabilities = 5;
  string provider_config_version = 6;
  string agent_config_version = 7;
  string external_session_id = 8;
  uint64 external_session_epoch = 9;
}

message RuntimeBudget {
  uint32 max_attempts = 1;
  uint32 max_agent_steps = 2;
  uint32 max_tool_calls = 3;
  uint32 max_identical_tool_calls = 4;
  uint32 max_delegation_depth = 5;
  uint64 wall_time_ms = 6;
  uint64 max_input_tokens = 7;
  uint64 max_output_tokens = 8;
  uint64 max_attachment_bytes = 9;
  optional double max_cost = 10;
}

message AgentAttachmentRef {
  string attachment_id = 1;
  string object_ref = 2;
  string mime_type = 3;
  uint64 size_bytes = 4;
  string checksum = 5;
  string filename = 6;
  string authorization_scope = 7;
  google.protobuf.Timestamp expires_at = 8;
  string extracted_content_ref = 9;
}

message CanonicalAgentMessage {
  string message_id = 1;
  string conversation_id = 2;
  string turn_id = 3;
  MessageRole role = 4;
  AgentMessageStatus status = 5;
  string content = 6;
  string parent_message_id = 7;
  string replaces_message_id = 8;
  repeated AgentAttachmentRef attachments = 9;
  google.protobuf.Timestamp created_at = 10;
}

message AgentTurn {
  string turn_id = 1;
  string conversation_id = 2;
  string ptid = 3;
  string agent_id = 4;
  string client_idempotency_key = 5;
  AgentTurnStatus status = 6;
  string user_message_id = 7;
  string assistant_message_id = 8;
  uint32 active_attempt = 9;
  RuntimeSnapshot runtime_snapshot = 10;
  RuntimeBudget budget = 11;
  string terminal_reason = 12;
  google.protobuf.Timestamp submitted_at = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp ended_at = 15;
}

message TurnQueueEntry {
  string queue_entry_id = 1;
  string conversation_id = 2;
  string agent_id = 3;
  string client_idempotency_key = 4;
  TurnQueueStatus status = 5;
  uint64 queue_sequence = 6;
  uint32 queue_position = 7;
  string admitted_turn_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string user_input = 11;
}

message TurnAdmission {
  TurnAdmissionStatus status = 1;
  string turn_id = 2;
  TurnQueueEntry queue_entry = 3;
  uint32 queue_capacity = 4;
  uint64 conversation_version = 5;
}

message TurnAttempt {
  string attempt_id = 1;
  string turn_id = 2;
  uint32 index = 3;
  RuntimeSnapshot runtime_snapshot = 4;
  string context_ledger_id = 5;
  AgentTurnStatus status = 6;
  string error_code = 7;
  TurnUsage usage = 8;
  string provider_request_ref = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp ended_at = 11;
  string capability_readiness_snapshot_id = 12;
}

message ContextSegment {
  string segment_id = 1;
  ContextSegmentType type = 2;
  repeated string source_refs = 3;
  string content_hash = 4;
  uint64 estimated_tokens = 5;
  ContextSegmentDecision decision = 6;
  string decision_reason = 7;
  string trust_metadata_ref = 8;
}

message ContextLedger {
  string context_ledger_id = 1;
  string turn_id = 2;
  string attempt_id = 3;
  repeated ContextSegment segments = 4;
  uint64 estimated_input_tokens = 5;
  uint64 reserved_output_tokens = 6;
  uint64 model_context_window = 7;
