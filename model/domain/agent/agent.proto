syntax = "proto3";

package peers_touch.model.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/agent/model;model";

enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_RUNNING = 1;
  TURN_STATUS_COMPLETED = 2;
  TURN_STATUS_FAILED = 3;
  TURN_STATUS_INTERRUPTED = 4;
}

message Turn {
  string turn_id = 1;
  string conversation_id = 2;
  string agent_id = 3;
  string user_input = 4;
  string final_response = 5;
  int32 tool_iterations = 6;
  TurnStatus status = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
}

message ToolCallRecord {
  string tool_name = 1;
  string arguments = 2;
  string result = 3;
  int64 duration_ms = 4;
}

message ProviderCallRecord {
  string provider = 1;
  string model = 2;
  int32 input_tokens = 3;
  int32 output_tokens = 4;
  int64 latency_ms = 5;
  bool cache_hit = 6;
  string credential_id = 7;
}

message TurnTrace {
  string trace_id = 1;
  string turn_id = 2;
  string system_prompt_hash = 3;
  string memory_snapshot_hash = 4;
  string skill_index_hash = 5;
  repeated string skills_loaded = 6;
  repeated ToolCallRecord tool_calls = 7;
  repeated ProviderCallRecord provider_calls = 8;
  bool review_triggered = 9;
  repeated ClassifiedErrorEvent errors_classified = 10;
  CompressionEvent compression_event = 11;
  repeated DelegationResult delegation_results = 12;
  repeated KnowledgeChunkReference knowledge_chunks = 13;
}

enum FailoverReason {
  FAILOVER_REASON_UNSPECIFIED = 0;
  FAILOVER_REASON_AUTH = 1;
  FAILOVER_REASON_AUTH_PERMANENT = 2;
  FAILOVER_REASON_BILLING = 3;
  FAILOVER_REASON_RATE_LIMIT = 4;
  FAILOVER_REASON_OVERLOADED = 5;
  FAILOVER_REASON_SERVER_ERROR = 6;
  FAILOVER_REASON_TIMEOUT = 7;
  FAILOVER_REASON_CONTEXT_OVERFLOW = 8;
  FAILOVER_REASON_PAYLOAD_TOO_LARGE = 9;
  FAILOVER_REASON_MODEL_NOT_FOUND = 10;
  FAILOVER_REASON_FORMAT_ERROR = 11;
  FAILOVER_REASON_THINKING_SIGNATURE = 12;
  FAILOVER_REASON_LONG_CONTEXT_TIER = 13;
  FAILOVER_REASON_UNKNOWN = 14;
}

message ClassifiedErrorEvent {
  FailoverReason reason = 1;
  bool retryable = 2;
  bool should_compress = 3;
  bool should_rotate_credential = 4;
  bool should_fallback = 5;
  string provider = 6;
  string model = 7;
  int32 http_status = 8;
  string error_code = 9;
  string error_message = 10;
  google.protobuf.Timestamp classified_at = 11;
}

message CompressionEvent {
  bool triggered = 1;
  int32 tokens_before = 2;
  int32 tokens_after = 3;
  string new_conversation_id = 4;
}

enum DelegationStatus {
  DELEGATION_STATUS_UNSPECIFIED = 0;
  DELEGATION_STATUS_COMPLETED = 1;
  DELEGATION_STATUS_FAILED = 2;
  DELEGATION_STATUS_TIMEOUT = 3;
}

message DelegationResult {
  string task_id = 1;
  string parent_turn_id = 2;
  string task_description = 3;
  repeated string child_toolset = 4;
  DelegationStatus status = 5;
  string result_summary = 6;
  int32 tool_iterations = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
}

message Conversation {
  string conversation_id = 1;
  string agent_id = 2;
  string user_id = 3;
  string title = 4;
  string description = 5;
  string provider_id = 6;
  string model_name = 7;
  string status = 8;
  string parent_id = 9;
  string config_json = 10;
  map<string, string> meta = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

enum AgentVisibility {
  AGENT_VISIBILITY_UNSPECIFIED = 0;
  AGENT_VISIBILITY_PRIVATE = 1;
  AGENT_VISIBILITY_WORKSPACE = 2;
}

message Agent {
  string agent_id = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string provider_id = 5;
  string model_name = 6;
  string effort = 7;
  AgentVisibility visibility = 8;
  string owner_actor_id = 9;
  string config_json = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ListAgentsRequest {
  AgentVisibility visibility = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  int32 total = 2;
}

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  Agent agent = 1;
}

message CreateAgentRequest {
  string name = 1;
  string title = 2;
  string description = 3;
  string provider_id = 4;
  string model_name = 5;
  string effort = 6;
  AgentVisibility visibility = 7;
  string config_json = 8;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message UpdateAgentRequest {
  string agent_id = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string provider_id = 5;
  string model_name = 6;
  string effort = 7;
  AgentVisibility visibility = 8;
  string config_json = 9;
}

message UpdateAgentResponse {
  Agent agent = 1;
}

message DeleteAgentRequest {
  string agent_id = 1;
}

message DeleteAgentResponse {
  bool success = 1;
}

enum KnowledgeResourceType {
  KNOWLEDGE_RESOURCE_TYPE_UNSPECIFIED = 0;
  KNOWLEDGE_RESOURCE_TYPE_DOCUMENT = 1;
  KNOWLEDGE_RESOURCE_TYPE_FOLDER = 2;
  KNOWLEDGE_RESOURCE_TYPE_PROJECT = 3;
  KNOWLEDGE_RESOURCE_TYPE_URL = 4;
  KNOWLEDGE_RESOURCE_TYPE_NOTEBOOK = 5;
  KNOWLEDGE_RESOURCE_TYPE_WORKSPACE = 6;
}

enum KnowledgeResourcePolicy {
  KNOWLEDGE_RESOURCE_POLICY_UNSPECIFIED = 0;
  KNOWLEDGE_RESOURCE_POLICY_MANUAL = 1;
  KNOWLEDGE_RESOURCE_POLICY_AUTO = 2;
  KNOWLEDGE_RESOURCE_POLICY_ALWAYS = 3;
  KNOWLEDGE_RESOURCE_POLICY_DISABLED = 4;
}

enum KnowledgeResourceStatus {
  KNOWLEDGE_RESOURCE_STATUS_UNSPECIFIED = 0;
  KNOWLEDGE_RESOURCE_STATUS_BOUND = 1;
  KNOWLEDGE_RESOURCE_STATUS_PENDING_INDEX = 2;
  KNOWLEDGE_RESOURCE_STATUS_INDEXED = 3;
  KNOWLEDGE_RESOURCE_STATUS_ERROR = 4;
}

message KnowledgeResource {
  string resource_id = 1;
  string agent_id = 2;
  KnowledgeResourceType type = 3;
  string title = 4;
  string source = 5;
  KnowledgeResourcePolicy policy = 6;
  KnowledgeResourceStatus status = 7;
  string last_indexed_at = 8;
  string error = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message KnowledgeChunkReference {
  string chunk_id = 1;
  string resource_id = 2;
  string resource_title = 3;
  string source = 4;
  int32 chunk_index = 5;
  double score = 6;
  string content_preview = 7;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_SYSTEM = 1;
  MESSAGE_ROLE_USER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
  MESSAGE_ROLE_TOOL = 4;
}

message AgentMessage {
  string message_id = 1;
  string conversation_id = 2;
  string turn_id = 3;
  string model_name = 4;
  MessageRole role = 5;
  string content = 6;
  string reasoning_json = 7;
  string tool_calls_json = 8;
  string metadata_json = 9;
  string error_json = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Lineage: branch_id groups messages in a regenerate/edit branch.
  // replaces_message_id points to the message this one replaces (sibling branch).
  optional string branch_id = 13;
  optional string replaces_message_id = 14;
  // Monotonic sequence within a conversation for cursor replay.
  int64 seq = 15;
}

message ExecuteTurnRequest {
  string conversation_id = 1;
  string agent_id = 2;
  string user_input = 3;
  bool stream = 4;
  // JSON field names `model` / `provider` match desktop and HTTP clients (not model_override).
  optional string model = 5;
  optional string provider = 6;
  optional string identity = 7;
  optional string agent_config_prompt = 8;
  optional string platform = 9;
  optional string workspace_root = 10;
  optional int32 context_window_size = 11;
  optional int32 max_retries = 12;
  repeated KnowledgeResource knowledge_resources = 13;
  // Reasoning effort level: "low" | "medium" | "high".
  // Passed through to LLM providers as reasoning_effort where supported.
  optional string effort = 14;
  // CLI execution fields — when cli_command is set, Station executes the CLI
  // binary in an isolated workspace instead of routing to an LLM provider.
  optional string cli_command = 15;
  optional string runtime_backend = 16;
  repeated string allowed_roots = 17;
}

message ExecuteTurnResponse {
  Turn turn = 1;
  TurnTrace trace = 2;
  AgentMessage response_message = 3;
  // task_id is the Station-owned Chat root task that hosts this turn so the
  // client can subscribe to the durable event outbox by cursor.
  string task_id = 4;
}

message TurnTraceEntry {
  Turn turn = 1;
  TurnTrace trace = 2;
}

message ListTurnTracesRequest {
  string agent_id = 1;
  string conversation_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListTurnTracesResponse {
  repeated TurnTraceEntry entries = 1;
  int32 total = 2;
}

message GetTurnTraceRequest {
  string trace_id = 1;
  string turn_id = 2;
}

message GetTurnTraceResponse {
  TurnTraceEntry entry = 1;
}

// ============================================================================
// Client Capability Session (D13 — platform-neutral opaque resource refs)
// ============================================================================

message ClientCapabilitySession {
  string session_id = 1;
  string platform = 2;
  map<string, string> capabilities = 3;
  string client_version = 4;
}

// ============================================================================
// Sequenced Turn Event (for SSE streaming + cursor replay)
// ============================================================================

enum TurnEventType {
  TURN_EVENT_TYPE_UNSPECIFIED = 0;
  TURN_EVENT_TYPE_PROGRESS = 1;
  TURN_EVENT_TYPE_TEXT = 2;
  TURN_EVENT_TYPE_TEXT_DELTA = 3;
  TURN_EVENT_TYPE_TOOL_CALL = 4;
  TURN_EVENT_TYPE_TOOL_RESULT = 5;
  TURN_EVENT_TYPE_LOCAL_TOOL_REQUEST = 6;
  TURN_EVENT_TYPE_TOOL_APPROVAL_REQUIRED = 7;
  TURN_EVENT_TYPE_TOOL_APPROVAL_DECISION = 8;
  TURN_EVENT_TYPE_ERROR = 9;
  TURN_EVENT_TYPE_DONE = 10;
  TURN_EVENT_TYPE_KNOWLEDGE_RETRIEVED = 11;
}

message TurnEvent {
  int64 seq = 1;
  string turn_id = 2;
  string conversation_id = 3;
  string agent_id = 4;
  TurnEventType type = 5;
  string stage = 6;
  string text = 7;
  string tool_call_id = 8;
  string tool_name = 9;
  string arguments = 10;
  string result = 11;
  string source = 12;
  string server_name = 13;
  string error = 14;
  int32 iteration = 15;
  string model = 16;
  google.protobuf.Timestamp created_at = 17;
}

// ============================================================================
// Conversation CRUD API
// ============================================================================

enum ConversationStatus {
  CONVERSATION_STATUS_UNSPECIFIED = 0;
  CONVERSATION_STATUS_ACTIVE = 1;
  CONVERSATION_STATUS_ARCHIVED = 2;
  CONVERSATION_STATUS_COMPRESSED = 3;
  CONVERSATION_STATUS_DELETED = 4;
}

message ListConversationsRequest {
  string agent_id = 1;
  ConversationStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  int32 total = 2;
  bool has_more = 3;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message CreateConversationRequest {
  string agent_id = 1;
  string title = 2;
  optional string description = 3;
  optional string model_name = 4;
  optional string provider_id = 5;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message UpdateConversationRequest {
  string conversation_id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string model_name = 4;
  map<string, string> meta = 5;
}

message UpdateConversationResponse {
  Conversation conversation = 1;
}

message ArchiveConversationRequest {
  string conversation_id = 1;
  bool permanent = 2;
}

message ArchiveConversationResponse {
  bool success = 1;
}

// ============================================================================
// Message listing + event streaming (cursor replay)
// ============================================================================

message ListMessagesRequest {
  string conversation_id = 1;
  optional int64 after_seq = 2;
  optional int64 before_seq = 3;
  int32 limit = 4;
  bool include_turn_events = 5;
}

message ListMessagesResponse {
  repeated AgentMessage messages = 1;
  repeated TurnEvent turn_events = 2;
  int64 next_cursor = 3;
  bool has_more = 4;
}

message StreamConversationEventsRequest {
  string conversation_id = 1;
  optional string active_turn_id = 2;
  int64 after_seq = 3;
}

message StreamConversationEventsResponse {
  TurnEvent event = 1;
}

// ============================================================================
// Local tool result submission (Desktop → Station during streaming)
// ============================================================================

message SubmitLocalToolResultRequest {
  string turn_id = 1;
  string tool_call_id = 2;
  string content = 3;
  bool is_error = 4;
}

message SubmitLocalToolResultResponse {
  bool success = 1;
}

// ============================================================================
// Scheduler API
// ============================================================================

message SchedulerStartRequest {
  string agent_id = 1;
  int32 review_interval_minutes = 2;
  int32 dogfood_interval_minutes = 3;
}

message SchedulerStartResponse {
  bool ok = 1;
  string message = 2;
}

message SchedulerStopRequest {}

message SchedulerStopResponse {
  bool ok = 1;
  string message = 2;
}

message SchedulerStatusRequest {}

message SchedulerStatusResponse {
  bool running = 1;
  string agent_id = 2;
  int32 review_interval_minutes = 3;
  int32 dogfood_interval_minutes = 4;
  int32 active_jobs = 5;
}

message SchedulerAddJobRequest {
  string kind = 1;
  string agent_id = 2;
  int32 interval_minutes = 3;
}

message SchedulerAddJobResponse {
  bool ok = 1;
}

// ============================================================================
// Growth API
// ============================================================================

message GetGrowthSnapshotRequest {
  string agent_id = 1;
}

message GetGrowthSnapshotResponse {
  string agent_id = 1;
  int32 total_memories = 2;
  int32 total_skills = 3;
  int32 total_reviews = 4;
  int64 total_turns = 5;
  int32 positive_feedback = 6;
  int32 negative_feedback = 7;
  double feedback_ratio = 8;
  double error_rate = 9;
  double retry_rate = 10;
  double review_success_rate = 11;
  double memory_growth_rate = 12;
  double skill_growth_rate = 13;
  string quality_trend = 14;
  double growth_score = 15;
  string growth_verdict = 16;
  string window_start = 17;
  string window_end = 18;
}

message RecordFeedbackRequest {
  string agent_id = 1;
  string turn_id = 2;
  string conversation_id = 3;
  string signal = 4;
  optional string comment = 5;
}

message RecordFeedbackResponse {
  string id = 1;
}
