syntax = "proto3";

package peers_touch.model.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/agent/model;model";

// Provider API contract — wire types for the agent provider management surface.

message ModelCapabilityConfig {
  // Canonical runtime capability IDs from RuntimeCapabilitySnapshot.
  // Explicit false values override catalog capabilities.
  map<string, bool> flags = 1;
}

message ProviderRuntimeConfig {
  string default_model = 1;
  repeated string startup_args = 2;
  map<string, string> environment = 3;
  int32 timeout_seconds = 4;
  string global_prompt = 5;
}

message ProviderAdapterCapabilities {
  bool model_discovery = 1;
  bool startup_args = 2;
  bool environment = 3;
  bool configurable_timeout = 4;
  repeated string runtime_capabilities = 5;
  repeated string backend_protocols = 6;
}

message ProviderModelInfo {
  string id = 1;
  string display_name = 2;
  string type = 3;
  bool enabled = 4;
  int32 context_window = 5;
  ModelCapabilityConfig capabilities = 6;
  string description = 7;
  string default_reasoning_level = 8;
  repeated string supported_reasoning_levels = 9;
}

enum ProviderResourceScope {
  PROVIDER_RESOURCE_SCOPE_UNSPECIFIED = 0;
  PROVIDER_RESOURCE_SCOPE_ACTOR = 1;
  PROVIDER_RESOURCE_SCOPE_STATION = 2;
}

message ProviderResourceOwner {
  ProviderResourceScope scope = 1;
  // Required for actor ownership; empty for Station ownership.
  string actor_ptid = 2;
}

message ProviderAccessGrant {
  bool all_actors = 1;
  string actor_ptid = 2;
  bool all_models = 3;
  string model_id = 4;
}

message ProviderAccess {
  string provider_id = 1;
  int64 revision = 2;
  repeated ProviderAccessGrant grants = 3;
}

message ProviderPolicy {
  bool personal_providers_enabled = 1;
  int64 revision = 2;
  // Global AI entitlement intersects with Provider/model grants. Absent on
  // an existing Station preserves its existing per-Provider grant policy.
  AIUserAccess ai_user_access = 3;
}

message AIUserAccess {
  bool all_actors = 1;
  repeated string actor_ptids = 2;
}

message GetProviderPolicyRequest {}
message GetProviderPolicyResponse { ProviderPolicy policy = 1; }
message SetProviderPolicyRequest {
  bool personal_providers_enabled = 1;
  int64 revision = 2;
  // Absent leaves the current global entitlement unchanged.
  AIUserAccess ai_user_access = 3;
}
message SetProviderPolicyResponse { ProviderPolicy policy = 1; }
message GetProviderAccessRequest { string provider_id = 1; }
message GetProviderAccessResponse { ProviderAccess access = 1; }
message SetProviderAccessRequest {
  string provider_id = 1;
  int64 revision = 2;
  repeated ProviderAccessGrant grants = 3;
}
message SetProviderAccessResponse { ProviderAccess access = 1; }

message AgentProviderInfo {
  reserved 19;

  string id = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  bool builtin = 5;
  string protocol = 6;
  string discovery = 7;
  string runtime_kind = 8;
  string base_url = 9;
  string home_url = 10;
  string api_key_url = 11;
  bool show_checker = 12;
  bool show_api_key = 13;
  string credential_status = 14;
  int64 version = 15;
  string source = 16;
  string cli_command = 17;
  repeated ProviderModelInfo models = 18;
  ProviderRuntimeConfig runtime_config = 20;
  ProviderRuntimeConfig default_runtime_config = 21;
  ProviderAdapterCapabilities adapter_capabilities = 22;
  string workspace_policy = 23;
  // Station installation state for CLI adapters: ready, missing,
  // installing, failed, manual_required or unsupported.
  string install_state = 24;
  // Whether the Station can install this adapter automatically.
  bool install_supported = 25;
  // Vendor installation guide linked from the UI when automatic install is
  // unavailable or failed.
  string manual_install_url = 26;
  ProviderResourceOwner owner = 27;
  // Installation/execution identity; independent of the named profile ID.
  string cli_adapter_id = 28;
  // Immutable record identity of a same-owner HTTP connection.
  string backend_provider_id = 29;
  string record_id = 30;
}

// InstallProviderRequest starts an administrator-authorized Station CLI install.
message InstallProviderRequest {
  string provider_id = 1;
}
message InstallProviderResponse {
  string install_state = 1;
  string job_id = 2;
  bool install_supported = 3;
  string manual_install_url = 4;
}

// ProviderInstallStatusRequest polls one install job. An empty job_id returns
// the current on-disk installation state.
message ProviderInstallStatusRequest {
  string provider_id = 1;
  string job_id = 2;
}
message ProviderInstallStatusResponse {
  string install_state = 1;
  string job_id = 2;
  string phase = 3;
  int32 percent = 4;
  string message = 5;
  string error = 6;
  bool install_supported = 7;
  string manual_install_url = 8;
  string installed_version = 9;
}

message AgentModelInfo {
  string id = 1;
  string actor_ptid = 2;
  string provider_id = 3;
  string model_id = 4;
  string display_name = 5;
  bool enabled = 6;
  int64 version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  int32 context_window = 10;
  ModelCapabilityConfig capabilities = 11;
  ProviderResourceOwner owner = 12;
}

message CredentialStatusInfo {
  string provider_id = 1;
  bool configured = 2;
  string status = 3;
  int64 version = 4;
}

message CredentialResolveInfo {
  string provider_id = 1;
  string api_key = 2;
  string base_url = 3;
  string protocol = 4;
}

message CheckProviderRequest { string provider_id = 1; }
message CheckProviderResponse {
  bool ok = 1;
  string program = 2;
  string error = 3;
  string install_hint = 4;
}

// Administrator verifies consumption using an explicitly selected, authorized
// actor. This never bypasses global entitlement or model grants.
message VerifyProviderModelRequest {
  string provider_id = 1;
  string model_id = 2;
  string actor_ptid = 3;
}
message VerifyProviderModelResponse {
  bool response_received = 1;
  string provider_id = 2;
  string model_id = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message DiscoverProviderModelsRequest { string provider_id = 1; }
message DiscoverProviderModelsResponse {
  repeated ProviderModelInfo models = 1;
  google.protobuf.Timestamp observed_at = 2;
}

// Provider CRUD
message ListProvidersRequest {}
message ListProvidersResponse {
  repeated AgentProviderInfo providers = 1;
  repeated CLIProfileDefault cli_profile_defaults = 2;
}

// Management preference only. Actor model defaults and historical bindings
// retain their explicit provider/model selection.
message CLIProfileDefault {
  string cli_adapter_id = 1;
  string provider_id = 2;
  int64 revision = 3;
}
message SetCLIProfileDefaultRequest {
  string cli_adapter_id = 1;
  string provider_id = 2;
  int64 expected_revision = 3;
}
message SetCLIProfileDefaultResponse { CLIProfileDefault profile_default = 1; }

message GetProviderRequest { string provider_id = 1; }
message GetProviderResponse { AgentProviderInfo provider = 1; }

message ListAvailableModelsRequest {}
message ListAvailableModelsResponse { repeated AvailableModelInfo models = 1; }

message AvailableModelInfo {
  string id = 1;
  string provider_id = 2;
  string provider_name = 3;
  string display_name = 4;
  string type = 5;
  bool enabled = 6;
  int32 context_window = 7;
  ModelCapabilityConfig capabilities = 8;
}

message CreateProviderRequest {
  string provider_id = 1;
  string display_name = 2;
  string base_url = 3;
  string protocol = 4;
  bytes config_json = 5;
  string cli_adapter_id = 6;
  string backend_provider_id = 7;
  ProviderRuntimeConfig runtime_config = 8;
}
message CreateProviderResponse { AgentProviderInfo provider = 1; }

message UpdateProviderRequest {
  string provider_id = 1;
  int64 version = 2;
  optional string display_name = 3;
  optional string base_url = 4;
  optional bool enabled = 5;
  bytes config_json = 6;
  reserved 7;
  reserved "key_vaults";
  ProviderRuntimeConfig runtime_config = 8;
  optional string backend_provider_id = 9;
}
message UpdateProviderResponse { AgentProviderInfo provider = 1; }

message DeleteProviderRequest {
  string provider_id = 1;
  int64 version = 2;
}
message DeleteProviderResponse { bool deleted = 1; }

// Model CRUD
message ListModelsRequest { string provider_id = 1; }
message ListModelsResponse { repeated AgentModelInfo models = 1; }

message CreateModelRequest {
  string provider_id = 1;
  string model_id = 2;
  string display_name = 3;
  bool enabled = 4;
  int32 context_window = 5;
  ModelCapabilityConfig capabilities = 6;
}
message CreateModelResponse { AgentModelInfo model = 1; }

message UpdateModelRequest {
  string provider_id = 1;
  string model_id = 2;
  int64 version = 3;
  optional string display_name = 4;
  optional bool enabled = 5;
  optional int32 context_window = 6;
  ModelCapabilityConfig capabilities = 7;
}
message UpdateModelResponse { AgentModelInfo model = 1; }

// Credential
message SetCredentialRequest {
  string provider_id = 1;
  string api_key = 2;
}
message SetCredentialResponse { CredentialStatusInfo status = 1; }

message DeleteCredentialRequest {
  string provider_id = 1;
  int64 version = 2;
}
message DeleteCredentialResponse { bool deleted = 1; }

message GetCredentialStatusRequest { string provider_id = 1; }
message GetCredentialStatusResponse { CredentialStatusInfo status = 1; }

message ResolveCredentialRequest { string provider_id = 1; }
message ResolveCredentialResponse { CredentialResolveInfo credential = 1; }

// Actor-scoped explicit default provider/model. Unlike the per-provider
// runtime_config.default_model, this selects which provider supplies new
// Topics. Historical turns keep their recorded provider attribution.
message RuntimeDefault {
  string provider_id = 1;
  string model_id = 2;
  int64 revision = 3;
}

message GetRuntimeDefaultRequest {}
message GetRuntimeDefaultResponse { RuntimeDefault runtime_default = 1; }

message SetRuntimeDefaultRequest {
  string provider_id = 1;
  string model_id = 2;
  int64 expected_revision = 3;
}
message SetRuntimeDefaultResponse { RuntimeDefault runtime_default = 1; }
