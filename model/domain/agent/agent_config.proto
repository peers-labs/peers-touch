syntax = "proto3";

package peers_touch.model.agent.v1;

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/agent/model;model";

import "domain/agent/turn_stream.proto";

// Provider model visibility preferences.
message HideModelRequest {
  string provider_id = 1;
  string model_id = 2;
}
message HideModelResponse { bool ok = 1; }

message GetHiddenModelsRequest { string provider_id = 1; }
message GetHiddenModelsResponse { repeated string hidden_models = 1; }

// Station-authoritative approval command. Actor identity is derived from the
// authenticated request context and is intentionally absent from this message.
message SubmitToolApprovalDecisionRequest {
  string approval_id = 1;
  string tool_call_id = 2;
  string decision_id = 3;
  uint64 expected_revision = 4;
  bool approved = 5;
  string idempotency_key = 6;
  string payload_hash = 7;
}

enum ToolApprovalDecisionErrorCode {
  TOOL_APPROVAL_DECISION_ERROR_CODE_UNSPECIFIED = 0;
  TOOL_APPROVAL_DECISION_ERROR_CODE_STALE_REVISION = 1;
  TOOL_APPROVAL_DECISION_ERROR_CODE_IDEMPOTENCY_CONFLICT = 2;
  TOOL_APPROVAL_DECISION_ERROR_CODE_EXPIRED = 3;
  TOOL_APPROVAL_DECISION_ERROR_CODE_NOT_FOUND = 4;
  TOOL_APPROVAL_DECISION_ERROR_CODE_EXECUTOR_UNAVAILABLE = 5;
}

message SubmitToolApprovalDecisionResponse {
  bool accepted = 1;
  uint64 decision_revision = 2;
  string approval_id = 3;
  string tool_call_id = 4;
  string decision_id = 5;
  bool approved = 6;
  string idempotency_key = 7;
  string payload_hash = 8;
  ToolApprovalDecisionErrorCode error_code = 9;
  ErrorPayload outcome_error = 10;
}
