message PrepareCapabilityAcceptanceScenarioResponse {
  string scenario_handle = 1;
  repeated string opaque_resource_ids = 2;
  string source_inventory_hash = 3;
  string executor_hook_ticket = 4;
}

message ArmCapabilityAcceptanceExecutorHookRequest {
  string scenario_handle = 1;
  string executor_hook_ticket = 2;
}

message ArmCapabilityAcceptanceExecutorHookResponse {
  string scenario_handle = 1;
  string barrier = 2;
  CapabilityAcceptanceScenarioFamily family = 3;
}

message ReachCapabilityAcceptanceExecutorBarrierRequest {
  string scenario_handle = 1;
  string barrier = 2;
}

message ReachCapabilityAcceptanceExecutorBarrierResponse {
  string scenario_handle = 1;
  string barrier = 2;
  bool interrupted = 3;
}

message WaitCapabilityAcceptanceBarrierRequest {
  string scenario_handle = 1;
  string barrier = 2;
}

message WaitCapabilityAcceptanceBarrierResponse {
  string scenario_handle = 1;
  string barrier = 2;
  bool reached = 3;
}

message ReleaseCapabilityAcceptanceBarrierRequest {
  string scenario_handle = 1;
  string barrier = 2;
}

message ReleaseCapabilityAcceptanceBarrierResponse {
  string scenario_handle = 1;
  string barrier = 2;
}

message InterruptCapabilityAcceptanceWorkerRequest {
  string scenario_handle = 1;
  string barrier = 2;
}

message InterruptCapabilityAcceptanceWorkerResponse {
  string scenario_handle = 1;
  string barrier = 2;
  bool interrupted = 3;
}

message CleanupCapabilityAcceptanceScenarioRequest {
  string scenario_handle = 1;
}

message CleanupCapabilityAcceptanceScenarioResponse {
  string scenario_handle = 1;
  repeated string cleaned_opaque_resource_ids = 2;
}

message GetEffectiveRuntimeProfileRequest {
  string agent_id = 1;
}

message GetEffectiveRuntimeProfileResponse {
  EffectiveRuntimeProfileSnapshot snapshot = 1;
}

message GetRuntimeActivityRequest {
  RuntimeKind runtime_kind = 1;
  string runtime_id = 2;
}

message GetRuntimeActivityResponse {
  RuntimeActivitySnapshot snapshot = 1;
}

message StartCapabilityOperationRequest {
  string capability_id = 1;
  string capability_version = 2;
  string operation_kind = 3;
  string target_device_id = 4;
  string capability_session_id = 5;
  bytes bounded_arguments = 6;
  string idempotency_key = 7;
  google.protobuf.Timestamp deadline = 8;
}

message StartCapabilityOperationResponse {
  CapabilityOperation operation = 1;
}

message CancelCapabilityOperationRequest {
  string operation_id = 1;
  uint64 expected_revision = 2;
  string idempotency_key = 3;
}

message CancelCapabilityOperationResponse {
  CapabilityOperation operation = 1;
}

message GetCapabilityOperationRequest {
  string operation_id = 1;
}

message GetCapabilityOperationResponse {
  CapabilityOperation operation = 1;
}

message ReportCapabilityOperationEventRequest {
  CapabilityOperationEvent event = 1;
  string target_device_id = 2;
  string capability_session_id = 3;
  string executor_lease_id = 4;
  string cleanup_lease_id = 5;
  uint64 cleanup_epoch = 6;
  uint64 cleanup_fencing_token = 7;
  string cleanup_outcome = 8;
  ClientCapabilityCommandProof command_proof = 9;
}

message ReportCapabilityOperationEventResponse {
  CapabilityOperation operation = 1;
  bool replayed = 2;
}

message ReconcileCapabilityOperationRequest {
  string operation_id = 1;
  uint64 after_sequence = 2;
}

message ReconcileCapabilityOperationResponse {
  CapabilityOperation operation = 1;
  repeated CapabilityOperationEvent events = 2;
}

message PullCapabilityOperationsRequest {
  string capability_session_id = 1;
  string device_id = 2;
  uint64 after_sequence = 3;
  uint32 limit = 4;
  ClientCapabilityCommandProof command_proof = 5;
}

message PullCapabilityOperationsResponse {
  repeated CapabilityOperation operations = 1;
  uint64 last_sequence = 2;
  ClientCapabilityCommandErrorCode error_code = 3;
}

message TakeOverCapabilityOperationRequest {
  reserved 5;
  reserved "executor_lease_id";
  string operation_id = 1;
  uint64 expected_revision = 2;
  string target_device_id = 3;
  string capability_session_id = 4;
  bool cleanup_only = 6;
  string external_idempotency_key = 7;
  ClientCapabilityCommandProof command_proof = 8;
}

message TakeOverCapabilityOperationResponse {
  CapabilityOperation operation = 1;
}

message TakeOverCapabilityCleanupRequest {
  reserved 5;
  reserved "cleanup_lease_id";
  string operation_id = 1;
  uint64 expected_cleanup_epoch = 2;
  string target_device_id = 3;
  string capability_session_id = 4;
  ClientCapabilityCommandProof command_proof = 6;
}

message TakeOverCapabilityCleanupResponse {
  CapabilityOperation operation = 1;
}

message ListConnectorResourceManifestsRequest {
  string connector_id = 1;
}

message ListConnectorResourceManifestsResponse {
  repeated ConnectorResourceManifest manifests = 1;
}
