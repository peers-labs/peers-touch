syntax = "proto3";

package peers_touch.model.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peers-labs/peers-touch/station/app/subserver/agent/model;model";

enum CollaborationEngineType {
  COLLABORATION_ENGINE_TYPE_UNSPECIFIED = 0;
  COLLABORATION_ENGINE_TYPE_EXPERT_HIERARCHY = 1;
  COLLABORATION_ENGINE_TYPE_ROUNDTABLE = 2;
  COLLABORATION_ENGINE_TYPE_DEBATE_JUDGE = 3;
  COLLABORATION_ENGINE_TYPE_SWARM = 4;
  COLLABORATION_ENGINE_TYPE_HIERARCHY = 5;
  COLLABORATION_ENGINE_TYPE_EXPERT_MESH = 6;
}

enum CollaborationTaskStatus {
  COLLABORATION_TASK_STATUS_UNSPECIFIED = 0;
  COLLABORATION_TASK_STATUS_PENDING = 1;
  COLLABORATION_TASK_STATUS_RUNNING = 2;
  COLLABORATION_TASK_STATUS_COMPLETED = 3;
  COLLABORATION_TASK_STATUS_FAILED = 4;
  COLLABORATION_TASK_STATUS_PAUSED = 5;
  COLLABORATION_TASK_STATUS_CANCELLED = 6;
}

enum TaskNodeStatus {
  TASK_NODE_STATUS_UNSPECIFIED = 0;
  TASK_NODE_STATUS_PENDING = 1;
  TASK_NODE_STATUS_RUNNING = 2;
  TASK_NODE_STATUS_COMPLETED = 3;
  TASK_NODE_STATUS_FAILED = 4;
  TASK_NODE_STATUS_SKIPPED = 5;
}

enum VoteType {
  VOTE_TYPE_UNSPECIFIED = 0;
  VOTE_TYPE_AGREE = 1;
  VOTE_TYPE_DISAGREE = 2;
  VOTE_TYPE_ABSTAIN = 3;
}

enum AcceptanceLevel {
  ACCEPTANCE_LEVEL_UNSPECIFIED = 0;
  ACCEPTANCE_LEVEL_L0 = 1;
  ACCEPTANCE_LEVEL_L1 = 2;
  ACCEPTANCE_LEVEL_L2 = 3;
}

enum AcceptanceVerdict {
  ACCEPTANCE_VERDICT_UNSPECIFIED = 0;
  ACCEPTANCE_VERDICT_ACCEPTED = 1;
  ACCEPTANCE_VERDICT_REJECTED = 2;
  ACCEPTANCE_VERDICT_PENDING = 3;
}

enum CircuitBreakerState {
  CIRCUIT_BREAKER_STATE_UNSPECIFIED = 0;
  CIRCUIT_BREAKER_STATE_CLOSED = 1;
  CIRCUIT_BREAKER_STATE_OPEN = 2;
  CIRCUIT_BREAKER_STATE_HALF_OPEN = 3;
}

message CollaborationTask {
  string task_id = 1;
  string title = 2;
  string description = 3;
  CollaborationEngineType engine_type = 4;
  CollaborationTaskStatus status = 5;
  string goal_owner_id = 6;
  string workspace_id = 7;
  double budget_tokens = 8;
  double budget_money = 9;
  int64 budget_time_ms = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp ended_at = 13;
  map<string, string> meta = 14;
}

message TaskNode {
  string node_id = 1;
  string task_id = 2;
  string parent_node_id = 3;
  string agent_id = 4;
  string role = 5;
  string description = 6;
  TaskNodeStatus status = 7;
  repeated string prerequisite_node_ids = 8;
  string result_summary = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp ended_at = 11;
}

enum TaskSurface {
  TASK_SURFACE_UNSPECIFIED = 0;
  TASK_SURFACE_CHAT = 1;
  TASK_SURFACE_CANVAS = 2;
  TASK_SURFACE_API = 3;
  TASK_SURFACE_SCHEDULED = 4;
  TASK_SURFACE_DIRECT_RUN = 5;
}

enum ExecutorKind {
  EXECUTOR_KIND_UNSPECIFIED = 0;
  EXECUTOR_KIND_STATION_HOSTED = 1;
  EXECUTOR_KIND_WORKSPACE_SANDBOX = 2;
  EXECUTOR_KIND_REMOTE_CONNECTOR = 3;
  EXECUTOR_KIND_DESKTOP_DEVICE = 4;
  EXECUTOR_KIND_MOBILE_DEVICE = 5;
}

enum TaskEventType {
  TASK_EVENT_TYPE_UNSPECIFIED = 0;
  TASK_EVENT_TYPE_TASK_CREATED = 1;
  TASK_EVENT_TYPE_TASK_STATUS_CHANGED = 2;
  TASK_EVENT_TYPE_STEP_STARTED = 3;
  TASK_EVENT_TYPE_STEP_COMPLETED = 4;
  TASK_EVENT_TYPE_STEP_FAILED = 5;
  TASK_EVENT_TYPE_TURN_EVENT = 6;
  TASK_EVENT_TYPE_ARTIFACT_CREATED = 7;
  TASK_EVENT_TYPE_CHECKPOINT_CREATED = 8;
  TASK_EVENT_TYPE_INTERRUPT_REQUESTED = 9;
  TASK_EVENT_TYPE_INTERRUPT_RESOLVED = 10;
  TASK_EVENT_TYPE_EXECUTOR_LEASED = 11;
  TASK_EVENT_TYPE_EXECUTOR_RELEASED = 12;
  TASK_EVENT_TYPE_GATE_RESULT = 13;
  TASK_EVENT_TYPE_FEEDBACK_RECORDED = 14;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_TEXT = 1;
  ARTIFACT_KIND_FILE = 2;
  ARTIFACT_KIND_PATCH = 3;
  ARTIFACT_KIND_IMAGE = 4;
  ARTIFACT_KIND_STRUCTURED = 5;
  ARTIFACT_KIND_TRACE = 6;
}

enum InterruptStatus {
  INTERRUPT_STATUS_UNSPECIFIED = 0;
  INTERRUPT_STATUS_PENDING = 1;
  INTERRUPT_STATUS_RESOLVED = 2;
  INTERRUPT_STATUS_CANCELLED = 3;
  INTERRUPT_STATUS_EXPIRED = 4;
}

enum TaskGateBlockingLevel {
  TASK_GATE_BLOCKING_LEVEL_UNSPECIFIED = 0;
  TASK_GATE_BLOCKING_LEVEL_BLOCK = 1;
  TASK_GATE_BLOCKING_LEVEL_WARN = 2;
  TASK_GATE_BLOCKING_LEVEL_INFO = 3;
}

enum TaskGateType {
  TASK_GATE_TYPE_UNSPECIFIED = 0;
  TASK_GATE_TYPE_ACCEPTANCE = 1;
  TASK_GATE_TYPE_POLICY = 2;
  TASK_GATE_TYPE_CONTRACT = 3;
  TASK_GATE_TYPE_QUALITY = 4;
  TASK_GATE_TYPE_CUSTOM = 5;
}

enum TaskGateCheckType {
  TASK_GATE_CHECK_TYPE_UNSPECIFIED = 0;
  TASK_GATE_CHECK_TYPE_SCHEMA = 1;
  TASK_GATE_CHECK_TYPE_TYPECHECK = 2;
  TASK_GATE_CHECK_TYPE_CONTRACT_GATE = 3;
  TASK_GATE_CHECK_TYPE_POLICY = 4;
  TASK_GATE_CHECK_TYPE_ARTIFACT = 5;
  TASK_GATE_CHECK_TYPE_CUSTOM = 6;
}

enum TaskGateEvaluatorKind {
  TASK_GATE_EVALUATOR_KIND_UNSPECIFIED = 0;
  TASK_GATE_EVALUATOR_KIND_DETERMINISTIC = 1;
  TASK_GATE_EVALUATOR_KIND_PROVIDER = 2;
  TASK_GATE_EVALUATOR_KIND_HUMAN = 3;
  TASK_GATE_EVALUATOR_KIND_POLICY = 4;
  TASK_GATE_EVALUATOR_KIND_CUSTOM = 5;
}

message TaskRun {
  string task_id = 1;
  string title = 2;
  string description = 3;
  TaskSurface surface = 4;
  CollaborationTaskStatus status = 5;
  string owner_actor_id = 6;
  string workspace_id = 7;
  string root_turn_id = 8;
  string current_checkpoint_id = 9;
  map<string, string> meta = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp ended_at = 14;
}

message ExecutionStep {
  string step_id = 1;
  string task_id = 2;
  string parent_step_id = 3;
  string agent_id = 4;
  string role = 5;
  string description = 6;
  TaskNodeStatus status = 7;
  repeated string prerequisite_step_ids = 8;
  repeated string required_capabilities = 9;
  repeated ExecutorKind eligible_executors = 10;
  repeated string input_artifact_ids = 11;
  repeated string output_artifact_ids = 12;
  string turn_id = 13;
  int32 attempt = 14;
  int64 input_version = 15;
  int64 output_version = 16;
  string result_summary = 17;
  google.protobuf.Timestamp started_at = 18;
  google.protobuf.Timestamp ended_at = 19;
}

message TaskEvent {
  string event_id = 1;
  string task_id = 2;
  string step_id = 3;
  string turn_id = 4;
  int64 event_seq = 5;
  TaskEventType type = 6;
  string payload_json = 7;
  google.protobuf.Timestamp created_at = 8;
}

message TaskArtifact {
  string artifact_id = 1;
  string task_id = 2;
  string step_id = 3;
  string turn_id = 4;
  ArtifactKind kind = 5;
  string schema = 6;
  string storage_uri = 7;
  string content_hash = 8;
  string summary = 9;
  string visibility = 10;
  google.protobuf.Timestamp created_at = 11;
}

message TaskArtifactRef {
  string artifact_id = 1;
  string kind = 2;
  string name = 3;
  string uri = 4;
  string checksum = 5;
  repeated string refs = 6;
  repeated string paths = 7;
  string markdown = 8;
  string meta = 9;
  string size = 10;
}

message TaskGateCheck {
  string name = 1;
  string status = 2;
  string detail = 3;
}

message TaskProviderSpec {
  string provider_id = 1;
  string model = 2;
  string reasoning_effort = 3;
  repeated string required_capabilities = 4;
  map<string, string> options = 5;
  string agent_id = 6;
  string role = 7;
}

message TaskProviderPlan {
  repeated TaskProviderSpec providers = 1;
  string synthesizer_agent_id = 2;
  string source = 3;
  TaskOrchestrationPolicy orchestration_policy = 4;
}

enum TaskGraphParallelPolicy {
  TASK_GRAPH_PARALLEL_POLICY_UNSPECIFIED = 0;
  TASK_GRAPH_PARALLEL_POLICY_SERIAL_ONLY = 1;
  TASK_GRAPH_PARALLEL_POLICY_INDEPENDENT_ONLY = 2;
  TASK_GRAPH_PARALLEL_POLICY_INTEGRATOR_REQUIRED = 3;
}

enum SupervisorLoopKind {
  SUPERVISOR_LOOP_KIND_UNSPECIFIED = 0;
  SUPERVISOR_LOOP_KIND_STATION_EVENT_BUS = 1;
}

enum ReplanPolicyKind {
  REPLAN_POLICY_KIND_UNSPECIFIED = 0;
  REPLAN_POLICY_KIND_BEFORE_B10_FROM_RESUME_ANCHOR = 1;
}

enum ResumeAnchorPolicyKind {
  RESUME_ANCHOR_POLICY_KIND_UNSPECIFIED = 0;
  RESUME_ANCHOR_POLICY_KIND_LATEST_ACCEPTED_CHECKPOINT = 1;
}

message TaskOrchestrationPolicy {
  TaskGraphParallelPolicy task_graph_parallel_policy = 1;
  string integrator_agent_id = 2;
  SupervisorLoopKind supervisor_loop = 3;
  ReplanPolicyKind replan_policy = 4;
  ResumeAnchorPolicyKind resume_anchor_policy = 5;
  string workspace_ref = 6;
}

message TaskGateEvaluatorSpec {
  TaskGateEvaluatorKind kind = 1;
  string evaluator_id = 2;
  TaskProviderSpec provider = 3;
  string policy_id = 4;
  repeated string required_capabilities = 5;
}

message TaskGateCheckSpec {
  string check_id = 1;
  string name = 2;
  string check_type = 3;
  string detail = 4;
  repeated string artifact_ids = 5;
  string config_json = 6;
  TaskGateCheckType typed_check_type = 7;
}

message TaskGateSpec {
  string gate_id = 1;
  string name = 2;
  TaskGateBlockingLevel blocking_level = 3;
  repeated string artifact_ids = 4;
  repeated TaskGateCheckSpec checks = 5;
  string config_json = 6;
  string gate_type = 7;
  string evaluator = 8;
  string level = 9;
  TaskGateType typed_gate_type = 10;
  TaskGateEvaluatorSpec evaluator_spec = 11;
}

message TaskGatePlan {
  string gate_plan_id = 1;
  string task_id = 2;
  string step_id = 3;
  string source = 4;
  string status = 5;
  repeated TaskGateSpec gates = 6;
  string plan_json = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message TaskGateResult {
  string gate_id = 1;
  string name = 2;
  string status = 3;
  string summary = 4;
  repeated TaskGateCheck checks = 5;
  repeated string artifact_ids = 6;
  bool blocking = 7;
  string gate_plan_id = 8;
}

message TaskCheckpoint {
  string checkpoint_id = 1;
  string task_id = 2;
  int64 event_seq = 3;
  string state_json = 4;
  string versions_json = 5;
  string pending_writes_cursor = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ExecutorLease {
  string lease_id = 1;
  string task_id = 2;
  string step_id = 3;
  string executor_id = 4;
  ExecutorKind executor_kind = 5;
  string status = 6;
  google.protobuf.Timestamp acquired_at = 7;
  google.protobuf.Timestamp heartbeat_at = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message InterruptRequest {
  string interrupt_id = 1;
  string task_id = 2;
  string step_id = 3;
  string turn_id = 4;
  string interrupt_type = 5;
  InterruptStatus status = 6;
  string payload_json = 7;
  string resume_payload_json = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp resolved_at = 10;
}

message ListTaskEventsRequest {
  string task_id = 1;
  int64 after_event_seq = 2;
  int32 page_size = 3;
}

message ListTaskEventsResponse {
  repeated TaskEvent events = 1;
  int64 next_event_seq = 2;
}

message Vote {
  string vote_id = 1;
  string task_id = 2;
  string node_id = 3;
  string voter_id = 4;
  VoteType vote_type = 5;
  string evidence_ref = 6;
  string comment = 7;
  google.protobuf.Timestamp voted_at = 8;
}

message EvidenceRef {
  string evidence_id = 1;
  string type = 2;
  string uri = 3;
  string summary = 4;
}

message AcceptanceCriteria {
  string criteria_id = 1;
  string task_id = 2;
  AcceptanceLevel level = 3;
  string predicate = 4;
  string expected_value = 5;
}

message AcceptanceVerdictResult {
  string verdict_id = 1;
  string task_id = 2;
  AcceptanceLevel level = 3;
  AcceptanceVerdict verdict = 4;
  string evidence_ref = 5;
  string judge_id = 6;
  google.protobuf.Timestamp decided_at = 7;
}

message Budget {
  string budget_id = 1;
  string task_id = 2;
  double allocated_tokens = 3;
  double used_tokens = 4;
  double allocated_money = 5;
  double used_money = 6;
  int64 allocated_time_ms = 7;
  int64 used_time_ms = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CircuitBreakerStatus {
  string circuit_id = 1;
  CircuitBreakerState state = 2;
  int32 failure_count = 3;
  int32 consecutive_failures = 4;
  google.protobuf.Timestamp last_failure_at = 5;
  google.protobuf.Timestamp last_reset_at = 6;
}

message CreateCollaborationTaskRequest {
  string title = 1;
  string description = 2;
  CollaborationEngineType engine_type = 3;
  string goal_owner_id = 4;
  optional string workspace_id = 5;
  double budget_tokens = 6;
  double budget_money = 7;
  int64 budget_time_ms = 8;
  map<string, string> meta = 9;
  TaskProviderPlan provider_plan = 10;
}

message CreateCollaborationTaskResponse {
  CollaborationTask task = 1;
}

message GetCollaborationTaskRequest {
  string task_id = 1;
}

message GetCollaborationTaskResponse {
  CollaborationTask task = 1;
  repeated TaskNode nodes = 2;
}

message ListCollaborationTasksRequest {
  string owner_id = 1;
  CollaborationTaskStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListCollaborationTasksResponse {
  repeated CollaborationTask tasks = 1;
  int32 total = 2;
}

message UpdateCollaborationTaskRequest {
  string task_id = 1;
  optional string title = 2;
  optional string description = 3;
  optional CollaborationTaskStatus status = 4;
  map<string, string> meta = 5;
}

message UpdateCollaborationTaskResponse {
  CollaborationTask task = 1;
}

message SubmitCollaborationNodeResultRequest {
  string task_id = 1;
  string node_id = 2;
  string lease_id = 3;
  string executor_id = 4;
  string result_summary = 5;
  string status = 6;
  string turn_id = 7;
  repeated TaskArtifactRef artifacts = 8;
  repeated TaskGateResult gates = 9;
  map<string, string> meta = 10;
}

message SubmitCollaborationNodeResultResponse {
  CollaborationTask task = 1;
  repeated TaskNode nodes = 2;
}

message ClaimDesktopExecutorTaskRequest {
  string executor_id = 1;
  int64 lease_ttl_ms = 2;
  optional string task_id = 3;
  optional string agent_id = 4;
  repeated string capabilities = 5;
  optional string node_id = 6;
}

message ClaimDesktopExecutorTaskResponse {
  CollaborationTask task = 1;
  TaskNode node = 2;
  ExecutorLease lease = 3;
  bool claimed = 4;
}

message HeartbeatExecutorLeaseRequest {
  string lease_id = 1;
  string executor_id = 2;
  int64 lease_ttl_ms = 3;
}

message HeartbeatExecutorLeaseResponse {
  ExecutorLease lease = 1;
}

message ReleaseExecutorLeaseRequest {
  string lease_id = 1;
  string executor_id = 2;
  string status = 3;
}

message ReleaseExecutorLeaseResponse {
  ExecutorLease lease = 1;
}

message DeleteCollaborationTaskRequest {
  string task_id = 1;
}

message DeleteCollaborationTaskResponse {
  bool success = 1;
}

message SubmitVoteRequest {
  string task_id = 1;
  string node_id = 2;
  VoteType vote_type = 3;
  optional string evidence_ref = 4;
  optional string comment = 5;
}

message SubmitVoteResponse {
  Vote vote = 1;
}

message ListVotesRequest {
  string task_id = 1;
  optional string node_id = 2;
}

message ListVotesResponse {
  repeated Vote votes = 1;
}

message GetAcceptanceVerdictRequest {
  string task_id = 1;
}

message GetAcceptanceVerdictResponse {
  AcceptanceVerdictResult verdict = 1;
}

message SubmitAcceptanceVerdictRequest {
  string task_id = 1;
  AcceptanceVerdict verdict = 2;
  string evidence_ref = 3;
}

message SubmitAcceptanceVerdictResponse {
  AcceptanceVerdictResult verdict = 1;
}

message GetBudgetRequest {
  string task_id = 1;
}

message GetBudgetResponse {
  Budget budget = 1;
}

message ResumeTaskRequest {
  string task_id = 1;
}

message ResumeTaskResponse {
  CollaborationTask task = 1;
}
