      "environment": "local",
      "tier": "ci-cheap",
      "description": "Validate W8 native runner fail-closed evidence, bounded telemetry, composer cleanup, Make launch, and stable selector contracts without launching a live journey."
    },
    "chat-native-two-client-e2e": {
      "command": "python3 tooling/acceptance/gates/chat/native_two_client_runner.py && python3 tooling/acceptance/gates/chat/native_visible_e2e.py --journey two-client",
      "timeout_seconds": 1800,
      "environment": "home-station",
