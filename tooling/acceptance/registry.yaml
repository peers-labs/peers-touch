{
  "version": 1,
  "rules": [
    {
      "id": "chat-proto",
      "features": ["chat-service-contract"],
      "when": {"paths": ["model/domain/chat/**"]},
      "require": ["proto-build", "station-messaging-unit", "messaging-platform-contract"]
    },
    {
      "id": "station-messaging",
      "features": ["chat-service-contract", "chat-realtime-delivery"],
      "when": {
        "paths": [
          "apps/station/app/subserver/conversation/**",
          "apps/station/app/subserver/envelope/**"
        ]
      },
      "require": ["station-messaging-unit", "messaging-platform-contract", "desktop-check"]
    },
    {
      "id": "chat-direct-delivered-receipt",
      "features": ["chat-direct-delivered-receipt"],
      "when": {
        "paths": [
          "apps/desktop/src-tauri/src/messaging/direct.rs",
          "apps/desktop/src-tauri/src/messaging/engine.rs",
          "apps/desktop/src-tauri/src/messaging/lifecycle.rs",
          "apps/desktop/src-tauri/src/messaging/store.rs",
          "apps/desktop/src-tauri/src/messaging/transport.rs",
          "apps/desktop/src-tauri/src/messaging/consumer.rs",
          "apps/desktop/src-tauri/src/messaging/receipt.rs",
          "apps/desktop/src/store/socialChat.ts",
          "apps/station/app/subserver/conversation/engine/application/receipt_service.go",
          "apps/station/app/subserver/conversation/engine/application/receipt_service_test.go",
          "apps/station/app/subserver/conversation/engine/interface/http/receipt_handler.go",
          "apps/station/app/subserver/conversation/engine/subserver.go",
          "tooling/acceptance/fixtures/chat_native_reset.py",
          "tooling/acceptance/gates/chat/chat_native_reset_test.py",
          "tooling/acceptance/gates/chat/native_two_client_runner.py",
          "tooling/acceptance/gates/chat/native_two_client_e2e.py"
        ]
      },
      "require": [
        "station-messaging-unit",
        "messaging-platform-contract",
        "desktop-check",
        "chat-native-visible-static",
        "chat-native-two-client-e2e"
      ]
    },
    {
      "id": "chat-message-interactions",
      "features": ["chat-message-interactions"],
      "when": {
        "paths": [
          "model/domain/chat/command.proto",
          "model/domain/chat/event.proto",
          "apps/station/app/subserver/conversation/engine/application/authority_service.go",
          "apps/station/app/subserver/conversation/engine/application/receipt_service.go",
          "apps/desktop/src-tauri/src/messaging/engine.rs",
          "apps/desktop/src-tauri/src/messaging/direct.rs",
          "apps/desktop/src-tauri/src/messaging/mls.rs",
          "apps/desktop/src-tauri/src/messaging/public_event.rs",
          "apps/desktop/src-tauri/src/messaging/store.rs",
          "apps/desktop/src-tauri/src/provider_models_lib.rs",
          "apps/desktop/src/services/desktop_api.ts",
          "apps/desktop/src/services/errorMappings/chatErrorMapping.ts",
          "apps/desktop/src/store/socialChat.ts",
          "apps/desktop/src/components/chat/**",
          "apps/desktop/src/pages/SettingsPage.tsx",
          "apps/desktop/src/main.tsx",
          "apps/desktop/src/acceptance/chat/**",
          "tooling/acceptance/fixtures/chat_native_reset.py",
          "tooling/acceptance/fixtures/chat_submit_fault_proxy.py",
          "tooling/acceptance/fixtures/chat_contact_message_fault_proxy.py",
          "tooling/acceptance/gates/chat/chat_native_reset_test.py",
          "tooling/acceptance/gates/chat/chat_submit_fault_proxy_test.py",
          "tooling/acceptance/gates/chat/chat_contact_message_fault_proxy_test.py",
          "tooling/acceptance/gates/chat/native_interactions_runner.py",
          "tooling/acceptance/gates/chat/native_interactions_static_test.py",
          "tooling/acceptance/gates/chat/contact_message_resilience_runner.py",
          "tooling/acceptance/gates/chat/native_support.py"
        ]
      },
      "require": [
        "station-messaging-unit",
        "messaging-platform-contract",
        "desktop-check",
        "chat-native-visible-static",
        "chat-native-interactions-e2e",
        "chat-contact-message-resilience-e2e"
      ]
    },
    {
      "id": "chat-typing-presence",
      "features": ["chat-typing-presence"],
      "when": {
        "paths": [
          "model/domain/chat/conversation.proto",
          "apps/station/app/subserver/conversation/engine/application/typing_service.go",
          "apps/station/app/subserver/conversation/engine/interface/http/typing_handler.go",
          "apps/desktop/src/components/chat/ChatMessageArea.tsx",
          "apps/desktop/src/store/socialChat.ts",
          "apps/desktop/src/acceptance/chat/**",
          "tooling/acceptance/fixtures/chat_native_reset.py",
          "tooling/acceptance/gates/chat/chat_native_reset_test.py",
          "tooling/acceptance/gates/chat/native_support.py",
          "tooling/acceptance/gates/chat/native_typing_runner.py"
        ]
      },
      "require": [
        "station-messaging-unit",
        "messaging-platform-contract",
        "desktop-check",
        "chat-native-visible-static",
        "chat-native-typing-e2e"
      ]
    },
    {
      "id": "desktop-chat",
      "features": ["desktop-chat-surface", "chat-realtime-delivery", "chat-desktop-gateway-message-flow", "chat-native-visible-clients"],
      "when": {
        "paths": [
          "apps/desktop/src/App.tsx",
          "apps/desktop/src/vite-env.d.ts",
          "apps/desktop/src/pages/SocialChatPage.tsx",
          "apps/desktop/src/pages/SocialChatPage.descriptor.tsx",
          "apps/desktop/src/components/chat/**",
          "apps/desktop/src/store/socialChat.ts",
          "apps/desktop/src/services/socialChatRealtime.ts"
        ]
      },
      "require": ["desktop-check", "chat-native-visible-static"]
    },
    {
      "id": "chat-native-visible-operations",
      "features": ["chat-native-visible-clients"],
      "when": {
        "paths": [
          "tooling/acceptance/gates/chat/native_multi_device_runner.py",
          "tooling/acceptance/gates/chat/native_recovery_runner.py",
          "tooling/acceptance/gates/chat/native_group_mls_runner.py",
          "tooling/acceptance/gates/chat/native_support.py",
          "tooling/acceptance/fixtures/chat_native_reset.py",
          "tooling/acceptance/gates/chat/chat_native_reset_test.py",
          "tooling/acceptance/playbooks/chat-native-visible-clients.md",
          "apps/desktop/src/acceptance/chat/**",
          "apps/desktop/src-tauri/src/application/profile/mod.rs"
        ]
      },
      "require": [
        "chat-native-visible-static",
        "chat-native-two-client-e2e",
        "chat-native-multi-device-e2e",
        "chat-native-recovery-e2e",
        "chat-native-group-mls-e2e"
      ]
    },
    {
      "id": "desktop-chat-gateway",
      "features": ["chat-desktop-gateway-message-flow"],
      "when": {
        "paths": [
          "apps/desktop/src-tauri/src/interface/http_gateway/**",
          "apps/desktop/src-tauri/src/application/auth/service.rs",
          "apps/desktop/src-tauri/src/messaging/**",
          "apps/desktop/src/services/desktop_api.ts",
          "apps/desktop/src/services/im-service.ts"
        ]
      },
      "require": ["messaging-platform-contract", "desktop-check", "chat-desktop-gateway-e2e"]
    },
    {
      "id": "federation-proto",
      "features": ["federation-ledger", "federation-governance"],
      "when": {"paths": ["model/domain/federation/**"]},
      "require": ["proto-build", "station-federation-unit", "federation-three-node-e2e"]
    },
    {
      "id": "station-federation",
      "features": ["federation-ledger", "federation-governance", "federation-discovery-network"],
      "when": {"paths": ["apps/station/app/subserver/federation/**"]},
      "require": ["station-federation-unit", "federation-three-node-e2e", "federation-surface-smoke"]
    },
    {
      "id": "station-federation-discovery",
      "features": ["federation-discovery-network"],
      "when": {"paths": ["apps/station/frame/core/plugin/native/federation/discovery/**"]},
      "require": ["station-federation-unit", "federation-surface-smoke"]
    },
    {
      "id": "station-dashboard",
      "features": ["station-dashboard-auth", "station-dashboard-operations"],
      "when": {"paths": ["apps/station/app/subserver/dashboard/**"]},
      "require": ["station-dashboard-unit", "station-dashboard-web-check"]
    },
    {
      "id": "dashboard-federation",
      "features": ["federation-dashboard-operations", "federation-operational-observability"],
      "when": {
        "paths": [
          "apps/station/app/subserver/dashboard/domain/federation.go",
          "apps/station/app/subserver/dashboard/infrastructure/federation_repo.go",
          "apps/station/app/subserver/dashboard/application/federation_service.go",
          "apps/station/app/subserver/dashboard/web/src/api/federation.ts",
          "apps/station/app/subserver/dashboard/web/src/pages/FederationPage.tsx"
        ]
      },
      "require": ["station-dashboard-unit", "federation-dashboard-operational-drilldown"]
    },
    {
      "id": "desktop-federation",
      "features": ["desktop-federation-surfaces"],
      "when": {
        "paths": [
          "apps/desktop/src/pages/FederationGovernancePage.tsx",
          "apps/desktop/src/components/common/StationPicker.tsx",
          "apps/desktop/src/components/chat/FindPeopleModal.tsx",
          "apps/desktop/src/store/stationRegistry.ts",
          "apps/desktop/src/runtimes/stationRuntime.ts",
          "apps/desktop/src-tauri/src/infrastructure/station_registry.rs",
          "apps/desktop/src-tauri/src/interface/tauri_commands/station.rs"
        ]
      },
      "require": ["desktop-check", "federation-desktop-gateway-smoke"]
    },
    {
      "id": "desktop-applet-lifecycle",
      "features": ["applet-desktop-lifecycle-smoothness"],
      "when": {
        "paths": [
          "apps/desktop/src/kernel/PageHost.tsx",
          "apps/desktop/src/kernel/pageRuntimeLease.ts",
          "apps/desktop/src/kernel/runtime.ts",
          "apps/desktop/src/pages/AppletRuntimePage.tsx",
          "apps/desktop/src/pages/AppletRuntimePage.descriptor.tsx",
          "apps/desktop/src/pages/AppletsPage.tsx",
          "apps/desktop/src/runtimes/appletsRuntime.ts",
          "apps/desktop/src/store/applets.ts",
          "apps/desktop/src/applet/LynxContainer.tsx",
          "apps/desktop/src/applet/productWindowE2E.ts",
          "apps/desktop/src/applet/useProductWindowLifecycleE2E.ts",
          "apps/desktop/src-tauri/src/interface/tauri_commands/applets.rs",
          "tooling/scripts/applet-desktop-product-window-gate.mjs"
        ]
      },
      "require": [
        "desktop-check",
        "applet-desktop-lifecycle-smoothness"
      ]
    },
    {
      "id": "mobile-station-access",
      "features": ["mobile-station-trust", "mobile-access-gate-oauth"],
      "when": {
        "paths": [
          "model/domain/actor/**",
          "model/domain/access_gate/**",
          "model/domain/oauth/**",
          "apps/mobile/src/features/station/**",
          "apps/mobile/src/features/auth/**",
          "apps/mobile/src-tauri/src/commands/station.rs"
        ]
      },
      "require": [
        "mobile-contract-static",
        "mobile-identity-contract",
        "mobile-native-access-e2e"
      ]
    },
    {
      "id": "mobile-access-gate-oauth-runtime",
      "features": ["mobile-access-gate-oauth"],
      "when": {
        "paths": [
          "apps/mobile/src/acceptance/**",
          "apps/mobile/src/runtimes/authRuntime.ts",
          "apps/mobile/src-tauri/src/runtime/oauth/**",
          "apps/mobile/src-tauri/src/commands/oauth.rs",
          "tooling/acceptance/gates/mobile/appium.py",
          "tooling/acceptance/gates/mobile/native_e2e.py",
          "tooling/acceptance/gates/mobile/native_e2e_test.py",
          "tooling/acceptance/provisioners/mobile_native.py",
          "tooling/acceptance/tests/test_mobile_native_preflight.py",
          "tooling/acceptance/environments/mobile-native.yaml"
        ]
      },
      "require": [
        "mobile-contract-static",
        "mobile-simulator-access-e2e",
        "mobile-native-access-e2e"
      ]
    },
    {
      "id": "mobile-simulator-access-runtime",
      "features": ["mobile-access-gate-oauth"],
      "when": {
        "paths": [
          "tooling/acceptance/environments/mobile-simulator.yaml",
          "tooling/acceptance/provisioners/mobile_simulator.py",
          "tooling/acceptance/tests/test_mobile_simulator_provisioner.py"
        ]
      },
      "require": [
        "mobile-contract-static",
        "mobile-simulator-access-e2e"
      ]
    },
    {
      "id": "mobile-runtime-lifecycle",
      "features": ["mobile-session-lifecycle", "mobile-recovery-degraded-states"],
      "when": {
        "paths": [
          "apps/mobile/src/App.tsx",
          "apps/mobile/src/app/**",
          "apps/mobile/src/components/MobileShell.tsx",
          "apps/mobile/src/runtimes/runtimeRegistry.ts"
        ]
      },
      "require": [
        "mobile-contract-static",
        "mobile-native-lifecycle-e2e",
        "mobile-native-recovery-ui-e2e"
      ]
    },
    {
      "id": "mobile-command-recovery",
      "features": ["mobile-command-draft-recovery", "mobile-recovery-degraded-states"],
      "when": {
        "paths": [
          "apps/mobile/src/runtimes/commandRuntime.ts",
          "apps/mobile/src-tauri/src/runtime/command_ledger/**",
          "apps/mobile/src-tauri/src/runtime/draft_store/**",
          "apps/mobile/src-tauri/src/messaging/adapter.rs"
        ]
      },
      "require": [
        "mobile-contract-static",
        "mobile-native-recovery-e2e",
        "mobile-native-recovery-ui-e2e"
      ]
    },
    {
      "id": "mobile-social-runtime",
      "features": [
        "mobile-chat-contacts-groups",
        "mobile-moments-participation",
        "mobile-profile-settings"
      ],
      "when": {
        "paths": [
          "model/domain/social/**",
          "apps/station/app/subserver/social/**",
          "apps/mobile/src/features/social/**"
        ]
      },
      "require": ["mobile-native-social-convergence-e2e"]
    },
    {
      "id": "mobile-chat-contacts-groups",
      "features": ["mobile-chat-contacts-groups"],
      "when": {
        "paths": [
          "apps/mobile/src/features/group/**",
          "apps/mobile/src/pages/ChatPage.tsx",
          "apps/mobile/src/pages/ContactsPage.tsx"
        ]
      },
      "require": [
        "mobile-native-social-convergence-e2e",
        "mobile-native-chat-contacts-e2e"
      ]
    },
    {
      "id": "mobile-moments",
      "features": ["mobile-moments-participation"],
      "when": {
        "paths": ["apps/mobile/src/pages/MomentsPage.tsx"]
      },
      "require": [
        "mobile-native-social-convergence-e2e",
        "mobile-native-moments-e2e"
      ]
    },
    {
      "id": "mobile-profile-settings",
      "features": ["mobile-profile-settings"],
      "when": {
        "paths": ["apps/mobile/src/pages/SettingsPage.tsx"]
      },
      "require": [
        "mobile-native-social-convergence-e2e",
        "mobile-native-settings-e2e"
      ]
    },
    {
      "id": "mobile-native-quality",
      "features": ["mobile-native-accessibility-performance"],
      "when": {
        "paths": [
          "apps/mobile/src-tauri/src/platform/**",
          "apps/mobile/src-tauri/gen/apple/**",
          "apps/mobile/src-tauri/gen/android/**",
          "apps/mobile/src/styles.css",
          "packages/locales/**"
        ]
      },
      "require": ["mobile-native-platform-e2e", "mobile-hard-cut-static"]
    },
    {
      "id": "acceptance-framework",
      "features": ["acceptance-framework"],
      "when": {
        "paths": [
          "tooling/acceptance/**",
          "tooling/scripts/acceptance-*.py",
          "tooling/scripts/quality-evidence.py",
          "tooling/make/acceptance.mk",
          "tooling/scripts/review/route-change.sh",
          "docs/architecture/quality-framework/**",
          "docs/architecture/acceptance-framework/**",
          "Makefile"
        ]
      },
      "require": [
        "acceptance-plan-self",
        "acceptance-infra-validation",
        "acceptance-runtime-provisioning-self"
      ]
    },
    {
      "id": "desktop-dev-runtime-isolation",
      "features": ["chat-native-visible-clients"],
      "when": {
        "paths": [
          "tooling/scripts/_ensure-desktop-rust.sh",
          "tooling/scripts/_ensure-desktop-vite.sh",
          "tooling/scripts/local-dev/desktop-dev.sh",
          "tooling/scripts/local-dev/env.sh",
          "tooling/scripts/local-dev/profile.sh",
          "tooling/acceptance/gates/desktop/dev_runtime_multi_instance.py",
          "tooling/acceptance/gates/desktop/dev_runtime_multi_instance_static_test.py"
        ]
      },
      "require": ["desktop-dev-runtime-isolation-static"]
    }
  ]
}
