{
  "id": "agent-provider-credential",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/agent/handler/provider_handler.go",
    "apps/station/app/subserver/agent/service/provider_config_service.go",
    "apps/station/app/subserver/agent/service/provider_service.go",
    "apps/station/app/subserver/agent/service/credential_config_service.go",
    "apps/station/app/subserver/agent/service/model_config_service.go",
    "apps/desktop/src/store/agent.ts",
    "apps/desktop/src/services/desktop_api.ts"
  ],
  "truth_sources": [
    "running Station agent API",
    "agent_providers table",
    "agent_models table",
    "encrypted credential store"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/agent/providers"},
    {"type": "api", "route": "/agent/providers/:id"},
    {"type": "api", "route": "/agent/providers/create"},
    {"type": "api", "route": "/agent/providers/:id/update"},
    {"type": "api", "route": "/agent/providers/:id/delete"},
    {"type": "api", "route": "/agent/models"},
    {"type": "api", "route": "/agent/models/:id"},
    {"type": "api", "route": "/agent/models/create"},
    {"type": "api", "route": "/agent/models/:id/update"},
    {"type": "api", "route": "/agent/models/:id/delete"},
    {"type": "api", "route": "/agent/credentials/set"},
    {"type": "api", "route": "/agent/credentials/delete"},
    {"type": "api", "route": "/agent/credentials/status"},
    {"type": "api", "route": "/agent/credentials/resolve"}
  ],
  "required_gates": ["agent-provider-credential-e2e"],
  "acceptance": {
    "service": [
      "provider CRUD persists provider name, base URL, type, and supported model families",
      "model CRUD persists model identifier, context window, capabilities, and parent provider reference",
      "credential set encrypts the API key at rest and associates it with a provider",
      "credential delete removes the stored key and marks the provider as unconfigured",
      "credential status returns whether a valid credential exists for a provider without exposing the key",
      "credential resolve selects the best available credential for a given model request considering pool and priority"
    ],
    "visible": [
      "provider list in Desktop settings shows each provider with its credential status indicator",
      "model selection dropdown only shows models whose parent provider has a valid credential"
    ]
  },
  "negative": [
    "credential values must never appear in API responses, logs, or error messages",
    "deleting a provider must not orphan its associated models — cascade or reject",
    "resolve must not fall back to an expired or revoked credential"
  ]
}
