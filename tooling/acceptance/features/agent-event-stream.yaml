{
  "id": "agent-event-stream",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/events/",
    "apps/station/app/subserver/agent/service/agent_realtime_relay.go",
    "apps/desktop/src-tauri/src/infrastructure/event_stream/",
    "apps/desktop/src/services/eventStream.ts",
    "apps/desktop/src/runtimes/homeRuntime.ts",
    "apps/desktop/src-tauri/src/application/applets/mod.rs"
  ],
  "truth_sources": [
    "Station AgentRealtimeOutbox and relay",
    "shared Station EventBus and /events/stream",
    "Desktop canonical realtime supervisor cursor"
  ],
  "visible_surfaces": [
    {"type": "sse", "route": "/events/stream"}
  ],
  "required_gates": ["agent-personal-goal-event-fanout-e2e"],
  "acceptance": {
    "service": [
      "Desktop establishes one actor-scoped /events/stream connection for real-time updates",
      "durable Agent outbox events reach the shared EventBus before Desktop fan-out",
      "connection supports automatic reconnection with last-event-id and Resync recovery",
      "events are scoped to the authenticated user and their agent instances"
    ],
    "visible": [
      "Home receives real-time Goal updates without polling as the normal driver",
      "Atelier receives canonical invalidations and reconciles from Station snapshots",
      "connection status indicator reflects SSE health in Home"
    ]
  },
  "negative": [
    "the event stream must not deliver events belonging to other users",
    "reconnection must not replay already-acknowledged events",
    "Agent-private publishers, endpoints, Desktop commands, and applet cursors must not exist",
    "event stream failure must not block or crash the agent chat loop"
  ]
}
