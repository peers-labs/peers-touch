  "acceptance": {
    "service": [
      "voice-note kind and duration remain inside encrypted attachment plaintext metadata",
      "Desktop and Mobile persistence round-trip voice-note kind and duration without exposing them in the Station-visible encrypted object descriptor",
      "production presentation receives only scoped opaque grants and bounded asset URLs over byte-verified Engine cache",
      "attachment upload and download retry retain durable transfer identity"
    ],
    "visible": [
      "screenshot cancellation and confirmation preserve native window and renderer geometry",
      "recording exposes permission, duration, cancel, stop, preview, discard, and explicit send states",
      "receiver playback exposes persisted duration, progress, seek, pause, terminal failure, and retry",
      "attachment and voice bytes remain identical across sender, receiver, retry, and restart",
      "sender and receiver file-card selection immediately opens original filename, type, size and actionable transfer state",
      "download progress, cancel and explicit retry preserve attachment identity; closing detail does not cancel Runtime-owned transfer",
      "supported image, audio, video, PDF, paged text, DOCX, XLS/XLSX and PPT/PPTX render in the selected detail; unsupported or resource-exhausted previews retain system and save actions",
      "file byte length alone does not disable preview; PDF and text use bounded Range reads, images use a reduced Native representation, and Office has independent decoded-resource budgets",
      "Word and slides navigate pages; workbooks select sheets and navigate bounded row and column viewports",
      "native preview, external application opening and save-copy intents are distinct",
      "external copies preserve safe filename and extension, are byte-identical and cannot modify the verified cache",
      "a saved user copy survives Chat cache eviction",
      "closing detail, leaving Chat or switching conversation, actor or Station fences late access and OS callbacks"
    ]
  },
  "negative": [
    "Station-visible encrypted object descriptors must not contain voice duration or content kind",
    "stopping a recording must not send before local preview confirmation",
    "a resumable attachment transfer must not be represented as live voice",
    "unverified ciphertext or a missing cache file must not be exposed to the media element",
    "Office external relationships, active content and embedded scripts must not execute or fetch remote resources",
    "closing or changing selection must terminate document workers and fence late decoder results",
    "cache-path readback and byte hashes cannot substitute for visible detail, native preview, external handoff or destination-picker proof",
    "unexecuted iOS, Android, Windows, Linux or cross-Station cells remain UNPROVEN",
    "compile, unit, API-only, or screenshot-only evidence cannot prove CHAT-J03"
  ]
}
