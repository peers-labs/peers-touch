{
  "id": "federation-operational-observability",
  "status": "active",
  "product_area": "federation",
  "owners": [
    "apps/station/app/subserver/dashboard/**",
    "apps/station/app/subserver/federation/**",
    "tooling/acceptance/gates/dashboard/federation_operational_drilldown.py"
  ],
  "truth_sources": [
    "federation_ledger_events",
    "federation_ledger_sync_cursors",
    "federation_operational_events",
    "FederationOperationalProjection"
  ],
  "visible_surfaces": [{"type": "dashboard", "route": "/dashboard/#/federation"}],
  "required_gates": ["station-dashboard-unit", "federation-dashboard-operational-drilldown"],
  "acceptance": {
    "service": [
      "operations API returns summary sync recovery discovery recent events and persisted operational events",
      "sync issues are derived from persisted sync cursors",
      "recovery readiness is derived from sequencer and unreachable cursor facts",
      "discovery derives persisted manifest and discovery observations when operational events exist"
    ],
    "visible": [
      "Dashboard shows Operational Health",
      "Dashboard shows Sync Drilldown Recovery Drilldown and Discovery Drilldown",
      "Dashboard shows Operational Event History",
      "Dashboard states that discovery hint is not membership truth"
    ]
  },
  "negative": [
    "Dashboard must not mutate federation governance truth",
    "discovery hint must not be displayed as membership trust",
    "gateway smoke must not be treated as Desktop DOM-level UI E2E"
  ]
}
