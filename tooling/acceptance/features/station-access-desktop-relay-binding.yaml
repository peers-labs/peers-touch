{
  "version": 1,
  "id": "station-access-desktop-relay-binding",
  "domain": "station-access",
  "status": "active",
  "owners": [
    "apps/desktop/src-tauri/src/application/station_binding/**",
    "apps/desktop/src-tauri/src/infrastructure/station_client.rs",
    "apps/desktop/src-tauri/src/infrastructure/station_discovery.rs",
    "apps/desktop/src-tauri/src/infrastructure/station_registry.rs",
    "apps/desktop/src-tauri/src/infrastructure/station_transport.rs",
    "apps/desktop/src-tauri/src/interface/tauri_commands/station.rs",
    "apps/desktop/src/acceptance/stationAccess.ts",
    "apps/desktop/src/acceptance/station_access/**",
    "apps/desktop/src/components/common/StationPicker.tsx",
    "tooling/acceptance/gates/station_access/desktop_relay_native_e2e.py"
  ],
  "truth_sources": [
    "signed AccessEndpointResponse",
    "Station-signed route attestation",
    "station_peer_id keyed Desktop registry",
    "Station-owned inner TLS SPKI",
    "native client binding proof"
  ],
  "visible_surfaces": [
    {
      "type": "desktop",
      "route": "Station picker Direct and Via Relay routes"
    },
    {
      "type": "desktop",
      "route": "persisted Station route recovery"
    }
  ],
  "required_gates": [
    "station-access-desktop-relay-native-e2e",
    "station-access-desktop-relay-windows-e2e"
  ],
  "acceptance": {
    "service": [
      "Desktop verifies signed Station identity before selecting a route",
      "Relay WSS carries canonical protobuf frames and Station-owned TLS 1.3",
      "registry identity remains station_peer_id while Direct and Relay are route candidates",
      "same-Station route switching advances route revision without changing lifecycle generation",
      "stale transport results are fenced by the current route lease"
    ],
    "surface": [
      "installed macOS and sixwin Windows Desktop show Via Relay while connected through the one Linux Relay",
      "the persisted Relay route recovers after native process restart"
    ]
  },
  "negative": [
    "URL is never the Station identity owner",
    "Relay has no separate client registry or user-facing administration surface",
    "unsigned health or bootstrap metadata cannot create a Station binding",
    "web-only evidence cannot satisfy either native Desktop Gate"
  ]
}
