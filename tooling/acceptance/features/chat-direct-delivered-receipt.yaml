  "acceptance": {
    "service": [
      "a locally published bundle is reconciled when Station public material is missing",
      "reconciliation persists fresh OPKs before upload and retries the exact batch",
      "current-profile native clients retain one isolated Device Engine state across repeated Gate runs",
      "a fresh Direct receiver checkpoints only the verified public predecessor before decrypting the current private delivery",
      "successful Direct decrypt atomically persists one typed DELIVERED receipt",
      "receipt submission failure remains pending for lifecycle retry",
      "Station routing failure is returned to the Desktop worker",
      "Direct receipt aggregation uses immutable authority delivery commitments for current endpoints outside the Group MLS device projection",
      "a committed recipient read cursor preserves monotonic delivered state without fabricating a device receipt",
      "typed Conversation interaction failures preserve their stable code and safe details at the HTTP boundary",
      "a retained submitted command converges to accepted, failed, or superseded canonical truth before new Native sends",
      "NOT_FOUND retries the exact command identity and bytes; a later stale delivery plan supersedes only that transport attempt while preserving the logical message identity"
    ],
    "visible": [
      "Alice sends one Direct message and Bob renders the exact plaintext",
      "Alice's native message row advances from sent to delivered after Bob decrypts",
      "the same journey works in the reverse Bob-to-Alice direction"
    ]
  },
  "negative": [
    "reconciliation must not republish or reactivate a consumed one-time prekey",
    "current-profile Gate cleanup must not roll a reused device back to an older private-key state",
    "receiver checkpoint failure must prevent private delivery consumption and ACK",
    "receiver activation checkpoint must not synthesize historical plaintext, session, cursor, marker, or receipt state",
    "queue consumption ACK must not be reported as a user-visible DELIVERED receipt",
    "Direct receipt aggregation must not require current endpoints to exist in conversation_member_devices",
    "Group receipt aggregation must still reject a missing committed MLS member device",
    "read-ahead repair must not fabricate consumed-device or fully-delivered counts",
    "typed Conversation interaction failures must not collapse into generic HTTP 500 responses",
    "static or gateway evidence must not replace two native Desktop clients",
    "receipt evidence must not expose plaintext, credentials, tokens, or key material",
    "NOT_FOUND submitted-command recovery must not mint a replacement command or message identity",
    "stale-delivery-plan recovery must not reuse stale ciphertext or replace the logical message identity"
  ]
}
