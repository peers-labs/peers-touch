{
  "version": 1,
  "id": "station-access-wire-contract",
  "domain": "station-access",
  "status": "active",
  "owners": [
    "docs/architecture/engineering/api-governance/station-api-capabilities.yaml",
    "model/domain/peer/station_identity.proto",
    "model/domain/access_gate/access_gate.proto",
    "apps/station/frame/touch/accessgate/**",
    "apps/station/frame/touch/actor_handler.go",
    "apps/desktop/src-tauri/src/application/auth/**",
    "apps/mobile/src-tauri/src/runtime/oauth/**"
  ],
  "truth_sources": [
    "signed StationIdentityStatement",
    "Station AccessAttempt and AccessDecision",
    "station-api-capabilities.yaml"
  ],
  "visible_surfaces": [
    {"type": "desktop", "route": "access-gate"},
    {"type": "mobile", "route": "access-gate"}
  ],
  "required_gates": [
    "proto-build",
    "station-api-ownership",
    "station-access-capability-contract"
  ],
  "acceptance": {
    "service": [
      "Station identity and Access Gate routes have one reviewed owner and generated protobuf contract",
      "Desktop and Mobile send application/protobuf and decode generated response types"
    ],
    "surface": [
      "both clients expose the same supported gate and typed failure outcomes"
    ]
  },
  "negative": [
    "clients must not call the retired direct login route or command",
    "Access response bytes must not pass through a JSON compatibility parser",
    "attempt scope must not omit Station, device, lifecycle generation, schema, or submission identity"
  ]
}
