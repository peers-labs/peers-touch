{
  "id": "mobile-command-draft-recovery",
  "status": "active",
  "product_area": "mobile",
  "owners": [
    "model/domain/mobile/reliability.proto",
    "model/domain/social/relationship.proto",
    "apps/station/app/subserver/social/**",
    "apps/mobile/src/runtimes/commandRuntime.ts",
    "apps/mobile/src/features/chat/chatCommands.ts",
    "apps/mobile/src/features/social/contactCommands.ts",
    "apps/mobile/src/pages/MomentsPage.tsx",
    "apps/mobile/src/pages/moments/**",
    "apps/mobile/src-tauri/src/messaging/engine.rs",
    "apps/mobile/src-tauri/src/messaging/transport.rs",
    "apps/mobile/src-tauri/src/runtime/command_ledger/**",
    "apps/mobile/src-tauri/src/runtime/draft_store/**",
    "apps/mobile/src-tauri/src/runtime/reliability/**"
  ],
  "truth_sources": ["Station mutation outcome readback", "Mobile Rust encrypted command ledger", "Mobile Rust encrypted draft store"],
  "visible_surfaces": [{"type": "mobile", "state": "pending-or-unknown-command"}, {"type": "mobile", "state": "draft-restored"}],
  "required_gates": [
    "mobile-contract-static",
    "mobile-hard-cut-static",
    "mobile-simulator-recovery-e2e"
  ],
  "acceptance": {
    "product_assertions": ["MS-PA07", "MS-PA08", "MS-PA23", "MS-PA26"],
    "visible": ["same-Station uncertain writes converge before retry and exact-scope drafts survive restart"]
  },
  "negative": [
    "non-idempotent writes must not replay blindly",
    "Social and native layers must not persist a second queue",
    "production features and pages must not use string/JSON or best-effort durable admission",
    "same-Station evidence must not be promoted to cross-Station or Relay-backed recovery"
  ]
}
