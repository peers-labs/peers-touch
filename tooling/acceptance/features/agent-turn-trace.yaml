{
  "id": "agent-turn-trace",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/agent/handler/turn_handler.go",
    "apps/station/app/subserver/agent/service/turn_service.go",
    "apps/station/app/subserver/agent/service/turn_evidence_service.go",
    "apps/station/app/subserver/agent/service/growth_metrics_service.go",
    "apps/desktop/src/services/desktop_api.ts"
  ],
  "truth_sources": [
    "running Station agent API",
    "agent_turn_traces table",
    "agent_turn_attempts.usage_json",
    "agent_user_feedback table",
    "Station-generated TurnDiagnosticReplay"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/agent/turn/trace/list"},
    {"type": "api", "route": "/agent/turn/trace/get"},
    {"type": "api", "route": "/agent/turn/diagnostics/export"},
    {"type": "api", "route": "/agent/growth/feedback"},
    {"type": "api", "route": "/agent/growth/feedback/turn/list"}
  ],
  "required_gates": ["agent-v2-kernel-foundation-e2e"],
  "acceptance": {
    "service": [
      "trace list and get are scoped to the authenticated actor",
      "attempt usage remains bound to the exact turn, attempt, provider, model, and tool call lineage",
      "feedback create returns the persisted record and exact-turn readback is actor isolated",
      "diagnostics export reconstructs Station facts without client-derived replay authority"
    ],
    "visible": [
      "turn trace inspector in Desktop shows step-by-step execution with latency per span",
      "token usage breakdown is visible per turn in the conversation detail view"
    ]
  },
  "negative": [
    "trace and diagnostics must not include raw credentials, secrets, message content, or local paths",
    "export must redact disallowed PII and never expose attachment encryption material",
    "trace collection must not measurably increase turn latency"
  ]
}
