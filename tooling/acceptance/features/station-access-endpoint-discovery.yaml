{
  "version": 1,
  "id": "station-access-endpoint-discovery",
  "domain": "station-access",
  "status": "active",
  "owners": [
    "model/domain/peer/access_endpoint.proto",
    "apps/station/frame/core/plugin/native/subserver/bootstrap/access_endpoint.go",
    "apps/station/frame/core/plugin/native/subserver/bootstrap/accessendpoint/**",
    "apps/station/frame/core/plugin/native/subserver/relay/application/discovery.go",
    "apps/station/frame/core/plugin/native/subserver/relay/handler_discovery.go",
    "apps/station/frame/core/plugin/native/subserver/relay-client/connection_material.go",
    "apps/station/app/subserver/dashboard/handler.go",
    "apps/station/app/subserver/dashboard/subserver.go",
    "tooling/acceptance/gates/station_access/relay_endpoint_discovery_contract.py"
  ],
  "truth_sources": [
    "Station host identity",
    "Relay endpoint signing identity",
    "current Relay mount generation",
    "Station-signed route attestation and connection grant"
  ],
  "visible_surfaces": [
    {
      "type": "client",
      "route": "POST /.well-known/peers-touch/access"
    },
    {
      "type": "peer",
      "route": "POST /api/v1/relay/routes"
    },
    {
      "type": "peer",
      "route": "POST /api/v1/relay/grants"
    },
    {
      "type": "operator",
      "route": "POST /dashboard/api/relay/connection-material"
    }
  ],
  "required_gates": [
    "proto-build",
    "station-api-ownership",
    "relay-endpoint-discovery-contract"
  ],
  "acceptance": {
    "service": [
      "Station and Relay return challenge-bound signed endpoint roles through one protobuf contract",
      "Relay exposes only unexpired public routes whose mount generation is current",
      "private connection grants are registered before use and consumed atomically",
      "authenticated Dashboard operators invoke the relay-client issuer through a strict protobuf contract with no-store and no-referrer response policy",
      "generated Go, Desktop TypeScript, and Mobile TypeScript bindings derive from one proto"
    ],
    "surface": [
      "one candidate, multiple candidates, no candidate, expired grant, replay, wrong Relay, and forged Station have typed outcomes"
    ]
  },
  "negative": [
    "URL shape, redirects, health responses, and unsigned metadata never determine endpoint role",
    "Relay cannot self-sign a Station route",
    "private routes never appear in public discovery",
    "connection material never appears in URL query, Referer, analytics, errors, or logs"
  ]
}
