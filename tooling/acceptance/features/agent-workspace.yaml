{
  "id": "agent-workspace",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/agent/handler/workspace_handler.go",
    "apps/station/app/subserver/agent/handler/workspace_oss_handler.go",
    "apps/station/app/subserver/agent/service/workspace_service.go",
    "apps/desktop/src/store/agentWorkspace.ts"
  ],
  "truth_sources": [
    "Station workspace persistence",
    "Station workspace file tree",
    "OSS object storage backend"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/agent/workspace/create"},
    {"type": "api", "route": "/agent/workspace/get"},
    {"type": "api", "route": "/agent/workspace/list"},
    {"type": "api", "route": "/agent/workspace/update"},
    {"type": "api", "route": "/agent/workspace/delete"},
    {"type": "api", "route": "/agent/workspace/files"},
    {"type": "api", "route": "/agent/workspace/diff"},
    {"type": "api", "route": "/agent/workspace/commit"},
    {"type": "api", "route": "/agent/workspace/files/delete"}
  ],
  "required_gates": ["agent-workspace-e2e"],
  "acceptance": {
    "service": [
      "creating a workspace provisions an isolated file namespace for the agent",
      "listing workspaces returns all workspaces owned by the current agent",
      "workspace files can be listed with their metadata and diff against previous commits",
      "committing changes creates an immutable snapshot of the workspace state",
      "deleting a workspace removes all associated files and metadata"
    ],
    "visible": [
      "the Desktop workspace panel shows file tree with change indicators",
      "file diff view renders additions and deletions with syntax highlighting",
      "commit history is navigable and shows author, timestamp, and change summary"
    ]
  },
  "negative": [
    "workspace operations must not cross agent boundaries — one agent cannot access another's workspace",
    "deleting files must not affect committed snapshots",
    "workspace must not accept files exceeding the configured size limit without error"
  ]
}
