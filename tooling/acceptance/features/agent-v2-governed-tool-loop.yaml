{
  "id": "agent-v2-governed-tool-loop",
  "status": "active",
  "initial_proof_status": "UNPROVEN",
  "product_area": "agent",
  "owners": [
    "model/domain/agent/turn_stream.proto",
    "apps/station/app/subserver/agent/**/tool*",
    "apps/desktop/src/components/messages/ToolCallCard.tsx",
    "apps/desktop/src/runtimes/toolRuntime.ts"
  ],
  "truth_sources": [
    "Station policy decision and ToolCall decision, claim, receipt, result, and fence revisions"
  ],
  "visible_surfaces": [
    {"type": "native-tauri", "surface": "Governed Tool approval and result cards"},
    {"type": "station-readback", "surface": "ToolCall lineage and terminal state"}
  ],
  "required_gates": ["agent-v2-governed-tool-loop-e2e"],
  "acceptance": {
    "service": [
      "one authoritative decision produces at most one claimed execution and one terminal result",
      "crash, timeout, cancel, revoke, disconnect, and replay settle through fenced idempotent semantics"
    ],
    "visible": [
      "the user can approve or deny once and see the exact authoritative result",
      "unknown side effects and retryability expose a safe next action"
    ]
  },
  "negative": [
    "process exit, client waiter state, or duplicate events must not infer terminal success",
    "PREPARED or UNKNOWN_SIDE_EFFECT work must not be blindly repeated",
    "missing executor receipts, side-effect counts, replay, or cleanup keeps the Gate UNPROVEN"
  ]
}
