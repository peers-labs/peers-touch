{
  "id": "agent-attachment-reference",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "model/domain/agent/agent.proto",
    "apps/station/app/subserver/agent/handler/turn_handler.go",
    "apps/station/app/subserver/agent/service/attachment_admission_service.go",
    "apps/station/app/subserver/agent/service/runtime_admission_service.go",
    "apps/station/app/subserver/oss/service/file_service.go",
    "apps/desktop/src/services/agentAttachments.ts",
    "apps/desktop/src/components/composer/useAgentAttachmentDrafts.ts",
    "apps/desktop/src/components/composer/AttachmentStage.tsx",
    "tooling/acceptance/gates/agent/native_agent_runner.py",
    "tooling/acceptance/provisioners/home_station.py"
  ],
  "truth_sources": [
    "Station ExecuteTurnRequest.attachments and persisted AgentMessage.attachments",
    "Station attachment admission and ContextLedger attribution",
    "Actor-private OSS object metadata and bytes"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/agent/turn/execute (with attachments)"},
    {"type": "api", "route": "/agent/workspace/oss/upload"},
    {"type": "api", "route": "/agent/workspace/oss/download"}
  ],
  "required_gates": ["agent-attachment-e2e"],
  "acceptance": {
    "service": [
      "a user can attach files to a message and the agent receives them as part of the turn context",
      "attached files are uploaded to OSS and referenced by stable URIs in the turn config",
      "the pre-admission check rejects invalid file types and records explicit omission when the selected model or provider adapter cannot consume an otherwise valid attachment",
      "attachment metadata (name, size, mime type) is persisted alongside the message",
      "attachments are downloadable from conversation history"
    ],
    "visible": [
      "the composer shows an attach button that opens a file picker",
      "selected files appear as chips in the composer with size and type indicators",
      "unsupported file types show an inline error explaining the capability gap",
      "sent messages with attachments display file thumbnails or icons inline",
      "clicking an attachment in history opens a preview or triggers download"
    ]
  },
  "negative": [
    "attachments must not be sent to a provider that does not support the file's mime type; omission must remain explicit and attributed",
    "upload failure must not silently proceed — the message must not send until upload completes or errors",
    "attachment URIs must not be guessable — they require authenticated access"
  ]
}
