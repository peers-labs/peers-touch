{
  "id": "agent-follow-up-suggestions",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/agent/service/turn_service.go",
    "apps/station/app/subserver/agent/handler/turn_handler.go",
    "apps/desktop/src/store/chat.ts",
    "apps/desktop/src/store/streaming/handler.ts"
  ],
  "truth_sources": [
    "Station GenerateFollowUpSuggestions (turn_service.go)",
    "turn_stream.proto follow_up_suggestions event field",
    "Desktop store.followUpSuggestions state"
  ],
  "visible_surfaces": [
    {"type": "sse", "route": "/agent/chat/stream (done event follow_up_suggestions)"},
    {"type": "ui", "surface": "Follow-up suggestion chips below message"}
  ],
  "required_gates": ["agent-follow-up-e2e"],
  "acceptance": {
    "service": [
      "after a turn completes, the server generates up to 3 follow-up suggestions using the agent's provider",
      "follow-up suggestions are delivered in the SSE done event as follow_up_suggestions field",
      "suggestions are contextually relevant to the conversation content"
    ],
    "visible": [
      "follow-up suggestion chips appear below the assistant's completed message",
      "clicking a suggestion fills the composer input without sending",
      "suggestions disappear when the user starts typing a new message"
    ]
  },
  "negative": [
    "follow-up generation failure must not block or delay the turn completion — silent absence when generation fails is acceptable, no error indicator is required",
    "suggestions must not appear during streaming — only after the turn reaches terminal state",
    "clicking a suggestion must not auto-send — it only fills the input"
  ]
}
