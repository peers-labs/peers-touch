{
  "id": "chat-service-contract",
  "status": "active",
  "product_area": "chat",
  "owners": [
    "model/domain/chat/**",
    "apps/station/app/subserver/messaging/**",
    "apps/station/app/subserver/conversation/**",
    "apps/station/app/subserver/envelope/**"
  ],
  "truth_sources": [
    "model/domain/chat/*.proto",
    "messaging device registry",
    "conversation event log",
    "per-device messaging queue"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/messaging/conversation/direct"},
    {"type": "api", "route": "/messaging/conversation/list"},
    {"type": "api", "route": "/messaging/command/submit"},
    {"type": "api", "route": "/messaging/queue/claim"},
    {"type": "api", "route": "/messaging/queue/ack"}
  ],
  "required_gates": ["proto-build", "station-messaging-unit", "messaging-platform-contract"],
  "acceptance": {
    "service": [
      "chat proto sources regenerate derived contracts",
      "messaging, conversation, and envelope package tests pass",
      "the messaging platform contract preserves device, queue, conversation, and crypto ownership"
    ],
    "visible": [
      "chat API contracts remain compatible with the Desktop messaging engine"
    ]
  },
  "negative": [
    "removed friend-chat and group-chat Station routes must not reappear",
    "Station must not accept plaintext as a substitute for client-prepared encrypted payloads",
    "chat messages must not be stored as Federation governance truth",
    "notification or realtime transport must not become chat persistence truth"
  ]
}
