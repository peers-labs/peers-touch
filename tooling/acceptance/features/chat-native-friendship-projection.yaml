  "acceptance": {
    "service": [
      "Desktop derives friendship only from the intersection of Station followers and following",
      "Station refreshes an existing remote-cached Actor by canonical PTID without overwriting local ownership or merging same-name Actors",
      "relationship projections carry federated handle, Home Station domain, and Home Station peer ID",
      "socialRealtime refreshes mutual friendship at bootstrap, after relationship events, during cold resync, and during periodic reconciliation",
      "socialRealtime refreshes Home-Station peer profiles for mutual friends even before a Direct conversation exists",
      "relationship pagination cannot omit mutual friends beyond the first page"
    ],
    "visible": [
      "seeded mutual friends appear in Contacts without requiring a prior Direct conversation or friend-request record",
      "same-name contacts remain separate by PTID and show their Federation plus Home Station identity",
      "Federation and Home Station render as separate readable labels without clipping the Station value",
      "one Actor PTID uses the same authoritative avatar source in Contacts, Create Group, search, and conversation rows",
      "clicking Message for a mutual friend opens or creates the Direct conversation for that exact peer PTID and never leaves the previously active peer visible",
      "seeded mutual friends appear as selectable Create Group members",
      "Create Group remains open with its selected PTIDs, typed inline error, and Retry action when preparation fails",
      "an accepted Group may render as establishing until the creator Device Inbox projects it, then becomes visible with the exact member set on all three clients",
      "a restarted member restores the same device identity, ready MLS state, Group projection, and decrypted message",
      "Find People renders an existing mutual friend as Friends and disables duplicate friend-request submission"
    ]
  },
  "negative": [
    "Direct conversation history and accepted friend-request history must not define friendship truth",
    "a failed Direct creation must render the selected peer's failure state instead of falling through to a stale active conversation",
    "multiple available federations must not be resolved by first-item fallback",
    "contacts must not be deduplicated by display name",
    "components must not define a second avatar or display-name precedence",
    "Federation and Home Station must not collapse into one ellipsized line that hides the distinguishing Station value",
    "a failed Group preparation must not close the dialog or discard its selected PTIDs",
    "a temporary creator projection delay must not be reported as Group creation failure",
    "page or modal mount effects must not own friendship projection freshness",
    "static or unit evidence must not be reported as Native DOM proof"
  ]
}
