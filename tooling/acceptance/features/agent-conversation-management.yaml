{
  "id": "agent-conversation-management",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/agent/handler/conversation_handler.go",
    "apps/station/app/subserver/agent/service/conversation_service.go",
    "apps/desktop/src/store/agent.ts",
    "apps/desktop/src/services/desktop_api.ts"
  ],
  "truth_sources": [
    "running Station agent API",
    "agent_conversations table",
    "agent_messages table"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/agent/conversations"},
    {"type": "api", "route": "/agent/conversations/:id"},
    {"type": "api", "route": "/agent/conversations/create"},
    {"type": "api", "route": "/agent/conversations/:id/update"},
    {"type": "api", "route": "/agent/conversations/:id/archive"},
    {"type": "api", "route": "/agent/conversations/:id/messages"},
    {"type": "api", "route": "/agent/conversations/:id/events"},
    {"type": "api", "route": "/agent/conversations/:id/select-branch"},
    {"type": "api", "route": "/agent/conversations/:id/message-tombstone"}
  ],
  "required_gates": ["agent-conversation-e2e"],
  "acceptance": {
    "service": [
      "listing conversations returns all non-archived conversations for the agent sorted by last activity",
      "get conversation returns full metadata including title, agent_id, created_at, and message count",
      "create conversation initializes an empty conversation bound to a specific agent",
      "update conversation persists title and metadata changes atomically",
      "archive conversation soft-deletes the conversation and excludes it from list results",
      "messages endpoint returns paginated messages in chronological order with branch info",
      "events endpoint returns conversation-level events (title changes, archive, branch switches)",
      "select-branch switches the active branch and subsequent message fetches reflect the new branch",
      "message-tombstone marks a message as deleted without removing it from storage"
    ],
    "visible": [
      "conversation list in Desktop shows title, last message preview, and timestamp",
      "archived conversations disappear from the active list",
      "tombstoned messages display a deleted placeholder in the conversation surface"
    ]
  },
  "negative": [
    "archiving a conversation must not permanently delete messages from storage",
    "selecting a non-existent branch must return an error, not silently create one",
    "tombstoning a message must not affect other messages in the same conversation"
  ]
}
