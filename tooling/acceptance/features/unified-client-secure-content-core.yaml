    ],
    "migration_assertions": [
      "Desktop and Mobile owner inventory maps every duplicated mechanism",
      "secure-content-operation-v1 schema migration is frozen before consumer cutover",
      "UCA-05 production consumers use the portable operation contract without dual write"
    ]
  },
  "negative": [
    "this source-only contract does not prove Desktop, iOS or Android product journeys",
    "Social and Conversation business authority must remain outside the core",
    "the Gate must fail if a production consumer bypasses the portable operation contract"
  ]
