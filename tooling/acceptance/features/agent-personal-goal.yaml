  "acceptance": {
    "service": [
      "Goal review validates admission completeness before making the contract read-only",
      "Goal admission commits REVIEWING to READY with expected revision and idempotency",
      "Goal admission creates no executable work",
      "Goal start atomically commits READY to RUNNING and creates one linked GoalNode, TaskRun, ExecutionStep, and attempt identity"
    ],
    "visible": [
      "Home shows material assumptions before Start",
      "Home shows the Station-authored admission rejection reason",
      "Home renders the authoritative RUNNING revision",
      "Home shows the first canonical TaskRun and exposes its Station identifiers after selection"
    ]
  },
  "negative": [
    "Desktop must not infer READY or RUNNING without Station readback",
    "stale, unauthorized, incomplete, or non-ready input must not start a Goal",
    "Goal start must not create AgentTask or CollaborationTask execution rows",
    "A failed TaskRun allocation must leave the Goal non-running",
    "source proof does not replace the required PAOS-J01 Native functional run"
  ]
