{
  "id": "mobile-chat-contacts-groups",
  "status": "active",
  "product_area": "mobile",
  "owners": [
    "apps/mobile/src/features/chat/**",
    "apps/mobile/src/features/social/**",
    "apps/mobile/src/runtimes/messagingRuntime.ts",
    "apps/mobile/src/components/BoundedList.tsx",
    "apps/mobile/src/components/boundedListRange.ts",
    "apps/mobile/src/runtimes/socialEventIngress.ts",
    "apps/mobile/src/runtimes/socialProjectionRuntime.ts",
    "apps/mobile/src/runtimes/runtimeRegistry.ts",
    "apps/mobile/src/services/gateways/socialGateway.ts",
    "apps/mobile/src/pages/ChatPage.tsx",
    "apps/mobile/src/pages/ContactsPage.tsx"
  ],
  "truth_sources": ["Station conversation and relationship domains", "shared Mobile Social projection ingress"],
  "visible_surfaces": [{"type": "mobile", "route": "chat"}, {"type": "mobile", "route": "contacts"}],
  "required_gates": ["mobile-simulator-social-convergence-e2e", "mobile-simulator-chat-contacts-e2e"],
  "acceptance": {
    "product_assertions": ["MS-PA06", "MS-PA09", "MS-PA10", "MS-PA18", "MS-PA19"],
    "visible": ["two actors on one Station can complete Chat, contact, and group journeys with authoritative readback"]
  },
  "negative": [
    "Messaging runtime must not open a second Station event stream",
    "empty state must not hide an error state",
    "render windows must not permanently hide requests, contacts, groups, members, or message history",
    "message search and thread counts must not depend on mounted rows",
    "pagination must not publish partial or stale-account relationship snapshots",
    "opaque encrypted object media type must not replace private attachment filename or MIME type in sender and receiver projections",
    "same-Station evidence must not be promoted to cross-Station or Relay-backed delivery"
  ]
}
