  "required_gates": [
    "proto-build",
    "station-api-ownership",
    "station-messaging-unit",
    "messaging-platform-contract",
    "desktop-check",
    "chat-native-visible-static",
    "chat-native-group-mls-e2e"
  ],
  "acceptance": {
    "service": [
      "friends_direct_add is the revision-fenced default and non-friends are denied",
      "friends_require_confirmation creates one durable invitation and no authority plan, membership, MLS commit, Welcome, session, or recovery entitlement before acceptance",
      "acceptance creates a source-bound grant and remains accepted_waiting_for_mls until an authorized member commits the bound membership transition",
      "the committed authority event atomically advances the Home Station grant and invitation to joined with one fulfillment transition identity",
      "a rejected-group entry denies both direct add and invitation creation",
      "leave-and-reject persists rejection before one exact signed leave intent and reaches completed only after the authoritative leave transition",
      "a failed delegated leave retains the same operation, rejection, intent when available, and retry state across restart"
    ],
    "visible": [
      "the receiver sees one pending invitation with accept and decline actions while the Group is absent",
      "after accept, the invitation visibly remains waiting and the Group is still absent",
      "after authorized fulfillment, the receiver sees the ready Group and the invitation reaches joined",
      "leave presents separate normal and leave-and-reject actions",
      "partial leave-and-reject appears in Privacy as rejection-active with a retry action",
      "restart preserves the same operation and retry state; successful retry removes membership and retains the rejected Group"
    ]
  },
  "negative": [
    "confirmation-required admission must not prepare or emit MLS material before acceptance",
    "notification read or deletion must not decide an invitation",
    "acceptance must not be projected as membership before the bound authority event commits",
    "a mutable preference revision or rejected Group must not be bypassed by grant replay",
    "leave failure must not roll back rejection or render false left/completed state",
    "retry must not allocate a second logical leave operation or replace a persisted leave intent",
    "static, Harness, unit, prototype, or API-only evidence must not be reported as Native proof"
  ]
}
