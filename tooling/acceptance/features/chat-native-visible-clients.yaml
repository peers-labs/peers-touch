{
  "version": 1,
  "id": "chat-native-visible-clients",
  "domain": "chat",
  "status": "active",
  "owners": ["acceptance-framework", "chat"],
  "source_paths": [
    "tooling/acceptance/gates/chat/native_*_runner.py",
    "tooling/acceptance/gates/chat/native_support.py",
    "tooling/acceptance/gates/chat/native_two_client_e2e.py",
    "tooling/acceptance/gates/chat/native_current_profile_two_client_*.py",
    "tooling/acceptance/gates/chat/lifecycle_onboarding*.py",
    "tooling/acceptance/gates/chat/*_test.py",
    "tooling/acceptance/playbooks/chat-native-visible-clients.md",
    "apps/desktop/src/acceptance/chat/**",
    "apps/desktop/src-tauri/src/application/profile/mod.rs",
    "apps/desktop/src/kernel/identityRuntime.ts",
    "apps/desktop/src/pages/login/LoginPage.tsx",
    "apps/desktop/src/pages/login/views/**",
    "apps/desktop/src/components/common/SquareAvatar.tsx",
    "apps/desktop/src/components/chat/**",
    "apps/desktop/src/components/profile/PublicProfileCard.tsx",
    "packages/prototypes/desktop/features/social-chat/**",
    "apps/desktop/src/store/federation.ts",
    "apps/desktop/src/store/socialChat.ts",
    "apps/desktop/src/services/chatPresence.ts",
    "apps/desktop/src/store/friendshipProjection.ts",
    "apps/desktop/src/store/socialNormalizers.ts",
    "apps/desktop/src/runtimes/federationRuntime.ts",
    "apps/desktop/src/components/settings/RecoverySettings.tsx",
    "apps/desktop/src/components/common/StationPicker.tsx",
    "apps/desktop/src/pages/login/views/**",
    "apps/station/app/conf/actor.yml",
    "apps/station/frame/touch/actor/seed.go",
    "apps/station/app/subserver/conversation/application/command/projections.go",
    "packages/messaging-core/src/store/schema.rs"
  ],
  "required_gates": [
    "chat-native-visible-static",
    "chat-lifecycle-onboarding-e2e",
    "chat-lifecycle-direct-e2e",
    "chat-native-current-profile-two-client-e2e",
    "chat-native-two-client-e2e",
    "chat-native-multi-device-e2e",
    "chat-native-recovery-e2e",
    "chat-native-group-mls-e2e"
  ],
  "acceptance": {
    "product_truths": [
      "visible native Desktop clients use isolated profiles, ports, storage roots, and observer sockets",
      "current-profile parity proof launches peers-group-chat and peers-chat-high-chat as distinct synchronized worktrees, with peers-group-chat initiating the journey",
      "a restorable native account cold-launches into the authenticated shell without provider credentials, while PIN-protected and sessionless accounts retain their distinct gates",
      "native onboarding starts from canonical stranger state, shows stable local, federated-handle, and Station-scoped identity, and converges through reject, retry, accept, one Direct conversation, and exact plaintext",
      "CHAT-UR08: Native Contacts consolidates request attempts by counterparty PTID, exposes current state and attempt count, and keeps terminal history selectable",
      "CHAT-UR09: Native contact identity renders the authoritative Station name in summaries and exposes raw identity values only in expandable copyable details",
      "CHAT-UR10: Direct Chat renders authoritative Station names and snapshot-plus-event presence, while keeping raw IDs in expandable technical details",
      "CHAT-UR11: Local background selection previews immediately while upload and durable persistence continue asynchronously, with rollback and retry on failure",
      "CHAT-UR12: Message search targets canonical Conversation projections, finds known durable plaintext, and keeps the clear affordance inside the input boundary",
      "CHAT-UR13: Clear history and restore within 24 hours converge on the authoritative marker and reproject the same durable messages",
      "a persistent current-profile client explicitly authenticates its assigned actor even when a prior session restores",
      "Station and every client record matching commit and canonical proto digest with workspace identity",
      "direct multi-device recovery and MLS journeys emit bounded boundary telemetry and stop on first failure",
      "failed message submission clears acceptance-injected composer text",
      "a newly sent optimistic message row is placed above the visible composer on its first rendered frame and remains clear as timestamp and receipt projections settle",
      "unresolved local drafts remain at their creation position relative to newer committed authority messages",
      "seeded Alice, Bob, and Carol avatars render as the standard rounded-square shape from bundled full-bleed image data without an external image origin",
      "retained custom avatars preserve their canonical Home-Station URL and render from the Desktop local asset cache",
      "the same Actor PTID renders the same signed Home-Station avatar source on every Native client"
    ],
    "surfaces": [
      {"type": "native-desktop", "selector": "[data-pt-text-input=\"chat-composer\"]"},
      {"type": "native-desktop", "selector": "[data-chat-composer]"},
      {"type": "native-desktop", "selector": "[data-chat-message-timeline]"},
      {"type": "native-desktop", "selector": "[data-chat-message-bottom-sentinel]"},
      {"type": "native-desktop", "selector": "[data-message-ulid]"},
      {"type": "native-desktop", "selector": "[data-chat-avatar-src]"},
      {"type": "native-desktop", "selector": "[data-chat-find-people-result]"},
      {"type": "native-desktop", "selector": "[data-chat-friend-request-id]"},
      {"type": "native-desktop", "selector": "[data-chat-profile-technical-details]"},
      {"type": "native-desktop", "selector": "[data-chat-station=\"authority\"]"},
      {"type": "native-desktop", "selector": "[data-chat-presence-tag]"},
      {"type": "native-desktop", "selector": "[data-chat-background-preview]"},
      {"type": "native-desktop", "selector": "[data-chat-message-search-input]"},
      {"type": "native-desktop", "selector": "[data-chat-history-action=\"restore\"]"},
      {"type": "native-desktop", "selector": "[data-chat-contact-message]"},
      {"type": "native-desktop", "selector": "[data-session-security]"},
      {"type": "native-desktop", "selector": "[data-group-security]"}
    ]
  },
  "constraints": [
    "live journeys must launch through make desktop",
    "two clients launched from one worktree cannot prove current-profile cross-worktree parity",
    "a restored authenticated actor must not be silently reused as the Gate's requested actor",
    "the renderer must not downgrade a native restorable session to provider reauthentication",
    "an existing relationship may be normalized only through production Social commands; fixture or client state must not fabricate stranger, pending, rejected, or accepted state",
    "the onboarding Gate must not pre-create a Direct conversation or substitute gateway-only relationship evidence for Native UI",
    "fixed sleeps and startup-order assumptions are forbidden",
    "seeded demo avatars must not depend on an HTTP or HTTPS image-generation service",
    "seeded avatar assets must not bake in a circular mask that overrides the shared UserSquareAvatar radius",
    "a Station must not rewrite another Home Station's cached Actor profile by username",
    "pending or failed local drafts must not be appended after newer committed authority events",
    "the composer must not occlude any part of the newest message row, including during post-send scroll positioning",
    "raw Station peer IDs must not be primary Direct Chat labels and unknown presence must not be rendered as online or offline",
    "local background preview must not wait for upload or persist a local filesystem reference",
    "message search must not derive targets from retired legacy session/group arrays",
    "history restore must not bypass the 24-hour authority window or report an accepted command as failed because projection refresh lagged",
    "missing stale partial API-only browser-only or dirty-Station evidence fails closed"
  ]
}
