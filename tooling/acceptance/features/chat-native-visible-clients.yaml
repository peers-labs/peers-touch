{
  "version": 1,
  "id": "chat-native-visible-clients",
  "domain": "chat",
  "status": "active",
  "owners": ["acceptance-framework", "chat"],
  "source_paths": [
    "tooling/acceptance/gates/chat/native_*_runner.py",
    "tooling/acceptance/gates/chat/native_support.py",
    "tooling/acceptance/gates/chat/native_two_client_e2e.py",
    "tooling/acceptance/gates/chat/native_current_profile_two_client_*.py",
    "tooling/acceptance/gates/chat/*_test.py",
    "tooling/acceptance/playbooks/chat-native-visible-clients.md",
    "apps/desktop/src/acceptance/chat/**",
    "apps/desktop/src-tauri/src/application/profile/mod.rs",
    "apps/desktop/src/components/common/SquareAvatar.tsx",
    "apps/desktop/src/components/chat/**",
    "apps/desktop/src/components/settings/RecoverySettings.tsx",
    "apps/desktop/src/components/common/StationPicker.tsx",
    "apps/desktop/src/pages/login/views/**",
    "apps/station/app/conf/actor.yml",
    "apps/station/frame/touch/actor/seed.go"
  ],
  "required_gates": [
    "chat-native-visible-static",
    "chat-native-current-profile-two-client-e2e",
    "chat-native-two-client-e2e",
    "chat-native-multi-device-e2e",
    "chat-native-recovery-e2e",
    "chat-native-group-mls-e2e"
  ],
  "acceptance": {
    "product_truths": [
      "visible native Desktop clients use isolated profiles, ports, storage roots, and observer sockets",
      "current-profile parity proof launches peers-group-chat and peers-chat-high-chat as distinct synchronized worktrees, with peers-group-chat initiating the journey",
      "a persistent current-profile client explicitly authenticates its assigned actor even when a prior session restores",
      "Station and every client record matching commit and canonical proto digest with workspace identity",
      "direct multi-device recovery and MLS journeys emit bounded boundary telemetry and stop on first failure",
      "failed message submission clears acceptance-injected composer text",
      "a newly sent optimistic message row is placed above the visible composer on its first rendered frame and remains clear as timestamp and receipt projections settle",
      "unresolved local drafts remain at their creation position relative to newer committed authority messages",
      "seeded Alice, Bob, and Carol avatars render as the standard rounded-square shape from bundled full-bleed image data without an external image origin",
      "the same Actor PTID renders the same signed Home-Station avatar source on every Native client"
    ],
    "surfaces": [
      {"type": "native-desktop", "selector": "[data-pt-text-input=\"chat-composer\"]"},
      {"type": "native-desktop", "selector": "[data-chat-composer]"},
      {"type": "native-desktop", "selector": "[data-chat-message-timeline]"},
      {"type": "native-desktop", "selector": "[data-chat-message-bottom-sentinel]"},
      {"type": "native-desktop", "selector": "[data-message-ulid]"},
      {"type": "native-desktop", "selector": "[data-chat-avatar-src]"},
      {"type": "native-desktop", "selector": "[data-session-security]"},
      {"type": "native-desktop", "selector": "[data-group-security]"}
    ]
  },
  "constraints": [
    "live journeys must launch through make desktop",
    "two clients launched from one worktree cannot prove current-profile cross-worktree parity",
    "a restored authenticated actor must not be silently reused as the Gate's requested actor",
    "fixed sleeps and startup-order assumptions are forbidden",
    "seeded demo avatars must not depend on an HTTP or HTTPS image-generation service",
    "seeded avatar assets must not bake in a circular mask that overrides the shared UserSquareAvatar radius",
    "a Station must not rewrite another Home Station's cached Actor profile by username",
    "pending or failed local drafts must not be appended after newer committed authority events",
    "the composer must not occlude any part of the newest message row, including during post-send scroll positioning",
    "missing stale partial API-only browser-only or dirty-Station evidence fails closed"
  ]
}
