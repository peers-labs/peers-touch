  "negative": [
    "clients must not receive raw runtime-home paths or own process, session, epoch, or cleanup truth",
    "resume failure must not start a replacement session before confirmation",
    "reset replay must not execute cleanup twice or advance another epoch",
    "concurrent duplicate reset delivery must not run external cleanup twice",
    "cleanup failure must not admit a new Turn or delete the Conversation",
    "static, mock, prototype, or Direct Model evidence must not prove this Gate"
