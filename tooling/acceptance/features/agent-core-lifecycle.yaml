{
  "id": "agent-core-lifecycle",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/agent/handler/agent_handler.go",
    "apps/desktop/src/store/agent.ts",
    "apps/desktop/src/components/agent/workbench/TopicRail.tsx"
  ],
  "truth_sources": [
    "Station agent CRUD API",
    "Desktop agent store",
    "Station /sub-agent/agent/create + list + update"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/sub-agent/agent/create"},
    {"type": "api", "route": "/sub-agent/agent/list"},
    {"type": "api", "route": "/sub-agent/agent/update"},
    {"type": "ui", "surface": "Desktop AgentSidebar + button"},
    {"type": "ui", "surface": "Desktop AgentProfilePage"}
  ],
  "required_gates": ["agent-core-lifecycle-native-e2e"],
  "acceptance": {
    "service": [
      "first login with no agents triggers auto-create of a default 'assistant' agent",
      "clicking + button calls store.createAgent which persists to Station and returns the new agent",
      "selecting an agent sets it as active and loads its chat surface with a composer",
      "sending a message to a configured agent produces a streaming assistant response with content",
      "creating a new topic resets the conversation and starts a fresh session",
      "updating agent name persists to Station and refreshes the sidebar listing"
    ],
    "visible": [
      "the agent list shows at least one agent after first login (auto-created if empty)",
      "the + button produces a new agent entry in the sidebar and navigates to profile",
      "clicking an agent name shows ChatInput (data-agent-composer) ready for input",
      "after sending, user message appears followed by assistant response with content",
      "new topic shows an empty conversation surface",
      "renamed agent shows updated name in the sidebar"
    ]
  },
  "negative": [
    "auto-create must not trigger if agents already exist",
    "create must not succeed without a valid authenticated session",
    "select must not load a chat surface for a non-existent agent ID"
  ]
}
