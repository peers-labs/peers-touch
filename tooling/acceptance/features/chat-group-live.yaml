  "required_gates": [
    "desktop-check",
    "chat-native-visible-static",
    "chat-lifecycle-group-live-e2e"
  ],
  "acceptance": {
    "service": [
      "Home binds each grant to the persisted Session, device and actor",
      "Authority validates active Group endpoint and consumes one SFU SID",
      "Session/device/member permission reductions confirm SFU ejection",
      "complete reconnect and token replay cannot restore withdrawn permissions",
      "Station API and client public LiveKit endpoints are configured separately"
    ],
    "visible": [
      "three native actors including Mobile complete group audio/video with RTP progress on every receiver edge",
      "mute, camera, late join, restart, leave, and resource release converge across clients",
      "membership/device/Session withdrawal releases capture and removes the endpoint from remaining rosters",
      "compact, expanded, and fullscreen call surfaces remain available during the call"
    ]
  },
  "negative": [
    "group calls must not use peer-to-peer mesh",
    "Desktop and Mobile UI and Harness must not import LiveKit directly",
    "API-only, compile-only, or participant-count-only evidence cannot prove media",
    "LiveKit tokens and media device identifiers must not enter durable evidence",
    "SSE room events cannot grant media permissions or establish current invitation state",
    "source-only and iOS simulator evidence cannot prove Android or physical-device behavior"
  ]
