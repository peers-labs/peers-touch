  "visible_surfaces": [
    {"type": "desktop-native", "selector": "[data-group-call-surface]"},
    {"type": "desktop-native", "selector": "[data-group-call-participant]"},
    {"type": "desktop-native", "selector": "[data-group-call-remote-audio]"},
    {"type": "mobile-native", "selector": "[data-group-call-surface]"},
