  "truth_sources": [
    "Home Session and Actor Device authorization fences",
    "Conversation membership, endpoint and Authority epoch fence",
    "durable Home/Authority grants and revocation tombstones",
    "conditional SFU admission at the current participant SID",
    "actual inbound/outbound RTP progress and native Desktop/Mobile surfaces"
