{
  "id": "chat-typing-presence",
  "status": "active",
  "product_area": "chat",
  "owners": [
    "model/domain/chat/conversation.proto",
    "apps/station/app/subserver/messaging/application/typing_service.go",
    "apps/station/app/subserver/messaging/interface/http/typing_handler.go",
    "apps/desktop/src/components/chat/ChatMessageArea.tsx",
    "apps/desktop/src/store/socialChat.ts",
    "apps/desktop/src/acceptance/chat/**"
  ],
  "truth_sources": [
    "authenticated active conversation membership",
    "fresh ephemeral typing pulse",
    "receiver process-local typing TTL projection"
  ],
  "visible_surfaces": [
    {"type": "desktop-native", "client": "alice"},
    {"type": "desktop-native", "client": "bob"},
    {"type": "desktop-native", "client": "carol"},
    {"type": "desktop-dom", "selector": "[data-chat-typing]"}
  ],
  "required_gates": [
    "station-messaging-unit",
    "messaging-platform-contract",
    "desktop-check",
    "chat-native-visible-static",
    "chat-native-typing-e2e"
  ],
  "acceptance": {
    "service": [
      "only authenticated active members can submit typing pulses",
      "Direct and Group pulses fan out over bounded ephemeral delivery",
      "typing pulses never enter authority events, durable device lanes, history, receipts or recovery"
    ],
    "visible": [
      "Direct and Group receivers show a fresh member typing",
      "stop, send, blur, session switch, disconnect and TTL expiry clear the indicator",
      "removed, revoked and non-member endpoints never produce visible typing"
    ]
  },
  "negative": [
    "Direct typing evidence must not be generalized to Group typing",
    "a lost stop pulse must not leave durable phantom typing",
    "typing must not block or advance the ordered durable message lane",
    "fixed sleeps must not replace observed start, stop and TTL transitions"
  ]
}
