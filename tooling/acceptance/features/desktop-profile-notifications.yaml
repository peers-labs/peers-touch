  "required_gates": ["desktop-profile-notifications-e2e"],
  "acceptance": {
    "service": [
      "profile drafts, writes, empty collections and conflicts preserve the revisioned Actor authority",
      "accept and reject use message-free signed Social decisions",
      "every supported notification category persists its real preferences"
    ],
    "surface": [
      "Native avatar and header uploads reach OSS and load in Account",
      "a receiving Native client renders eight real notifications and resolves seven declines and one acceptance",
      "notification search, six-row pagination and shell badges agree with authoritative records",
      "push registrations are accurate and read-only, including the empty state"
    ]
  },
  "negative": [
    "a conflicting profile write cannot discard the local draft or overwrite the newer authority",
    "disabled categories disable push and sound controls",
    "unsupported Desktop push registration mutations and provider tokens are absent",
    "a failed scenario or failed cleanup cannot publish a successful Suite result"
  ]
}
