{
  "version": 1,
  "id": "desktop-profile-notifications",
  "domain": "station-access",
  "status": "active",
  "owners": [
    "docs/client/desktop/runtime-projections.md",
    "apps/desktop/src/components/settings/AccountTab.tsx",
    "apps/desktop/src/components/notifications/NotificationCenter.tsx",
    "tooling/acceptance/gates/desktop/profile_notifications_journey.py"
  ],
  "truth_sources": [
    "Station revisioned Actor profile",
    "Station Social friend request authority",
    "Station notification list, counts, preferences and redacted push registrations"
  ],
  "visible_surfaces": [
    {"type": "native-desktop", "route": "settings/account"},
    {"type": "native-desktop", "route": "shell/notifications"}
