{
  "id": "agent-task-management",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/agent/handler/agent_task_handler.go",
    "apps/station/app/subserver/agent/service/agent_task_service.go",
    "apps/station/app/subserver/agent/service/task_event_writer.go",
    "apps/desktop/src/store/agent.ts",
    "apps/desktop/src/services/desktop_api.ts"
  ],
  "truth_sources": [
    "running Station agent API",
    "agent_tasks table",
    "agent_subtasks table"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/agent/tasks/create"},
    {"type": "api", "route": "/agent/tasks"},
    {"type": "api", "route": "/agent/tasks/:id/status"},
    {"type": "api", "route": "/agent/tasks/:id/delete"},
    {"type": "api", "route": "/agent/tasks/:id/subtask/add"},
    {"type": "api", "route": "/agent/tasks/:id/subtask/complete"}
  ],
  "required_gates": ["agent-task-e2e"],
  "acceptance": {
    "service": [
      "create initializes a task with title, description, and optional deadline",
      "list returns all tasks for an agent with status filtering and pagination",
      "status returns or updates the current state of a task (pending, in_progress, completed, failed)",
      "delete removes a task and its subtasks",
      "subtask-add appends a subtask to an existing parent task",
      "subtask-complete marks a specific subtask as done and updates parent progress"
    ],
    "visible": [
      "task list in Desktop shows tasks with progress bars based on subtask completion",
      "completing all subtasks automatically transitions parent task to completed state"
    ]
  },
  "negative": [
    "deleting a task must not leave orphaned subtask records",
    "completing a subtask on a deleted task must return an error",
    "task status must not regress from completed to in_progress without explicit user action"
  ]
}
