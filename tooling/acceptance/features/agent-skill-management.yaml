{
  "id": "agent-skill-management",
  "status": "active",
  "product_area": "agent",
  "owners": [
    "apps/station/app/subserver/agent/handler/skill_handler.go",
    "apps/station/app/subserver/agent/service/skill_service.go",
    "apps/station/app/subserver/agent/service/skills_guard_service.go",
    "apps/desktop/src/store/agent.ts",
    "apps/desktop/src/services/desktop_api.ts"
  ],
  "truth_sources": [
    "running Station agent API",
    "agent_skills table",
    "skill registry"
  ],
  "visible_surfaces": [
    {"type": "api", "route": "/agent/skills"},
    {"type": "api", "route": "/agent/skills/:id"},
    {"type": "api", "route": "/agent/skills/install"},
    {"type": "api", "route": "/agent/skills/uninstall"},
    {"type": "api", "route": "/agent/skills/:id/activate"},
    {"type": "api", "route": "/agent/skills/:id/deactivate"},
    {"type": "api", "route": "/agent/skills/:id/delete"}
  ],
  "required_gates": ["agent-skill-e2e"],
  "acceptance": {
    "service": [
      "list returns all installed skills with their activation status and metadata",
      "get returns full skill definition including description, parameters, and version",
      "install adds a skill from the registry and marks it as active by default",
      "uninstall removes a skill and its configuration from the agent",
      "activate enables a previously deactivated skill for use in the chat loop",
      "deactivate disables a skill without removing it, preserving configuration",
      "delete permanently removes a skill and all associated data"
    ],
    "visible": [
      "skill list in Desktop shows installed skills with active/inactive toggle",
      "activated skills appear in the agent tool palette during conversation"
    ]
  },
  "negative": [
    "installing a skill must not grant it access to agent memory without explicit permission",
    "deactivating a skill must not interrupt an in-progress turn that is using it",
    "uninstalling a skill must not leave orphan references in prompt assembly"
  ]
}
