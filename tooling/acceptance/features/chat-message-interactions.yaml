    "desktop-check",
    "chat-native-visible-static",
    "chat-native-interactions-e2e"
  ],
  "acceptance": {
    "service": [
      "reply and thread identity is committed with the original message event",
      "only the original author can edit or retract a message",
      "reaction add and remove is idempotent per actor and reaction",
      "pin and unpin converge in authority order",
      "read cursor only advances",
      "durable interactions use ordered device consumption and post-commit ACK"
    ],
    "visible": [
      "Direct peers converge on reply, thread, edited, retracted, reaction, pin and read state",
      "all active Group members converge on the same interaction state",
      "offline, duplicate and restart paths do not duplicate or regress visible state",
      "message actions remain pane-bounded, keyboard reachable and do not occlude content"
    ]
  },
  "negative": [
    "compile, unit, process startup, API-only or screenshot-only evidence cannot prove the interaction journey",
    "non-author edit or retract must produce zero authority mutation",
    "removed, revoked or non-member endpoints must not submit or receive future interactions",
    "UI optimistic mutation must not become terminal product truth"
  ]
}
