{
  "version": 1,
  "id": "node-connectivity-standard-stream",
  "domain": "station-access",
  "status": "active",
  "owners": [
    "apps/station/frame/core/plugin/native/transport/securehttp/**",
    "apps/station/frame/core/plugin/native/relay/**",
    "packages/station-libp2p-http/**",
    "apps/desktop/src-tauri/src/application/station_runtime/**",
    "apps/desktop/src-tauri/src/infrastructure/station/**",
    "apps/mobile/src-tauri/src/runtime/station_route.rs",
    "apps/station/frame/core/plugin/server/hertz/**",
    "apps/station/frame/core/server/**",
    "apps/station/app/subserver/events/**",
    "apps/station/app/subserver/presence/publisher.go",
    "apps/station/frame/touch/model/peer/station_trust.go",
    "apps/station/frame/touch/model/peer/station_route_trust.go",
    "tooling/acceptance/gates/station_access/node_connectivity_native_e2e.py",
    "tooling/scripts/node-connectivity-journey.py"
  ],
  "truth_sources": [
    "logical Station root authorization",
    "delegated node PeerID and Ed25519 key",
    "Station-signed route kind, destination PeerID, Relay PeerID, and TLS SPKI",
    "existing Hertz router and canonical handler wrappers",
    "shared PostgreSQL realtime_events and realtime_actor_event_sequences"
  ],
  "visible_surfaces": [
    {
      "type": "station",
      "route": "libp2p direct or Circuit stream with TLS 1.3 and HTTP/2"
    },
    {
      "type": "desktop",
      "route": "two Native Desktop clients exercise request-level Direct-only, Relay-only, and ordered Auto failover before using one Station through the standard Circuit route"
    }
  ],
  "required_gates": [
    "NCP-G01",
    "NCP-G02",
    "NCP-G03",
    "NCP-G04",
    "NCP-G07",
    "NCP-G08"
  ],
  "acceptance": {
    "service": [
      "two authorized node keys preserve one logical Station root identity",
      "direct and Circuit routes authenticate exact node PeerID and signed TLS SPKI before HTTP credentials",
      "HTTP/2 streams reach the existing Hertz route registration and wrappers",
      "SSE Flush, streamed request and response bodies, cancellation, and canonical protobuf errors retain their existing semantics",
      "the ingress borrows and never closes the process Host",
      "Rust native transport reaches the Go Station through standard Circuit with SSE and a 32 MiB body",
      "Direct-only uses the committed Direct lease, Relay-only uses the committed Circuit lease, and both reject conflicting or unavailable routes with closed typed errors",
      "Auto reaches Circuit only after a real Direct connection failure, preserving Session and lifecycle while advancing route revision and cancelling the prior lease",
      "canonical Profile mutation and peer readback remain visible through both Direct and Circuit routes",
      "two Native Desktop actors exchange receiver-visible plaintext with DELIVERED and READ receipts through Circuit",
      "the receiver opens a 32 MiB Native attachment whose local readback digest equals the sender source",
      "two Events processes allocate one gap-free per-Actor sequence and deliver committed rows through PostgreSQL wake hints plus bounded reconciliation",
      "subscriber restart replays through a captured high-watermark without leaking another device's targeted payload",
      "Relay ACL admits only enrolled nodes, current public routes, or source-bound private permits",
      "custom Relay WSS and mount-framing production paths are absent"
    ],
    "surface": []
  },
  "negative": [
    "wrong root, node PeerID, Relay binding, or TLS SPKI fails before request credentials",
    "untrusted forwarding and peer identity headers do not enter the canonical router",
    "the library unit registers no alternate production listener or business handler registry",
    "ephemeral typing and presence never advance the durable cursor",
    "transaction rollback creates no durable event or Actor sequence gap",
    "renewal preserves the route generation while revoke removes admission"
  ]
}
