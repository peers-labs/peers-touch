{
  "id": "mobile-native",
  "profile": {
    "required": true,
    "identity_match": true
  },
  "source_identity": {
    "commit_required": true,
    "workspace_digest_required": true
  },
  "build": {
    "environment": {
      "VITE_ACCEPTANCE_HARNESS": "1"
    },
    "projects": {
      "ios": "apps/mobile/src-tauri/gen/apple/peers-touch-mobile.xcodeproj",
      "android": "apps/mobile/src-tauri/gen/android"
    },
    "applications": {
      "ios": {
        "id": "com.peers.touch.mobile",
        "callback_scheme": "peers-touch"
      },
      "android": {
        "id": "com.peers.touch.mobile",
        "callback_scheme": "peers-touch"
      }
    }
  },
  "appium": {
    "server": {
      "url_ref": "env:PT_MOBILE_APPIUM_SERVER_URL",
      "executable": "appium",
      "expected_version": "2.19.0",
      "status_path": "/status"
    },
    "drivers": {
      "ios": {
        "identity": "appium-xcuitest-driver",
        "installed_name": "xcuitest",
        "automation_name": "XCUITest",
        "expected_version": "9.10.5"
      },
      "android": {
        "identity": "appium-uiautomator2-driver",
        "installed_name": "uiautomator2",
        "automation_name": "UiAutomator2",
        "expected_version": "4.2.9"
      }
    },
    "ios": {
      "device_inventory_command": ["xcrun", "xctrace", "list", "devices"],
      "native_context": "NATIVE_APP",
      "webview_context_prefix": "WEBVIEW",
      "wda_bundle_id_ref": "env:PT_MOBILE_IOS_WDA_BUNDLE_ID",
      "webview_bundle_id_ref": "env:PT_MOBILE_IOS_WEBVIEW_BUNDLE_ID"
    },
    "android": {
      "device_inventory_command": ["adb", "devices", "-l"],
      "chromedriver": {
        "browser_packages": [
          "com.android.chrome",
          "com.google.android.webview"
        ],
        "cache_root": "<runtime-cache>/chromedriver",
        "cache_root_ref": "env:PT_MOBILE_ACCEPTANCE_RUNTIME_CACHE",
        "executable_ref": "env:PT_MOBILE_ANDROID_CHROMEDRIVER_EXECUTABLE",
        "acquisition": {
          "enabled": false,
          "mode": "preseeded"
        },
        "artifacts": [
          {
            "browser_major": 124,
            "driver_version": "124.0.6367.207",
            "source": "https://storage.googleapis.com/chrome-for-testing-public/124.0.6367.207/mac-arm64/chromedriver-mac-arm64.zip",
            "platform": "darwin",
            "arch": "arm64",
            "android_abis": ["arm64-v8a"],
            "sha256": "115e3923a95abfddee333819923ca9ab545aceab4fd56f30f3f7387556798632",
            "cache_target": "124.0.6367.207/darwin-arm64/chromedriver-mac-arm64.zip",
            "executable_target": "124.0.6367.207/darwin-arm64/chromedriver"
          }
        ]
      }
    }
  },
  "services": {
    "station-primary": {
      "kind": "station",
      "required": true,
      "runtime_identity_required": true,
      "ready_action": "station-check",
      "health_action": "station-check",
      "status_action": "station-status",
      "attestation_producer": "station-deployment"
    },
    "station-secondary": {
      "kind": "station",
      "required": true,
      "runtime_identity_required": true,
      "ready_action": "station-check",
      "health_action": "station-check",
      "status_action": "station-status",
      "attestation_producer": "station-deployment"
    },
    "relay": {
      "kind": "relay",
      "required": true,
      "runtime_identity_required": true,
      "ready_action": "relay-check",
      "health_action": "relay-check",
      "status_action": "relay-status",
      "attestation_producer": "relay-deployment"
    }
  },
  "fixtures": [
    {
      "id": "mobile-native-actors",
      "authorization_required": true,
      "authorization_ref": "env:MOBILE_ACCEPTANCE_RESET",
      "target_assertion": "station-primary and station-secondary are approved disposable targets",
      "initial_assertion": "alice and bob have isolated PTID and device identities on both Stations",
      "setup_action": "python3 -m tooling.acceptance.fixtures.mobile_native_reset --prepare",
      "cleanup_action": "python3 -m tooling.acceptance.fixtures.mobile_native_reset --cleanup"
    }
  ],
  "credentials": [
    {
      "id": "github-disposable-account",
      "source_ref": "env:MOBILE_ACCEPTANCE_GITHUB_ACCOUNT",
      "required": true
    },
    {
      "id": "google-disposable-account",
      "source_ref": "env:MOBILE_ACCEPTANCE_GOOGLE_ACCOUNT",
      "required": true
    }
  ],
  "clients": [
    {
      "id": "alice-ios",
      "platform": "ios",
      "actor": "alice",
      "runtime": "tauri-ios",
      "destination_class_ref": "ios-physical",
      "physical_device_lease_ref": "physical-device-lease/alice-ios",
      "device_role": "primary-physical",
      "profile": "mobile-shell-alice-ios",
      "port_roles": ["wda-local", "mjpeg", "webview"],
      "storage_root": "<runtime-home>/acceptance/mobile-shell/<run-id>/alice-ios",
      "session_lease": "mobile-native/alice-ios",
      "browser_session": {
        "owner": "alice-ios",
        "provider": "github",
        "credential_ref": "github-disposable-account",
        "lease_ref": "provider-browser-session-lease/alice-ios",
        "baseline": "preauthenticated-exclusive",
        "cleanup_policy": "preserve-login-verify-identity"
      }
    },
    {
      "id": "bob-ios",
      "platform": "ios",
      "actor": "bob",
      "runtime": "tauri-ios",
      "destination_class_ref": "ios-physical",
      "physical_device_lease_ref": "physical-device-lease/bob-ios",
      "device_role": "secondary-physical",
      "profile": "mobile-shell-bob-ios",
      "port_roles": ["wda-local", "mjpeg", "webview"],
      "storage_root": "<runtime-home>/acceptance/mobile-shell/<run-id>/bob-ios",
      "session_lease": "mobile-native/bob-ios",
      "browser_session": {
        "owner": "bob-ios",
        "provider": "google",
        "credential_ref": "google-disposable-account",
        "lease_ref": "provider-browser-session-lease/bob-ios",
        "baseline": "preauthenticated-exclusive",
        "cleanup_policy": "preserve-login-verify-identity"
      }
    },
    {
      "id": "alice-android",
      "platform": "android",
      "actor": "alice",
      "runtime": "tauri-android",
      "destination_class_ref": "android-physical",
      "physical_device_lease_ref": "physical-device-lease/alice-android",
      "device_role": "primary-physical",
      "profile": "mobile-shell-alice-android",
      "port_roles": ["system", "mjpeg", "webview"],
      "storage_root": "<runtime-home>/acceptance/mobile-shell/<run-id>/alice-android",
      "session_lease": "mobile-native/alice-android",
      "browser_session": {
        "owner": "alice-android",
        "provider": "google",
        "credential_ref": "google-disposable-account",
        "lease_ref": "provider-browser-session-lease/alice-android",
        "baseline": "preauthenticated-exclusive",
        "cleanup_policy": "preserve-login-verify-identity"
      }
    },
    {
      "id": "bob-android",
      "platform": "android",
      "actor": "bob",
      "runtime": "tauri-android",
      "destination_class_ref": "android-physical",
      "physical_device_lease_ref": "physical-device-lease/bob-android",
      "device_role": "secondary-physical",
      "profile": "mobile-shell-bob-android",
      "port_roles": ["system", "mjpeg", "webview"],
      "storage_root": "<runtime-home>/acceptance/mobile-shell/<run-id>/bob-android",
      "session_lease": "mobile-native/bob-android",
      "browser_session": {
        "owner": "bob-android",
        "provider": "github",
        "credential_ref": "github-disposable-account",
        "lease_ref": "provider-browser-session-lease/bob-android",
        "baseline": "preauthenticated-exclusive",
        "cleanup_policy": "preserve-login-verify-identity"
      }
    }
  ],
  "harness": {
    "namespace": "__PEERS_MOBILE_ACCEPTANCE__",
    "build_flag": "VITE_ACCEPTANCE_HARNESS=1",
    "required_actions": [
      "station.add",
      "station.replace",
      "access.submit",
      "oauth.start",
      "oauth.status",
      "oauth.cancel",
      "lifecycle.restart",
      "projection.read",
      "cleanup"
    ],
    "parent_only_actions": [
      "build.identity",
      "oauth.replayHandle",
      "oauth.negativeCallback"
    ],
    "policy": "production actions only; direct Store mutation and successful-result injection are forbidden"
  },
  "leases": {
    "profile": "mobile-shell-acceptance",
    "ports": "one reserved set per client",
    "storage": "one isolated root per client and run",
    "storage_root_ref": "env:PT_MOBILE_ACCEPTANCE_RUNTIME_ROOT",
    "authentication_key_ref": "env:PT_MOBILE_RESOURCE_LEASE_AUTH_KEY",
    "sessions": "one Appium session lease per client",
    "deployments": ["station-primary", "station-secondary", "relay"],
    "resource_broker": {
      "broker_ref": "mobile-resource-lease-broker",
      "heartbeat_seconds": 300,
      "expiry_seconds": 600,
      "expiry_policy": "quarantine-until-baseline-recovery",
      "operation_fence": ["resourceKey", "holderRunId", "fenceToken"],
      "correlation": {
        "mode": "run-scoped-secret-side-hmac",
        "channel": "anonymous-pipe-or-process-memory",
        "cleanup": ["close-channel", "zeroize-key"]
      }
    },
    "physical_devices": [
      {
        "client_id": "alice-ios",
        "platform": "ios",
        "resource_key": "physical-device/alice-ios",
        "physical_device_ref": "device-ref/alice-ios",
        "destination_class_ref": "ios-physical"
      },
      {
        "client_id": "bob-ios",
        "platform": "ios",
        "resource_key": "physical-device/bob-ios",
        "physical_device_ref": "device-ref/bob-ios",
        "destination_class_ref": "ios-physical"
      },
      {
        "client_id": "alice-android",
        "platform": "android",
        "resource_key": "physical-device/alice-android",
        "physical_device_ref": "device-ref/alice-android",
        "destination_class_ref": "android-physical"
      },
      {
        "client_id": "bob-android",
        "platform": "android",
        "resource_key": "physical-device/bob-android",
        "physical_device_ref": "device-ref/bob-android",
        "destination_class_ref": "android-physical"
      }
    ],
    "provider_accounts": [
      {
        "provider": "github",
        "account_ref": "github-disposable-account",
        "resource_key": "provider-account/github/disposable",
        "allowed_client_ids": ["alice-ios", "bob-android"],
        "max_concurrent_authorizations": 1
      },
      {
        "provider": "google",
        "account_ref": "google-disposable-account",
        "resource_key": "provider-account/google/disposable",
        "allowed_client_ids": ["bob-ios", "alice-android"],
        "max_concurrent_authorizations": 1
      }
    ],
    "browser_profiles": [
      {
        "client_id": "alice-ios",
        "resource_key": "physical-device/alice-ios/browser/default",
        "browser_profile_ref": "browser-profile/alice-ios"
      },
      {
        "client_id": "bob-ios",
        "resource_key": "physical-device/bob-ios/browser/default",
        "browser_profile_ref": "browser-profile/bob-ios"
      },
      {
        "client_id": "alice-android",
        "resource_key": "physical-device/alice-android/browser/default",
        "browser_profile_ref": "browser-profile/alice-android"
      },
      {
        "client_id": "bob-android",
        "resource_key": "physical-device/bob-android/browser/default",
        "browser_profile_ref": "browser-profile/bob-android"
      }
    ]
  },
  "cleanup": {
    "resources": [
      "processes",
      "appium-sessions",
      "ports",
      "storage",
      "sessions",
      "fixture-data",
      "physical-device-leases",
      "provider-account-leases",
      "provider-browser-session-leases",
      "correlation-channel",
      "profile-leases",
      "deployment-leases"
    ],
    "order": [
      "appium-sessions",
      "client-processes",
      "ports",
      "storage",
      "fixture-sessions",
      "fixture-data",
      "provider-browser-session-leases",
      "provider-account-leases",
      "physical-device-leases",
      "correlation-channel",
      "client-profile-leases",
      "environment-profile-lease",
      "deployment-leases"
    ],
    "deterministic": true
  }
}
