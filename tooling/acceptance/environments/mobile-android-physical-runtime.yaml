{
  "id": "mobile-android-physical-runtime",
  "base_environment": "mobile-native",
  "device_descriptor_ref": "../devices/oppo-peem00.yaml",
  "scenarios": {
    "android-social": {
      "gate_id": "mobile-social-android-native",
      "clients": ["alice-android"],
      "services": ["station-primary"],
      "credentials": [],
      "fixtures": ["mobile-social-existing-actors"],
      "provider_accounts": [],
      "browser_sessions": [],
      "harness_actions": [
        "station.add",
        "access.submit",
        "lifecycle.restart",
        "lifecycle.scope.read",
        "session.logout",
        "navigation.snapshot",
        "navigation.apply",
        "projection.read",
        "messaging.createDirect",
        "messaging.createGroup",
        "messaging.reconcile",
        "messaging.projection.read",
        "social.people.search",
        "social.request.send",
        "social.request.accept",
        "social.reconcile",
        "social.projection.read",
        "reliability.draft.write",
        "reliability.draft.read",
        "reliability.draft.action",
        "recovery.snapshot",
        "moments.feed.read",
        "moments.publish",
        "moments.private.read",
        "moments.private.comment.submit",
        "moments.private.reconcile",
        "moments.private.snapshot",
        "cleanup"
      ],
      "parent_harness_actions": ["build.identity"],
      "ephemeral_capabilities": ["mobile.native.appium-session"],
      "appium_operations": [
        "start",
        "stop",
        "wait_ready",
        "is_alive",
        "contexts",
        "switch_context",
        "harness_inventory",
        "harness_action",
        "background_app",
        "capture_page_source",
        "capture_screenshot",
        "social_ui",
        "verify_build_identity"
      ],
      "require_exact_device_count": true,
      "cleanup_resources": [
        "processes",
        "appium-sessions",
        "ports",
        "storage",
        "sessions",
        "fixture-data",
        "physical-device-leases",
        "correlation-channel",
        "profile-leases",
        "deployment-leases",
        "usb-station-transports"
      ]
    }
  },
  "services": {
    "station-primary": {
      "kind": "station",
      "required": true,
      "runtime_identity_required": true,
      "endpoint_ref": "env:PT_MOBILE_STATION_PRIMARY_URL",
      "deployment_environment_ref": "env:PT_MOBILE_STATION_PRIMARY_DEPLOY_ENV",
      "ready_action": "station-check",
      "health_action": "station-check",
      "status_action": "station-status",
      "attestation_producer": "station-deployment"
    }
  },
  "fixtures": [
    {
      "id": "mobile-social-existing-actors",
      "authorization_required": false,
      "target_assertion": "station-primary is an approved non-stable development target",
      "initial_assertion": "Alice, Bob and Eve already exist with distinct canonical PTIDs on station-primary"
    }
  ]
}
