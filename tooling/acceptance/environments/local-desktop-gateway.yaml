{
  "id": "local-desktop-gateway",
  "profile": {
    "required": true,
    "identity_match": true
  },
  "services": {
    "station": {
      "kind": "station",
      "required": true,
      "ready_action": "station",
      "health_action": "station-check",
      "status_action": "station-status",
      "attestation_producer": "station-deployment"
    },
    "desktop-gateway": {
      "kind": "desktop-gateway",
      "required": true,
      "ready_action": "desktop",
      "health_action": "desktop-gateway-check",
      "status_action": "desktop-gateway-status",
      "attestation_producer": "desktop-deployment"
    }
  },
  "fixtures": [
    {
      "id": "chat-native-actors",
      "authorization_required": true,
      "authorization_ref": "env:CHAT_ACCEPTANCE_RESET"
    }
  ],
  "credentials": [
    {
      "id": "chat-password",
      "source_ref": "fixture:apps/station/app/conf/actor.yml#preset_users",
      "required": true
    }
  ],
  "cleanup": {
    "resources": ["processes", "ports", "storage", "sessions"]
  }
}
