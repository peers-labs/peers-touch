{
  "id": "mobile-simulator",
  "profile": {
    "required": false,
    "identity_match": false
  },
  "source_identity": {
    "commit_required": true,
    "workspace_digest_required": true
  },
  "selectors": {
    "ios": {
      "preferred_runtime": "iOS 17.4",
      "preferred_device_name": "iPhone 15 Pro"
    },
    "android": {
      "avd_name": "peers_touch_applet_l3_e2e",
      "abi": "arm64-v8a"
    }
  },
  "build": {
    "environment": {
      "VITE_ACCEPTANCE_HARNESS": "1",
      "MOBILE_TAURI_STATIC_BUNDLE_BUILD": "1"
    },
    "commands": {
      "web": [
        "pnpm",
        "--dir",
        "apps/mobile",
        "run",
        "build"
      ],
      "ios": [
        "xcodebuild",
        "-project",
        "apps/mobile/src-tauri/gen/apple/peers-touch-mobile.xcodeproj",
        "-scheme",
        "peers-touch-mobile_iOS",
        "-configuration",
        "debug",
        "-sdk",
        "iphonesimulator",
        "-destination",
        "id={ios_udid}",
        "-derivedDataPath",
        "{runtime_root}/build/ios-derived",
        "build"
      ],
      "android": [
        "pnpm",
        "--dir",
        "apps/mobile",
        "exec",
        "tauri",
        "android",
        "build",
        "--ci",
        "--debug",
        "--target",
        "aarch64",
        "--split-per-abi",
        "--apk",
        "--config",
        "{\"build\":{\"devUrl\":null}}"
      ]
    },
    "artifacts": {
      "ios": "{runtime_root}/build/ios-derived/Build/Products/debug-iphonesimulator/*.app",
      "android": "apps/mobile/src-tauri/gen/android/app/build/outputs/apk/arm64/debug/*.apk"
    },
    "applications": {
      "ios": {
        "id": "com.peers.touch.mobile",
        "callback_scheme": "peers-touch"
      },
      "android": {
        "id": "com.peers.touch.mobile",
        "callback_scheme": "peers-touch"
      }
    }
  },
  "appium": {
    "server": {
      "ownership": "provisioner",
      "executable": "appium",
      "expected_version": "2.19.0",
      "host": "127.0.0.1",
      "port": "dynamic",
      "status_path": "/status",
      "startup_timeout_seconds": 30
    },
    "drivers": {
      "ios": {
        "identity": "appium-xcuitest-driver",
        "installed_name": "xcuitest",
        "automation_name": "XCUITest",
        "expected_version": "9.10.5"
      },
      "android": {
        "identity": "appium-uiautomator2-driver",
        "installed_name": "uiautomator2",
        "automation_name": "UiAutomator2",
        "expected_version": "4.2.9"
      }
    },
    "chromedriver": {
      "browser_packages": [
        "com.android.chrome",
        "com.google.android.webview"
      ],
      "cache_root": "<runtime-cache>/chromedriver",
      "acquisition": {
        "enabled": true,
        "mode": "explicit"
      },
      "artifacts": [
        {
          "browser_major": 124,
          "driver_version": "124.0.6367.207",
          "source": "https://storage.googleapis.com/chrome-for-testing-public/124.0.6367.207/mac-arm64/chromedriver-mac-arm64.zip",
          "platform": "darwin",
          "arch": "arm64",
          "android_abis": [
            "arm64-v8a"
          ],
          "sha256": "115e3923a95abfddee333819923ca9ab545aceab4fd56f30f3f7387556798632",
          "cache_target": "124.0.6367.207/darwin-arm64/chromedriver-mac-arm64.zip",
          "artifact_kind": "zip",
          "executable_member": "chromedriver-mac-arm64/chromedriver",
          "executable_target": "124.0.6367.207/darwin-arm64/chromedriver"
        }
      ]
    }
  },
  "services": {},
  "fixtures": [],
  "credentials": [],
  "clients": [
    {
      "id": "sim-ios",
      "platform": "ios",
      "role": "simulator",
      "runtime": "tauri-ios-simulator",
      "port_roles": [
        "wda-local",
        "mjpeg",
        "webview"
      ],
      "storage_root": "<runtime-home>/acceptance/mobile-simulator/<run-id>/sim-ios"
    },
    {
      "id": "sim-android",
      "platform": "android",
      "role": "emulator",
      "runtime": "tauri-android-emulator",
      "port_roles": [
        "system",
        "mjpeg",
        "webview"
      ],
      "storage_root": "<runtime-home>/acceptance/mobile-simulator/<run-id>/sim-android"
    }
  ],
  "harness": {
    "namespace": "__PEERS_MOBILE_ACCEPTANCE__",
    "build_flag": "VITE_ACCEPTANCE_HARNESS=1",
    "required_actions": [
      "lifecycle.snapshot",
      "lifecycle.suspend",
      "lifecycle.resume",
      "lifecycle.restart",
      "native.deliverDeepLink",
      "projection.read",
      "cleanup"
    ],
    "policy": "production actions only; simulator success injection and direct Store mutation are forbidden"
  },
  "proof_scope": {
    "proves": [
      "simulator and emulator launch",
      "native callback routing",
      "runtime-graph suspend, resume, restart, and monotonic generation behavior",
      "fail-closed behavior"
    ],
    "does_not_prove": [
      "physical-device MS-AG03",
      "provider authorization success",
      "Station or Relay behavior",
      "physical OS background and foreground delivery"
    ]
  },
  "cleanup": {
    "resources": [
      "appium-process",
      "app-installations",
      "ports",
      "storage",
      "emulator-process",
      "simulator-boot",
      "environment-lease"
    ],
    "order": [
      "appium-process",
      "app-installations",
      "ports",
      "storage",
      "emulator-process",
      "simulator-boot",
      "environment-lease"
    ],
    "deterministic": true
  }
}
