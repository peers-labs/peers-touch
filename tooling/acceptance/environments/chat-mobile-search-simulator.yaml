{
  "id": "chat-mobile-search-simulator",
  "base_environment": "mobile-simulator",
  "profile": {"required": false, "identity_match": false},
  "source_identity": {"commit_required": true, "workspace_digest_required": true},
  "services": {
    "station": {
      "kind": "station",
      "required": true,
      "runtime_identity_required": true,
      "endpoint_ref": "env:PT_MOBILE_DIRECT_STATION_URL",
      "deployment_environment_ref": "env:PT_MOBILE_DIRECT_STATION_DEPLOY_ENV",
      "health_action": "station-check",
      "status_action": "station-status",
      "attestation_producer": "station-deployment"
    }
  },
  "fixtures": [{
    "id": "mobile-social-simulator-actors",
    "authorization_required": true,
    "authorization_ref": "station.reset:mobile-social-simulator-actors",
    "target_assertion": "the Station is an approved disposable target",
    "initial_assertion": "Alice and Bob have distinct PTIDs on the same Station"
  }],
  "credentials": [],
  "clients": [
    {
      "id": "sim-ios", "actor": "alice", "runtime": "tauri-ios-simulator",
      "required_service_roles": ["station"],
      "service_bindings": {"station": {"service_id": "station", "required_kind": "station"}}
    },
    {
      "id": "sim-android", "actor": "bob", "runtime": "tauri-android-emulator",
      "required_service_roles": ["station"],
      "service_bindings": {"station": {"service_id": "station", "required_kind": "station"}}
    }
  ],
  "harness": {
    "namespace": "__PEERS_MOBILE_ACCEPTANCE__",
    "required_actions": [
      "build.identity", "runtime.prepareActorIdentity", "station.add", "access.submit",
      "lifecycle.restart", "lifecycle.waitReady", "lifecycle.scope.read",
      "lifecycle.suspend", "lifecycle.resume", "session.logout",
      "navigation.snapshot", "navigation.apply", "projection.read",
      "messaging.createDirect", "messaging.createGroup", "messaging.attachment.stage", "messaging.send",
      "messaging.interact", "messaging.reconcile", "messaging.projection.read",
      "social.people.search", "social.request.send", "social.request.accept",
      "social.contact.open", "social.reconcile", "social.projection.read",
      "moments.private.snapshot", "recovery.snapshot", "getRealtimeDevice",
      "search.page", "search.resolve", "search.state", "search.cancel", "search.reads",
      "cleanup"
    ],
    "policy": "production actions only; direct Store mutation and successful-result injection are forbidden"
  },
  "proof_scope": {
    "proves": [
      "source-bound iOS Simulator and Android Emulator receivers",
      "real received Chinese messages, replies and attachment filenames",
      "native Search query, canonical Chat open, return, paging and Settings navigation",
      "persisted light and dark themes and real software-keyboard input clearance",
      "typed authority, revision and old-session denial",
      "original SearchExecutor read costs and lifecycle fences"
    ],
    "does_not_prove": [
      "physical-device behavior", "cross-Station or Relay delivery",
      "VoiceOver or TalkBack traversal", "OEM scheduler behavior"
    ]
  },
  "cleanup": {
    "resources": [
      "appium-process", "app-installations", "ports", "storage", "simulator-boot",
      "station-process-state", "actor-fixture", "profile-leases", "deployment-leases"
    ],
    "deterministic": true
  }
}
