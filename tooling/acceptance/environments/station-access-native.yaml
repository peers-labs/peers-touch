{
  "id": "station-access-native",
  "base_environment": "mobile-simulator",
  "profile": {
    "required": false,
    "identity_match": false
  },
  "source_identity": {
    "commit_required": true,
    "workspace_digest_required": true
  },
  "services": {
    "station": {
      "kind": "station",
      "required": true,
      "runtime_identity_required": true,
      "endpoint_ref": "env:PT_MOBILE_DIRECT_STATION_URL",
      "deployment_environment_ref": "env:PT_MOBILE_DIRECT_STATION_DEPLOY_ENV",
      "health_action": "station-check",
      "status_action": "station-status",
      "attestation_producer": "station-deployment"
    }
  },
  "fixtures": [
    {
      "id": "station-access-existing-actors",
      "authorization_required": false,
      "initial_assertion": "Alice and Bob already exist on the selected approved development Station"
    }
  ],
  "credentials": [],
  "clients": [
    {
      "id": "desktop-alice",
      "actor": "alice",
      "runtime": "native-tauri",
      "required_service_roles": ["station"],
      "service_bindings": {
        "station": {
          "service_id": "station",
          "required_kind": "station"
        }
      }
    },
    {
      "id": "desktop-bob",
      "actor": "bob",
      "runtime": "native-tauri",
      "required_service_roles": ["station"],
      "service_bindings": {
        "station": {
          "service_id": "station",
          "required_kind": "station"
        }
      }
    },
    {
      "id": "sim-ios",
      "actor": "bob",
      "runtime": "tauri-ios-simulator",
      "required_service_roles": ["station"],
      "service_bindings": {
        "station": {
          "service_id": "station",
          "required_kind": "station"
        }
      }
    },
    {
      "id": "sim-ios-peer",
      "actor": "alice",
      "runtime": "tauri-ios-simulator",
      "required_service_roles": ["station"],
      "service_bindings": {
        "station": {
          "service_id": "station",
          "required_kind": "station"
        }
      }
    }
  ],
  "harness": {
    "namespace": "__PEERS_MOBILE_ACCEPTANCE__",
    "required_actions": [
      "lifecycle.resume",
      "lifecycle.restart",
      "lifecycle.scope.read",
      "lifecycle.suspend",
      "messaging.reconcile",
      "social.projection.read",
      "social.reconcile",
      "session.logout",
      "getRealtimeDevice",
      "cleanup"
    ],
    "policy": "Station Access production actions only; service endpoints and Appium authority remain parent-owned"
  },
  "proof_scope": {
    "proves": [
      "native macOS Desktop and iOS Simulator bind one signed Station identity before authentication",
      "same-actor Desktop and Mobile sessions retain distinct device identities",
      "native restart and logout preserve Station, Actor, Device, and lifecycle scope isolation"
    ],
    "does_not_prove": [
      "Linux or Windows Desktop behavior",
      "Android or physical-device behavior",
      "cross-Station Federation context"
    ]
  },
  "cleanup": {
    "resources": [
      "desktop-processes",
      "desktop-ports",
      "desktop-storage",
      "appium-sessions",
      "appium-process",
      "app-installations",
      "simulator-ports",
      "simulator-storage",
      "simulator-boot",
      "profile-leases",
      "deployment-leases"
    ],
    "deterministic": true
  }
}
