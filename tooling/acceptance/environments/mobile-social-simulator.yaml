{
  "id": "mobile-social-simulator",
  "base_environment": "mobile-simulator",
  "profile": {
    "required": false,
    "identity_match": false
  },
  "source_identity": {
    "commit_required": true,
    "workspace_digest_required": true
  },
  "services": {
    "station-primary": {
      "kind": "station",
      "required": true,
      "runtime_identity_required": true,
      "endpoint_ref": "env:PT_MOBILE_STATION_PRIMARY_URL",
      "deployment_environment_ref": "env:PT_MOBILE_STATION_PRIMARY_DEPLOY_ENV",
      "health_action": "station-check",
      "status_action": "station-status",
      "attestation_producer": "station-deployment"
    },
    "station-secondary": {
      "kind": "station",
      "required": true,
      "runtime_identity_required": true,
      "endpoint_ref": "env:PT_MOBILE_STATION_SECONDARY_URL",
      "deployment_environment_ref": "env:PT_MOBILE_STATION_SECONDARY_DEPLOY_ENV",
      "health_action": "station-check",
      "status_action": "station-status",
      "attestation_producer": "station-deployment"
    },
    "relay": {
      "kind": "relay",
      "required": true,
      "runtime_identity_required": true,
      "endpoint_ref": "env:PT_RELAY_URL",
      "deployment_environment_ref": "env:PT_RELAY_DEPLOY_ENV",
      "health_endpoint_ref": "env:PT_RELAY_HEALTH_URL",
      "health_action": "relay-check",
      "status_action": "relay-status",
      "attestation_producer": "relay-deployment"
    }
  },
  "fixtures": [
    {
      "id": "mobile-social-simulator-actors",
      "authorization_required": true,
      "authorization_ref": "station.reset:mobile-social-simulator-actors",
      "target_assertion": "both Stations are approved disposable targets",
      "initial_assertion": "Alice and Bob have distinct PTIDs on their assigned Stations"
    }
  ],
  "credentials": [],
  "clients": [
    {
      "id": "sim-ios",
      "actor": "alice",
      "runtime": "tauri-ios-simulator",
      "required_service_roles": ["station"],
      "service_bindings": {
        "station": {
          "service_id": "station-primary",
          "required_kind": "station"
        }
      }
    },
    {
      "id": "sim-ios-peer",
      "actor": "bob",
      "runtime": "tauri-ios-simulator",
      "required_service_roles": ["station"],
      "service_bindings": {
        "station": {
          "service_id": "station-secondary",
          "required_kind": "station"
        }
      }
    }
  ],
  "harness": {
    "namespace": "__PEERS_MOBILE_ACCEPTANCE__",
    "required_actions": [
      "station.add",
      "station.route.select",
      "station.route.snapshot",
      "access.submit",
      "lifecycle.restart",
      "lifecycle.scope.read",
      "projection.read",
      "messaging.createDirect",
      "messaging.createGroup",
      "messaging.attachment.stage",
      "messaging.attachment.open",
      "messaging.send",
      "messaging.interact",
      "messaging.read",
      "messaging.typing",
      "messaging.reconcile",
      "messaging.command.read",
      "messaging.search",
      "messaging.projection.read",
      "social.people.search",
      "social.request.send",
      "social.request.accept",
      "social.contact.open",
      "social.reconcile",
      "social.projection.read",
      "reliability.fixture.configure",
      "reliability.friendRequest.submit",
      "reliability.snapshot",
      "reliability.reconcile",
      "reliability.draft.write",
      "reliability.draft.read",
      "reliability.draft.action",
      "recovery.snapshot",
      "moments.feed.read",
      "moments.publish",
      "moments.react",
      "moments.comment",
      "moments.comments.read",
      "cleanup"
    ],
    "policy": "production actions only; direct Store mutation and successful-result injection are forbidden"
  },
  "proof_scope": {
    "proves": [
      "two isolated simulator clients",
      "two source-attested Station bindings",
      "Direct and Group Messaging production-action journeys",
      "receiver projection, typing, receipt, interaction, search, attachment, and WebView restart readback",
      "unknown-outcome command and exact-scope draft recovery",
      "Moments publish, feed, reaction, comment, reply, rollback, and draft readback"
    ],
    "does_not_prove": [
      "physical-device behavior",
      "authoritative Station history readback",
      "native background and foreground lifecycle",
      "tab-remount interaction timing"
    ]
  },
  "cleanup": {
    "resources": [
      "appium-process",
      "app-installations",
      "ports",
      "storage",
      "simulator-boot",
      "actor-fixture",
      "profile-leases",
      "deployment-leases"
    ],
    "deterministic": true
  }
}
