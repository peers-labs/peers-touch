    surface: canvas-web
    source: apps/desktop/src/pages/AgentCanvasPage.tsx
    symbol: runCanvas
    target: api.createAgentCollaborationTask
    disposition: guarded
    expected_fragments: ["const runCanvas = useCallback", "api.createAgentCollaborationTask"]
    guard:
      scope_source: apps/desktop/src/pages/AgentCanvasPage.tsx
      scope_symbol: runCanvas
      first_effect: "setRunState('running')"
      current_state: before-effect

