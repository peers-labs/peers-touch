version: 1
guard_symbol: enforce_canvas_single_agent_readiness
allowed_dispositions:
  - guarded
  - guarded-forwarder
  - allowed-read
  - allowed-read-stream
  - allowed-cleanup
  - allowed-nonexecution-mutation

route_sets:
  - id: station-generic
    source: apps/station/app/subserver/agent/agent.go
    prefix: /agent/
  - id: station-official-atelier
    source: apps/station/app/subserver/official_applets/atelier.go
    prefix: /applets/atelier/v1/
